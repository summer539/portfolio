- ✅ 编译时框架，无虚拟 DOM，运行时极轻

**1. 加载态（Loading）**
- 首次进入：骨架屏占位，展示 6~8 行灰色占位条
- 加载超过 5s：底部提示「加载较慢，请稍候」

**2. 空态（Empty）**
- 无数据：居中插画 + 主文案「暂无内容」+ 副文案引导 + 主按钮「新建」
- 筛选后无结果：文案改为「没有符合条件的结果」+「清除筛选」次级按钮

**3. 错误态（Error）**
- 请求失败：居中错误插画 + 「加载失败」+「重试」按钮
- 网络断开：顶部常驻告警条，恢复后自动刷新

**4. 分页 / 加载更多**
- 桌面端：底部分页器，展示总条数与跳页
- 移动端：触底自动加载，加载中显示 loading，到底部显示「没有更多了」

**1. 朴素 RAG（Naive RAG）**
- 流程：切块 → 向量检索 → 拼接 Prompt → 生成
- ✅ 实现简单、成本低；❌ 召回质量依赖切块，长文档易丢上下文

**2. 混合检索（Hybrid：向量 + BM25）**
- 向量召回语义 + 关键词召回精确匹配，再做 RRF 融合
- ✅ 显著提升召回率，专有名词/编号场景更稳；❌ 需维护两套索引

**3. 重排序（Rerank）**
- 在召回后加 Cross-Encoder 精排 Top-K
- ✅ 精度提升明显；❌ 增加一次模型调用延迟

**4. 结构化 / GraphRAG**
- 构建实体关系图辅助检索
- ✅ 擅长多跳推理与全局性问题；❌ 构建成本高，更新维护复杂

**选型建议**
- 起步：**Hybrid + Rerank** 是性价比最高的组合，覆盖 80% 场景
- 文档量大 / 专业术语多：加强 BM25 权重 + 领域微调 Embedding
- 需要跨文档推理：再引入 GraphRAG，但先验证 ROI
