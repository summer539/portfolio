或組織的名稱以及顯示其擔任有關職務所涉及的時間。董事會應自行決定相隔多久作出一次披露。"},{"article_no":43,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.1.5 獨立非執行董事及其他非執行董事作為與其他董事擁有同等地位的董事會成 員，應定期出席董事會及其同時出任委員會成員的委員會的會議並積極參與會務，以其技能、專業知識及不同的背景及資格作出貢獻。一般而言，他們並應出席股東大會，對公司股東的意見有全面、公正的了解。註：非執行董事出席股東大會是非常重要的。獨立非執行董事常是董事委員會的主席或成員，理應向股東負責，在場回應股東有關其工作的提問及查詢。若董事缺席股東大會，便不能對股東的意見有全面、公正的瞭解。"},{"article_no":44,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.1.6 獨立非執行董事及其他非執行董事須透過提供獨立、富建設性及有根據的意 見對發行人制定策略及政策作出正面貢獻。"},{"article_no":45,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.1.7 發行人應就其董事可能會面對的法律行動作適當的投保安排。 建議最佳常規"},{"article_no":46,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.1.8 如主席並非獨立非執行董事，發行人應委任一名獨立非執行董事為首席獨立 非執行董事，以(a)作為其他董事與股東的中間人；及(b)當與主席或管理層的一般溝通渠道不足時，作為其他董事和股東的聯絡點。"},{"article_no":47,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.2 主席及行政總裁原則每家發行人在經營管理上皆有兩大方面—董事會的經營管理和業務的日常管理。這兩者之間必須清楚區分，以確保權力和授權分布均衡，不致權力僅集中於一位人士。守則條文"},{"article_no":48,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.2.1 主席與行政總裁的角色應有區分，並不應由一人同時兼任。主席與行政總裁 之間職責的分工應清楚界定並以書面列載。"},{"article_no":49,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.2.2 主席應確保董事會會議上所有董事均適當知悉當前的事項。"},{"article_no":50,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.2.3 主席應負責確保董事及時收到充分的資訊，而有關資訊亦必須準確清晰及完 備可靠。"},{"article_no":51,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.2.4 主席其中一個重要角色是領導董事會。主席應確保董事會有效地運作，且履 行應有職責，並及時就所有重要的適當事項進行討論。主席應主要負責釐定並批准每次董事會會議的議程，並在適當情況下計及其他董事提議加入議程的任何事項。主席可將這項責任轉授指定的董事或公司秘書。"},{"article_no":52,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.2.5 主席應負主要責任，確保公司制定良好的企業管治常規及程序。"},{"article_no":53,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.2.6 主席應鼓勵所有董事全力投入董事會事務，並以身作則，確保董事會行事 符合發行人最佳利益。主席應鼓勵持不同意見的董事均表達出本身關注的事宜、給予這些事宜充足時間討論，以及確保董事會的決定能公正反映董事會的共識。"},{"article_no":54,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.2.7 主席應至少每年與獨立非執行董事舉行一次沒有其他董事出席的會議。"},{"article_no":55,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.2.8 主席應確保採取適當步驟保持與股東有效聯繫，以及確保股東意見可傳達到 整個董事會。"},{"article_no":56,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.2.9 主席應提倡公開、積極討論的文化，促進董事（特別是非執行董事）對董事 會作出有效貢獻，並確保執行董事與非執行董事之間維持建設性的關係。"},{"article_no":57,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.3 管理功能原則發行人應有一個正式的預定計劃，列載特別要董事會批准的事項。董事會應明確指示管理層哪些事項須先經由董事會批准而後方可代表發行人作出決定。守則條文"},{"article_no":58,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.3.1 當董事會將其管理及行政功能方面的權力轉授予管理層時，必須同時就管理 層的權力，給予清晰的指引，特別是在管理層應向董事會匯報以及在代表發行人作出任何決定或訂立任何承諾前應取得董事會批准等事宜方面。註：董事會不應將處理事宜的權力轉授予其轄下委員會、執行董事或管理層，若這樣的權力轉授所達到的程度，會大大妨礙或削弱董事會整體履行其職權的能力。"},{"article_no":59,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.3.2 發行人應將那些保留予董事會的職能及那些轉授予管理層的職能分別確定下 來；發行人也應定期作檢討以確保有關安排符合發行人的需要。"},{"article_no":60,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.3.3 董事應清楚了解既定的權力轉授安排。發行人應有正式的董事委任書，訂明 有關委任的主要條款及條件。"},{"article_no":61,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.4 董事會轄下的委員會原則董事會轄下各委員會的成立應訂有書面的特定職權範圍，清楚列載委員會權力及職責。守則條文"},{"article_no":62,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.4.1 若要成立委員會處理事宜，董事會應向有關委員會提供充分清楚的職權範 圍，讓其能適當地履行職能。"},{"article_no":63,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.4.2 董事會轄下各委員會的職權範圍應規定該等委員會要向董事會匯報其決定或 建議，除非該等委員會受法律或監管限制所限而不能作此匯報（例如因監管規定而限制披露）。"},{"article_no":64,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5 董事會議事程序以及資料提供及使用原則發行人應確保董事能夠以有意義和有效的方式參與董事會議事程序。董事應獲提供適當的適時資料，其形式及素質須使董事能夠在掌握有關資料的情況下作出決定，並能履行其職責及責任。守則條文"},{"article_no":65,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5.1 董事會應定期開會，董事會會議應每年召開至少四次，大約每季一次。預計 每次召開董事會定期會議皆有大部分有權出席會議的董事親身出席，或透過電子通訊方法積極參與。因此，董事會定期會議並不包括以傳閱書面決議方式取得董事會批准。"},{"article_no":66,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5.2 董事會應訂有安排，以確保全體董事皆有機會提出商討事項列入董事會定期 會議議程。"},{"article_no":67,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5.3 召開董事會定期會議應發出至少14天通知，以讓所有董事皆有機會騰空出 席。至於召開其他所有董事會會議，應發出合理通知。"},{"article_no":68,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5.4 經正式委任的會議秘書應備存董事會及轄下委員會的會議紀錄，若有任何董 事發出合理通知，應公開有關會議紀錄供其在任何合理的時段查閱。"},{"article_no":69,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5.5 董事會及其轄下委員會的會議紀錄，應對會議上所考慮事項及達致的決定作 足夠詳細的記錄，其中應該包括董事提出的任何疑慮或表達的反對意見。董事會會議結束後，應於合理時段內先後將會議紀錄的初稿及最終定稿發送全體董事，初稿供董事表達意見，最後定稿則作其紀錄之用。"},{"article_no":70,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5.6 董事會應該商定程序，讓董事按合理要求，可在適當的情況下尋求獨立專業 意見，費用由發行人支付。董事會應議決另外為董事提供獨立專業意見，以協助他們履行其對發行人的責任。"},{"article_no":71,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5.7 若有大股東或董事在董事會將予考慮的事項中存有董事會認為重大的利益衝 突，有關事項應以舉行董事會會議（而非書面決議）方式處理。在交易中本身及其緊密聯繫人均沒有重大利益的獨立非執行董事應該出席有關的董事會會議。註：在符合發行人的組織章程文件、其註冊成立地的法律及法規的情況下，透過電話或視像會議等電子途徑參與會議的董事可計算為親身出席董事會會議。"},{"article_no":72,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5.8 董事會定期會議的議程及相關會議文件應全部及時送交全體董事，並至少在 計劃舉行董事會或其轄下委員會會議日期的三天前（或協定的其他時間內）送出。董事會其他所有會議在切實可行的情況下亦應採納以上安排。"},{"article_no":73,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5.9 管理層有責任向董事會及其轄下委員會提供充足的適時資料，以使董事能夠 在掌握有關資料的情況下作出決定。管理層所提供的資料必須完整可靠。董事要恰當履行董事職責，他們在所有情況下皆不能單靠管理層主動提供的資料，有時董事還需自行作進一步查詢。任何董事若需要管理層提供其他額外（管理層主動提供以外）的資料，應該按需要再作進一步查詢。因此，董事會及個別董事應有自行接觸發行人高級管理人員的獨立途徑。"},{"article_no":74,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.5.10 所有董事均有權查閱董事會文件及相關資料。該等文件及相關資料的形式及 素質應足以讓董事會能就提呈董事會商議事項作出知情有根據的決定。對於董事提出的問題，發行人必須盡可能作出迅速及全面的回應。"},{"article_no":75,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.6 公司秘書原則公司秘書在支援董事會上擔當重要角色，確保董事會成員之間資訊交流良好，以及遵循董事會政策及程序。公司秘書負責透過主席及╱或行政總裁向董事會提供管治事宜方面意見，並安排董事的入職培訓及專業發展。守則條文"},{"article_no":76,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.6.1 公司秘書應是發行人的僱員，對發行人的日常事務有所認識。發行人若外聘 服務機構擔任公司秘書，應披露其內部一名可供該外聘服務機構聯絡的較高職位人士（如首席法律顧問或財務總監）的身份。"},{"article_no":77,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.6.2 公司秘書的遴選、委任或解僱應經由董事會批准。 註：委任及解僱公司秘書事宜應透過董事會會議討論，並應是舉行董事會會議而非以書面決議處理。"},{"article_no":78,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.6.3 公司秘書應向董事會主席及╱或行政總裁匯報。"},{"article_no":79,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.6.4 所有董事應可取得公司秘書的意見和享用他的服務，以確保董事會程序及所 有適用法律、規則及規例均獲得遵守。"}]},{"name":"D. 核數、內部監控及風險管理","articles":[{"article_no":80,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.1 財務匯報原則董事會應平衡、清晰及全面地評核公司的表現、情況及前景。守則條文"},{"article_no":81,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.1.1 管理層應向董事會提供充分的解釋及資料，讓董事會可以就提交給他們批准 的財務及其他資料，作出有根據的評審。"},{"article_no":82,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.1.2 管理層應每月向董事會成員提供更新資料（董事會及各董事亦有權索閱並應 該索閱有關資料），載列有關發行人的財務及營運表現，財務狀況及前景的公正及易於理解的評估，內容足以讓董事履行《上市規則》第3.08條及第十三章所規定的職責。註：所提供的資料應包括（如有）每月的管理層賬目及資料更新、有關將提呈董事會商議事項的背景或說明資料、披露文件、預算、預測以及其他相關內部財務報表。預算方面，若事前預測與實際數字之間有任何重大差距，亦應一併披露及解釋。"},{"article_no":83,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.1.3 董事應在《企業管治報告》中承認他們有編制賬目的責任，核數師亦應在有關 財務報表的核數師報告中就他們的匯報責任作出聲明。除非假設公司將會持續經營業務並不恰當，否則，董事擬備的賬目應以公司持續經營為基礎，有需要時更應輔以假設或保留意見。若董事知道有重大不明朗事件或情況可能會嚴重影響發行人持續經營的能力，董事應在《企業管治報告》清楚顯著披露及詳細討論此等不明朗因素。《企業管治報告》應載有足夠資料，讓投資者明白事件的嚴重性及意義。在合理和適當的範圍內，發行人可提述年報其他部分。該等提述必須清楚明白，不得含糊，而《企業管治報告》不能只列出相互參照的提述而對有關事宜不作任何論述。"},{"article_no":84,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.1.4 有關董事會應在年度報告及中期報告及根據《上市規則》規定須予披露的其他 財務資料內，對公司表現作出平衡、清晰及容易理解的評審。此外，其亦應在向監管者提交的報告及根據法例規定披露的資料內作出同樣的陳述。建議最佳常規"},{"article_no":85,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.1.5 發行人應於有關季度結束後45天內公布及刊發季度財務業績，所披露的資 料應足以讓股東評核發行人的表現、財務狀況及前景。發行人擬備季度財務業績時，應使用其半年度及年度賬目的會計政策。"},{"article_no":86,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.1.6 發行人開始公布季度財務業績後，其後的財政年度即應繼續匯報截至第三個 月及第九個月的季度業績。若發行人決定不繼續公布及刊發某一季度的財務業績，應公布作出這項決定的原因。"},{"article_no":87,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.2 風險管理及內部監控原則董事會負責評估及釐定發行人達成策略目標時所願意接納的風險性質及程度。上述風險包括但不限於與環境、社會及管治有關的重大風險（詳情見《上市規則》附錄C2的《環境、社會及管治報告守則》）。董事會有責任確保發行人設有並維持適當及有效的風險管理及內部監控系統，以處理所識別的風險、保障發行人資產、預防及偵測詐騙、不當行為和損失、確保發行人財務報告準確無誤以及遵守適用法律及規例。董事會應持續監督管理層對風險管理及內部監控系統的設計、實施及監察，並有責任確保發行人及其附屬公司至少每年檢討風險管理及內部監控系統的有效性，而管理層應向董事會提供有關系統是否有效的確認。守則條文"},{"article_no":88,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.2.1 董事會應確保有足夠的資源就發行人及其附屬公司的風險管理及內部監控系 統的效能進行（至少每年一次）的檢討。檢討範圍應涵蓋所有重大監控措施，包括財務、營運及合規監控措施，其中應特別考慮：(a)自上年檢討後，重大風險（包括環境、社會及管治風險）的性質及嚴重程度的轉變、以及發行人應付其業務轉變及外在環境轉變的能力；(b)管理層持續監察風險（包括環境、社會及管治風險）及內部監控系統的工作範疇及素質，及（如適用）內部審核功能及其他保證提供者的工作；(c)向董事會（或其轄下委員會）傳達監控結果的詳盡程度及次數，以助董事會評核發行人的風險管理及內部監控系統是否充足及有效；(d)檢討風險管理及內部監控系統期間發現的重大監控失誤或弱項，以及因此導致未能預見的後果或緊急情況的嚴重程度，而該等後果或情況對發行人的財務表現或情況已產生、可能已產生或將來可能會產生的重大影響，以及為解決有關監控失誤或弱項而採取的任何措施；(e)發行人有關財務報告及遵守《上市規則》規定的程序是否有效；及(f)發行人用於設計、實施及監察風險管理及內部監控系統的內部及外部資源（包括員工資歷及經驗、培訓課程以及發行人在會計、內部審核及財務匯報職能方面的預算）以及與發行人環境、社會及管治表現和匯報相關的資源是否足夠。註：有關風險管理及內部監控系統的檢討範圍，發行人應參閱本交易所發布並載於本交易所網站不時修訂的指引。"},{"article_no":89,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.2.2 發行人應設立內部審核功能。沒有內部審核功能的發行人須每年檢討是否需 要增設此項功能，並在《企業管治報告》內解釋為何沒有這項功能。註：1內部審核功能普遍是對發行人的風險管理及內部監控系統是否足夠和有效作出分析及獨立評估。2擁有多家上市發行人的集團可讓旗下成員公司共用集團資源去執行內部審核功能。"},{"article_no":90,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.2.3 發行人應制定舉報政策及系統，讓僱員及其他與發行人有往來者（如客戶及 供應商）可暗中及以不具名方式向審核委員會（或任何由獨立非執行董事佔大多數的指定委員會）提出其對任何可能關於發行人的不當事宜的關注。"},{"article_no":91,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.2.4 發行人應制定促進和支持反貪污法律及規例的政策和系統。"},{"article_no":92,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.3 審核委員會原則董事會應就如何應用財務匯報、風險管理及內部監控原則及如何維持與發行人核數師適當的關係作出正規及具透明度的安排。根據《上市規則》成立的審核委員會須具有清晰的職權範圍。守則條文"},{"article_no":93,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.3.1 審核委員會的完整會議紀錄應由正式委任的會議秘書（通常為公司秘書）保 存。會議紀錄的初稿及最後定稿應在會議後一段合理時間內發送委員會全體成員，初稿供成員表達意見，最後定稿作其紀錄之用。"},{"article_no":94,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.3.2 現時負責審計發行人賬目的核數公司的前任合伙人在以下日期（以日期較後 者為準）起計兩年內，不得擔任發行人審核委員會的成員：(a)該名人士終止成為該公司合伙人的日期；或(b)該名人士不再享有該公司財務利益的日期。"},{"article_no":95,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.3.3 審核委員會的職權範圍須至少包括： 與發行人核數師的關係(a)主要負責就外聘核數師的委任、重新委任及罷免向董事會提供建議、批准外聘核數師的薪酬及聘用條款，及處理任何有關該核數師辭職或辭退該核數師的問題；(b)按適用的標準檢討及監察外聘核數師是否獨立客觀及核數程序是否有效；審核委員會應於核數工作開始前先與核數師討論核數性質及範疇及有關匯報責任；(c)就外聘核數師提供非核數服務制定政策，並予以執行。就此規定而言，「外聘核數師」包括與負責核數的公司處於同一控制權、所有權或管理權之下的任何機構，或一個合理知悉所有有關資料的第三方，在合理情況下會斷定該機構屬於該負責核數的公司的本土或國際業務的一部分的任何機構。審核委員會應就任何須採取行動或改善的事項向董事會報告並提出建議；審閱發行人的財務資料(d)監察發行人的財務報表以及年度報告及賬目、半年度報告及（若擬刊發）季度報告的完整性，並審閱報表及報告所載有關財務申報的重大意見。委員會在向董事會提交有關報表及報告前，應特別針對下列事項加以審閱：(i)會計政策及實務的任何更改；(ii)涉及重要判斷的地方；(iii)因核數而出現的重大調整；(iv)企業持續經營的假設及任何保留意見；(v)是否遵守會計準則；及(vi)是否遵守有關財務申報的《上市規則》及法律規定；(e)就上述(d)項而言：－(i)委員會成員應與董事會及高級管理人員聯絡。委員會須至少每年與發行人的核數師開會兩次；及(ii)委員會應考慮於該等報告及賬目中所反映或需反映的任何重大或不尋常事項，並應適當考慮任何由發行人屬下會計及財務匯報職員、監察主任或核數師提出的事項；監管發行人財務匯報制度、風險管理及內部監控系統(f)檢討發行人的財務監控，以及（除非有另設的董事會轄下風險委員會又或董事會本身會明確處理）檢討發行人的風險管理及內部監控系統；(g)與管理層討論風險管理及內部監控系統，確保管理層已履行職責建立有效的系統。討論內容應包括發行人在會計及財務匯報職能方面的資源、員工資歷及經驗是否足夠，以及員工所接受的培訓課程及有關預算又是否充足；(h)主動或應董事會的委派，就有關風險管理及內部監控事宜的重要調查結果及管理層對調查結果的回應進行研究；(i)如公司設有內部審核功能，須確保內部和外聘核數師的工作得到協調；也須確保內部審核功能在發行人內部有足夠資源運作，並且有適當的地位；以及檢討及監察其成效；(j)檢討集團的財務及會計政策及實務；(k)檢查外聘核數師給予管理層的《審核情況說明函件》、核數師就會計紀錄、財務賬目或監控系統向管理層提出的任何重大疑問及管理層作出的回應；(l)確保董事會及時回應於外聘核數師給予管理層的《審核情況說明函件》中提出的事宜；(m)就本守則條文的事宜向董事會匯報；及(n)研究其他由董事會界定的課題。"},{"article_no":96,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.3.4 審核委員會應在本交易所網站及發行人網站上公開其職權範圍，解釋其角色 及董事會轉授予其的權力。"},{"article_no":97,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.3.5 凡董事會不同意審核委員會對甄選、委任、辭任或罷免外聘核數師事宜的意 見，發行人應在《企業管治報告》中列載審核委員會闡述其建議的聲明，以及董事會持不同意見的原因。"},{"article_no":98,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.3.6 審核委員會應獲供給充足資源以履行其職責。"},{"article_no":99,"chapter_no":17,"chapter_name":"D. 核數、內部監控及風險管理","content":"D.3.7 審核委員會的職權範圍亦須包括： (a)檢討發行人設定的以下安排：發行人僱員可暗中就財務匯報、內部監控或其他方面可能發生的不正當行為提出關注。審核委員會應確保有適當安排，讓發行人對此等事宜作出公平獨立的調查及採取適當行動；及(b)擔任發行人與外聘核數師之間的主要代表，負責監察二者之間的關係。"}]},{"name":"E. 薪酬","articles":[{"article_no":100,"chapter_no":18,"chapter_name":"E. 薪酬","content":"E.1 薪酬的水平及組成及其披露原則發行人應就董事酬金及其他與薪酬相關的事宜制定正規而具透明度的政策；應設有正規而具透明度的程序，以制定有關執行董事酬金及全體董事薪酬待遇的政策。所定薪酬的水平應足以吸引及挽留董事管好公司營運，而又不致支付過多的酬金。任何董事不得參與訂定本身的酬金。守則條文"},{"article_no":101,"chapter_no":18,"chapter_name":"E. 薪酬","content":"E.1.1 薪酬委員會應就其他執行董事的薪酬建議咨詢主席及╱或行政總裁。如有需 要，薪酬委員會應可尋求獨立專業意見。"},{"article_no":102,"chapter_no":18,"chapter_name":"E. 薪酬","content":"E.1.2 薪酬委員會在職權範圍方面應作為最低限度包括： (a)就發行人董事及高級管理人員的全體薪酬政策及架構，及就設立正規而具透明度的程序制訂薪酬政策，向董事會提出建議；(b)因應董事會所訂企業方針及目標而檢討及批准管理層的薪酬建議；(c)以下兩者之一：(i)獲董事會轉授責任，釐定個別執行董事及高級管理人員的薪酬待遇；或(ii)向董事會建議個別執行董事及高級管理人員的薪酬待遇。此應包括非金錢利益、退休金權利及賠償金額（包括喪失或終止職務或委任的賠償）；(d)就非執行董事的薪酬向董事會提出建議；(e)考慮同類公司支付的薪酬、須付出的時間及職責以及集團內其他職位的僱用條件；(f)檢討及批准向執行董事及高級管理人員就其喪失或終止職務或委任而須支付的賠償，以確保該等賠償與合約條款一致；若未能與合約條款一致，賠償亦須公平合理，不致過多；(g)檢討及批准因董事行為失當而解僱或罷免有關董事所涉及的賠償安排，以確保該等安排與合約條款一致；若未能與合約條款一致，有關賠償亦須合理適當；(h)確保任何董事或其任何聯繫人不得參與釐定其本身的薪酬；及(i)審閱及╱或批准《上市規則》第十七章所述有關股份計劃的事宜。"},{"article_no":103,"chapter_no":18,"chapter_name":"E. 薪酬","content":"E.1.3 薪酬委員會應在本交易所網站及發行人網站上公開其職權範圍，解釋其角色 及董事會轉授予其的權力。"},{"article_no":104,"chapter_no":18,"chapter_name":"E. 薪酬","content":"E.1.4 薪酬委員會應獲供給充足資源以履行其職責。"},{"article_no":105,"chapter_no":18,"chapter_name":"E. 薪酬","content":"E.1.5 發行人應在其年報內披露董事薪酬政策，按薪酬等級披露高級管理人員的酬 金詳情及其他與薪酬有關的事項。建議最佳常規"},{"article_no":106,"chapter_no":18,"chapter_name":"E. 薪酬","content":"E.1.6 若採納第E.1.2(c)(ii)條，凡董事會議決通過的薪酬或酬金安排為薪酬委員會 不同意者，董事會應在下一份《企業管治報告》中披露其通過該項決議的原因。"},{"article_no":107,"chapter_no":18,"chapter_name":"E. 薪酬","content":"E.1.7 執行董事的薪酬應有頗大部分與公司及個人表現掛鈎。"},{"article_no":108,"chapter_no":18,"chapter_name":"E. 薪酬","content":"E.1.8 發行人應在其年度報告內披露每名高級管理人員的酬金，並列出每名高級管 理人員的姓名。"},{"article_no":109,"chapter_no":18,"chapter_name":"E. 薪酬","content":"E.1.9 發行人一般不應給予獨立非執行董事帶有績效表現相關元素的股本權益酬金 （例如購股權或贈授股份），因為這或導致其決策偏頗並影響其客觀性和獨立性。"}]},{"name":"F. 股東參與","articles":[{"article_no":110,"chapter_no":19,"chapter_name":"F. 股東參與","content":"F.1 有效溝通及股東會議的進行原則董事會應負責與股東持續保持對話，尤其是藉正式會議（包括股東大會）及發行人股東溝通政策下的其他適當渠道與股東溝通及鼓勵他們的參與。此外，發行人召開股東大會應預留足夠時間向股東發出通知，並提供足夠的資料，讓股東得知有關投票表決的詳細程序，同時亦應安排在股東會議上回答股東的問題。守則條文"},{"article_no":111,"chapter_no":19,"chapter_name":"F. 股東參與","content":"F.1.1 董事會（尤其是獨立非執行董事）應便於股東與其聯繫，以促進具建設性的 互動及了解股東對影響發行人的事宜（包括就發行人的管治及企業策略的表現）有何看法。董事會應在《企業管治報告》中載列報告期內與股東互動的資料，包括：(a)所進行的互動的性質及數目╱頻次；(b)參與有關互動的股東群體；(c)參與有關互動的發行人代表（例如行政總裁、董事會主席、獨立非執行董事、董事委員會主席及高級管理層成員）；及(d)發行人跟進有關互動結果的方法。"},{"article_no":112,"chapter_no":19,"chapter_name":"F. 股東參與","content":"F.1.2 在股東大會上，會議主席應就每項實際獨立的事宜個別提出決議案。除非有 關決議案之間相互依存及關連，合起來方成一項重大建議，否則發行人應避免「捆扎」決議案。若要「捆扎」決議案，發行人應在會議通知解釋原因及當中涉及的重大影響。註： 「實際獨立事宜」的例子包括董事提名，即每名候選人的提名應以獨立決議案的方式進行。"},{"article_no":113,"chapter_no":19,"chapter_name":"F. 股東參與","content":"F.1.3 董事會主席應出席股東周年大會，並邀請首席獨立非執行董事（如有）以及審 核委員會、薪酬委員會、提名委員會及任何其他委員會（視何者適用而定）的主席出席。若任何委員會主席未克出席，董事會主席應邀請另一名委員（或如該名委員未能出席，則其適當委任的代表）出席。該人士須在股東周年大會上回答相關提問。董事會轄下的獨立委員會（如有）的主席亦應在任何批准以下交易的股東大會上回應問題，即關連交易或任何其他須經獨立股東批准的交易。發行人的管理層應確保外聘核數師出席股東周年大會，回答有關審計工作，編制核數師報告及其內容，會計政策以及核數師的獨立性等問題。註：在符合發行人的組織章程文件、其註冊成立地的法律及法規的情況下，透過電話或視像會議等電子途徑參與會議的上述人士可計算為親身出席會議。"},{"article_no":114,"chapter_no":19,"chapter_name":"F. 股東參與","content":"F.1.4 大會主席應確保在會議上向股東解釋以投票方式進行表決的詳細程序，並回 答股東有關以投票方式表決的任何提問。建議最佳常規"},{"article_no":115,"chapter_no":19,"chapter_name":"F. 股東參與","content":"F.1.5 本交易所鼓勵發行人在其《企業管治報告》中包括以下資料： (a)股東類別的詳情及總持股量；(b)接着一個財政年度的股東重要事項日誌；及(c)[已於2026年1月1日刪除](d)每名高級管理人員的持股量。"}]}]},{"id":137,"name":"吉林市人民政府关于废止和修改部分政府规章的决定","doc_no":"吉林市人民政府令第245号","level":"地方政府规章","issuing_org":"吉林市人民政府","publish_date":"2024-02-23","amend_date":"2023-02-01","status":"现行有效","bbbs":null,"source":"国家规章库","official_url":"http://xxgk.jlcity.gov.cn/szf/gzk/202403/t20240308_1195127.html","effective_date":null,"preamble":null,"chapters":[{"name":"全文","articles":[{"article_no":1,"chapter_no":null,"chapter_name":null,"content":"吉林市人民政府关于废止和修改部分政府规章的决定\n\n（2024年3月6日吉林市人民政府令第245号公布）\n\n为贯彻落实新修订的《中华人民共和国行政复议法》等相关法律、法规，维护国家法制统一，根据有关规定，市政府对现行政府规章进行了清理。经过清理决定：\n\n一、对下列2部政府规章予以废止\n\n（一）《吉林市行政许可实施与监督办法》（2004年9月30日吉林市人民政府令第158号公布，根据2023年2月1日吉林市人民政府令第243号修订）。\n\n（二）《吉林市行政执法责任制规定》（2005年11月25日吉林市人民政府令第167号公布，根据2023年2月1日吉林市人民政府令第243号修订）。\n\n二、对《吉林市城区养犬管理办法》予以修改\n\n将第四条第一款修改为：“公安机关是本市养犬管理工作的行政主管部门，负责办理养犬登记工作，查处违法养犬、携犬外出等行为。”\n\n将第十一条第一款修改为：“犬龄满90日的，在接受犬只免疫接种后，养犬人应当携带有关材料，向公安机关申请首次登记。”将第二款中的“应当当场发放养犬证和犬牌”修改为“应当发放登记凭证”。将第三款修改为：“禁止买卖或者伪造、变造犬只免疫证明、登记凭证。”\n\n将第十三条、第十五条中的“养犬证”修改为“犬只登记”。\n\n将第十六条第一款修改为：“养犬实行年登记制度，养犬人应当自养犬首次登记之日起每满一年前15日内，携带登记凭证、犬只免疫证明向公安机关重新申请登记。”将第二款中的“年检”修改为“办理年度登记”。\n\n将第十七条第一款中的“持养犬证和犬牌”修改为“持犬只登记凭证”。将第二款修改为：“养犬人放弃饲养犬只或者饲养的犬只死亡、丢失的，养犬人应当在15日内，向公安机关申请注销登记。”\n\n删去第十八条第三项，将第四项改为第三项，修改为：“（三）犬只登记、变更、注销等情况”。\n\n将第二十一条第二款中的“诊断报告”修改为“临床诊断报告”。\n\n删去第二十五条第一款第四项。\n\n将第二十六条第二款中的“养犬证”修改为“犬只登记”。删去第三款。\n\n将第二十七条修改为：“逾期不认领的走失犬只、无主犬只、养犬人送交的犬只和因养犬人违反本办法规定被没收的犬只，经检疫合格的，可以由符合本办法规定条件的个人或者单位在30日内领养。无人领养的，由公安机关依法处理。”\n\n删去第二十八条。\n\n将第二十九条改为第二十八条，将第二项修改为：“（二）违反第十一条第一款、第十六条第一款规定，未办理首次养犬登记或者登记期限届满未按规定重新办理登记的，没收有关犬只，并处以每犬1000元罚款”。删去第四项。\n\n此外，将该规章中的“畜牧兽医”修改为“农业农村”。\n\n对规章的条文顺序作相应调整。\n\n本决定自公布之日起施行。"}]}]},{"id":147,"name":"唐山市人民代表大会常务委员会关于废止地方性法规中若干行政许可规定的决定","doc_no":null,"level":"地方性法规","issuing_org":"唐山市人民代表大会常务委员会","publish_date":"2004-10-09","amend_date":null,"status":"现行有效","bbbs":"ff8080816f3cbb3c016f64e53fba49e6","source":"国家法律法规数据库","official_url":"https://flk.npc.gov.cn/detail.html?bbbs=ff8080816f3cbb3c016f64e53fba49e6","effective_date":"2004-10-09","preamble":"（2004年6月25日唐山市第十二届人民代表大会常务委员会第九次会议通过  2004年9月27日河北省第十届人民代表大会常务委员会第十一次会议批准  2004年10月9日唐山市第十二届人大常委会发布第七号公告公布施行）","chapters":[{"name":"全文","articles":[{"article_no":null,"chapter_no":null,"chapter_name":"","content":"唐山市人民代表大会常务委员会\n关于废止地方性法规中若干行政许可规定的\n决定\n（2004年6月25日唐山市第十二届人民代表大会常务委员会第九次会议通过  2004年9月27日河北省第十届人民代表大会常务委员会第十一次会议批准  2004年10月9日唐山市第十二届人大常委会发布第七号公告公布施行）\n唐山市第十二届人民代表大会常务委员会第九次会议审议通过了《唐山市人民代表大会法制委员会关于清理地方性法规中行政许可规定及审查清理结果的报告》，根据《中华人民共和国行政许可法》的有关规定，唐山市第十二届人大常委会第九次会议决定：\n一、废止《唐山市农药经营管理办法》第十条和第十一条设定的“农药经营许可”；\n二、废止《唐山市技术市场管理办法》第十二条规定的“技术贸易机构设立（前置）许可”；\n本决定自河北省人大常委会批准之日起施行。"}]}]},{"id":149,"name":"唐山市人民代表大会常务委员会关于第二批废止地方性法规中若干行政许可规定的决定","doc_no":null,"level":"地方性法规","issuing_org":"唐山市人民代表大会常务委员会","publish_date":"2004-12-01","amend_date":null,"status":"现行有效","bbbs":"ff8080816f3cbb3c016f64c4cd034974","source":"国家法律法规数据库","official_url":"https://flk.npc.gov.cn/detail.html?bbbs=ff8080816f3cbb3c016f64c4cd034974","effective_date":"2004-12-01","preamble":"（2004年10月27日唐山市第十二届人民代表大会常务委员会第十一次会议通过2004年11月27日河北省第十届人民代表大会常务委员会第十二次会议批准）","chapters":[{"name":"全文","articles":[{"article_no":null,"chapter_no":null,"chapter_name":"","content":"唐山市人民代表大会常务委员会\n关于第二批废止地方性法规中\n若干行政许可规定的决定\n（2004年10月27日唐山市第十二届人民代表大会常务委员会第十一次会议通过2004年11月27日河北省第十届人民代表大会常务委员会第十二次会议批准）\n唐山市第十二届人民代表大会常务委员会第十一次会议审议了市人大常委会主任会议提请审议的《关于第二批废止地方性法规中若干行政许可规定的决定（草案）》的议案，根据《中华人民共和国行政许可法》和国务院的有关规定，唐山市第十二届人大常委会第十一次会议决定：\n一、废止《唐山市市政工程设施管理条例》第十五条规定的“占用、挖掘城市道路由公安交通管理部门办理审批”的行政许可规定；\n二、废止《唐山市市政工程设施管理条例》第二十三条规定的“超限车辆、履带车通过城市桥涵必须经公安交通管理部门批准”的行政许可规定；\n三、废止《唐山市城市供水管理条例》第七条规定的“城市供水行政管理部门核发供水企业资质证书”的行政许可规定，第三十六条第一项规定的法律责任相应废止；\n四、废止《唐山市城市供水管理条例》第二十九条第五项规定的“自建设施供水管网与城市公共供水管网连接审批”的行政许可规定，第三十七条第七项规定的有关法律责任相应废止；\n五、废止《唐山市文物保护管理办法》第十九条规定的“本市文物省内、省外展览审批”的行政许可规定；\n六、废止《唐山市乡村规划建设管理条例》第十五条设定的“在乡村规划范围内临时用地须经建设部门批准”的行政许可规定。\n本决定自公布之日起施行。"}]}]},{"id":152,"name":"最高人民法院关于废止1993年底以前发布的部分司法解释的通知","doc_no":null,"level":"司法解释","issuing_org":"最高人民法院","publish_date":"1994-07-27","amend_date":null,"status":"现行有效","bbbs":"402881e46005230d0160058f58bc05b3","source":"国家法律法规数据库","official_url":"https://flk.npc.gov.cn/detail.html?bbbs=402881e46005230d0160058f58bc05b3","effective_date":"1994-07-27","preamble":null,"chapters":[{"name":"全文","articles":[{"article_no":1,"chapter_no":null,"chapter_name":null,"content":"各省、自治区、直辖市高级人民法院，解放军军事法院：\n根据任建新院长在第十六次全国法院工作会议报告中提出的“抓紧对过去的司法解释进行清理，对其中不适应加快改革开放和经济建设要求的，分别不同情况，进行修改、补充或者废止”的要求，我院自1993年起，本着由近及远、分期分批、抓紧进行的原则，对1979年至1993年间发布的司法解释进行了全面清理。现将经我院审判委员会讨论通过的第一批予以废止的司法解释目录印发给你们。这批予以废止的司法解释共11件，其中刑事审判方面2件，经济审判方面2件，行政审判方面4件，海事审判方面3件。予以废止的这些司法解释从即日起不再适用（有的早已自行失效）。但过去适用上述司法解释对有关案件作出的判决、裁定仍然有效。清理司法解释工作尚在进行中，需要废止的司法解释，以后还将陆续分批通知你们。最高人民法院与有关部门联合发布的司法解释性文件需要废止的，我院将与有关部门联合发文予以废止。有些司法解释只有部分内容不适应当前审判实践需要的，我院将在全面清理的基础上，组织有关部门研究修改，各地有什么意见请及时报我院。\n附：最高人民法院予以废止的1993年底以前发布的司法解释目录（第一批）\n附：\n最高人民法院\n予以废止的1993年底以前发布的\n司法解释目录（第一批）\n（最高人民法院审判委员会第667次会议讨论通过）\n序号\n分类\n司法解释名称\n发文日期、文号\n废止理由\n1\n刑事\n最高人民法院关于办理共同盗窃犯罪案件如何适用法律问题的意见\n1991年4月12日法（研）发〔1991〕11号\n已被1992年12月11日最高人民法院最高人民检察院发布的《关于办理盗窃案件具体应用法律的若干问题的解释》代替。\n2\n最高人民法院关于严厉打击偷渡犯罪活动的通知\n1993年9月24日法发〔1993〕24号\n1994年3月5日全国人民代表大会常务委员会已经通过并公布了《关于严惩组织运送他人偷越国（边）境犯罪的补充规定》，原依据刑法有关规定作出的上述司法解释不再适用。\n3\n经济\n最高人民法院关于因口头协议纠纷提起的诉讼管辖问题的批复\n1990年3月16日\n1991年4月9日全国人民代表大会通过并公布了《中华人民共和国民事诉讼法》，上述批复有关内容与之抵触或者重复，不再适用。\n4\n最高人民法院关于工商行政管理机关对无效经济合同引起的财产争议处理后当事人向人民法院起诉是否受理的批复\n1990年11月3日法（经）复〔1990〕16号\n已被1992年4月1日最高人民法院发布的《关于不服工商行政管理机关的确认经济合同无效及财产损失的处理决定的案件应属行政案件的复函》代替。\n5\n行政\n人民法院审理治安行政案件具体应用法律的若干问题的暂行规定\n1986年10月24日法（研）发〔1986〕31号\n1989年4月4日全国人民代表大会已经通过并公布了《中华人民共和国行政诉讼法》，上述司法解释与之抵触，不再适用。\n6\n最高人民法院关于如何适用土地管理法第十三条和森林法第十四条的批复\n1987年7月31日法（经）复字〔1987〕28号\n1989年4月4日全国人民代表大会通过并公布了《中华人民共和国行政诉讼法》，上述批复与之抵触，不再适用。\n7\n最高人民法院关于铁路运输法院是否受理治安行政案件的批复\n1987年9月11日法（研）复〔1987〕34号\n1989年4月4日全国人民代表大会已经通过并公布了《中华人民共和国行政诉讼法》，上述批复与之抵触，不再适用。\n8\n最高人民法院关于《人民法院审理治安行政案件具体应用法律的若干问题的暂行规定》是否适用于审理其他行政案件的批复\n1988年1月13日法（研）复〔1988〕9号\n1989年4月4日全国人民代表大会已经通过并公布了《中华人民共和国行政诉讼法》，上述批复与之抵触，不再适用。\n9\n海事\n最高人民法院在扣船规定出台前关于扣船程序的批复\n1981年10月24日〔81〕法（交）字第3号\n已被1994年7月6日最高人民法院发布的《关于海事法院诉讼前扣押船舶的规定》代替。\n10\n最高人民法院关于诉讼前扣押船舶的具体规定（1986年1月31日最高人民法院审判委员会通过）\n已被1994年7月6日最高人民法院发布的《关于海事法院诉讼前扣押船舶的规定》代替。\n11\n最高人民法院关于强制变卖被扣押船舶清偿债务的具体规定\n1987年8月29日法（经）发〔1987〕22号\n已被1994年7月6日最高人民法院发布的《关于海事法院拍卖被扣押船舶清偿债务的规定》代替。"}]}]},{"id":153,"name":"最高人民法院关于废止1979年至1989年间发布的部分司法解释的通知","doc_no":null,"level":"司法解释","issuing_org":"最高人民法院","publish_date":"1996-12-31","amend_date":null,"status":"现行有效","bbbs":"402881e46005230d01600584880504d2","source":"国家法律法规数据库","official_url":"https://flk.npc.gov.cn/detail.html?bbbs=402881e46005230d01600584880504d2","effective_date":"1996-12-31","preamble":"1996年12月31日      法发〔1996〕34号","chapters":[{"name":"全文","articles":[{"article_no":1,"chapter_no":null,"chapter_name":null,"content":"各省、自治区、直辖市高级人民法院，解放军军事法院：\n我院公布第一批予以废止的司法解释目录之后，即着手对1979年至1989年间发布的司法解释进行了全面清理。现将经我院审判委员会讨论决定废止的第二批司法解释目录印发给你们。这批废止的司法解释共69件，包括刑事审判方面16件，民事审判方面34件，经济审判方面19件。其中，有个别文件是以“函”、“复函”等形式发出的，考虑到这些文件具有司法解释的性质，而且在当时也起到了指导审判工作的作用，本着尊重历史、保持原貌的原则，这次也将其作为司法解释一并予以清理。废止的司法解释从即日起不再适用（有的早已自行失效）。但过去适用上述司法解释对有关案件作出的判决、裁定仍然有效。清理司法解释工作将继续进行。最高人民法院与有关部门联合发布的司法解释性文件需要废止的，我院将与有关部门联合发文予以废止。对一些司法解释中只有部分内容不适应当前审判实践需要的，不在这次清理之列，我院将在全面清理的基础上，组织有关部门研究修改。各地有何意见请及时报告我院。\n附：\n最高人民法院决定废止的1979年至\n1989年间发布的司法解释目录（第二批）\n（最高人民法院审判委员会第869次会议讨论通过）\n序号\n分类\n司法解释名称\n发文日期、文号\n废止理由\n1\n刑事\n最高人民法院关于管辖区划变更后复查案件审批程序问题的批复\n1979年3月21日〔79〕法办研字第7号\n该批复是对个案问题的处理意见，现已不再适用。\n2\n最高人民法院关于报送死刑复核案件的几项规定的通知\n1979年12月12日〔79〕法办字第92号\n该司法解释已被1994年3月21日最高人民法院发布的《关于审理刑事案件程序的具体规定》代替。\n3\n最高人民法院关于对几类现行犯授权高级人民法院核准死刑的若干具体规定的通知\n1980年3月18日\n该司法解释已被1983年9月7日最高人民法院发布的《关于授权高级人民法院核准部分死刑案件的通知》代替。\n4\n最高人民法院关于揭批“四人帮”斗争中清查出来的犯罪分子在逮捕前被隔离审查的日期可否折抵刑期的批复\n1980年4月17日〔80〕法研字第13号\n该批复是对特定历史时期遗留问题的处理意见，现已不再适用。\n5\n最高人民法院关于中级人民法院判处死缓经高级人民法院复核认为必须判处死刑立即执行的案件应如何处理问题的批复\n1981年6月10日〔81〕法研字第11号\n该批复已被1994年3月21日最高人民法院发布的《关于审理刑事案件程序的具体规定》代替。\n6\n最高人民法院关于在逮捕前交“群众监督劳动”的日期可否折抵刑期问题的批复\n1982年9月8日〔1982〕法研字第7号\n该批复是对个案问题的处理意见，现已不再适用。\n7\n最高人民法院关于刑事案件被告人在审理过程中患精神病应否中止审理的批复\n1983年2月4日〔83〕法研字第1号\n该批复已被1994年3月21日最高人民法院发布的《关于审理刑事案件程序的具体规定》代替。\n8\n最高人民法院关于个人非法制造、销售他人注册商标标识而构成犯罪的应按假冒商标罪惩处的批复\n1985年5月9日法（研）复〔1985〕28号\n1993年2月22日全国人民代表大会常务委员会通过并公布了《关于惩治假冒注册商标犯罪的补充规定》，该批复内容与之抵触，不再适用。\n9\n最高人民法院关于播放淫秽录像、影片、电视片、幻灯片等犯罪案件如何定罪问题的批复\n1985年7月8日法（研）复〔1985〕40号\n1990年12月28日全国人民代表大会常务委员会通过并公布了《关于惩治走私制造贩卖传播淫秽物品犯罪分子的决定》，该批复内容与之抵触，不再适用。\n10\n最高人民法院关于对罪犯减刑时应将判决前羁押的日期折抵为已执行的刑期的批复\n1985年11月14日\n该批复是对最高人民法院、最高人民检察院、公安部1979年10月10日《关于死缓犯和无期徒刑犯减刑问题的联合通知》有关问题的解释，该《联合通知》已废除，该批复不再适用。\n11\n最高人民法院关于依法严惩猎杀大熊猫、倒卖走私大熊猫皮的犯罪活动的通知\n1987年7月24日\n该批复已被1988年11月8日全国人民代表大会常务委员会通过并公布的《关于惩治捕杀国家重点保护的珍贵、濒危野生动物犯罪的补充规定》代替。\n12\n最高人民法院关于被判处拘役或者三年以下有期徒刑宣告缓刑的罪犯减刑的管辖和处理程序的批复\n1988年1月5日\n法（研）复〔1988〕1号\n该批复已被1994年3月21日最高人民法院发布的《关于审理刑事案件程序的具体规定》代替。\n13\n最高人民法院关于第二审人民法院审理被害人对刑事案件中附带的民事部分提出的上诉应全案审查并就附带民事诉讼部分作出终审裁判的批复\n1988年5月11日法（研）发〔1988〕23号\n该批复已被1994年3月21日最高人民法院发布的《关于审理刑事案件程序的具体规定》代替。\n14\n最高人民法院关于刑事案件取保候审的被告人在法院审理期间潜逃应宣告中止审理的批复\n1988年7月6日法（研）复〔1988〕29号\n该批复已被1994年3月21 号\n原依据的《中华人民共和国经济合同法》已失效。\n7\n最高人民法院关于经工商行政管理部门查处后人民法院对购销伪劣假冒商品合同纠纷是否受理的问题的函\n1989年5月30日〔89〕法经函字第15号\n已被1991年4月9日全国人民代表大会通过的《中华人民共和国民事诉讼法》代替。\n8\n最高人民法院民事审判庭关于民事制裁复议程序几个问题的复函\n1990年4月13日〔89〕民他字第47号\n已被1991年4月9日全国人民代表大会通过的《中华人民共和国民事诉讼法》和1992年7月14日最高人民法院发布的法发〔1992〕22号《最高人民法院关于适用〈中华人民共和国民事诉讼法〉若干问题的意见》代替。\n9\n最高人民法院关于在经济审判中适用国务院国发〔1990〕68号文件有关问题的通知\n1991年3月16日法（经）发〔1991〕10号\n情况已变化，实际上已失效。\n10\n最高人民法院关于适用《关于修改〈中华人民共和国经济合同法〉的决定》有关问题的通知\n1993年11月27日法发〔1993〕39号\n原依据的《中华人民共和国经济合同法》已失效。\n11\n最高人民法院关于逾期付款的违约金应依何种标准计算问题的复函\n1994年3月12日法函〔1994〕10号\n已被1999年2月16日最高人民法院发布的法释〔1999〕8号《最高人民法院关于逾期付款违约金应当按照何种标准计算问题的批复》代替。\n12\n最高人民法院关于海事法院诉讼前扣押船舶的规定\n1994年7月6日法发〔1994〕14号\n已被1999年12月25日全国人民代表大会常务委员会通过的《中华人民共和国海事诉讼特别程序法》代替。\n13\n最高人民法院关于逾期付款违约金应当依据何种标准计算问题的批复\n1996年5月16日法复〔1996〕7号\n已被1999年2月16日最高人民法院发布的法释〔1999〕8号《最高人民法院关于逾期付款违约金应当按照何种标准计算问题的批复》代替。\n14\n最高人民法院关于对公民在羁押期内被同监室人犯殴打致死公安机关应否承担责任问题的答复\n1998年1月19日〔1997〕行他字第9号\n已被2001年6月26日最高人民法院发布的法释〔2001〕23号《最高人民法院关于公安机关不履行法定行政职责是否承担行政赔偿责任问题的批复》代替。"}]}]},{"id":159,"name":"西安市人民代表大会常务委员会关于废止《西安市预防职务犯罪条例》的决定","doc_no":null,"level":"地方性法规","issuing_org":"西安市人民代表大会常务委员会","publish_date":"2021-01-18","amend_date":null,"status":"现行有效","bbbs":"ff80808177e75f8801784a2d0d516af1","source":"国家法律法规数据库","official_url":"https://flk.npc.gov.cn/detail.html?bbbs=ff80808177e75f8801784a2d0d516af1","effective_date":"2021-01-18","preamble":null,"chapters":[{"name":"全文","articles":[{"article_no":null,"chapter_no":null,"chapter_name":"","content":"西安市人民代表大会常务委员会\n关于废止《西安市预防职务犯罪条例》的决定\n（2020年10月21日西安市第十六届人民代表大会\n常务委员会第三十七次会议通过\n2020年11月26日陕西省第十三届人民代表大会\n常务委员会第二十三次会议批准）\n西安市第十六届人民代表大会常务委员会第三十七次会议决定：\n废止《西安市预防职务犯罪条例》（2003年5月29日西安市第十三届人民代表大会常务委员会第七次会议通过2003年9月28日陕西省第十届人民代表大会常务委员会第六次会议批准  根据2010年7月15日西安市第十四届人民代表大会常务委员会第二十三次会议通过2010年9月29日陕西省第十一届人民代表大会常务委员会第十八次会议批准的《西安市人民代表大会常务委员会关于修改部分地方性法规的决定》修正）。\n本决定自公布之日起施行。"}]}]},{"id":1663,"name":"退役军人就业创业促进条例","doc_no":null,"level":"行政法规","issuing_org":"国务院","publish_date":"2026-06-26","amend_date":null,"status":"现行有效","bbbs":"ff8081819f12cdb7019f20e2bce8514c","source":"国家法律法规数据库","official_url":"https://flk.npc.gov.cn/detail.html?bbbs=ff8081819f12cdb7019f20e2bce8514c","effective_date":"2026-08-01","preamble":null,"chapters":[{"name":"总则","articles":[{"article_no":1,"chapter_no":1,"chapter_name":"总则","content":"为了促进退役军人就业创业，发挥退役军人人力资源作用，维护退役军人合法权益，让军人成为全社会尊崇的职业，根据《中华人民共和国退役军人保障法》、《中华人民共和国就业促进法》等有关法律，制定本条例。"},{"article_no":2,"chapter_no":1,"chapter_name":"总则","content":"退役军人就业创业工作坚持中国共产党的领导，坚持普惠与优待叠加的原则，采取政府推动、市场引导、社会支持相结合的方式，鼓励和扶持退役军人就业创业。"},{"article_no":3,"chapter_no":1,"chapter_name":"总则","content":"引导退役军人树立正确的择业观念，通过教育培训、就业支持、创业扶持等措施，促进退役军人高质量充分就业。"},{"article_no":4,"chapter_no":1,"chapter_name":"总则","content":"国家将退役军人就业创业工作纳入有关规划。\n各级人民政府应当加强对退役军人就业创业的指导和服务，推动机关、群团组织、企业事业单位等各负其责、密切配合，形成支持退役军人就业创业的合力。"},{"article_no":5,"chapter_no":1,"chapter_name":"总则","content":"国务院退役军人工作主管部门、人力资源社会保障部门以及中央和国家机关其他有关部门按照职责分工做好退役军人就业创业工作。\n县级以上地方人民政府退役军人工作主管部门应当加强对退役军人就业创业的宣传、组织、协调等工作。地方各级有关机关应当在各自职责范围内做好退役军人就业创业工作。"},{"article_no":6,"chapter_no":1,"chapter_name":"总则","content":"尊重、关爱退役军人是全社会的共同责任。国家鼓励和引导企业、社会组织、个人等社会力量依法为退役军人就业创业提供支持和帮助。"},{"article_no":7,"chapter_no":1,"chapter_name":"总则","content":"退役军人在就业创业活动中应当模范遵守宪法和法律法规，保守军事秘密，践行社会主义核心价值观，积极参加社会主义现代化建设。"},{"article_no":8,"chapter_no":1,"chapter_name":"总则","content":"国家依法对退役军人就业创业给予经费支持，标准应当与经济社会发展水平和财力状况相适应。"}]},{"name":"教育培训","articles":[{"article_no":9,"chapter_no":2,"chapter_name":"教育培训","content":"国家采取措施加强对退役军人的教育培训，帮助退役军人完善知识结构，提高思想政治水平、职业技能水平和综合职业素养，提升就业创业能力。"},{"article_no":10,"chapter_no":2,"chapter_name":"教育培训","content":"国家鼓励退役军人接受学历教育，提升学历层次，增强就业创业发展潜力。\n国家鼓励退役军人接受职业学校教育，提升技术技能，增强职业综合素质和行动能力。"},{"article_no":11,"chapter_no":2,"chapter_name":"教育培训","content":"军人入伍前已被普通高等学校录取或者是正在普通高等学校就学的学生，服现役期间保留入学资格或者学籍，退役后2年内允许入学或者复学，可以按照国家有关规定转入本校其他专业学习。"},{"article_no":12,"chapter_no":2,"chapter_name":"教育培训","content":"退役军人参加国家教育考试的，按照国家有关规定享受优待政策。\n退役军人在接受学历教育时，按照国家有关规定享受学费和助学金资助等国家教育资助政策。\n县级以上地方人民政府兵役机关、退役军人工作主管部门按照职责分工负责对退役军人考生和复学学生的政策宣传、身份审核工作，教育行政部门负责资助资格审核工作。\n鼓励各地出台政策支持退役军人参加高等教育自学考试和各类高等学校举办的高等学历继续教育。"},{"article_no":13,"chapter_no":2,"chapter_name":"教育培训","content":"鼓励普通高等学校、职业院校（含技工院校）等针对退役军人特点，优化人才培养方案。"},{"article_no":14,"chapter_no":2,"chapter_name":"教育培训","content":"退役军人培训工作应当以提高就业质量为导向，紧密围绕社会需求，适应科技创新和产业发展趋势，为退役军人提供有特色、精细化、针对性强的培训服务。"},{"article_no":15,"chapter_no":2,"chapter_name":"教育培训","content":"县级以上地方人民政府退役军人工作主管部门根据驻地部队需要，协助开展职业技能储备培训和离队前教育。"},{"article_no":16,"chapter_no":2,"chapter_name":"教育培训","content":"军人退出现役后，退役军人工作主管部门和其他负责退役军人安置工作的部门应当区分不同安置方式的退役军人，组织适应性培训。培训应当使用适合退役军人特点的教材，培训时长不得少于国家规定的时长。"},{"article_no":17,"chapter_no":2,"chapter_name":"教育培训","content":"符合条件的退役军人参加职业技能培训的，按照规定享受职业技能培训补贴等相应扶持政策。\n安置地人民政府退役军人工作主管部门应当根据未达到法定退休年龄的自主就业退役军士和义务兵的就业需求，组织其免费参加职业技能培训，或者在其参加职业技能培训后在安置地标准内给予培训补贴。"},{"article_no":18,"chapter_no":2,"chapter_name":"教育培训","content":"自主就业的退役军士和义务兵原则上在安置地参加职业技能培训。经安置地人民政府退役军人工作主管部门批准，在安置地以外地区参加职业技能培训的，培训结束并经安置地人民政府退役军人工作主管部门审核同意后，在安置地标准内给予培训补贴。"},{"article_no":19,"chapter_no":2,"chapter_name":"教育培训","content":"省级人民政府退役军人工作主管部门负责统筹本行政区域内退役军人职业技能培训工作，明确总体计划、管理机制、发展方向等，可以根据实际情况会同有关部门制定公布职业技能培训项目参考目录，结合实际组织实施示范培训。\n设区的市级人民政府退役军人工作主管部门及其授权的县级人民政府退役军人工作主管部门负责本行政区域内退役军人职业技能培训的具体组织实施，结合本地区产业发展和急需紧缺职业需要，综合考虑自主就业的退役军士和义务兵就业需求，会同有关部门制定公布职业技能培训项目参考目录。\n组织实施职业技能培训的地方人民政府退役军人工作主管部门按照规定从普通高等学校、职业院校（含技工院校）、专业培训机构中确定承训机构，签订承训合同，公告承训机构信息，并动态更新。涉及政府采购的，应当严格执行政府采购有关规定。"},{"article_no":20,"chapter_no":2,"chapter_name":"教育培训","content":"承训机构应当建立健全教学管理制度、学员管理制度、安全管理制度，组织学员参加职业能力评价，推荐就业岗位。\n鼓励承训机构共享优质培训资源。"},{"article_no":21,"chapter_no":2,"chapter_name":"教育培训","content":"省级人民政府退役军人工作主管部门会同有关部门对承训机构加强动态管理，建立以学员满意度、职业技能评价、培训后就业情况等为主要指标的培训质量评价标准，定期对培训质量进行检查，提高职业技能培训质量和水平。"},{"article_no":22,"chapter_no":2,"chapter_name":"教育培训","content":"鼓励公共实训基地主动承接退役军人职业技能培训项目，面向退役军人就业需求和市场需求设置有针对性的培训课程。"},{"article_no":23,"chapter_no":2,"chapter_name":"教育培训","content":"国家推行终身职业技能培训制度，将退役军人职业技能培训纳入终身职业技能培训政策和组织实施体系。\n国务院退役军人工作主管部门完善网络课程体系，为退役军人提供便捷化网络学习服务。\n鼓励用人单位定期组织招用的退役军人参加岗位技能提升和知识更新培训。"},{"article_no":24,"chapter_no":2,"chapter_name":"教育培训","content":"发挥普通高等学校、职业院校（含技工院校）等教学资源优势，加强校内培训服务，支持退役军人学生在获得学历证书的同时，经考试考核合格取得相应的职业资格证书或者职业技能等级证书。"},{"article_no":25,"chapter_no":2,"chapter_name":"教育培训","content":"退役军人服现役期间取得的技能人员职业资格证书，作为其退出现役后从事相应职业（工种）的合法凭证，在全国范围内通用。"}]},{"name":"就业支持","articles":[{"article_no":26,"chapter_no":3,"chapter_name":"就业支持","content":"国家支持退役军人多渠道就业，引导退役军人发挥自身优势投身社会主义现代化建设。"},{"article_no":27,"chapter_no":3,"chapter_name":"就业支持","content":"自主就业的退役军士和义务兵入伍前是机关、群团组织、事业单位或者国有企业人员的，退出现役后可以选择复职复工，其工资、福利待遇不得低于本单位同等条件人员的平均水平。"},{"article_no":28,"chapter_no":3,"chapter_name":"就业支持","content":"机关、群团组织、事业单位和国有企业在招录或者招聘人员时，对退役军人的年龄和学历条件可以适当放宽，同等条件下优先招录、招聘退役军人。国有企业招聘人员时，可以根据需要设置一定比例的岗位招聘退役军人。\n鼓励和引导前款规定以外的其他用人单位在招用人员时，同等条件下优先招用退役军人。\n用人单位招用退役军人符合国家规定的，依法享受税收优惠等政策。"},{"article_no":29,"chapter_no":3,"chapter_name":"就业支持","content":"各地应当设置一定数量的基层公务员职位，面向服现役满5年的高校毕业生退役军人招考。\n服现役满5年的高校毕业生退役军人可以报考面向服务基层项目人员定向考录的职位，同服务基层项目人员共享公务员定向考录计划。\n各级有关机关在组织开展选调生工作时，应当注重选调有服役经历的符合条件的优秀大学生。"},{"article_no":30,"chapter_no":3,"chapter_name":"就业支持","content":"艰苦边远地区县乡事业单位可以按照有关规定对退役军人进行专项招聘，并增加工作实绩在组织考察中的权重。\n促进符合条件的优秀退役军人到中小学任教。各地在制定中小学教师招聘计划时，可以面向退役军人单列计划。\n各地应当注重从优秀退役军人中选聘党的基层组织、社区和村专职工作人员。\n各级退役军人工作主管部门直属事业单位、乡镇（街道）退役军人服务站应当优先招聘符合条件的退役军人。"},{"article_no":31,"chapter_no":3,"chapter_name":"就业支持","content":"国家综合性消防救援队伍招录消防员时，应当设置一定比例的计划专项招录退役军士和义务兵。\n招聘警务辅助人员时，同等条件下应当优先招聘退役军人。\n军队文职人员岗位、国防教育机构岗位等应当优先选用符合条件的退役军人。"},{"article_no":32,"chapter_no":3,"chapter_name":"就业支持","content":"退役军官在军队团和相当于团以下单位工作的经历，退役军士和义务兵服现役的经历，视为基层工作经历。\n退役军人服现役年限计算为工龄，退役后与所在单位工作年限累计计算，享受国家和所在单位规定的与工龄有关的相应待遇。"},{"article_no":33,"chapter_no":3,"chapter_name":"就业支持","content":"县级以上地方人民政府退役军人工作主管部门应当会同有关部门开展退役军人就业推荐、职业指导，定期组织退役军人招聘活动，开展形式多样的岗位推介，为退役军人就业搭建平台。\n公共人力资源服务机构应当免费为退役军人提供职业介绍、职业指导等服务。"},{"article_no":34,"chapter_no":3,"chapter_name":"就业支持","content":"地方各级人民政府应当将符合就业困难人员认定条件的退役军人纳入就业援助范围，优先提供帮扶。"}]},{"name":"创业扶持","articles":[{"article_no":35,"chapter_no":4,"chapter_name":"创业扶持","content":"鼓励和支持有条件、有意愿的退役军人创业，带动更多就业。"},{"article_no":36,"chapter_no":4,"chapter_name":"创业扶持","content":"退役军人从事个体经营，依法享受税收优惠等政策。"},{"article_no":37,"chapter_no":4,"chapter_name":"创业扶持","content":"退役军人创业，可以按照国家有关规定申请创业担保贷款，并享受贷款贴息等融资优惠政策。\n金融机构应当按照市场化原则，依法依规提供符合退役军人创业需求的金融产品和服务，扩大退役军人信贷服务覆盖面。\n鼓励社会资本设立退役军人创业基金，拓宽退役军人融资渠道。"},{"article_no":38,"chapter_no":4,"chapter_name":"创业扶持","content":"县级以上地方人民政府投资建设或者与社会共建的创业基地（园区）等可以通过开辟专区等形式，优先为退役军人创业提供服务。\n有条件的地区可以建立退役军人创业载体，为退役军人创业提供经营场地、投资融资、项目对接等方面的优先、优惠服务。"},{"article_no":39,"chapter_no":4,"chapter_name":"创业扶持","content":"县级以上地方人民政府应当支持引导有创业意愿和培训需求的退役军人参加创业培训。\n鼓励县级以上地方人民政府退役军人工作主管部门建立退役军人创业服务团队，发挥创业指导、吸纳退役军人就业、企业互助发展等方面作用。"},{"article_no":40,"chapter_no":4,"chapter_name":"创业扶持","content":"国务院部门、县级以上地方人民政府及其部门设立的政务服务机构、公共服务机构等应当设置退役军人窗口或者绿色通道，为退役军人创业提供登记注册、税费办理、补贴申领等服务。"},{"article_no":41,"chapter_no":4,"chapter_name":"创业扶持","content":"鼓励退役军人围绕新技术、新产业、新业态以及国家重点扶持领域创业创新。支持退役军人创办的符合条件的中小企业参与科技型中小企业评价。\n县级以上人民政府退役军人工作主管部门应当采取多种举措促进退役军人创业创新赛事活动优秀项目成果转化。"},{"article_no":42,"chapter_no":4,"chapter_name":"创业扶持","content":"县级以上人民政府退役军人工作主管部门应当引导退役军人用好各项创业扶持优惠政策。"}]},{"name":"法律责任","articles":[{"article_no":43,"chapter_no":5,"chapter_name":"法律责任","content":"退役军人工作主管部门及其工作人员有下列行为之一的，由其上级主管部门责令改正；对负有责任的领导人员和直接责任人员依法给予处分：\n（一）在退役军人就业创业工作中出具虚假文件的；\n（二）挪用、截留、私分退役军人就业创业工作等经费的；\n（三）在退役军人就业创业工作中利用职务之便为自己或者他人谋取私利的；\n（四）在退役军人就业创业工作中失职渎职的；\n（五）有其他违反法律法规行为的。"},{"article_no":44,"chapter_no":5,"chapter_name":"法律责任","content":"其他负责退役军人就业创业有关工作的部门及其工作人员违反本条例规定的，由其上级主管部门责令改正；对负有责任的领导人员和直接责任人员依法给予处分。"},{"article_no":45,"chapter_no":5,"chapter_name":"法律责任","content":"退役军人弄虚作假骗取相关待遇的，由有关主管部门取消待遇，追缴非法所得，并由其所在单位或者有关部门依法给予处分。"},{"article_no":46,"chapter_no":5,"chapter_name":"法律责任","content":"违反本条例规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"}]},{"name":"附则","articles":[{"article_no":47,"chapter_no":6,"chapter_name":"附则","content":"中国人民武装警察部队依法退出现役的警官、警士和义务兵等人员，适用本条例。"},{"article_no":48,"chapter_no":6,"chapter_name":"附则","content":"本条例自2026年8月1日起施行。"}]}]},{"id":1664,"name":"行政法规制定程序条例","doc_no":null,"level":"行政法规","issuing_org":"国务院","publish_date":"2026-05-15","amend_date":"2017-12-22","status":"现行有效","bbbs":"ff8081819e20a843019e3ef37f7d692e","source":"国家法律法规数据库","official_url":"https://flk.npc.gov.cn/detail.html?bbbs=ff8081819e20a843019e3ef37f7d692e","effective_date":"2026-07-01","preamble":"（2001年11月16日中华人民共和国国务院令第321号公布根据2017年12月22日《国务院关于修改〈行政法规制定程序条例〉的决定》修订2026年5月15日中华人民共和国国务院令第838号第二次修订）","chapters":[{"name":"总则","articles":[{"article_no":1,"chapter_no":1,"chapter_name":"总则","content":"为了规范行政法规制定程序，保证行政法规质量，根据宪法、立法法和国务院组织法的有关规定，制定本条例。"},{"article_no":2,"chapter_no":1,"chapter_name":"总则","content":"行政法规的立项、起草、审查、决定、公布、解释，适用本条例。"},{"article_no":3,"chapter_no":1,"chapter_name":"总则","content":"制定行政法规，应当坚持中国共产党的领导，贯彻落实党的路线方针政策和决策部署。\n制定行政法规，应当符合宪法和法律的规定，遵循立法法确定的指导思想和原则。"},{"article_no":4,"chapter_no":1,"chapter_name":"总则","content":"制定政治方面法律的配套行政法规，应当按照有关规定及时报告党中央。\n制定经济、文化、社会、生态文明等方面重大体制和重大政策调整的重要行政法规，应当将行政法规草案或者行政法规草案涉及的重大问题按照有关规定及时报告党中央。"},{"article_no":5,"chapter_no":1,"chapter_name":"总则","content":"制定行政法规，应当完整准确全面贯彻新发展理念，统筹发展和安全，注重立法与改革、发展、稳定相协同，注重保障和促进社会公平正义，优化法治化营商环境，服务高质量发展和高水平对外开放，建设法治政府，推进国家治理体系和治理能力现代化。"},{"article_no":6,"chapter_no":1,"chapter_name":"总则","content":"制定行政法规，应当坚持科学立法、民主立法、依法立法，增强立法的系统性、整体性、协同性、时效性。"},{"article_no":7,"chapter_no":1,"chapter_name":"总则","content":"制定行政法规，应当适应改革需要，引导、推动、规范、保障相关改革。"},{"article_no":8,"chapter_no":1,"chapter_name":"总则","content":"对党和国家工作大局急需、人民群众迫切期盼，调整范围单一、有关方面没有较大争议的行政法规，应当快速响应，优化工作方式，加快相关立法工作。"},{"article_no":9,"chapter_no":1,"chapter_name":"总则","content":"行政法规应当备而不繁，逻辑严密，条文明确、具体，用语准确、简洁，具有可操作性。"}]},{"name":"立项","articles":[{"article_no":10,"chapter_no":2,"chapter_name":"立项","content":"国务院于每年年初编制本年度的立法工作计划。\n国务院法治部门根据国家总体工作部署，拟订国务院年度立法工作计划，报党中央、国务院批准后向社会公布。"},{"article_no":11,"chapter_no":2,"chapter_name":"立项","content":"国务院有关部门认为需要制定行政法规的，应当于国务院编制年度立法工作计划前，向国务院报请立项。\n国务院有关部门应当贯彻落实党中央、国务院决策部署，报送实践所需、立法时机成熟的立项申请。\n国务院法治部门应当向社会公开征集行政法规制定项目建议。"},{"article_no":12,"chapter_no":2,"chapter_name":"立项","content":"国务院有关部门报送行政法规立项申请，应当说明依据的党的路线方针政策和决策部署、立法项目的必要性和可行性、所要解决的主要问题、拟确立的主要制度及预期实施效果、有关风险评估及防范应对措施、已开展的工作情况等。"},{"article_no":13,"chapter_no":2,"chapter_name":"立项","content":"国务院法治部门拟订国务院年度立法工作计划时，应当结合立法项目的成熟程度、紧迫程度，突出重点领域、新兴领域、涉外领域，统筹兼顾，加强评估论证。\n列入国务院年度立法工作计划的行政法规项目应当符合下列要求：\n（一）贯彻落实党的路线方针政策和决策部署，适应改革、发展、稳定的需要；\n（二）有关的改革实践经验基本成熟，立法时机成熟；\n（三）所要解决的问题属于国务院职权范围并需要国务院制定行政法规的事项，全国人民代表大会及其常务委员会授权国务院制定行政法规的事项，或者为执行法律的规定需要制定行政法规的事项；\n（四）拟列入当年完成审查的立法项目的，还应当已经向国务院报送行政法规草案送审稿（以下简称送审稿），且有关方面对送审稿规定的主要制度没有较大争议。"},{"article_no":14,"chapter_no":2,"chapter_name":"立项","content":"承担起草任务的国务院有关部门应当严格贯彻执行立法工作计划，抓紧工作，按照要求向国务院报送送审稿；报送国务院前，应当送国务院法治部门进行前置评估。国务院法治部门应当提出前置评估意见。起草部门应当认真研究处理，并在报送国务院的材料中对前置评估意见研究处理情况作出说明。\n国务院法治部门应当及时跟踪了解国务院各部门落实国务院年度立法工作计划的情况，加强组织协调和督促指导，统筹推进立法工作计划落实。\n国务院年度立法工作计划在执行中可以根据实际情况予以调整。"},{"article_no":15,"chapter_no":2,"chapter_name":"立项","content":"国务院有关部门起草的拟报请国务院批准印发的文件涉及立法项目的，应当征求国务院法治部门意见。"}]},{"name":"起草","articles":[{"article_no":16,"chapter_no":3,"chapter_name":"起草","content":"行政法规由国务院组织起草。国务院年度立法工作计划确定行政法规由国务院的一个部门或者几个部门具体负责起草工作，也可以确定由国务院法治部门起草或者组织起草。"},{"article_no":17,"chapter_no":3,"chapter_name":"起草","content":"起草行政法规，应当符合本条例第三条至第七条的规定，并符合下列要求：\n（一）弘扬社会主义核心价值观，铸牢中华民族共同体意识；\n（二）体现全面深化改革精神，科学规范行政行为，保障政府履行经济调节、市场监管、社会管理、公共服务、生态环境保护等职能；\n（三）符合优化协同高效的原则，相同或者相近的职能规定由一个行政机关承担，简化行政管理手续；\n（四）切实保障公民、法人和其他组织的合法权益，在规定其应当履行的义务的同时，应当规定其相应的权利和保障权利实现的途径；\n（五）体现行政机关的职权与责任相统一的原则，在赋予有关行政机关必要的职权的同时，应当规定其行使职权的条件、程序和应承担的责任；\n（六）坚持问题导向，遵循经济社会发展规律。"},{"article_no":18,"chapter_no":3,"chapter_name":"起草","content":"起草行政法规，应当坚持和发展全过程人民民主，拓展人民群众有序参与立法途径。起草部门应当通过多种方式深入调查研究，总结实践经验，广泛听取有关机关、组织和公民的意见。起草与经营主体生产经营活动密切相关的行政法规，应当听取有关企业和行业协会商会的意见。听取意见可以采取召开座谈会、论证会、听证会等多种形式。\n起草行政法规，涉及人民群众普遍关注的热点难点问题和经济社会发展遇到的突出矛盾，减损公民、法人和其他组织权利或者增加其义务，对人民群众有重要影响等重大利益调整事项的，应当进行论证咨询。\n起草行政法规，起草部门应当将行政法规草案及其说明等向社会公布，征求意见；但是，涉及国家安全，或者遇有紧急情形等，经国务院决定不公布的除外。向社会公布征求意见的期限一般不少于30日。\n起草专业性较强的行政法规，起草部门可以吸收相关领域的专家参与起草工作，或者委托有关专家、教学科研单位、社会组织起草。"},{"article_no":19,"chapter_no":3,"chapter_name":"起草","content":"起草行政法规，起草部门应当就涉及其他部门的职责或者与其他部门关系紧密的规定，与有关部门充分协商，涉及部门职责分工、行政许可、财政支持、税收优惠政策的，应当征得机构编制、财政、税务等相关部门同意。\n起草部门应当加强立法时机、立法预期实施效果等的评估，并与宏观政策取向保持一致，注重为基层减负。"},{"article_no":20,"chapter_no":3,"chapter_name":"起草","content":"起草行政法规，起草部门应当对涉及有关管理体制、政策等需要国务院决策的重大问题提出解决方案，报国务院决定。"},{"article_no":21,"chapter_no":3,"chapter_name":"起草","content":"起草部门向国务院报送的送审稿，应当由起草部门主要负责人签发。\n起草行政法规，涉及几个部门共同职责需要共同起草的，应当共同起草，达成一致意见后联合报送送审稿。几个部门共同起草的送审稿，应当由该几个部门主要负责人共同签发。"},{"article_no":22,"chapter_no":3,"chapter_name":"起草","content":"起草部门将送审稿报送国务院审查时，应当一并报送送审稿的说明和有关材料。修改行政法规的，还应当报送修改前后的对照文本。\n送审稿的说明应当包括以下内容：立法的必要性、可行性，主要思路，确立的主要制度；征求有关机关、组织和公民意见的情况，各方面对送审稿主要问题的不同意见及其协调处理情况；拟设定、取消或者调整行政许可、行政强制措施的情况；风险评估及防范应对措施等。\n有关材料主要包括：依据的党的路线方针政策和决策部署；所规范领域的实际情况和相关数据，实践中存在的主要问题，与有关行政法规协调和衔接情况；拟设定、取消或者调整行政许可、行政强制措施的论证材料；有关评估报告；调研报告、考察报告、国内外的有关立法资料等。"}]},{"name":"审查","articles":[{"article_no":23,"chapter_no":4,"chapter_name":"审查","content":"报送国务院的送审稿，由国务院法治部门负责审查。国务院法治部门应当完善政府立法审查制度，提高审查质效。\n国务院法治部门主要从以下方面对送审稿进行审查：\n（一）是否严格贯彻落实党的路线方针政策和决策部署，是否符合宪法和法律的规定，是否遵循立法法确定的指导思想和原则；\n（二）是否符合本条例第十七条的要求；\n（三）是否与有关行政法规协调、衔接；\n（四）是否正确处理有关机关、组织和公民对送审稿主要问题的意见；\n（五）其他需要审查的内容。"},{"article_no":24,"chapter_no":4,"chapter_name":"审查","content":"送审稿有下列情形之一的，国务院法治部门可以缓办或者退回，并书面告知起草部门：\n（一）制定行政法规的基本条件尚不成熟或者发生重大变化的；\n（二）有关部门对送审稿规定的主要制度存在较大争议的；\n（三）起草部门未就涉及部门职责分工、行政许可、财政支持、税收优惠政策的规定征得机构编制、财政、税务等相关部门同意的；\n（四）未按照本条例有关规定公开征求意见的；\n（五）报送送审稿等材料不符合本条例第十四条、第二十条至第二十二条规定的。"},{"article_no":25,"chapter_no":4,"chapter_name":"审查","content":"国务院法治部门应当将送审稿或者送审稿涉及的主要问题发送国务院有关部门、地方人民政府、有关组织和专家等各方面征求意见。国务院有关部门、地方人民政府应当在规定期限内反馈书面意见，并加盖本单位或者本单位办公厅（室）印章。国务院法治部门认为送审稿中涉及合宪性问题的，应当征求全国人民代表大会常务委员会有关工作机构意见。\n国务院法治部门可以将送审稿或者修改稿及其说明等向社会公布，征求意见。向社会公布征求意见的期限一般不少于30日。"},{"article_no":26,"chapter_no":4,"chapter_name":"审查","content":"国务院法治部门应当就送审稿涉及的主要问题，深入基层进行实地调查研究，听取基层有关机关、组织和公民的意见。"},{"article_no":27,"chapter_no":4,"chapter_name":"审查","content":"送审稿涉及重大利益调整的，国务院法治部门应当进行论证咨询，广泛听取有关方面的意见。论证咨询可以采取座谈会、论证会、听证会、委托研究等多种形式。\n送审稿涉及重大利益调整或者存在重大意见分歧，对公民、法人或者其他组织的权利义务有较大影响，人民群众普遍关注的，国务院法治部门可以举行听证会，听取有关机关、组织和公民的意见。"},{"article_no":28,"chapter_no":4,"chapter_name":"审查","content":"国务院有关部门对送审稿涉及的主要制度、政策、管理体制、权限分工等有不同意见的，国务院法治部门应当进行协调，力求达成一致意见。对有较大争议的重要立法事项，国务院法治部门可以委托有关专家、教学科研单位、社会组织进行评估。\n经过充分协调不能达成一致意见的，国务院法治部门、起草部门应当将争议的主要问题、有关部门的意见以及国务院法治部门的意见及时报国务院领导协调，或者报国务院决定。"},{"article_no":29,"chapter_no":4,"chapter_name":"审查","content":"国务院法治部门应当认真研究各方面的意见，与起草部门协商后，对送审稿进行修改，形成行政法规草案和对草案的说明。"},{"article_no":30,"chapter_no":4,"chapter_name":"审查","content":"行政法规草案由国务院法治部门主要负责人提出提请国务院常务会议审议的建议；对调整范围单一、各方面意见一致或者依据法律制定的配套行政法规草案，可以采取传批方式，由国务院法治部门直接提请国务院审批。"}]},{"name":"决定与公布","articles":[{"article_no":31,"chapter_no":5,"chapter_name":"决定与公布","content":"行政法规草案由国务院常务会议审议，或者由国务院审批。\n国务院常务会议审议行政法规草案时，由国务院法治部门或者起草部门作说明。"},{"article_no":32,"chapter_no":5,"chapter_name":"决定与公布","content":"国务院法治部门应当根据国务院对行政法规草案的审议意见，对行政法规草案进行修改，形成草案修改稿，报请总理签署国务院令公布施行。\n签署公布行政法规的国务院令载明该行政法规的施行日期。"},{"article_no":33,"chapter_no":5,"chapter_name":"决定与公布","content":"行政法规签署公布后，及时在国务院公报和中国政府法制信息网以及在全国范围内发行的报纸上刊载。国务院法治部门应当及时汇编出版行政法规的国家正式版本，并纳入国家行政法规库。\n在国务院公报上刊登的行政法规文本为标准文本。"},{"article_no":34,"chapter_no":5,"chapter_name":"决定与公布","content":"行政法规应当自公布之日起30日后施行；但是，涉及国家安全、外汇汇率、货币政策的确定以及公布后不立即施行将有碍行政法规施行的，可以自公布之日起施行。"},{"article_no":35,"chapter_no":5,"chapter_name":"决定与公布","content":"行政法规在公布后的30日内由国务院办公厅报全国人民代表大会常务委员会备案。"}]},{"name":"行政法规解释","articles":[{"article_no":36,"chapter_no":6,"chapter_name":"行政法规解释","content":"行政法规有下列情形之一的，由国务院解释：\n（一）行政法规的规定需要进一步明确具体含义的；\n（二）行政法规制定后出现新的情况，需要明确适用行政法规依据的。\n国务院法治部门研究拟订行政法规解释草案，报国务院同意后，由国务院公布或者由国务院授权国务院有关部门公布。\n行政法规的解释与行政法规具有同等效力。"},{"article_no":37,"chapter_no":6,"chapter_name":"行政法规解释","content":"国务院各部门和省、自治区、直辖市人民政府可以向国务院提出行政法规解释要求。"},{"article_no":38,"chapter_no":6,"chapter_name":"行政法规解释","content":"对属于行政工作中具体应用行政法规的问题，省、自治区、直辖市人民政府法治部门以及国务院有关部门法治机构请求国务院法治部门解释的，国务院法治部门可以研究答复；其中涉及重大问题的，由国务院法治部门提出意见，报国务院同意后答复。"}]},{"name":"其他规定","articles":[{"article_no":39,"chapter_no":7,"chapter_name":"其他规定","content":"行政法规的名称一般称“条例”，也可以称“规定”、“办法”等。国务院根据全国人民代表大会及其常务委员会的授权决定制定的行政法规，称“暂行条例”或者“暂行规定”。\n国务院各部门和地方人民政府制定的规章不得称“条例”。"},{"article_no":40,"chapter_no":7,"chapter_name":"其他规定","content":"行政法规根据内容需要，可以分章、节、条、款、项、目。章、节、条的序号用中文数字依次表述，款不编序号，项的序号用中文数字加括号依次表述，目的序号用阿拉伯数字依次表述。"},{"article_no":41,"chapter_no":7,"chapter_name":"其他规定","content":"行政法规明确要求对专门事项作出配套的具体规定的，国务院有关部门应当自行政法规施行之日起1年内作出规定；行政法规对配套的具体规定制定期限另有规定的，从其规定。国务院有关部门未能在期限内作出配套的具体规定的，应当向国务院说明情况。"},{"article_no":42,"chapter_no":7,"chapter_name":"其他规定","content":"国务院可以根据经济社会发展、全面深化改革需要，就行政管理等领域的特定事项，决定授权在规定期限和范围内暂时调整或者暂时停止适用行政法规的部分规定。\n国务院有关部门应当会同相关地方人民政府对行政法规暂时调整或者暂时停止适用情况及时进行评估论证。对实践证明可行、需要修改有关行政法规的，按立法程序办理；对实践证明不宜调整、需要恢复施行行政法规有关规定的，由国务院有关部门报请国务院决定。"},{"article_no":43,"chapter_no":7,"chapter_name":"其他规定","content":"国务院法治部门应当根据全面深化改革、经济社会发展需要以及上位法规定，报国务院同意后及时组织开展行政法规清理工作。国务院有关部门可以根据工作需要，向国务院法治部门提出行政法规清理建议。\n对不适应全面深化改革和经济社会发展要求、不符合上位法规定的行政法规，应当及时修改或者废止。"},{"article_no":44,"chapter_no":7,"chapter_name":"其他规定","content":"国务院法治部门或者国务院有关部门可以组织对有关行政法规或者行政法规中的有关规定进行立法后评估，并把评估结果作为修改、废止有关行政法规的重要参考。"},{"article_no":45,"chapter_no":7,"chapter_name":"其他规定","content":"行政法规的修改、废止程序适用本条例的有关规定。\n行政法规修改的，应当公布新的行政法规文本。\n行政法规废止的，除由法律、其他行政法规规定废止该行政法规的以外，由总理签署国务院令予以公布。"},{"article_no":46,"chapter_no":7,"chapter_name":"其他规定","content":"行政法规的外文正式译本和民族语言文本，由国务院法治部门审定。"},{"article_no":47,"chapter_no":7,"chapter_name":"其他规定","content":"拟订国务院提请全国人民代表大会或者全国人民代表大会常务委员会审议的法律草案，参照本条例的有关规定办理。"}]},{"name":"附则","articles":[{"article_no":48,"chapter_no":8,"chapter_name":"附则","content":"本条例自2026年7月1日起施行。"}]}]},{"id":1665,"name":"中华人民共和国矿产资源法实施条例","doc_no":null,"level":"行政法规","issuing_org":"国务院","publish_date":"2026-05-15","amend_date":null,"status":"现行有效","bbbs":"ff8081819e48b44c019ef8a2eb573b4e","source":"国家法律法规数据库","official_url":"https://flk.npc.gov.cn/detail.html?bbbs=ff8081819e48b44c019ef8a2eb573b4e","effective_date":"2026-06-15","preamble":null,"chapters":[{"name":"总则","articles":[{"article_no":1,"chapter_no":1,"chapter_name":"总则","content":"根据《中华人民共和国矿产资源法》（以下简称矿产资源法），制定本条例。"},{"article_no":2,"chapter_no":1,"chapter_name":"总则","content":"国家促进矿产资源合理开发利用，加强矿产资源和生态环境保护，推动矿业高质量发展，保障矿产资源安全。"},{"article_no":3,"chapter_no":1,"chapter_name":"总则","content":"矿产资源目录的确定和调整，由国务院自然资源主管部门会同国务院发展改革部门提出，报国务院批准后公布。\n矿产资源目录包括矿产资源矿种和分类。"},{"article_no":4,"chapter_no":1,"chapter_name":"总则","content":"国家加大对基础性地质调查工作的投入力度，加强基础性地质调查队伍建设，鼓励社会力量依法有序参与基础性地质调查，提升基础性地质调查工作质效。"},{"article_no":5,"chapter_no":1,"chapter_name":"总则","content":"国家完善财政、金融、土地、生态环境、产业、进出口等方面政策措施，健全战略性矿产资源探产供储销全链条统筹和衔接体系，加大对战略性矿产资源勘查、开采、加工、贸易、储备等的支持力度，推进战略性矿产资源产业优化升级，提升矿产资源安全保障水平。\n战略性矿产资源目录的确定和调整，由国务院自然资源主管部门会同国务院有关部门研究提出，报国务院批准后实施。确定和调整战略性矿产资源目录，应当统筹考虑下列因素，对相关矿产资源开展评估：\n（一）对国民经济和社会发展、国家安全的重要程度；\n（二）国内资源禀赋情况、紧缺程度以及对外依存度；\n（三）相关产业链供应链的韧性和安全水平；\n（四）其他需要考虑的因素。\n对国务院确定的特定战略性矿产资源，按照法律、行政法规和国家有关规定实行规划管控、总量调控、限定开采主体等保护性开采措施。"},{"article_no":6,"chapter_no":1,"chapter_name":"总则","content":"依照矿产资源法第九条规定编制并经批准的矿产资源相关规划应当依法公布。开展地质调查以及矿产资源勘查、开采、保护和矿区生态修复等活动，应当符合矿产资源相关规划。\n县级以上人民政府自然资源主管部门可以根据实际需要，会同有关部门就特定领域、特定区域的矿产资源或者特定矿种的勘查、开采、保护和矿区生态修复等编制相关规划，相关信息应当纳入国土空间规划实施监督信息系统。"},{"article_no":7,"chapter_no":1,"chapter_name":"总则","content":"国家坚持平等互利、合作共赢的方针，通过多种途径和方式积极促进矿产资源领域国际投资、贸易、技术等合作，维护产业链供应链安全稳定。\n开展海外矿产资源开发利用，应当维护国家利益和社会公共利益，遵守我国法律、法规以及所在国家或者地区的相关法律，信守合同，尊重当地习俗和文化传统，注重生态环境保护和安全生产，加强安全风险防范，并按照规定办理相关手续，依法接受我国相关部门和驻外外交机构的管理和监督。"}]},{"name":"矿业权","articles":[{"article_no":8,"chapter_no":2,"chapter_name":"矿业权","content":"矿业权应当通过招标、拍卖、挂牌等竞争性方式出让；对紧缺程度高、资源储量规模中型以上的战略性矿产资源，或者对勘查开采技术、生态环境保护有特殊要求的勘查区块，优先通过招标方式出让探矿权。\n有下列情形之一的，可以通过协议方式出让矿业权：\n（一）依照法律、行政法规或者国务院规定，相关矿产资源需由特定主体勘查、开采；\n（二）为保障矿山安全生产或者矿业权合理设置等，需要在登记的开采区域深部、上部继续开采矿产资源或者在其周边进一步开采零星分散矿产资源；\n（三）同一矿业权人在其登记的相邻勘查、开采区域之间无法单独设置矿业权的夹缝区域勘查、开采矿产资源；\n（四）法律、行政法规或者国务院规定的其他情形。\n为保障国家矿产资源安全，急需开采战略性矿产资源的，经国务院同意，可以由省级以上人民政府自然资源主管部门直接授予采矿权。"},{"article_no":9,"chapter_no":2,"chapter_name":"矿业权","content":"县级以上人民政府自然资源主管部门按照规定权限组织矿业权出让。\n下列矿产资源由国务院自然资源主管部门或者其授权的省、自治区、直辖市人民政府自然资源主管部门组织矿业权出让：\n（一）战略性矿产资源；\n（二）跨省、自治区、直辖市的矿产资源；\n（三）我国领海及管辖的其他海域的矿产资源。\n前款规定以外的矿产资源的矿业权出让权限，由省、自治区、直辖市人民政府规定。\n同一矿种的探矿权、采矿权出让实行同级管理。矿业权出让涉及多个矿种的，出让权限按照主矿种确定；难以确定主矿种的，按照出让权限最高的矿种确定。"},{"article_no":10,"chapter_no":2,"chapter_name":"矿业权","content":"县级以上人民政府自然资源主管部门应当根据矿产资源相关规划和矿产资源供需形势等，加强对矿业权出让工作的统筹安排，对符合出让条件的及时安排出让。\n矿业权出让前，出让矿业权的自然资源主管部门（以下称矿业权出让部门）应当进行核查，确保拟出让的勘查、开采区域符合国土空间规划管控要求。\n探矿权出让以经纬度划分的区块为基本单位。\n除符合规定的情形外，新设采矿权范围不得与已设采矿权垂直投影范围重叠，可集中开发的同一矿体不得设立2个以上采矿权。"},{"article_no":11,"chapter_no":2,"chapter_name":"矿业权","content":"对向县级以上人民政府自然资源主管部门提供可设立探矿权的区块来源的单位和个人，按照国家有关规定给予适当奖励或者补偿；参与该区块探矿权竞争性出让的，同等条件下优先取得探矿权。"},{"article_no":12,"chapter_no":2,"chapter_name":"矿业权","content":"通过竞争性方式出让矿业权的，矿业权出让部门应当提前在其门户网站、公共资源交易平台等公告拟出让矿业权的基本情况、出让方式、竞争规则、保证金收取、风险提示、受让人的技术能力等条件及其权利义务等事项。公告期限不少于30个工作日。\n国务院自然资源主管部门、县级以上地方人民政府及其自然资源主管部门应当创造和维护公平、有序的市场竞争环境，保障各类主体依法平等参与矿业权竞争性出让。"},{"article_no":13,"chapter_no":2,"chapter_name":"矿业权","content":"出让矿业权的，矿业权出让部门应当与依法确定的受让人以书面形式签订矿业权出让合同。\n矿业权出让合同签订后，因矿业权出让部门核查有误等导致矿业权不符合国土空间规划管控要求，无法进行勘查或者开采的，受让人有权解除合同。合同解除后，矿业权出让部门应当返还矿业权出让收益；造成受让人财产损失的，应当依法赔偿。"},{"article_no":14,"chapter_no":2,"chapter_name":"矿业权","content":"矿业权受让人应当按照国家有关规定和出让合同约定按时足额缴纳矿业权出让收益、矿业权占用费等有关费用。矿业权有关费用征收的具体办法由国务院财政部门会同国务院自然资源主管部门、国务院税务主管部门制定，报国务院批准后执行。\n有下列情形之一的，可以减收或者免收矿业权出让收益：\n（一）勘查、开采低品位、难选冶矿产资源；\n（二）对矿产资源实行综合开发利用成效显著；\n（三）依法组织实施矿产资源应急性开采；\n（四）国务院规定的其他情形。\n未按时足额缴纳矿业权出让收益的，应当按照国家有关规定和出让合同约定支付违约金。"},{"article_no":15,"chapter_no":2,"chapter_name":"矿业权","content":"探矿权的期限为5年，期限届满可以续期，续期最多不超过3次，每次期限为5年。对石油、天然气以及国务院自然资源主管部门确定的其他战略性矿产资源，经国务院自然资源主管部门同意，可以根据实际情况增加续期次数。\n采矿权的期限结合矿产资源储量和矿山建设规模确定，最长不超过30年。确定采矿权期限的具体办法由国务院自然资源主管部门制定。采矿权期限届满，登记的开采区域内仍有可供开采的矿产资源的，可以续期。\n矿业权期限届满前，因保障国家矿产资源安全等公共利益需要，原矿业权出让部门可以依法收回矿业权；矿业权被收回的，应当依法给予公平、合理的补偿。"},{"article_no":16,"chapter_no":2,"chapter_name":"矿业权","content":"申请矿业权续期的，矿业权人应当在矿业权期限届满前6个月至3个月内向原矿业权出让部门提出申请。原矿业权出让部门应当在矿业权期限届满前作出是否准予续期的决定。"},{"article_no":17,"chapter_no":2,"chapter_name":"矿业权","content":"办理探矿权续期时，应当按照国务院自然资源主管部门规定的比例核减勘查区域面积。但是，已经探明矿产资源或者符合国务院自然资源主管部门规定情形的勘查区域，不计入核减面积计算基数。\n因生态环境保护、基础设施建设等公共利益需要，或者因自然灾害等不可抗力导致已设立探矿权的部分勘查区域无法继续勘查的，可以按照规定凭相关证明文件抵扣需核减的面积。"},{"article_no":18,"chapter_no":2,"chapter_name":"矿业权","content":"探矿权人依照矿产资源法第二十五条规定申请将其探矿权转为采矿权的，应当在探矿权期限内向原矿业权出让部门提出申请，并提交矿产资源储量报告（以下简称储量报告）等材料。原矿业权出让部门应当与该探矿权人签订采矿权出让合同，设立采矿权，但有下列情形之一的除外：\n（一）所探明矿产资源按照国家有关规定需由该探矿权人以外的特定主体开采；\n（二）所探明矿产资源未达到有关产业政策规定的储量规模或者产能要求；\n（三）所探明矿产资源因公共利益需要不能转为采矿权，或者因不可抗力等特殊情形已不具备开采条件；\n（四）法律、行政法规规定的其他情形。"},{"article_no":19,"chapter_no":2,"chapter_name":"矿业权","content":"矿业权可以依法转让。但是，有下列情形之一的，矿业权不得转让：\n（一）以协议出让方式取得矿业权，持有不满5年；\n（二）矿业权依法被查封；\n（三）矿业权权属不明确或者存在争议；\n（四）矿业权出让合同约定矿业权不得转让；\n（五）国家规定不得转让的其他情形。\n依照本条例第八条第三款规定由省级以上人民政府自然资源主管部门直接授予的采矿权，未经原授予采矿权的自然资源主管部门同意，不得转让。\n因股权转让等导致实际控制人变更的，矿业权人应当向原矿业权出让部门报告。"},{"article_no":20,"chapter_no":2,"chapter_name":"矿业权","content":"矿业权转让的，受让人应当具备该矿业权出让时要求的受让人的技术能力等条件。"},{"article_no":21,"chapter_no":2,"chapter_name":"矿业权","content":"矿业权转让的，转让人、受让人应当以书面形式签订矿业权转让合同，明确双方的权利和义务。矿业权转让合同应当对矿区生态修复义务履行有关事项作出明确约定。\n矿业权转让后的期限为该矿业权的剩余期限。"},{"article_no":22,"chapter_no":2,"chapter_name":"矿业权","content":"矿业权设立、变更、转让、抵押和消灭的，应当依法办理登记。"},{"article_no":23,"chapter_no":2,"chapter_name":"矿业权","content":"矿产资源法第二十八条第一项所称国家出资勘查矿产资源，是指由中央财政或者地方财政出资，为保障国家矿产资源安全而开展的矿产资源勘查。国家出资勘查矿产资源的，凭项目任务书开展地质勘查工作，无需取得探矿权。\n采矿权人在登记的开采区域内为开采活动需要进行勘查，以及在登记的开采区域深部、上部进行勘查的，无需取得探矿权。"},{"article_no":24,"chapter_no":2,"chapter_name":"矿业权","content":"建设项目施工单位在批准的作业区域和建设工期内，因施工需要采挖只能用作普通建筑材料的砂、石、黏土，无需取得采矿权。采挖的砂、石、黏土的处置应当遵守所在地省、自治区、直辖市的有关规定，不得自行处置（建设项目施工自用除外）。\n前款所称批准的作业区域，不包括建设项目施工临时用地区域。"}]},{"name":"矿产资源勘查、开采","articles":[{"article_no":25,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"国务院自然资源主管部门会同国务院有关部门建立健全基础性地质调查技术标准和规范体系。\n从事基础性地质调查工作的单位应当严格执行有关技术标准和规范，对调查成果的质量负责。县级以上人民政府自然资源主管部门应当加强对基础性地质调查成果质量的监督。\n任何单位和个人不得阻挠、妨碍依法开展的基础性地质调查工作。"},{"article_no":26,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"省级以上人民政府自然资源主管部门应当加强基础性地质调查成果发布管理，按照规定权限统一发布基础性地质调查成果信息；信息发布前应当依法进行保密审查，不得发布涉及国家秘密、工作秘密、商业秘密的成果数据。"},{"article_no":27,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"省级以上人民政府自然资源主管部门应当为建设单位提供建设项目占地范围内矿产资源分布和矿业权设置情况查询服务。\n建设项目确需压覆已经设置矿业权的矿产资源，对矿业权人正常勘查、开采活动造成直接影响的，建设单位应当在压覆前与矿业权人协商，并依法给予矿业权人公平、合理的补偿。因矿产资源被压覆依法需要办理矿业权变更登记或者注销登记的，矿业权人应当依法办理。\n建设项目确需压覆战略性矿产资源的，应当经国务院自然资源主管部门或者其授权的省、自治区、直辖市人民政府自然资源主管部门批准。经依法批准的国土空间规划确定的城镇开发边界内的建设项目确需压覆战略性矿产资源的，有关审批应当根据实际情况予以简化。\n经科学评估，建设项目压覆矿产资源但不直接影响正常勘查、开采活动的，可以不作为压覆矿产资源处理。"},{"article_no":28,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"矿业权人进行矿产资源勘查、开采作业前，应当分别编制勘查方案、开采方案，报原矿业权出让部门批准，取得勘查许可证、采矿许可证；未取得相应许可证的，不得进行勘查、开采作业。\n编制勘查方案，应当根据勘查矿种和范围、勘查相关标准和技术规范，以及绿色勘查等勘查工作要求，明确勘查区域，合理选择勘查工作方法，并对勘查活动结束后的清理恢复等作出安排。\n编制开采方案，应当根据开采矿种和范围、资源赋存情况、开采技术规范，以及矿产资源合理开发利用、绿色矿山建设等开采工作要求，合理选择开采方式、开采顺序、开采方法，并对空间使用以及资源综合开采、综合利用的保障措施等作出安排。\n综合开采矿产资源的，应当结合储量报告和开采方案，根据开采实际合理确定并登记开采矿种。"},{"article_no":29,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"申请勘查许可证、采矿许可证的，应当向原矿业权出让部门提交申请书、矿业权证书，以及相应的勘查方案或者开采方案等材料。原矿业权出让部门应当自受理申请之日起15个工作日内作出是否批准的决定。予以批准的，核发勘查许可证、采矿许可证；不予批准的，书面通知申请人并说明理由。\n原矿业权出让部门受理申请后，可以组织专家对勘查方案、开采方案进行评审，并在10个工作日内出具评审意见。评审所需时间不计算在许可审查期限内，费用不得由矿业权人承担。\n勘查许可证、采矿许可证期限届满日期与探矿权、采矿权期限届满日期一致。\n原矿业权出让部门核发采矿许可证后，应当及时通知开采区域有关地方人民政府组织落实采矿权勘界工作。"},{"article_no":30,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"矿业权人可以在办理矿业权登记时一并申请办理勘查许可证、采矿许可证。\n矿业权转让的，受让人应当重新申请勘查许可证、采矿许可证。"},{"article_no":31,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"勘查许可证、采矿许可证具体管理办法由国务院自然资源主管部门制定。"},{"article_no":32,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"矿业权人应当按照经批准的勘查方案、开采方案进行勘查、开采作业。\n勘查的主要工作方法发生变化的，探矿权人应当调整勘查方案，报原矿业权出让部门批准。\n开采方式发生重大变化或者开采的主矿种发生变化的，采矿权人应当调整开采方案，报原矿业权出让部门批准并重新核发采矿许可证。"},{"article_no":33,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"矿业权人进行矿产资源勘查、开采作业前，应当依法办理建设项目核准（备案）、用地用海、生态环境、安全生产等方面相关手续；涉及军用土地的，还应当经军队团级以上单位按照中央军事委员会的相关规定报经批准。\n采矿权人编制矿山开发项目可行性研究报告、矿山初步设计（油气田开发方案）等，应当与开采方案相衔接。"},{"article_no":34,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"自然保护地范围内可以依法开展符合管控要求的基础性地质调查、战略性矿产资源远景调查和规定范围内的战略性矿产资源勘查、开采等活动，具体管理办法由国务院自然资源主管部门、林业草原主管部门制定。"},{"article_no":35,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"矿产资源法第三十四条第一款所称矿业用地，包括矿产资源勘查用地和矿产资源开采用地。\n矿产资源勘查用地包括勘查作业使用的土地，以及为满足勘查作业需要搭建或者修建生活用房、工棚、运输便道等使用的土地。\n矿产资源开采用地包括采掘矿产资源等采矿作业使用的土地，以及为满足采矿作业需要堆放采出的矿石、废石、废渣，修建工业厂房、井巷工程、尾矿库、配套的选矿厂、生活服务设施、交通运输设施等使用的土地。\n县级以上人民政府应当依法保障矿产资源勘查、开采用地的合理需求。"},{"article_no":36,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"矿业权人可以依法通过划拨、出让、租赁、作价出资等方式使用国有土地，也可以依法通过出让、出租等方式取得集体经营性建设用地使用权。\n开采矿产资源使用国有土地和集体经营性建设用地，可以通过协议方式出让。"},{"article_no":37,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"勘查矿产资源可以依照土地管理法律、行政法规的规定临时使用土地。\n露天开采战略性矿产资源占用土地，经科学论证，具备边开采、边复垦条件的，矿业权人报省级以上人民政府自然资源主管部门批准后，可以临时使用土地；涉及使用林地草地的，有关自然资源主管部门应当征求同级林业草原主管部门意见。临时使用土地应当分区、分期审批，原则上每期不超过五年。矿业权人未按照规定履行土地复垦等矿区生态修复义务的，有关自然资源主管部门不得批准其新的临时用地。"},{"article_no":38,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"石油、天然气等矿产资源勘查过程中发现可供开采的石油、天然气等矿产资源的，探矿权人完成试油（气）作业，向原矿业权出让部门提交探采合一计划后，可以进行开采，并按照规定向有关能源主管部门履行备案手续。\n探矿权人依照前款规定开采石油、天然气等矿产资源的，应当在国务院自然资源主管部门规定的期限内，向原矿业权出让部门申请将其探矿权转为采矿权，依法办理采矿权登记，并取得采矿许可证。"},{"article_no":39,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"国务院自然资源主管部门会同国务院有关部门完善绿色矿山政策、标准规范，健全绿色矿山名录并实行动态管理。矿业权人应当加强绿色矿山规划、建设、运营和管理，推动矿山企业绿色发展。"},{"article_no":40,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"国务院自然资源主管部门会同国务院有关部门组织制定矿产资源开采回采率、选矿回收率、综合利用率有关国家标准。\n采矿权人应当从技术、设备、管理等方面采取有效措施，确保矿产资源开采回采率、选矿回收率、综合利用率达到有关国家标准的要求。\n国家制定和完善相关激励性政策措施，促进提高矿产资源开采回采率、选矿回收率、综合利用率。"},{"article_no":41,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"县级以上人民政府自然资源主管部门应当会同有关部门加强矿产资源综合开采、综合利用先进适用技术、工艺、设备的推广应用，鼓励、引导采矿权人开展技术、工艺升级和设备更新，推进矿产资源综合利用产业化发展。"},{"article_no":42,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"国家建立矿产资源储量管理制度，加强对矿产资源储量及其变动情况的调查、核实、统计、评估等，为编制矿产资源相关规划、促进矿产资源合理开发利用、加强矿产资源保护等提供依据。\n国家定期组织开展矿产资源潜力评价和开发利用现状调查，加强对矿产资源储量和矿业权价值及相关权益的评估管理。"},{"article_no":43,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"矿业权人经过勘查工作查明可供开采的矿产资源或者在开采期间发现矿产资源储量发生重大变化的，应当编制储量报告并报送原矿业权出让部门。储量报告应当包括矿产资源的空间分布、种类、数量、质量和矿床工业指标论证等内容，并对矿石加工选冶技术性能、开采技术条件、开发经济意义等情况作出说明。\n原矿业权出让部门应当对矿业权人报送的储量报告进行审核，并可以根据审核工作需要组织有关单位对储量报告进行技术评估。经审核的储量报告可以作为矿产资源储量统计和监督管理等的依据。\n矿业权人应当对其报送的储量报告的真实性负责，不得弄虚作假。"},{"article_no":44,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"采矿权人应当按照规定开展矿产资源储量监测，建立健全矿产资源储量台账，定期向原矿业权出让部门报告矿产资源储量变化情况和开发利用情况。"},{"article_no":45,"chapter_no":3,"chapter_name":"矿产资源勘查、开采","content":"矿山闭坑的，采矿权人应当按照国家有关规定将闭坑地质报告报送县级以上地方人民政府自然资源主管部门，并汇交有关地质资料。"}]},{"name":"矿区生态修复","articles":[{"article_no":46,"chapter_no":4,"chapter_name":"矿区生态修复","content":"县级以上地方人民政府自然资源主管部门应当会同有关部门对本行政区域内因开采矿产资源导致的地质环境破坏、土地损毁、植被退化等生态破坏情况进行调查评价，明确矿区生态修复的重点区域、目标任务。"},{"article_no":47,"chapter_no":4,"chapter_name":"矿区生态修复","content":"采矿权人是矿区生态修复的责任人。采矿权人应当协同实施矿区生态修复与污染防治。\n采矿权转让的，除国家另有规定或者矿业权出让、转让合同另有约定外，由受让人履行矿区生态修复义务。转让人在采矿权转让过程中对矿区生态修复事项弄虚作假的，其生态修复义务不因采矿权转让而免除。"},{"article_no":48,"chapter_no":4,"chapter_name":"矿区生态修复","content":"对历史遗留的废弃矿区，由所在地县级以上地方人民政府自然资源主管部门确认矿区生态修复责任人；责任人灭失或者无法确认的，由所在地县级以上地方人民政府组织开展矿区生态修复，并协同开展污染治理。\n国务院自然资源主管部门等有关部门可以制定专项政策，支持地方人民政府对历史遗留的废弃矿区开展生态修复。县级以上地方人民政府依法可以通过多种方式拓宽矿区生态修复资金渠道。"},{"article_no":49,"chapter_no":4,"chapter_name":"矿区生态修复","content":"国家完善政策措施，鼓励社会资本依法参与矿区生态修复，维护参与矿区生态修复的社会资本的合法权益。\n国家充分发挥市场机制在矿区生态修复中的作用，推进矿区生态修复市场化发展。"},{"article_no":50,"chapter_no":4,"chapter_name":"矿区生态修复","content":"开采矿产资源前，采矿权人应当依照法律、法规和国务院自然资源主管部门的规定以及矿业权出让合同编制矿区生态修复方案，随开采方案报原矿业权出让部门批准。矿区生态修复方案应当明确生态修复的目标任务、工程布局、技术措施、时序安排、经费概算、保障措施等内容；涉及尾矿库的，还应当明确尾矿库修复的专门措施。\n编制矿区生态修复方案，应当依照矿产资源法第四十六条第二款的规定，在矿区涉及的有关范围内公示征求意见，并专门听取有关单位和个人的意见。采矿权人应当在矿区生态修复方案报批时对公示征求意见和专门听取意见的情况作出说明。\n采矿权人对矿区生态修复方案作出调整的，应当按照国务院自然资源主管部门的规定报原矿业权出让部门备案；依据本条例第三十二条第三款的规定调整开采方案的，应当重新编制矿区生态修复方案并随开采方案报原矿业权出让部门批准。\n已经按照规定编制矿区生态修复方案的，不再编制土地复垦方案。"},{"article_no":51,"chapter_no":4,"chapter_name":"矿区生态修复","content":"矿区生态修复能够边开采、边修复或者分区、分期修复的，采矿权人应当根据矿山开采设计和工艺流程、开采进度、采矿用地范围和类型、安全生产条件以及土地损毁和生态破坏等情况，合理划分修复单元、安排修复时序，及时开展生态修复；不能边开采、边修复或者分区、分期修复的，应当在矿山闭坑前或者闭坑后的2年内完成生态修复，但开采放射性矿产资源的矿区生态修复时限可以根据实际需要确定。"},{"article_no":52,"chapter_no":4,"chapter_name":"矿区生态修复","content":"采矿权人按照矿区生态修复方案完成生态修复后，应当及时向矿区所在地县级以上地方人民政府自然资源主管部门申请验收；分区、分期完成生态修复的，应当分区、分期申请验收。\n县级以上地方人民政府自然资源主管部门会同生态环境主管部门等有关部门组织矿区生态修复验收。验收合格的，应当向采矿权人出具验收合格确认书；验收不合格的，应当向采矿权人出具书面整改意见，由采矿权人整改完成后重新申请验收。"},{"article_no":53,"chapter_no":4,"chapter_name":"矿区生态修复","content":"矿区生态修复费用由采矿权人按年度提取，除法律另有规定外，矿区生态修复费用不得被查封、冻结或者划拨。"}]},{"name":"矿产资源储备和应急","articles":[{"article_no":54,"chapter_no":5,"chapter_name":"矿产资源储备和应急","content":"国家按照政府主导、社会共建、多元互补、高效协同的原则，构建产品储备、产能储备和产地储备相结合的战略性矿产资源储备体系，科学合理确定储备结构、规模和布局并动态调整，发挥储备的战略保障、宏观调控和应对急需等功能。\n国家完善战略性矿产资源储备监管体系，加快储备设施建设，提高储备运营主体专业化水平，加强储备信息化建设，持续提升战略性矿产资源储备综合效能。县级以上人民政府应当根据需要，将战略性矿产资源储备纳入国民经济和社会发展相关规划、国土空间规划，并在安排重大项目建设方面给予支持。"},{"article_no":55,"chapter_no":5,"chapter_name":"矿产资源储备和应急","content":"国务院发展改革部门统筹协调国家矿产品储备工作，定期拟订储备规划和总量计划，动态调整储备品种规模；国务院粮食和物资储备部门组织实施中央政府矿产品储备的收储、轮换和日常管理；国务院能源主管部门按照职责负责能源储备相关工作。县级以上地方人民政府按照国家有关规定，结合本地实际开展矿产品储备。\n有关企业应当按照国家有关规定做好矿产品储备工作。国家完善政策措施，支持企业开展矿产品储备。\n战略性矿产资源产品储备管理部门、承储单位应当加强战略性矿产品资产管理，并按照规定报送矿产品储备管理情况。"},{"article_no":56,"chapter_no":5,"chapter_name":"矿产资源储备和应急","content":"能源战略性矿产资源产能储备的具体办法，由国务院能源主管部门会同国务院有关部门制定；其他战略性矿产资源产能储备的具体办法由国务院工业和信息化主管部门会同国务院有关部门制定。\n开采战略性矿产资源的采矿权人应当按照国家有关规定，结合矿山生产能力、外部运输条件、安全生产状况等情况，编制产能储备建设方案，落实产能储备责任，合理规划生产能力，确保应急增产需要。"},{"article_no":57,"chapter_no":5,"chapter_name":"矿产资源储备和应急","content":"战略性矿产资源产地储备应当遵循科学评估、合理布局、分级管理、动态调整的原则，结合国家矿产资源开发利用和安全保障等相关规划，统筹资源禀赋、开发利用技术条件、国内外供需状况、生态区位等因素，合理确定储备规模、布局等，并对储备地开展必要的补充勘查，提升应急开采能力，与产品储备、产能储备有机衔接，形成梯次供应能力。\n国务院自然资源主管部门牵头组织全国战略性矿产资源产地储备工作，研究提出产地储备矿种、规模、布局意见，组织开展产地储备摸底调查、评估论证和储备勘查，划定战略性矿产资源储备地，加强产地储备监测和保护监督。省、自治区、直辖市人民政府自然资源主管部门协助开展产地储备相关工作，按照属地管理职责组织开展保护监督工作。鼓励企业积极参与产地储备工作。\n战略性矿产资源产地储备期限应当与矿产资源相关规划相衔接，原则上不少于5年。储备期限届满后，国务院自然资源主管部门应当会同国务院有关部门组织评估论证，确定是否延长储备期限，根据需要适时开展产地储备调整、动用。\n纳入产地储备的战略性矿产资源，未经国务院自然资源主管部门批准，不得开采或者压覆。"},{"article_no":58,"chapter_no":5,"chapter_name":"矿产资源储备和应急","content":"国务院发展改革、工业和信息化、自然资源、粮食和物资储备、矿山安全监察等有关部门应当建立健全矿产资源供应安全预测预警工作体系，加强矿产资源供应安全相关数据信息共享和应用，对矿产品供求变化、价格波动以及安全风险状况等开展综合监测、分析、评估，及时进行预测预警。"},{"article_no":59,"chapter_no":5,"chapter_name":"矿产资源储备和应急","content":"矿产资源法第五十五条第一款第六项所称其他必要措施，包括但不限于直接组织矿产资源开采、加工、运输、供应，征用相关矿产品、矿产品储备设施、交通运输工具，按照供应保障顺序组织实施矿产资源或者矿产品供应。"}]},{"name":"监督管理","articles":[{"article_no":60,"chapter_no":6,"chapter_name":"监督管理","content":"县级以上人民政府自然资源主管部门和其他有关部门应当按照职责分工，加强对矿产资源勘查、开采和矿区生态修复等活动的监督检查，依法及时查处违法行为。\n县级以上人民政府自然资源主管部门和其他有关部门在监督检查中应当加强协调配合，能够联合检查的实行联合检查，鼓励通过非现场检查、使用非接触式技术手段开展监督检查。"},{"article_no":61,"chapter_no":6,"chapter_name":"监督管理","content":"自然资源主管部门和其他有关部门及其工作人员对监督管理过程中知悉的国家秘密、工作秘密、商业秘密、个人隐私和个人信息依法负有保密义务。\n前款所称商业秘密，包括但不限于矿产资源储量和矿业权人的勘查成果、重大发现、核心技术方案。商业秘密不得向第三方泄露，法律另有规定或者矿业权人书面同意的除外。"},{"article_no":62,"chapter_no":6,"chapter_name":"监督管理","content":"国务院自然资源主管部门按照科学合理、体现差异、简便易行的原则，建立矿产资源开发利用水平评估指标体系，并加强对评估指标运用的指导。\n县级以上人民政府自然资源主管部门应当根据矿产资源开发利用水平评估指标，加强对本行政区域内矿产资源勘查、开采情况的汇总、分析并定期进行评估，提出节约集约开发利用矿产资源等方面的改进措施。采矿权人和有关矿山企业应当配合自然资源主管部门的评估工作，落实相关改进措施。"},{"article_no":63,"chapter_no":6,"chapter_name":"监督管理","content":"国务院自然资源主管部门推动提升矿产资源监督管理信息化水平，通过全国矿产资源监督管理信息系统开展监管和服务，并与国务院有关部门加强信息共享。"},{"article_no":64,"chapter_no":6,"chapter_name":"监督管理","content":"国务院自然资源主管部门根据从事矿产资源勘查单位的规模、技术能力、人才装备、信用状况等，对其实行备案和分级分类监管，引导矿产资源勘查市场规模化发展，提升专业化水平。"},{"article_no":65,"chapter_no":6,"chapter_name":"监督管理","content":"矿业权人之间对勘查、开采区域发生争议时，由当事人协商解决。当事人协商不成的，由矿产资源所在地县级以上地方人民政府根据依法核定的勘查、开采区域处理；跨行政区域的勘查、开采区域争议，由共同的上一级人民政府处理。"},{"article_no":66,"chapter_no":6,"chapter_name":"监督管理","content":"国家自然资源督察机构根据国务院的授权，对省、自治区、直辖市人民政府矿产资源开发利用和监督管理情况进行督察。\n国家自然资源督察机构进行督察时，有权向与督察事项有关的单位和个人了解督察事项有关情况，有关单位和个人应当支持、协助督察机构工作。"}]},{"name":"法律责任","articles":[{"article_no":67,"chapter_no":7,"chapter_name":"法律责任","content":"阻挠、妨碍依法开展的基础性地质调查工作的，由县级以上人民政府自然资源主管部门责令改正，给予警告或者通报批评；拒不改正的，对单位处2万元以上10万元以下的罚款，对个人处1万元以上5万元以下的罚款。"},{"article_no":68,"chapter_no":7,"chapter_name":"法律责任","content":"矿业权人未定期报送矿产资源储量变化情况和开发利用情况，或者在矿山闭坑后未报送闭坑地质报告的，由县级以上人民政府自然资源主管部门责令改正，处2万元以上10万元以下的罚款；情节严重的，处10万元以上50万元以下的罚款。"},{"article_no":69,"chapter_no":7,"chapter_name":"法律责任","content":"矿产资源法第六十三条、第六十四条、第六十六条、第六十七条、第六十八条规定的违法行为所涉矿产资源属于战略性矿产资源的，应当从重处罚。"},{"article_no":70,"chapter_no":7,"chapter_name":"法律责任","content":"矿业权人未按照规定缴纳矿业权占用费的，征收机关可以责令限期缴纳，逾期不缴纳的，可以处应缴矿业权占用费3倍以下的罚款。"},{"article_no":71,"chapter_no":7,"chapter_name":"法律责任","content":"建设项目施工单位自行处置因施工需要采挖的砂、石、黏土的，由县级以上人民政府自然资源主管部门责令改正，处自行处置的矿产品市场价值3倍以上5倍以下的罚款；自行处置的矿产品市场价值不足10万元的，处10万元以上30万元以下的罚款。"},{"article_no":72,"chapter_no":7,"chapter_name":"法律责任","content":"未经批准开采纳入产地储备的战略性矿产资源的，依照矿产资源法第六十四条的规定从重处罚。"},{"article_no":73,"chapter_no":7,"chapter_name":"法律责任","content":"违反本条例规定，造成他人人身财产损害或者生态环境损害的，依法承担民事责任；构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。"}]},{"name":"附则","articles":[{"article_no":74,"chapter_no":8,"chapter_name":"附则","content":"外商投资勘查、开采矿产资源，应当符合外商投资准入负面清单的规定。\n外商投资勘查、开采矿产资源，影响或者可能影响国家安全的，依照国家有关规定进行安全审查。"},{"article_no":75,"chapter_no":8,"chapter_name":"附则","content":"矿产资源及相关货物、技术、服务的进出口，应当遵守有关对外贸易、进出口管理法律、行政法规的规定；属于出口管制物项的，还应当遵守出口管制法律、行政法规的规定。"},{"article_no":76,"chapter_no":8,"chapter_name":"附则","content":"任何国家、地区和国际组织采取或者协助、支持采取歧视性的禁止、限制或者其他类似措施，危害中华人民共和国矿产资源及相关产业链供应链安全的，国务院有关部门可以根据实际情况采取必要的反制措施。"},{"article_no":77,"chapter_no":8,"chapter_name":"附则","content":"国家对铀（钍）矿等放射性矿产资源的勘查、开采和保护等另有规定的，依照其规定。"},{"article_no":78,"chapter_no":8,"chapter_name":"附则","content":"2025年7月1日前依法核发的勘查许可证、采矿许可证，在有效期内继续有效。"},{"article_no":79,"chapter_no":8,"chapter_name":"附则","content":"本条例自2026年6月15日起施行。《矿产资源监督管理暂行办法》、《矿产资源补偿费征收管理规定》、《中华人民共和国矿产资源法实施细则》、《矿产资源勘查区块登记管理办法》、《矿产资源开采登记管理办法》、《探矿权采矿权转让管理办法》同时废止。"}]}]}]
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl = (text, kw) => {
  if (!kw) return esc(text);
  const t = esc(text), k = esc(kw);
  return t.split(k).join('<mark>'+k+'</mark>');
};
const badge = (l) => {
  const lv = l.level==='法律'?'b-law':(l.level==='部门规章'||l.level==='地方政府规章')?'b-reg':'b-law';
  const st = l.status==='现行有效'?'b-valid':'b-amended';
  return `<span class="badge ${lv}">${l.level}</span><span class="badge ${st}">${l.status}</span>`;
};
// 统计
$('#stats').innerHTML = [
  ['法规数量', LAWS.length+' 部'],
  ['条文总数', LAWS.reduce((s,l)=>s+l.chapters.reduce((a,c)=>a+c.articles.length,0),0)+' 条'],
  ['现行有效', LAWS.filter(l=>l.status==='现行有效').length+' 部'],
  ['数据源', '官方数据+用户提供']
].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
// 筛选状态
let fLevel='', fStatus='';
const fOrgs = new Set();
const trunc = (s,n)=> s.length>n ? s.slice(0,n)+'…' : s;
// 机关名规范化：去括号注释 + 按分号/顿号/逗号拆分（联合发文）
const normOrgs = l => ((l.issuing_org||'（未知）')
  .replace(/[（(][^（）()]*[）)]/g,'')
  .split(/[;；、,，]/)
  .map(s=>s.trim()).filter(Boolean));
// 机关分类（7 类，规则见方案）
const classify = (org) => {
  if (!org) return '群团及其他';
  if (org.includes('全国人民代表大会')) return '国家权力机关';
  if (org.includes('人民代表大会') || org.includes('人大常委会') || org.includes('人大常务委员会') || (org.includes('人大') && !org.includes('全国'))) return '地方权力机关';
  if (org.includes('人民法院') || org.includes('人民检察院')) return '司法机关';
  if (org.includes('人民政府')) return '地方行政机关';
  if (org.includes('中共中央') || org.includes('中央纪律检查委员会') || org.includes('中央委员会')) return '党中央机构';
  // 地方政府部门（省厅/市局/自治区部门等）→ 地方行政机关
  if (/省|市|自治区|自治州|自治县|地区|盟/.test(org)) return '地方行政机关';
  if (org==='国务院' || org==='国务院办公厅' || /^(国家|中国证券|中国银行|国务院)/.test(org) || /(部|委员会|总局|局|署|行|院|办公室|委|办)$/.test(org)) return '国务院部门';
  return '群团及其他';
};
// 生成机关分类树
(function buildOrgTree(){
  const cnt = {};
  LAWS.forEach(l=>{ normOrgs(l).forEach(o=>{ cnt[o]=(cnt[o]||0)+1; }); });
  const groups = {};
  Object.entries(cnt).forEach(([o,n])=>{ const g=classify(o); (groups[g]=groups[g]||[]).push([o,n]); });
  const ORDER = ['国家权力机关','党中央机构','国务院部门','司法机关','地方权力机关','地方行政机关','群团及其他'];
  const tree = $('#orgTree');
  tree.innerHTML = ORDER.filter(g=>groups[g]).map(g=>{
    const items = groups[g].sort((a,b)=>b[1]-a[1]);
    const gsum = items.reduce((s,x)=>s+x[1],0);
    return `<div class="og-group" data-g="${g}">
      <div class="og-head" onclick="toggleGroup(this)">
        <input type="checkbox" class="og-all" data-g="${g}" onclick="event.stopPropagation();toggleAll(this)" title="全选/全不选本组">
        <span>${g}</span><span class="ogcnt">（${gsum} 部次）</span><span class="arrow">▸</span>
      </div>
      <div class="og-body">${items.map(([o,n])=>`<label title="${esc(o)}"><input type="checkbox" class="og-item" value="${esc(o)}" data-g="${g}" onchange="onOrgChange()">${esc(trunc(o,16))}<span class="ocnt">${n}</span></label>`).join('')}</div>
    </div>`;
  }).join('');
})();
const toggleGroup = (head)=>{ head.parentElement.classList.toggle('open'); };
const toggleAll = (cb)=>{
  const g = cb.dataset.g;
  document.querySelectorAll(`.og-item[data-g="${g}"]`).forEach(i=>{ i.checked = cb.checked; });
  onOrgChange();
};
const onOrgChange = ()=>{
  fOrgs.clear();
  document.querySelectorAll('.og-item:checked').forEach(i=>fOrgs.add(i.value));
  render(qInput.value, modeSel.value);
};
const clearOrgTree = ()=>{
  document.querySelectorAll('.og-item,.og-all').forEach(i=>i.checked=false);
  fOrgs.clear();
};
const fillSelect = (id, key) => {
  const cnt = {};
  LAWS.forEach(l=>{ const v = l[key]||'（未知）'; cnt[v]=(cnt[v]||0)+1; });
  const opts = Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  $(id).innerHTML = '<option value="">全部</option>' +
    opts.map(([v,n])=>`<option value="${esc(v)}">${esc(trunc(v,20))}（${n}）</option>`).join('');
};
fillSelect('#fLevel','level');
fillSelect('#fStatus','status');
const resetFilters = ()=>{ fLevel=''; fStatus=''; clearOrgTree(); ['#fLevel','#fStatus'].forEach(s=>$(s).value=''); render(qInput.value, modeSel.value); };
['#fLevel','#fStatus'].forEach(s=>$(s).addEventListener('change', e=>{
  if (s==='#fLevel') fLevel=e.target.value;
  if (s==='#fStatus') fStatus=e.target.value;
  render(qInput.value, modeSel.value);
}));
// 渲染法规
function render(kw, mode){
  kw = (kw||'').trim();
  mode = mode || 'all';
  const inTitle = l => (l.name||'').includes(kw) || (l.doc_no||'').includes(kw);
  const kwHit = a => kw && (a.content.includes(kw) || a.article_no==parseInt(kw));
  const inContent = l => l.chapters.some(c=>c.articles.some(kwHit));
  const match = l => !kw || (mode==='title' ? inTitle(l) : mode==='content' ? inContent(l) : inTitle(l)||inContent(l));
  // 筛选：效力位阶 / 制定机关 / 时效性（可叠加，对当前结果再筛选）
  const passFilter = l => (!fLevel || (l.level||'')===fLevel) && (fOrgs.size===0 || normOrgs(l).some(o=>fOrgs.has(o))) && (!fStatus || (l.status||'')===fStatus);
  // 正文过滤：正文命中时仅渲染命中章节+条文；标题命中或无关键词时渲染全文
  const onlyHits = l => kw && (mode==='content' || (mode==='all' && !inTitle(l)));
  const bodyChapters = l => (onlyHits(l)
    ? l.chapters.map((c,ci)=>({ci, name:c.name, articles:c.articles.filter(kwHit)})).filter(c=>c.articles.length>0)
    : l.chapters.map((c,ci)=>({ci, name:c.name, articles:c.articles})));
  const box = $('#laws');
  const filtered = LAWS.filter(passFilter);
  const shown = filtered.filter(match);
  $('#fcount').textContent = '当前筛选：' + filtered.length + ' 部' + (filtered.length!==LAWS.length ? '（共 '+LAWS.length+' 部）' : '');
  if (!shown.length) { box.innerHTML = '<div class="empty">没有匹配「'+esc(kw)+'」'+(mode==='title'?'的法规标题':mode==='content'?'的条文':'的内容')+(filtered.length!==LAWS.length?'（或当前筛选条件下无结果，试试重置筛选）':'')+'</div>'; return; }
  box.innerHTML = shown.map((l,i)=>{
    const arts = l.chapters.flatMap(c=>c.articles);
    const tHit = kw && inTitle(l);
    const hit = kw && mode!=='title' ? arts.filter(a=>a.content.includes(kw)).length : 0;
    const titleHtml = tHit ? hl(l.name, kw) : esc(l.name);
    const hitInfo = mode==='title' ? (tHit?' ｜ 命中 <b style="color:#c77700">标题</b>':'') : (kw && hit ? ' ｜ 命中 <b style="color:#c77700">'+hit+'</b> 条'+(onlyHits(l)?'（仅显示命中条文）':'') : '');
    const bc = bodyChapters(l);
    const chHit = ci => onlyHits(l) && !l.chapters[ci].articles.some(kwHit);
    return `<div class="law-card">
      <div class="law-head" onclick="document.getElementById('lb${i}').classList.toggle('open')">
        <div>
          <span class="law-title">${titleHtml}</span>${badge(l)}
          <div class="law-meta">${l.doc_no?('文号：'+esc(l.doc_no)+' ｜ '):''}公布：${l.publish_date||'—'} ｜ 修正：${l.amend_date||'—'} ｜ 制定机关：${esc(l.issuing_org||'—')} ｜ 条文：${arts.length} 条${hitInfo}</div>
        </div>
        <span style="color:#bdc3c7;font-size:20px">▾</span>
      </div>
      <div class="law-body" id="lb${i}">
        ${l.preamble?`<div class="preamble">📜 题注：${esc(l.preamble)}</div>`:''}
        ${l.chapters.length>1?`<div class="toc"><b>📑 目录</b>${l.chapters.map((c,ci)=> chHit(ci) ? `<span style="color:#bdc3c7">${esc(c.name)}</span>` : `<a href="#ch${i}_${ci}">${esc(c.name)}</a>`).join('')}${onlyHits(l)?` <span style="color:#c77700;font-size:12px">（灰显=未命中章节）</span>`:''}</div>`:''}
        ${bc.map(c=>`<div class="chapter"><h3 id="ch${i}_${c.ci}">${esc(c.name)}</h3>${
          c.articles.map(a=>`<div class="article"><b class="no">${a.article_no?`第${a.article_no}条`:'全文'}</b>${hl(a.content, mode==='title'?'':kw)}</div>`).join('')
        }</div>`).join('')}
        ${onlyHits(l)?`<div style="font-size:12px;color:#bdc3c7;margin-top:8px">🔍 命中 ${hit} 条，仅显示上述命中条文（切换「全部/按标题」可看全文）</div>`:''}
      </div>
    </div>`;
  }).join('');
  // 自动展开：仅正文命中时展开（内容模式/全部模式的正文命中）；按标题搜索保持折叠，由用户自行展开
  if (kw && mode!=='title') shown.forEach((l,i)=>{ if(inContent(l)) document.getElementById('lb'+i)?.classList.add('open'); });
}
const modeSel = $('#mode'), qInput = $('#q');
qInput.addEventListener('input', e=>render(e.target.value, modeSel.value));
modeSel.addEventListener('change', e=>{
  const m = e.target.value;
  qInput.placeholder = m==='title' ? '🔍 按法规标题搜索（如：公司法、劳动法、上市规则）…' : m==='content' ? '🔍 搜索条文关键词（如：年休假、劳动合同、经济补偿）…' : '🔍 标题或条文关键词搜索…';
  render(qInput.value, m);
});
render('', 'all');
</script>
</body>
</html>
