建设项目，评标委员会否决全部投标的，招标人应当重新招标。"},{"article_no":35,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"评标完成后，评标委员会应当根据《招标投标法》和《实施条例》的有关规定向招标人提交评标报告和中标候选人名单。\n招标人进行集中招标的，评标委员会应当推荐不少于招标文件载明的中标人数量的中标候选人，并标明排序。\n评标委员会分组的，应当形成统一、完整的评标报告。"},{"article_no":36,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"评标报告应当包括下列内容：\n（一）基本情况；\n（二）开标记录和投标一览表；\n（三）评标方法、评标标准或者评标因素一览表；\n（四）评标专家评分原始记录表和否决投标的情况说明；\n（五）经评审的价格或者评分比较一览表和投标人排序；\n（六）推荐的中标候选人名单及其排序；\n（七）签订合同前要处理的事宜；\n（八）澄清、说明、补正事项纪要；\n（九）评标委员会成员名单及本人签字、拒绝在评标报告上签字的评标委员会成员名单及其陈述的不同意见和理由。"},{"article_no":37,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"依法必须进行招标的通信工程建设项目的招标人应当自收到评标报告之日起3日内通过“管理平台”公示中标候选人，公示期不得少于3日。"},{"article_no":38,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"招标人应当根据《招标投标法》和《实施条例》的有关规定确定中标人。\n招标人进行集中招标的，应当依次确定排名靠前的中标候选人为中标人，且中标人数量及每个中标人对应的中标份额等应当与招标文件载明的内容一致。招标人与中标人订立的合同中应当明确中标价格、预估合同份额等主要条款。\n中标人不能履行合同的，招标人可以按照评标委员会提出的中标候选人名单排序依次确定其他中标候选人为中标人，也可以对中标人的中标份额进行调整，但应当在招标文件中载明调整规则。"},{"article_no":39,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"在确定中标人之前，招标人不得与投标人就投标价格、投标方案等实质性内容进行谈判。\n招标人不得向中标人提出压低报价、增加工作量、增加配件、增加售后服务量、缩短工期或其他违背中标人的投标文件实质性内容的要求。"},{"article_no":40,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"依法必须进行招标的通信工程建设项目的招标人应当自确定中标人之日起15日内，通过“管理平台”向通信行政监督部门提交《通信工程建设项目招标投标情况报告表》（见附录二）。"},{"article_no":41,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"招标人应建立完整的招标档案，并按国家有关规定保存。招标档案应当包括下列内容：\n（一）招标文件；\n（二）中标人的投标文件；\n（三）评标报告；\n（四）中标通知书；\n（五）招标人与中标人签订的书面合同；\n（六）向通信行政监督部门提交的《通信工程建设项目自行招标备案表》、《通信工程建设项目招标投标情况报告表》；\n（七）其他需要存档的内容。"},{"article_no":42,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"招标人进行集中招标的，应当在所有项目实施完成之日起30日内通过“管理平台”向通信行政监督部门报告项目实施情况。"},{"article_no":43,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"通信行政监督部门对通信工程建设项目招标投标活动实施监督检查，可以查阅、复制招标投标活动中有关文件、资料，调查有关情况，相关单位和人员应当配合。必要时，通信行政监督部门可以责令暂停招标投标活动。\n通信行政监督部门的工作人员对监督检查过程中知悉的国家秘密、商业秘密，应当依法予以保密。"}]},{"name":"法律责任","articles":[{"article_no":44,"chapter_no":4,"chapter_name":"法律责任","content":"招标人在发布招标公告、发出投标邀请书或者售出招标文件或资格预审文件后无正当理由终止招标的，由通信行政监督部门处以警告，可以并处1万元以上3万元以下的罚款。"},{"article_no":45,"chapter_no":4,"chapter_name":"法律责任","content":"依法必须进行招标的通信工程建设项目的招标人或者招标代理机构有下列情形之一的，由通信行政监督部门责令改正，可以处3万元以下的罚款：\n（一）招标人自行招标，未按规定向通信行政监督部门备案；\n（二）未通过“管理平台”确定评标委员会的专家；\n（三）招标人未通过“管理平台”公示中标候选人；\n（四）确定中标人后，未按规定向通信行政监督部门提交招标投标情况报告。"},{"article_no":46,"chapter_no":4,"chapter_name":"法律责任","content":"招标人有下列情形之一的，由通信行政监督部门责令改正，可以处3万元以下的罚款，对单位直接负责的主管人员和其他直接责任人员依法给予处分；对中标结果造成实质性影响，且不能采取补救措施予以纠正的，招标人应当重新招标或者评标：\n（一）编制的资格预审文件、招标文件中未载明所有资格审查或者评标的标准和方法；\n（二）招标文件中含有要求投标人多轮次报价、投标人保证报价不高于历史价格等违法条款；\n（三）不按规定组建资格审查委员会；\n（四）投标人数量不符合法定要求时未重新招标而直接发包；\n（五）开标过程、开标记录不符合《招标投标法》、《实施条例》和本办法的规定；\n（六）违反《实施条例》第三十二条的规定限制、排斥投标人；\n（七）以任何方式要求评标委员会成员以其指定的投标人作为中标候选人、以招标文件未规定的评标标准和方法作为评标依据，或者以其他方式非法干涉评标活动，影响评标结果。"},{"article_no":47,"chapter_no":4,"chapter_name":"法律责任","content":"招标人进行集中招标或者集中资格预审，违反本办法第二十三条、第二十四条、第三十五条或者第三十八条规定的，由通信行政监督部门责令改正，可以处3万元以下的罚款。"}]},{"name":"附 则","articles":[{"article_no":48,"chapter_no":5,"chapter_name":"附 则","content":"通信行政监督部门建立通信工程建设项目招标投标情况通报制度，定期通报通信工程建设项目招标投标总体情况、公开招标及招标备案情况、重大违法违约事件等信息。"},{"article_no":49,"chapter_no":5,"chapter_name":"附 则","content":"本办法自2014年7月1日起施行。原中华人民共和国信息产业部2000年9月22日公布的《通信建设项目招标投标管理暂行规定》（中华人民共和国信息产业部令第2号）同时废止。\n附录：《通信工程建设项目招标投标管理办法》附录.wps"}]}]},{"id":9,"name":"中华人民共和国企业国有资产法","doc_no":"主席令第5号","level":"法律","issuing_org":"全国人民代表大会常务委员会","publish_date":"2008-10-28","amend_date":null,"status":"现行有效","bbbs":"2c909fdd678bf17901678bf653fb03c5","source":"国家法律法规数据库","official_url":"https://flk.npc.gov.cn/detail2.html?bbbs=2c909fdd678bf17901678bf653fb03c5","effective_date":null,"preamble":"（2008年10月28日第十一届全国人民代表大会常务委员会第五次会议通过）","chapters":[{"name":"总则","articles":[{"article_no":1,"chapter_no":1,"chapter_name":"总则","content":"为了维护国家基本经济制度，巩固和发展国有经济，加强对国有资产的保护，发挥国有经济在国民经济中的主导作用，促进社会主义市场经济发展，制定本法。"},{"article_no":2,"chapter_no":1,"chapter_name":"总则","content":"本法所称企业国有资产（以下称国有资产），是指国家对企业各种形式的出资所形成的权益。"},{"article_no":3,"chapter_no":1,"chapter_name":"总则","content":"国有资产属于国家所有即全民所有。国务院代表国家行使国有资产所有权。"},{"article_no":4,"chapter_no":1,"chapter_name":"总则","content":"国务院和地方人民政府依照法律、行政法规的规定，分别代表国家对国家出资企业履行出资人职责，享有出资人权益。\n国务院确定的关系国民经济命脉和国家安全的大型国家出资企业，重要基础设施和重要自然资源等领域的国家出资企业，由国务院代表国家履行出资人职责。其他的国家出资企业，由地方人民政府代表国家履行出资人职责。"},{"article_no":5,"chapter_no":1,"chapter_name":"总则","content":"本法所称国家出资企业，是指国家出资的国有独资企业、国有独资公司，以及国有资本控股公司、国有资本参股公司。"},{"article_no":6,"chapter_no":1,"chapter_name":"总则","content":"国务院和地方人民政府应当按照政企分开、社会公共管理职能与国有资产出资人职能分开、不干预企业依法自主经营的原则，依法履行出资人职责。"},{"article_no":7,"chapter_no":1,"chapter_name":"总则","content":"国家采取措施，推动国有资本向关系国民经济命脉和国家安全的重要行业和关键领域集中，优化国有经济布局和结构，推进国有企业的改革和发展，提高国有经济的整体素质，增强国有经济的控制力、影响力。"},{"article_no":8,"chapter_no":1,"chapter_name":"总则","content":"国家建立健全与社会主义市场经济发展要求相适应的国有资产管理与监督体制，建立健全国有资产保值增值考核和责任追究制度，落实国有资产保值增值责任。"},{"article_no":9,"chapter_no":1,"chapter_name":"总则","content":"国家建立健全国有资产基础管理制度。具体办法按照国务院的规定制定。"},{"article_no":10,"chapter_no":1,"chapter_name":"总则","content":"国有资产受法律保护，任何单位和个人不得侵害。"}]},{"name":"履行出资人职责的机构","articles":[{"article_no":11,"chapter_no":2,"chapter_name":"履行出资人职责的机构","content":"国务院国有资产监督管理机构和地方人民政府按照国务院的规定设立的国有资产监督管理机构，根据本级人民政府的授权，代表本级人民政府对国家出资企业履行出资人职责。\n国务院和地方人民政府根据需要，可以授权其他部门、机构代表本级人民政府对国家出资企业履行出资人职责。\n代表本级人民政府履行出资人职责的机构、部门，以下统称履行出资人职责的机构。"},{"article_no":12,"chapter_no":2,"chapter_name":"履行出资人职责的机构","content":"履行出资人职责的机构代表本级人民政府对国家出资企业依法享有资产收益、参与重大决策和选择管理者等出资人权利。\n履行出资人职责的机构依照法律、行政法规的规定，制定或者参与制定国家出资企业的章程。\n履行出资人职责的机构对法律、行政法规和本级人民政府规定须经本级人民政府批准的履行出资人职责的重大事项，应当报请本级人民政府批准。"},{"article_no":13,"chapter_no":2,"chapter_name":"履行出资人职责的机构","content":"履行出资人职责的机构委派的股东代表参加国有资本控股公司、国有资本参股公司召开的股东会会议、股东大会会议，应当按照委派机构的指示提出提案、发表意见、行使表决权，并将其履行职责的情况和结果及时报告委派机构。"},{"article_no":14,"chapter_no":2,"chapter_name":"履行出资人职责的机构","content":"履行出资人职责的机构应当依照法律、行政法规以及企业章程履行出资人职责，保障出资人权益，防止国有资产损失。\n履行出资人职责的机构应当维护企业作为市场主体依法享有的权利，除依法履行出资人职责外，不得干预企业经营活动。"},{"article_no":15,"chapter_no":2,"chapter_name":"履行出资人职责的机构","content":"履行出资人职责的机构对本级人民政府负责，向本级人民政府报告履行出资人职责的情况，接受本级人民政府的监督和考核，对国有资产的保值增值负责。\n履行出资人职责的机构应当按照国家有关规定，定期向本级人民政府报告有关国有资产总量、结构、变动、收益等汇总分析的情况。"}]},{"name":"国家出资企业","articles":[{"article_no":16,"chapter_no":3,"chapter_name":"国家出资企业","content":"国家出资企业对其动产、不动产和其他财产依照法律、行政法规以及企业章程享有占有、使用、收益和处分的权利。\n国家出资企业依法享有的经营自主权和其他合法权益受法律保护。"},{"article_no":17,"chapter_no":3,"chapter_name":"国家出资企业","content":"国家出资企业从事经营活动，应当遵守法律、行政法规，加强经营管理，提高经济效益，接受人民政府及其有关部门、机构依法实施的管理和监督，接受社会公众的监督，承担社会责任，对出资人负责。\n国家出资企业应当依法建立和完善法人治理结构，建立健全内部监督管理和风险控制制度。"},{"article_no":18,"chapter_no":3,"chapter_name":"国家出资企业","content":"国家出资企业应当依照法律、行政法规和国务院财政部门的规定，建立健全财务、会计制度，设置会计账簿，进行会计核算，依照法律、行政法规以及企业章程的规定向出资人提供真实、完整的财务、会计信息。\n国家出资企业应当依照法律、行政法规以及企业章程的规定，向出资人分配利润。"},{"article_no":19,"chapter_no":3,"chapter_name":"国家出资企业","content":"国有独资公司、国有资本控股公司和国有资本参股公司依照《中华人民共和国公司法》的规定设立监事会。国有独资企业由履行出资人职责的机构按照国务院的规定委派监事组成监事会。\n国家出资企业的监事会依照法律、行政法规以及企业章程的规定，对董事、高级管理人员执行职务的行为进行监督，对企业财务进行监督检查。"},{"article_no":20,"chapter_no":3,"chapter_name":"国家出资企业","content":"国家出资企业依照法律规定，通过职工代表大会或者其他形式，实行民主管理。"},{"article_no":21,"chapter_no":3,"chapter_name":"国家出资企业","content":"国家出资企业对其所出资企业依法享有资产收益、参与重大决策和选择管理者等出资人权利。\n国家出资企业对其所出资企业，应当依照法律、行政法规的规定，通过制定或者参与制定所出资企业的章程，建立权责明确、有效制衡的企业内部监督管理和风险控制制度，维护其出资人权益。"}]},{"name":"国家出资企业管理者的选择与考核","articles":[{"article_no":22,"chapter_no":4,"chapter_name":"国家出资企业管理者的选择与考核","content":"履行出资人职责的机构依照法律、行政法规以及企业章程的规定，任免或者建议任免国家出资企业的下列人员：\n（一）任免国有独资企业的经理、副经理、财务负责人和其他高级管理人员；\n（二）任免国有独资公司的董事长、副董事长、董事、监事会主席和监事；\n（三）向国有资本控股公司、国有资本参股公司的股东会、股东大会提出董事、监事人选。\n国家出资企业中应当由职工代表出任的董事、监事，依照有关法律、行政法规的规定由职工民主选举产生。"},{"article_no":23,"chapter_no":4,"chapter_name":"国家出资企业管理者的选择与考核","content":"履行出资人职责的机构任命或者建议任命的董事、监事、高级管理人员，应当具备下列条件：\n（一）有良好的品行；\n（二）有符合职位要求的专业知识和工作能力；\n（三）有能够正常履行职责的身体条件；\n（四）法律、行政法规规定的其他条件。\n董事、监事、高级管理人员在任职期间出现不符合前款规定情形或者出现《中华人民共和国公司法》规定的不得担任公司董事、监事、高级管理人员情形的，履行出资人职责的机构应当依法予以免职或者提出免职建议。"},{"article_no":24,"chapter_no":4,"chapter_name":"国家出资企业管理者的选择与考核","content":"履行出资人职责的机构对拟任命或者建议任命的董事、监事、高级管理人员的人选，应当按照规定的条件和程序进行考察。考察合格的，按照规定的权限和程序任命或者建议任命。"},{"article_no":25,"chapter_no":4,"chapter_name":"国家出资企业管理者的选择与考核","content":"未经履行出资人职责的机构同意，国有独资企业、国有独资公司的董事、高级管理人员不得在其他企业兼职。未经股东会、股东大会同意，国有资本控股公司、国有资本参股公司的董事、高级管理人员不得在经营同类业务的其他企业兼职。\n未经履行出资人职责的机构同意，国有独资公司的董事长不得兼任经理。未经股东会、股东大会同意，国有资本控股公司的董事长不得兼任经理。\n董事、高级管理人员不得兼任监事。"},{"article_no":26,"chapter_no":4,"chapter_name":"国家出资企业管理者的选择与考核","content":"国家出资企业的董事、监事、高级管理人员，应当遵守法律、行政法规以及企业章程，对企业负有忠实义务和勤勉义务，不得利用职权收受贿赂或者取得其他非法收入和不当利益，不得侵占、挪用企业资产，不得超越职权或者违反程序决定企业重大事项，不得有其他侵害国有资产出资人权益的行为。"},{"article_no":27,"chapter_no":4,"chapter_name":"国家出资企业管理者的选择与考核","content":"国家建立国家出资企业管理者经营业绩考核制度。履行出资人职责的机构应当对其任命的企业管理者进行年度和任期考核，并依据考核结果决定对企业管理者的奖惩。\n履行出资人职责的机构应当按照国家有关规定，确定其任命的国家出资企业管理者的薪酬标准。"},{"article_no":28,"chapter_no":4,"chapter_name":"国家出资企业管理者的选择与考核","content":"国有独资企业、国有独资公司和国有资本控股公司的主要负责人，应当接受依法进行的任期经济责任审计。"},{"article_no":29,"chapter_no":4,"chapter_name":"国家出资企业管理者的选择与考核","content":"本法第二十二条第一款第一项、第二项规定的企业管理者，国务院和地方人民政府规定由本级人民政府任免的，依照其规定。履行出资人职责的机构依照本章规定对上述企业管理者进行考核、奖惩并确定其薪酬标准。"}]},{"name":"关系国有资产出资人权益的重大事项","articles":[{"article_no":30,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国家出资企业合并、分立、改制、上市，增加或者减少注册资本，发行债券，进行重大投资，为他人提供大额担保，转让重大财产，进行大额捐赠，分配利润，以及解散、申请破产等重大事项，应当遵守法律、行政法规以及企业章程的规定，不得损害出资人和债权人的权益。"},{"article_no":31,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有独资企业、国有独资公司合并、分立，增加或者减少注册资本，发行债券，分配利润，以及解散、申请破产，由履行出资人职责的机构决定。"},{"article_no":32,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有独资企业、国有独资公司有本法第三十条所列事项的，除依照本法第三十一条和有关法律、行政法规以及企业章程的规定，由履行出资人职责的机构决定的以外，国有独资企业由企业负责人集体讨论决定，国有独资公司由董事会决定。"},{"article_no":33,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有资本控股公司、国有资本参股公司有本法第三十条所列事项的，依照法律、行政法规以及公司章程的规定，由公司股东会、股东大会或者董事会决定。由股东会、股东大会决定的，履行出资人职责的机构委派的股东代表应当依照本法第十三条的规定行使权利。"},{"article_no":34,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"重要的国有独资企业、国有独资公司、国有资本控股公司的合并、分立、解散、申请破产以及法律、行政法规和本级人民政府规定应当由履行出资人职责的机构报经本级人民政府批准的重大事项，履行出资人职责的机构在作出决定或者向其委派参加国有资本控股公司股东会会议、股东大会会议的股东代表作出指示前，应当报请本级人民政府批准。\n本法所称的重要的国有独资企业、国有独资公司和国有资本控股公司，按照国务院的规定确定。"},{"article_no":35,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国家出资企业发行债券、投资等事项，有关法律、行政法规规定应当报经人民政府或者人民政府有关部门、机构批准、核准或者备案的，依照其规定。"},{"article_no":36,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国家出资企业投资应当符合国家产业政策，并按照国家规定进行可行性研究；与他人交易应当公平、有偿，取得合理对价。"},{"article_no":37,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国家出资企业的合并、分立、改制、解散、申请破产等重大事项，应当听取企业工会的意见，并通过职工代表大会或者其他形式听取职工的意见和建议。"},{"article_no":38,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有独资企业、国有独资公司、国有资本控股公司对其所出资企业的重大事项参照本章规定履行出资人职责。具体办法由国务院规定。\n第二节企业改制"},{"article_no":39,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"本法所称企业改制是指：\n（一）国有独资企业改为国有独资公司；\n（二）国有独资企业、国有独资公司改为国有资本控股公司或者非国有资本控股公司；\n（三）国有资本控股公司改为非国有资本控股公司。"},{"article_no":40,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"企业改制应当依照法定程序，由履行出资人职责的机构决定或者由公司股东会、股东大会决定。\n重要的国有独资企业、国有独资公司、国有资本控股公司的改制，履行出资人职责的机构在作出决定或者向其委派参加国有资本控股公司股东会会议、股东大会会议的股东代表作出指示前，应当将改制方案报请本级人民政府批准。"},{"article_no":41,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"企业改制应当制定改制方案，载明改制后的企业组织形式、企业资产和债权债务处理方案、股权变动方案、改制的操作程序、资产评估和财务审计等中介机构的选聘等事项。\n企业改制涉及重新安置企业职工的，还应当制定职工安置方案，并经职工代表大会或者职工大会审议通过。"},{"article_no":42,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"企业改制应当按照规定进行清产核资、财务审计、资产评估，准确界定和核实资产，客观、公正地确定资产的价值。\n企业改制涉及以企业的实物、知识产权、土地使用权等非货币财产折算为国有资本出资或者股份的，应当按照规定对折价财产进行评估，以评估确认价格作为确定国有资本出资额或者股份数额的依据。不得将财产低价折股或者有其他损害出资人权益的行为。\n第三节与关联方的交易"},{"article_no":43,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国家出资企业的关联方不得利用与国家出资企业之间的交易，谋取不当利益，损害国家出资企业利益。\n本法所称关联方，是指本企业的董事、监事、高级管理人员及其近亲属，以及这些人员所有或者实际控制的企业。"},{"article_no":44,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有独资企业、国有独资公司、国有资本控股公司不得无偿向关联方提供资金、商品、服务或者其他资产，不得以不公平的价格与关联方进行交易。"},{"article_no":45,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"未经履行出资人职责的机构同意，国有独资企业、国有独资公司不得有下列行为：\n（一）与关联方订立财产转让、借款的协议；\n（二）为关联方提供担保；\n（三）与关联方共同出资设立企业，或者向董事、监事、高级管理人员或者其近亲属所有或者实际控制的企业投资。"},{"article_no":46,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有资本控股公司、国有资本参股公司与关联方的交易，依照《中华人民共和国公司法》和有关行政法规以及公司章程的规定，由公司股东会、股东大会或者董事会决定。由公司股东会、股东大会决定的，履行出资人职责的机构委派的股东代表，应当依照本法第十三条的规定行使权利。\n公司董事会对公司与关联方的交易作出决议时，该交易涉及的董事不得行使表决权，也不得代理其他董事行使表决权。\n第四节资产评估"},{"article_no":47,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有独资企业、国有独资公司和国有资本控股公司合并、分立、改制，转让重大财产，以非货币财产对外投资，清算或者有法律、行政法规以及企业章程规定应当进行资产评估的其他情形的，应当按照规定对有关资产进行评估。"},{"article_no":48,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有独资企业、国有独资公司和国有资本控股公司应当委托依法设立的符合条件的资产评估机构进行资产评估；涉及应当报经履行出资人职责的机构决定的事项的，应当将委托资产评估机构的情况向履行出资人职责的机构报告。"},{"article_no":49,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有独资企业、国有独资公司、国有资本控股公司及其董事、监事、高级管理人员应当向资产评估机构如实提供有关情况和资料，不得与资产评估机构串通评估作价。"},{"article_no":50,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"资产评估机构及其工作人员受托评估有关资产，应当遵守法律、行政法规以及评估执业准则，独立、客观、公正地对受托评估的资产进行评估。资产评估机构应当对其出具的评估报告负责。\n第五节国有资产转让"},{"article_no":51,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"本法所称国有资产转让，是指依法将国家对企业的出资所形成的权益转移给其他单位或者个人的行为；按照国家规定无偿划转国有资产的除外。"},{"article_no":52,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有资产转让应当有利于国有经济布局和结构的战略性调整，防止国有资产损失，不得损害交易各方的合法权益。"},{"article_no":53,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有资产转让由履行出资人职责的机构决定。履行出资人职责的机构决定转让全部国有资产的，或者转让部分国有资产致使国家对该企业不再具有控股地位的，应当报请本级人民政府批准。"},{"article_no":54,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有资产转让应当遵循等价有偿和公开、公平、公正的原则。\n除按照国家规定可以直接协议转让的以外，国有资产转让应当在依法设立的产权交易场所公开进行。转让方应当如实披露有关信息，征集受让方；征集产生的受让方为两个以上的，转让应当采用公开竞价的交易方式。\n转让上市交易的股份依照《中华人民共和国证券法》的规定进行。"},{"article_no":55,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有资产转让应当以依法评估的、经履行出资人职责的机构认可或者由履行出资人职责的机构报经本级人民政府核准的价格为依据，合理确定最低转让价格。"},{"article_no":56,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"法律、行政法规或者国务院国有资产监督管理机构规定可以向本企业的董事、监事、高级管理人员或者其近亲属，或者这些人员所有或者实际控制的企业转让的国有资产，在转让时，上述人员或者企业参与受让的，应当与其他受让参与者平等竞买；转让方应当按照国家有关规定，如实披露有关信息；相关的董事、监事和高级管理人员不得参与转让方案的制定和组织实施的各项工作。"},{"article_no":57,"chapter_no":5,"chapter_name":"关系国有资产出资人权益的重大事项","content":"国有资产向境外投资者转让的，应当遵守国家有关规定，不得危害国家安全和社会公共利益。"}]},{"name":"国有资本经营预算","articles":[{"article_no":58,"chapter_no":6,"chapter_name":"国有资本经营预算","content":"国家建立健全国有资本经营预算制度，对取得的国有资本收入及其支出实行预算管理。"},{"article_no":59,"chapter_no":6,"chapter_name":"国有资本经营预算","content":"国家取得的下列国有资本收入，以及下列收入的支出，应当编制国有资本经营预算：\n（一）从国家出资企业分得的利润；\n（二）国有资产转让收入；\n（三）从国家出资企业取得的清算收入；\n（四）其他国有资本收入。"},{"article_no":60,"chapter_no":6,"chapter_name":"国有资本经营预算","content":"国有资本经营预算按年度单独编制，纳入本级人民政府预算，报本级人民代表大会批准。\n国有资本经营预算支出按照当年预算收入规模安排，不列赤字。"},{"article_no":61,"chapter_no":6,"chapter_name":"国有资本经营预算","content":"国务院和有关地方人民政府财政部门负责国有资本经营预算草案的编制工作，履行出资人职责的机构向财政部门提出由其履行出资人职责的国有资本经营预算建议草案。"},{"article_no":62,"chapter_no":6,"chapter_name":"国有资本经营预算","content":"国有资本经营预算管理的具体办法和实施步骤，由国务院规定，报全国人民代表大会常务委员会备案。"}]},{"name":"国有资产监督","articles":[{"article_no":63,"chapter_no":7,"chapter_name":"国有资产监督","content":"各级人民代表大会常务委员会通过听取和审议本级人民政府履行出资人职责的情况和国有资产监督管理情况的专项工作报告，组织对本法实施情况的执法检查等，依法行使监督职权。"},{"article_no":64,"chapter_no":7,"chapter_name":"国有资产监督","content":"国务院和地方人民政府应当对其授权履行出资人职责的机构履行职责的情况进行监督。"},{"article_no":65,"chapter_no":7,"chapter_name":"国有资产监督","content":"国务院和地方人民政府审计机关依照《中华人民共和国审计法》的规定，对国有资本经营预算的执行情况和属于审计监督对象的国家出资企业进行审计监督。"},{"article_no":66,"chapter_no":7,"chapter_name":"国有资产监督","content":"国务院和地方人民政府应当依法向社会公布国有资产状况和国有资产监督管理工作情况，接受社会公众的监督。\n任何单位和个人有权对造成国有资产损失的行为进行检举和控告。"},{"article_no":67,"chapter_no":7,"chapter_name":"国有资产监督","content":"履行出资人职责的机构根据需要，可以委托会计师事务所对国有独资企业、国有独资公司的年度财务会计报告进行审计，或者通过国有资本控股公司的股东会、股东大会决议，由国有资本控股公司聘请会计师事务所对公司的年度财务会计报告进行审计，维护出资人权益。"}]},{"name":"法律责任","articles":[{"article_no":68,"chapter_no":8,"chapter_name":"法律责任","content":"履行出资人职责的机构有下列行为之一的，对其直接负责的主管人员和其他直接责任人员依法给予处分：\n（一）不按照法定的任职条件，任命或者建议任命国家出资企业管理者的；\n（二）侵占、截留、挪用国家出资企业的资金或者应当上缴的国有资本收入的；\n（三）违反法定的权限、程序，决定国家出资企业重大事项，造成国有资产损失的；\n（四）有其他不依法履行出资人职责的行为，造成国有资产损失的。"},{"article_no":69,"chapter_no":8,"chapter_name":"法律责任","content":"履行出资人职责的机构的工作人员玩忽职守、滥用职权、徇私舞弊，尚不构成犯罪的，依法给予处分。"},{"article_no":70,"chapter_no":8,"chapter_name":"法律责任","content":"履行出资人职责的机构委派的股东代表未按照委派机构的指示履行职责，造成国有资产损失的，依法承担赔偿责任；属于国家工作人员的，并依法给予处分。"},{"article_no":71,"chapter_no":8,"chapter_name":"法律责任","content":"国家出资企业的董事、监事、高级管理人员有下列行为之一，造成国有资产损失的，依法承担赔偿责任；属于国家工作人员的，并依法给予处分：\n（一）利用职权收受贿赂或者取得其他非法收入和不当利益的；\n（二）侵占、挪用企业资产的；\n（三）在企业改制、财产转让等过程中，违反法律、行政法规和公平交易规则，将企业财产低价转让、低价折股的；\n（四）违反本法规定与本企业进行交易的；\n（五）不如实向资产评估机构、会计师事务所提供有关情况和资料，或者与资产评估机构、会计师事务所串通出具虚假资产评估报告、审计报告的；\n（六）违反法律、行政法规和企业章程规定的决策程序，决定企业重大事项的；\n（七）有其他违反法律、行政法规和企业章程执行职务行为的。\n国家出资企业的董事、监事、高级管理人员因前款所列行为取得的收入，依法予以追缴或者归国家出资企业所有。\n履行出资人职责的机构任命或者建议任命的董事、监事、高级管理人员有本条第一款所列行为之一，造成国有资产重大损失的，由履行出资人职责的机构依法予以免职或者提出免职建议。"},{"article_no":72,"chapter_no":8,"chapter_name":"法律责任","content":"在涉及关联方交易、国有资产转让等交易活动中，当事人恶意串通，损害国有资产权益的，该交易行为无效。"},{"article_no":73,"chapter_no":8,"chapter_name":"法律责任","content":"国有独资企业、国有独资公司、国有资本控股公司的董事、监事、高级管理人员违反本法规定，造成国有资产重大损失，被免职的，自免职之日起五年内不得担任国有独资企业、国有独资公司、国有资本控股公司的董事、监事、高级管理人员；造成国有资产特别重大损失，或者因贪污、贿赂、侵占财产、挪用财产或者破坏社会主义市场经济秩序被判处刑罚的，终身不得担任国有独资企业、国有独资公司、国有资本控股公司的董事、监事、高级管理人员。"},{"article_no":74,"chapter_no":8,"chapter_name":"法律责任","content":"接受委托对国家出资企业进行资产评估、财务审计的资产评估机构、会计师事务所违反法律、行政法规的规定和执业准则，出具虚假的资产评估报告或者审计报告的，依照有关法律、行政法规的规定追究法律责任。"},{"article_no":75,"chapter_no":8,"chapter_name":"法律责任","content":"违反本法规定，构成犯罪的，依法追究刑事责任。"}]},{"name":"附则","articles":[{"article_no":76,"chapter_no":9,"chapter_name":"附则","content":"金融企业国有资产的管理与监督，法律、行政法规另有规定的，依照其规定。"},{"article_no":77,"chapter_no":9,"chapter_name":"附则","content":"本法自2009年5月1日起施行。"}]}]},{"id":13,"name":"必须招标的工程项目规定","doc_no":"国家发展改革委令第16号","level":"部门规章","issuing_org":"发展改革委","publish_date":"2018-03-27","amend_date":null,"status":"现行有效","bbbs":null,"source":"国家规章库","official_url":"http://www.gov.cn/zhengce/2021-11/30/content_5713255.htm","effective_date":"2018-06-01","preamble":"(2018年3月27日国家发展改革委令第16号公布 自2018年6月1日起施行)","chapters":[{"name":"全文","articles":[{"article_no":1,"chapter_no":0,"chapter_name":"","content":"为了确定必须招标的工程项目，规范招标投标活动，提高工作效率、降低企业成本、预防腐败，根据《中华人民共和国招标投标法》第三条的规定，制定本规定。"},{"article_no":2,"chapter_no":0,"chapter_name":"","content":"全部或者部分使用国有资金投资或者国家融资的项目包括：\n(一)使用预算资金200万元人民币以上，并且该资金占投资额10%以上的项目;\n(二)使用国有企业事业单位资金，并且该资金占控股或者主导地位的项目。"},{"article_no":3,"chapter_no":0,"chapter_name":"","content":"使用国际组织或者外国政府贷款、援助资金的项目包括：\n(一)使用世界银行、亚洲开发银行等国际组织贷款、援助资金的项目;\n(二)使用外国政府及其机构贷款、援助资金的项目。"},{"article_no":4,"chapter_no":0,"chapter_name":"","content":"不属于本规定第二条、第三条规定情形的大型基础设施、公用事业等关系社会公共利益、公众安全的项目，必须招标的具体范围由国务院发展改革部门会同国务院有关部门按照确有必要、严格限定的原则制订，报国务院批准。"},{"article_no":5,"chapter_no":0,"chapter_name":"","content":"本规定第二条至第四条规定范围内的项目，其勘察、设计、施工、监理以及与工程建设有关的重要设备、材料等的采购达到下列标准之一的，必须招标：\n(一)施工单项合同估算价在400万元人民币以上;\n(二)重要设备、材料等货物的采购，单项合同估算价在200万元人民币以上;\n(三)勘察、设计、监理等服务的采购，单项合同估算价在100万元人民币以上。\n同一项目中可以合并进行的勘察、设计、施工、监理以及与工程建设有关的重要设备、材料等的采购，合同估算价合计达到前款规定标准的，必须招标。"},{"article_no":6,"chapter_no":0,"chapter_name":"","content":"本规定自2018年6月1日起施行。"}]}]},{"id":27,"name":"必须招标的基础设施和公用事业项目范围规定","doc_no":"发改法规规〔2018〕843号","level":"规范性文件","issuing_org":"国家发展改革委","publish_date":"2018-06-06","amend_date":null,"status":"现行有效","bbbs":null,"source":"国家发展改革委官网","official_url":"https://www.ndrc.gov.cn/xxgk/zcfb/ghxwj/201806/t20180611_960949.html","effective_date":"2018-06-06","preamble":"（发改法规规〔2018〕843号印发，2018年6月6日施行）","chapters":[{"name":"全文","articles":[{"article_no":1,"chapter_no":0,"chapter_name":"","content":"为明确必须招标的大型基础设施和公用事业项目范围，根据《中华人民共和国招标投标法》和《必须招标的工程项目规定》，制定本规定。"},{"article_no":2,"chapter_no":0,"chapter_name":"","content":"不属于《必须招标的工程项目规定》第二条、第三条规定情形的大型基础设施、公用事业等关系社会公共利益、公众安全的项目，必须招标的具体范围包括：（一）煤炭、石油、天然气、电力、新能源等能源基础设施项目；（二）铁路、公路、管道、水运，以及公共航空和A1级通用机场等交通运输基础设施项目；（三）电信枢纽、通信信息网络等通信基础设施项目；（四）防洪、灌溉、排涝、引（供）水等水利基础设施项目；（五）城市轨道交通等城建项目。"},{"article_no":3,"chapter_no":0,"chapter_name":"","content":"本规定自2018年6月6日起施行。"}]}]},{"id":104,"name":"企业内部控制基本规范","doc_no":"财会〔2008〕7号","level":"规范性文件","issuing_org":"财政部、证监会、审计署、银监会、保监会","publish_date":"2008-05-22","amend_date":null,"status":"现行有效","bbbs":null,"source":"财政部官网（会计资格评价中心）","official_url":"http://kzp.mof.gov.cn/infor.jsp?infoid=286","effective_date":"2009-07-01","preamble":"（2008年5月22日 财政部等五部委印发 自2009年7月1日起在上市公司范围内施行，鼓励非上市大中型企业执行）","chapters":[{"name":"10","articles":[{"article_no":1,"chapter_no":"第一章总则","chapter_name":"10","content":"第一条 为了加强和规范企业内部控制，提高企业经营管理水平和风险防范能力，促进企业可持续发展，维护社会主义市场经济秩序和社会公众利益，根据《中华人民共和国公司法》、《中华人民共和国证券法》、《中华人民共和国会计法》和其他有关法律法规，制定本规范。"},{"article_no":2,"chapter_no":"第一章总则","chapter_name":"10","content":"第二条 本规范适用于中华人民共和国境内设立的大中型企业。小企业和其他单位可以参照本规范建立与实施内部控制。大中型企业和小企业的划分标准根据国家有关规定执行。"},{"article_no":3,"chapter_no":"第一章总则","chapter_name":"10","content":"第三条 本规范所称内部控制，是由企业董事会、监事会、经理层和全体员工实施的、旨在实现控制目标的过程。内部控制的目标是合理保证企业经营管理合法合规、资产安全、财务报告及相关信息真实完整，提高经营效率和效果，促进企业实现发展战略。"},{"article_no":4,"chapter_no":"第一章总则","chapter_name":"10","content":"第四条 企业建立与实施内部控制，应当遵循下列原则：（一）全面性原则。内部控制应当贯穿决策、执行和监督全过程，覆盖企业及其所属单位的各种业务和事项。（二）重要性原则。内部控制应当在全面控制的基础上，关注重要业务事项和高风险领域。（三）制衡性原则。内部控制应当在治理结构、机构设置及权责分配、业务流程等方面形成相互制约、相互监督，同时兼顾运营效率。（四）适应性原则。内部控制应当与企业经营规模、业务范围、竞争状况和风险水平等相适应，并随着情况的变化及时加以调整。（五）成本效益原则。内部控制应当权衡实施成本与预期效益，以适当的成本实现有效控制。"},{"article_no":5,"chapter_no":"第一章总则","chapter_name":"10","content":"第五条 企业建立与实施有效的内部控制，应当包括下列要素：（一）内部环境。内部环境是企业实施内部控制的基础，一般包括治理结构、机构设置及权责分配、内部审计、人力资源政策、企业文化等。（二）风险评估。风险评估是企业及时识别、系统分析经营活动中与实现内部控制目标相关的风险，合理确定风险应对策略。（三）控制活动。控制活动是企业根据风险评估结果，采用相应的控制措施，将风险控制在可承受度之内。（四）信息与沟通。信息与沟通是企业及时、准确地收集、传递与内部控制相关的信息，确保信息在企业内部、企业与外部之间进行有效沟通。（五）内部监督。内部监督是企业对内部控制建立与实施情况进行监督检查，评价内部控制的有效性，发现内部控制缺陷，应当及时加以改进。"},{"article_no":6,"chapter_no":"第一章总则","chapter_name":"10","content":"第六条 企业应当根据有关法律法规、本规范及其配套办法，制定本企业的内部控制制度并组织实施。"},{"article_no":7,"chapter_no":"第一章总则","chapter_name":"10","content":"第七条 企业应当运用信息技术加强内部控制，建立与经营管理相适应的信息系统，促进内部控制流程与信息系统的有机结合，实现对业务和事项的自动控制，减少或消除人为操纵因素。"},{"article_no":8,"chapter_no":"第一章总则","chapter_name":"10","content":"第八条 企业应当建立内部控制实施的激励约束机制，将各责任单位和全体员工实施内部控制的情况纳入绩效考评体系，促进内部控制的有效实施。"},{"article_no":9,"chapter_no":"第一章总则","chapter_name":"10","content":"第九条 国务院有关部门可以根据法律法规、本规范及其配套办法，明确贯彻实施本规范的具体要求，对企业建立与实施内部控制的情况进行监督检查。"},{"article_no":10,"chapter_no":"第一章总则","chapter_name":"10","content":"第十条 接受企业委托从事内部控制审计的会计师事务所，应当根据本规范及其配套办法和相关执业准则，对企业内部控制的有效性进行审计，出具审计报告。会计师事务所及其签字的从业人员应当对发表的内部控制审计意见负责。为企业内部控制提供咨询的会计师事务所，不得同时为同一企业提供内部控制审计服务。"},{"article_no":15,"chapter_no":"第四章控制活动","chapter_name":"10","content":"第二十八条 企业应当结合风险评估结果，通过手工控制与自动控制、预防性控制与发现性控制相结合的方法，运用相应的控制措施，将风险控制在可承受度之内。控制措施一般包括：不相容职务分离控制、授权审批控制、会计系统控制、财产保护控制、预算控制、运营分析控制和绩效考评控制等。"},{"article_no":16,"chapter_no":"第四章控制活动","chapter_name":"10","content":"第二十九条 不相容职务分离控制要求企业全面系统地分析、梳理业务流程中所涉及的不相容职务，实施相应的分离措施，形成各司其职、各负其责、相互制约的工作机制。"},{"article_no":17,"chapter_no":"第四章控制活动","chapter_name":"10","content":"第三十条 授权审批控制要求企业根据常规授权和特别授权的规定，明确各岗位办理业务和事项的权限范围、审批程序和相应责任。企业应当编制常规授权的权限指引，规范特别授权的范围、权限、程序和责任，严格控制特别授权。常规授权是指企业在日常经营管理活动中按照既定的职责和程序进行的授权。特别授权是指企业在特殊情况、特定条件下进行的授权。企业各级管理人员应当在授权范围内行使职权和承担责任。企业对于重大的业务和事项，应当实行集体决策审批或者联签制度，任何个人不得单独进行决策或者擅自改变集体决策。"},{"article_no":18,"chapter_no":"第四章控制活动","chapter_name":"10","content":"第三十一条 会计系统控制要求企业严格执行国家统一的会计准则制度，加强会计基础工作，明确会计凭证、会计账簿和财务会计报告的处理程序，保证会计资料真实完整。企业应当依法设置会计机构，配备会计从业人员。从事会计工作的人员，必须取得会计从业资格证书。会计机构负责人应当具备会计师以上专业技术职务资格。大中型企业应当设置总会计师。设置总会计师的企业，不得设置与其职权重叠的副职。"},{"article_no":19,"chapter_no":"第四章控制活动","chapter_name":"10","content":"第三十二条 财产保护控制要求企业建立财产日常管理制度和定期清查制度，采取财产记录、实物保管、定期盘点、账实核对等措施，确保财产安全。企业应当严格限制未经授权的人员接触和处置财产。"},{"article_no":20,"chapter_no":"第四章控制活动","chapter_name":"10","content":"第三十三条 预算控制要求企业实施全面预算管理制度，明确各责任单位在预算管理中的职责权限，规范预算的编制、审定、下达和执行程序，强化预算约束。"},{"article_no":21,"chapter_no":"第四章控制活动","chapter_name":"10","content":"第三十四条 运营分析控制要求企业建立运营情况分析制度，经理层应当综合运用生产、购销、投资、筹资、财务等方面的信息，通过因素分析、对比分析、趋势分析等方法，定期开展运营情况分析，发现存在的问题，及时查明原因并加以改进。"},{"article_no":22,"chapter_no":"第四章控制活动","chapter_name":"10","content":"第三十五条 绩效考评控制要求企业建立和实施绩效考评制度，科学设置考核指标体系，对企业内部各责任单位和全体员工的业绩进行定期考核和客观评价，将考评结果作为确定员工薪酬以及职务晋升、评优、降级、调岗、辞退等的依据。"},{"article_no":23,"chapter_no":"第四章控制活动","chapter_name":"10","content":"第三十六条 企业应当根据内部控制目标，结合风险应对策略，综合运用控制措施，对各种业务和事项实施有效控制。"},{"article_no":24,"chapter_no":"第四章控制活动","chapter_name":"10","content":"第三十七条 企业应当建立重大风险预警机制和突发事件应急处理机制，明确风险预警标准，对可能发生的重大风险或突发事件，制定应急预案、明确责任人员、规范处置程序，确保突发事件得到及时妥善处理。"}]},{"name":"4","articles":[{"article_no":11,"chapter_no":"第二章内部环境","chapter_name":"4","content":"第十一条 企业应当根据国家有关法律法规和企业章程，建立规范的公司治理结构和议事规则，明确决策、执行、监督等方面的职责权限，形成科学有效的职责分工和制衡机制。股东（大）会享有法律法规和企业章程规定的合法权利，依法行使企业经营方针、筹资、投资、利润分配等重大事项的表决权。董事会对股东（大）会负责，依法行使企业的经营决策权。监事会对股东（大）会负责，监督企业董事、经理和其他高级管理人员依法履行职责。经理层负责组织实施股东（大）会、董事会决议事项，主持企业的生产经营管理工作。"},{"article_no":12,"chapter_no":"第二章内部环境","chapter_name":"4","content":"第十二条 董事会负责内部控制的建立健全和有效实施。监事会对董事会建立与实施内部控制进行监督。经理层负责组织领导企业内部控制的日常运行。企业应当成立专门机构或者指定适当的机构具体负责组织协调内部控制的建立实施及日常工作。"},{"article_no":13,"chapter_no":"第二章内部环境","chapter_name":"4","content":"第十三条 企业应当在董事会下设立审计委员会。审计委员会负责审查企业内部控制，监督内部控制的有效实施和内部控制自我评价情况，协调内部控制审计及其他相关事宜等。审计委员会负责人应当具备相应的独立性、良好的职业操守和专业胜任能力。风险分担是企业准备借助他人力量，采取业务分包、购买保险等方式和适当的控制措施，将风险控制在风险承受度之内的策略。风险承受是企业对风险承受度之内的风险，在权衡成本效益之后，不准备采取控制措施降低风险或者减轻损失的策略。"},{"article_no":14,"chapter_no":"第二章内部环境","chapter_name":"4","content":"第二十七条 企业应当结合不同发展阶段和业务拓展情况，持续收集与风险变化相关的信息，进行风险识别和风险分析，及时调整风险应对策略。"}]},{"name":"6","articles":[{"article_no":25,"chapter_no":"第五章信息与沟通","chapter_name":"6","content":"第三十八条 企业应当建立信息与沟通制度，明确内部控制相关信息的收集、处理和传递程序，确保信息及时沟通，促进内部控制有效运行。"},{"article_no":26,"chapter_no":"第五章信息与沟通","chapter_name":"6","content":"第三十九条 企业应当对收集的各种内部信息和外部信息进行合理筛选、核对、整合，提高信息的有用性。企业可以通过财务会计资料、经营管理资料、调研报告、专项信息、内部刊物、办公网络等渠道，获取内部信息。企业可以通过行业协会组织、社会中介机构、业务往来单位、市场调查、来信来访、网络媒体以及有关监管部门等渠道，获取外部信息。"},{"article_no":27,"chapter_no":"第五章信息与沟通","chapter_name":"6","content":"第四十条 企业应当将内部控制相关信息在企业内部各管理级次、责任单位、业务环节之间，以及企业与外部投资者、债权人、客户、供应商、中介机构和监管部门等有关方面之间进行沟通和反馈。信息沟通过程中发现的问题，应当及时报告并加以解决。重要信息应当及时传递给董事会、监事会和经理层。"},{"article_no":28,"chapter_no":"第五章信息与沟通","chapter_name":"6","content":"第四十一条 企业应当利用信息技术促进信息的集成与共享，充分发挥信息技术在信息与沟通中的作用。企业应当加强对信息系统开发与维护、访问与变更、数据输入与输出、文件储存与保管、网络安全等方面的控制，保证信息系统安全稳定运行。"},{"article_no":29,"chapter_no":"第五章信息与沟通","chapter_name":"6","content":"第四十二条 企业应当建立反舞弊机制，坚持惩防并举、重在预防的原则，明确反舞弊工作的重点领域、关键环节和有关机构在反舞弊工作中的职责权限，规范舞弊案件的举报、调查、处理、报告和补救程序。企业至少应当将下列情形作为反舞弊工作的重点：（一）未经授权或者采取其他不法方式侵占、挪用企业资产，牟取不当利益。（二）在财务会计报告和信息披露等方面存在的虚假记载、误导性陈述或者重大遗漏等。（三）董事、监事、经理及其他高级管理人员滥用职权。（四）相关机构或人员串通舞弊。"},{"article_no":30,"chapter_no":"第五章信息与沟通","chapter_name":"6","content":"第四十三条 企业应当建立举报投诉制度和举报人保护制度，设置举报专线，明确举报投诉处理程序、办理时限和办结要求，确保举报、投诉成为企业有效掌握信息的重要途径。"}]}]},{"id":105,"name":"企业内部控制评价指引","doc_no":"财会〔2010〕11号","level":"规范性文件","issuing_org":"财政部、证监会、审计署、银监会、保监会","publish_date":"2010-04-15","amend_date":null,"status":"现行有效","bbbs":null,"source":"财政部官网（会计资格评价中心）","official_url":"http://kzp.mof.gov.cn/infor.jsp?infoid=289","effective_date":"2011-01-01","preamble":"（2010年4月15日 财政部等五部委以财会〔2010〕11号印发《企业内部控制配套指引》，本指引为其组成部分 自2011年1月1日起在境内外同时上市的公司施行，2012年1月1日起扩大到沪深主板）","chapters":[{"name":"4","articles":[{"article_no":1,"chapter_no":"第一章总则","chapter_name":"4","content":"第一条 为了促进企业全面评价内部控制的设计与运行情况，规范内部控制评价程序和评价报告，揭示和防范风险，根据有关法律法规和《企业内部控制基本规范》，制定本指引。"},{"article_no":2,"chapter_no":"第一章总则","chapter_name":"4","content":"第二条 本指引所称内部控制评价，是指企业董事会或类似权力机构对内部控制的有效性进行全面评价、形成评价结论、出具评价报告的过程。"},{"article_no":3,"chapter_no":"第一章总则","chapter_name":"4","content":"第三条 企业实施内部控制评价至少应当遵循下列原则：（一）全面性原则。评价工作应当包括内部控制的设计与运行，涵盖企业及其所属单位的各种业务和事项。（二）重要性原则。评价工作应当在全面评价的基础上，关注重要业务单位、重大业务事项和高风险领域。（三）客观性原则。评价工作应当准确地揭示经营管理的风险状况，如实反映内部控制设计与运行的有效性。"},{"article_no":4,"chapter_no":"第一章总则","chapter_name":"4","content":"第四条 企业应当根据本评价指引，结合内部控制设计与运行的实际情况，制定具体的内部控制评价办法，规定评价的原则、内容、程序、方法和报告形式等，明确相关机构或岗位的职责权限，落实责任制，按照规定的办法、程序和要求，有序开展内部控制评价工作。企业董事会应当对内部控制评价报告的真实性负责。"}]},{"name":"7","articles":[{"article_no":5,"chapter_no":"第二章内部控制评价的内容","chapter_name":"7","content":"第五条 企业应当根据《企业内部控制基本规范》、应用指引以及本企业的内部控制制度，围绕内部环境、风险评估、控制活动、信息与沟通、内部监督等要素，确定内部控制评价的具体内容，对内部控制设计与运行情况进行全面评价。"},{"article_no":6,"chapter_no":"第二章内部控制评价的内容","chapter_name":"7","content":"第六条 企业组织开展内部环境评价，应当以组织架构、发展战略、人力资源、企业文化、社会责任等应用指引为依据，结合本企业的内部控制制度，对内部环境的设计及实际运行情况进行认定和评价。"},{"article_no":7,"chapter_no":"第二章内部控制评价的内容","chapter_name":"7","content":"第七条 企业组织开展风险评估机制评价，应当以《企业内部控制基本规范》有关风险评估的要求，以及各项应用指引中所列主要风险为依据，结合本企业的内部控制制度，对日常经营管理过程中的风险识别、风险分析、应对策略等进行认定和评价。"},{"article_no":8,"chapter_no":"第二章内部控制评价的内容","chapter_name":"7","content":"第八条 企业组织开展控制活动评价，应当以《企业内部控制基本规范》和各项应用指引中的控制措施为依据，结合本企业的内部控制制度，对相关控制措施的设计和运行情况进行认定和评价。"},{"article_no":9,"chapter_no":"第二章内部控制评价的内容","chapter_name":"7","content":"第九条 企业组织开展信息与沟通评价，应当以内部信息传递、财务报告、信息系统等相关应用指引为依据，结合本企业的内部控制制度，对信息收集、处理和传递的及时性、反舞弊机制的健全性、财务报告的真实性、信息系统的安全性，以及利用信息系统实施内部控制的有效性等进行认定和评价。"},{"article_no":10,"chapter_no":"第二章内部控制评价的内容","chapter_name":"7","content":"第十条 企业组织开展内部监督评价，应当以《企业内部控制基本规范》有关内部监督的要求，以及各项应用指引中有关日常管控的规定为依据，结合本企业的内部控制制度，对内部监督机制的有效性进行认定和评价，重点关注监事会、审计委员会、内部审计机构等是否在内部控制设计和运行中有效发挥监督作用。"},{"article_no":11,"chapter_no":"第二章内部控制评价的内容","chapter_name":"7","content":"第十一条 内部控制评价工作应当形成工作底稿，详细记录企业执行评价工作的内容，包括评价要素、主要风险点、采取的控制措施、有关证据资料以及认定结果等。评价工作底稿应当设计合理、证据充分、简便易行、便于操作。"}]},{"name":"6","articles":[{"article_no":12,"chapter_no":"第三章内部控制评价的程序","chapter_name":"6","content":"第十二条 （六）内部控制缺陷及其认定情况。（七）内部控制缺陷的整改情况及重大缺陷拟采取的整改措施。（八）内部控制有效性的结论。"},{"article_no":13,"chapter_no":"第三章内部控制评价的程序","chapter_name":"6","content":"第二十三条 企业应当根据年度内部控制评价结果，结合内部控制评价工作底稿和内部控制缺陷汇总表等资料，按照规定的程序和要求，及时编制内部控制评价报告。"},{"article_no":14,"chapter_no":"第三章内部控制评价的程序","chapter_name":"6","content":"第二十四条 内部控制评价报告应当报经董事会或类似权力机构批准后对外披露或报送相关部门。企业内部控制评价部门应当关注自内部控制评价报告基准日至内部控制评价报告发出日之间是否发生影响内部控制有效性的因素，并根据其性质和影响程度对评价结论进行相应调整。"},{"article_no":15,"chapter_no":"第三章内部控制评价的程序","chapter_name":"6","content":"第二十五条 企业内部控制审计报告应当与内部控制评价报告同时对外披露或报送。"},{"article_no":16,"chapter_no":"第三章内部控制评价的程序","chapter_name":"6","content":"第二十六条 企业应当以12月31日作为年度内部控制评价报告的基准日。内部控制评价报告应于基准日后4个月内报出。"},{"article_no":17,"chapter_no":"第三章内部控制评价的程序","chapter_name":"6","content":"第二十七条 企业应当建立内部控制评价工作档案管理制度。内部控制评价的有关文件资料、工作底稿和证明材料等应当妥善保管。"}]}]},{"id":117,"name":"中国共产党章程","doc_no":"","level":"党内法规","issuing_org":"中国共产党第二十次全国代表大会","publish_date":"2022-10-22","amend_date":null,"status":"现行有效","bbbs":null,"source":"官方网站","official_url":"https://www.12371.cn/2022/10/26/ARTI1666788342244946.shtml","effective_date":"2022-10-22","preamble":"2022年10月22日中国共产党第二十次全国代表大会通过","chapters":[{"name":"党员","articles":[{"article_no":1,"chapter_no":1,"chapter_name":"党员","content":"第一条　年满十八岁的中国工人、农民、军人、知识分子和其他社会阶层的先进分子，承认党的纲领和章程，愿意参加党的一个组织并在其中积极工作、执行党的决议和按期交纳党费的，可以申请加入中国共产党。"},{"article_no":2,"chapter_no":1,"chapter_name":"党员","content":"第二条　中国共产党党员是中国工人阶级的有共产主义觉悟的先锋战士。中国共产党党员必须全心全意为人民服务，不惜牺牲个人的一切，为实现共产主义奋斗终身。中国共产党党员永远是劳动人民的普通一员。除了法律和政策规定范围内的个人利益和工作职权以外，所有共产党员都不得谋求任何私利和特权。"},{"article_no":3,"chapter_no":1,"chapter_name":"党员","content":"第三条　党员必须履行下列义务：（一）认真学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想，学习党的路线、方针、政策和决议，学习党的基本知识和党的历史，学习科学、文化、法律和业务知识，努力提高为人民服务的本领。（二）增强“四个意识”、坚定“四个自信”、做到“两个维护”，贯彻执行党的基本路线和各项方针、政策，带头参加改革开放和社会主义现代化建设，带动群众为经济发展和社会进步艰苦奋斗，在生产、工作、学习和社会生活中起先锋模范作用。（三）坚持党和人民的利益高于一切，个人利益服从党和人民的利益，吃苦在前，享受在后，克己奉公，多做贡献。（四）自觉遵守党的纪律，首先是党的政治纪律和政治规矩，模范遵守国家的法律法规，严格保守党和国家的秘密，执行党的决定，服从组织分配，积极完成党的任务。（五）维护党的团结和统一，对党忠诚老实，言行一致，坚决反对一切派别组织和小集团活动，反对阳奉阴违的两面派行为和一切阴谋诡计。（六）切实开展批评和自我批评，勇于揭露和纠正违反党的原则的言行和工作中的缺点、错误，坚决同消极腐败现象作斗争。（七）密切联系群众，向群众宣传党的主张，遇事同群众商量，及时向党反映群众的意见和要求，维护群众的正当利益。（八）发扬社会主义新风尚，带头实践社会主义核心价值观和社会主义荣辱观，提倡共产主义道德，弘扬中华民族传统美德，为了保护国家和人民的利益，在一切困难和危险的时刻挺身而出，英勇斗争，不怕牺牲。"},{"article_no":4,"chapter_no":1,"chapter_name":"党员","content":"第四条　党员享有下列权利：（一）参加党的有关会议，阅读党的有关文件，接受党的教育和培训。（二）在党的会议上和党报党刊上，参加关于党的政策问题的讨论。（三）对党的工作提出建议和倡议。（四）在党的会议上有根据地批评党的任何组织和任何党员，向党负责地揭发、检举党的任何组织和任何党员违法乱纪的事实，要求处分违法乱纪的党员，要求罢免或撤换不称职的干部。（五）行使表决权、选举权，有被选举权。（六）在党组织讨论决定对党员的党纪处分或作出鉴定时，本人有权参加和进行申辩，其他党员可以为他作证和辩护。（七）对党的决议和政策如有不同意见，在坚决执行的前提下，可以声明保留，并且可以把自己的意见向党的上级组织直至中央提出。（八）向党的上级组织直至中央提出请求、申诉和控告，并要求有关组织给以负责的答复。党的任何一级组织直至中央都无权剥夺党员的上述权利。"},{"article_no":5,"chapter_no":1,"chapter_name":"党员","content":"第五条　发展党员，必须把政治标准放在首位，经过党的支部，坚持个别吸收的原则。申请入党的人，要填写入党志愿书，要有两名正式党员作介绍人，要经过支部大会通过和上级党组织批准，并且经过预备期的考察，才能成为正式党员。介绍人要认真了解申请人的思想、品质、经历和工作表现，向他解释党的纲领和党的章程，说明党员的条件、义务和权利，并向党组织作出负责的报告。党的支部委员会对申请入党的人，要注意征求党内外有关群众的意见，进行严格的审查，认为合格后再提交支部大会讨论。上级党组织在批准申请人入党以前，要派人同他谈话，作进一步的了解，并帮助他提高对党的认识。在特殊情况下，党的中央和省、自治区、直辖市委员会可以直接接收党员。"},{"article_no":6,"chapter_no":1,"chapter_name":"党员","content":"第六条　预备党员必须面向党旗进行入党宣誓。誓词如下：我志愿加入中国共产党，拥护党的纲领，遵守党的章程，履行党员义务，执行党的决定，严守党的纪律，保守党的秘密，对党忠诚，积极工作，为共产主义奋斗终身，随时准备为党和人民牺牲一切，永不叛党。"},{"article_no":7,"chapter_no":1,"chapter_name":"党员","content":"第七条　预备党员的预备期为一年。党组织对预备党员应当认真教育和考察。预备党员的义务同正式党员一样。预备党员的权利，除了没有表决权、选举权和被选举权以外，也同正式党员一样。预备党员预备期满，党的支部应当及时讨论他能否转为正式党员。认真履行党员义务，具备党员条件的，应当按期转为正式党员；需要继续考察和教育的，可以延长预备期，但不能超过一年；不履行党员义务，不具备党员条件的，应当取消预备党员资格。预备党员转为正式党员，或延长预备期，或取消预备党员资格，都应当经支部大会讨论通过和上级党组织批准。预备党员的预备期，从支部大会通过他为预备党员之日算起。党员的党龄，从预备期满转为正式党员之日算起。"},{"article_no":8,"chapter_no":1,"chapter_name":"党员","content":"第八条　每个党员，不论职务高低，都必须编入党的一个支部、小组或其他特定组织，参加党的组织生活，接受党内外群众的监督。党员领导干部还必须参加党委、党组的民主生活会。不允许有任何不参加党的组织生活、不接受党内外群众监督的特殊党员。"},{"article_no":9,"chapter_no":1,"chapter_name":"党员","content":"第九条　党员有退党的自由。党员要求退党，应当经支部大会讨论后宣布除名，并报上级党组织备案。党员缺乏革命意志，不履行党员义务，不符合党员条件，党的支部应当对他进行教育，要求他限期改正；经教育仍无转变的，应当劝他退党。劝党员退党，应当经支部大会讨论决定，并报上级党组织批准。如被劝告退党的党员坚持不退，应当提交支部大会讨论，决定把他除名，并报上级党组织批准。党员如果没有正当理由，连续六个月不参加党的组织生活，或不交纳党费，或不做党所分配的工作，就被认为是自行脱党。支部大会应当决定把这样的党员除名，并报上级党组织批准。"}]},{"name":"党的组织制度","articles":[{"article_no":10,"chapter_no":2,"chapter_name":"党的组织制度","content":"第十条　党是根据自己的纲领和章程，按照民主集中制组织起来的统一整体。党的民主集中制的基本原则是：（一）党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会。（二）党的各级领导机关，除它们派出的代表机关和在非党组织中的党组外，都由选举产生。（三）党的最高领导机关，是党的全国代表大会和它所产生的中央委员会。党的地方各级领导机关，是党的地方各级代表大会和它们所产生的委员会。党的各级委员会向同级的代表大会负责并报告工作。（四）党的上级组织要经常听取下级组织和党员群众的意见，及时解决他们提出的问题。党的下级组织既要向上级组织请示和报告工作，又要独立负责地解决自己职责范围内的问题。上下级组织之间要互通情报、互相支持和互相监督。党的各级组织要按规定实行党务公开，使党员对党内事务有更多的了解和参与。（五）党的各级委员会实行集体领导和个人分工负责相结合的制度。凡属重大问题都要按照集体领导、民主集中、个别酝酿、会议决定的原则，由党的委员会集体讨论，作出决定；委员会成员要根据集体的决定和分工，切实履行自己的职责。（六）党禁止任何形式的个人崇拜。要保证党的领导人的活动处于党和人民的监督之下，同时维护一切代表党和人民利益的领导人的威信。"},{"article_no":11,"chapter_no":2,"chapter_name":"党的组织制度","content":"第十一条　党的各级代表大会的代表和委员会的产生，要体现选举人的意志。选举采用无记名投票的方式。候选人名单要由党组织和选举人充分酝酿讨论。可以直接采用候选人数多于应选人数的差额选举办法进行正式选举。也可以先采用差额选举办法进行预选，产生候选人名单，然后进行正式选举。选举人有了解候选人情况、要求改变候选人、不选任何一个候选人和另选他人的权利。任何组织和个人不得以任何方式强迫选举人选举或不选举某个人。党的地方各级代表大会和基层代表大会的选举，如果发生违反党章的情况，上一级党的委员会在调查核实后，应作出选举无效和采取相应措施的决定，并报再上一级党的委员会审查批准，正式宣布执行。党的各级代表大会代表实行任期制。"},{"article_no":12,"chapter_no":2,"chapter_name":"党的组织制度","content":"第十二条　党的中央和地方各级委员会在必要时召集代表会议，讨论和决定需要及时解决的重大问题。代表会议代表的名额和产生办法，由召集代表会议的委员会决定。"},{"article_no":13,"chapter_no":2,"chapter_name":"党的组织制度","content":"第十三条　凡是成立党的新组织，或是撤销党的原有组织，必须由上级党组织决定。在党的地方各级代表大会和基层代表大会闭会期间，上级党的组织认为有必要时，可以调动或者指派下级党组织的负责人。党的中央和地方各级委员会可以派出代表机关。"},{"article_no":14,"chapter_no":2,"chapter_name":"党的组织制度","content":"第十四条　党的中央和省、自治区、直辖市委员会实行巡视制度，在一届任期内，对所管理的地方、部门、企事业单位党组织实现巡视全覆盖。中央有关部委和国家机关部门党组（党委）根据工作需要，开展巡视工作。党的市（地、州、盟）和县（市、区、旗）委员会建立巡察制度。"},{"article_no":15,"chapter_no":2,"chapter_name":"党的组织制度","content":"第十五条　党的各级领导机关，对同下级组织有关的重要问题作出决定时，在通常情况下，要征求下级组织的意见。要保证下级组织能够正常行使他们的职权。凡属应由下级组织处理的问题，如无特殊情况，上级领导机关不要干预。"},{"article_no":16,"chapter_no":2,"chapter_name":"党的组织制度","content":"第十六条　有关全国性的重大政策问题，只有党中央有权作出决定，各部门、各地方的党组织可以向中央提出建议，但不得擅自作出决定和对外发表主张。党的下级组织必须坚决执行上级组织的决定。下级组织如果认为上级组织的决定不符合本地区、本部门的实际情况，可以请求改变；如果上级组织坚持原决定，下级组织必须执行，并不得公开发表不同意见，但有权向再上一级组织报告。党的各级组织的报刊和其他宣传工具，必须宣传党的路线、方针、政策和决议。"},{"article_no":17,"chapter_no":2,"chapter_name":"党的组织制度","content":"第十七条　党组织讨论决定问题，必须执行少数服从多数的原则。决定重要问题，要进行表决。对于少数人的不同意见，应当认真考虑。如对重要问题发生争论，双方人数接近，除了在紧急情况下必须按多数意见执行外，应当暂缓作出决定，进一步调查研究，交换意见，下次再表决；在特殊情况下，也可将争论情况向上级组织报告，请求裁决。党员个人代表党组织发表重要主张，如果超出党组织已有决定的范围，必须提交所在的党组织讨论决定，或向上级党组织请示。任何党员不论职务高低，都不能个人决定重大问题；如遇紧急情况，必须由个人作出决定时，事后要迅速向党组织报告。不允许任何领导人实行个人专断和把个人凌驾于组织之上。"},{"article_no":18,"chapter_no":2,"chapter_name":"党的组织制度","content":"第十八条　党的中央、地方和基层组织，都必须重视党的建设，经常讨论和检查党的宣传工作、教育工作、组织工作、纪律检查工作、群众工作、统一战线工作等，注意研究党内外的思想政治状况。"}]},{"name":"党的中央组织","articles":[{"article_no":19,"chapter_no":3,"chapter_name":"党的中央组织","content":"第十九条　党的全国代表大会每五年举行一次，由中央委员会召集。中央委员会认为有必要，或者有三分之一以上的省一级组织提出要求，全国代表大会可以提前举行；如无非常情况，不得延期举行。全国代表大会代表的名额和选举办法，由中央委员会决定。"},{"article_no":20,"chapter_no":3,"chapter_name":"党的中央组织","content":"第二十条　党的全国代表大会的职权是：（一）听取和审查中央委员会的报告；（二）审查中央纪律检查委员会的报告；（三）讨论并决定党的重大问题；（四）修改党的章程；（五）选举中央委员会；（六）选举中央纪律检查委员会。"},{"article_no":21,"chapter_no":3,"chapter_name":"党的中央组织","content":"第二十一条　党的全国代表会议的职权是：讨论和决定重大问题；调整和增选中央委员会、中央纪律检查委员会的部分成员。调整和增选中央委员及候补中央委员的数额，不得超过党的全国代表大会选出的中央委员及候补中央委员各自总数的五分之一。"},{"article_no":22,"chapter_no":3,"chapter_name":"党的中央组织","content":"第二十二条　党的中央委员会每届任期五年。全国代表大会如提前或延期举行，它的任期相应地改变。中央委员会委员和候补委员必须有五年以上的党龄。中央委员会委员和候补委员的名额，由全国代表大会决定。中央委员会委员出缺，由中央委员会候补委员按照得票多少依次递补。中央委员会全体会议由中央政治局召集，每年至少举行一次。中央政治局向中央委员会全体会议报告工作，接受监督。在全国代表大会闭会期间，中央委员会执行全国代表大会的决议，领导党的全部工作，对外代表中国共产党。"},{"article_no":23,"chapter_no":3,"chapter_name":"党的中央组织","content":"第二十三条　党的中央政治局、中央政治局常务委员会和中央委员会总书记，由中央委员会全体会议选举。中央委员会总书记必须从中央政治局常务委员会委员中产生。中央政治局和它的常务委员会在中央委员会全体会议闭会期间，行使中央委员会的职权。中央书记处是中央政治局和它的常务委员会的办事机构；成员由中央政治局常务委员会提名，中央委员会全体会议通过。中央委员会总书记负责召集中央政治局会议和中央政治局常务委员会会议，并主持中央书记处的工作。党的中央军事委员会组成人员由中央委员会决定，中央军事委员会实行主席负责制。每届中央委员会产生的中央领导机构和中央领导人，在下届全国代表大会开会期间，继续主持党的经常工作，直到下届中央委员会产生新的中央领导机构和中央领导人为止。"},{"article_no":24,"chapter_no":3,"chapter_name":"党的中央组织","content":"第二十四条　中国人民解放军的党组织，根据中央委员会的指示进行工作。中央军事委员会负责军队中党的工作和政治工作，对军队中党的组织体制和机构作出规定。"}]},{"name":"党的地方组织","articles":[{"article_no":25,"chapter_no":4,"chapter_name":"党的地方组织","content":"第二十五条　党的省、自治区、直辖市的代表大会，设区的市和自治州的代表大会，县（旗）、自治县、不设区的市和市辖区的代表大会，每五年举行一次。党的地方各级代表大会由同级党的委员会召集。在特殊情况下，经上一级委员会批准，可以提前或延期举行。党的地方各级代表大会代表的名额和选举办法，由同级党的委员会决定，并报上一级党的委员会批准。"},{"article_no":26,"chapter_no":4,"chapter_name":"党的地方组织","content":"第二十六条　党的地方各级代表大会的职权是：（一）听取和审查同级委员会的报告；（二）审查同级纪律检查委员会的报告；（三）讨论本地区范围内的重大问题并作出决议；（四）选举同级党的委员会，选举同级党的纪律检查委员会。"},{"article_no":27,"chapter_no":4,"chapter_name":"党的地方组织","content":"第二十七条　党的省、自治区、直辖市、设区的市和自治州的委员会，每届任期五年。这些委员会的委员和候补委员必须有五年以上的党龄。党的县（旗）、自治县、不设区的市和市辖区的委员会，每届任期五年。这些委员会的委员和候补委员必须有三年以上的党龄。党的地方各级代表大会如提前或延期举行，由它选举的委员会的任期相应地改变。党的地方各级委员会的委员和候补委员的名额，分别由上一级委员会决定。党的地方各级委员会委员出缺，由候补委员按照得票多少依次递补。党的地方各级委员会全体会议，每年至少召开两次。党的地方各级委员会在代表大会闭会期间，执行上级党组织的指示和同级党代表大会的决议，领导本地方的工作，定期向上级党的委员会报告工作。"},{"article_no":28,"chapter_no":4,"chapter_name":"党的地方组织","content":"第二十八条　党的地方各级委员会全体会议，选举常务委员会和书记、副书记，并报上级党的委员会批准。党的地方各级委员会的常务委员会，在委员会全体会议闭会期间，行使委员会职权；在下届代表大会开会期间，继续主持经常工作，直到新的常务委员会产生为止。党的地方各级委员会的常务委员会定期向委员会全体会议报告工作，接受监督。"},{"article_no":29,"chapter_no":4,"chapter_name":"党的地方组织","content":"第二十九条　党的地区委员会和相当于地区委员会的组织，是党的省、自治区委员会在几个县、自治县、市范围内派出的代表机关。它根据省、自治区委员会的授权，领导本地区的工作。"}]},{"name":"党的基层组织","articles":[{"article_no":30,"chapter_no":5,"chapter_name":"党的基层组织","content":"第三十条　企业、农村、机关、学校、医院、科研院所、街道社区、社会组织、人民解放军连队和其他基层单位，凡是有正式党员三人以上的，都应当成立党的基层组织。党的基层组织，根据工作需要和党员人数，经上级党组织批准，分别设立党的基层委员会、总支部委员会、支部委员会。基层委员会由党员大会或代表大会选举产生，总支部委员会和支部委员会由党员大会选举产生，提出委员候选人要广泛征求党员和群众的意见。"},{"article_no":31,"chapter_no":5,"chapter_name":"党的基层组织","content":"第三十一条　党的基层委员会、总支部委员会、支部委员会每届任期三年至五年。基层委员会、总支部委员会、支部委员会的书记、副书记选举产生后，应报上级党组织批准。"},{"article_no":32,"chapter_no":5,"chapter_name":"党的基层组织","content":"第三十二条　党的基层组织是党在社会基层组织中的战斗堡垒，是党的全部工作和战斗力的基础。它的基本任务是：（一）宣传和执行党的路线、方针、政策，宣传和执行党中央、上级组织和本组织的决议，充分发挥党员的先锋模范作用，积极创先争优，团结、组织党内外的干部和群众，努力完成本单位所担负的任务。（二）组织党员认真学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观、习近平新时代中国特色社会主义思想，推进“两学一做”学习教育、党史学习教育常态化制度化，学习党的路线、方针、政策和决议，学习党的基本知识，学习科学、文化、法律和业务知识。（三）对党员进行教育、管理、监督和服务，提高党员素质，坚定理想信念，增强党性，严格党的组织生活，开展批评和自我批评，维护和执行党的纪律，监督党员切实履行义务，保障党员的权利不受侵犯。加强和改进流动党员管理。（四）密切联系群众，经常了解群众对党员、党的工作的批评和意见，维护群众的正当权利和利益，做好群众的思想政治工作。（五）充分发挥党员和群众的积极性创造性，发现、培养和推荐他们中间的优秀人才，鼓励和支持他们在改革开放和社会主义现代化建设中贡献自己的聪明才智。（六）对要求入党的积极分子进行教育和培养，做好经常性的发展党员工作，重视在生产、工作第一线和青年中发展党员。（七）监督党员干部和其他任何工作人员严格遵守国家法律法规，严格遵守国家的财政经济法规和人事制度，不得侵占国家、集体和群众的利益。（八）教育党员和群众自觉抵制不良倾向，坚决同各种违纪违法行为作斗争。"},{"article_no":33,"chapter_no":5,"chapter_name":"党的基层组织","content":"第三十三条　街道、乡、镇党的基层委员会和村、社区党组织，统一领导本地区基层各类组织和各项工作，加强基层社会治理，支持和保证行政组织、经济组织和群众性自治组织充分行使职权。国有企业党委（党组）发挥领导作用，把方向、管大局、保落实，依照规定讨论和决定企业重大事项。国有企业和集体企业中党的基层组织，围绕企业生产经营开展工作。保证监督党和国家的方针、政策在本企业的贯彻执行；支持股东会、董事会、监事会和经理（厂长）依法行使职权；全心全意依靠职工群众，支持职工代表大会开展工作；参与企业重大问题的决策；加强党组织的自身建设，领导思想政治工作、精神文明建设、统一战线工作和工会、共青团、妇女组织等群团组织。非公有制经济组织中党的基层组织，贯彻党的方针政策，引导和监督企业遵守国家的法律法规，领导工会、共青团等群团组织，团结凝聚职工群众，维护各方的合法权益，促进企业健康发展。社会组织中党的基层组织，宣传和执行党的路线、方针、政策，领导工会、共青团等群团组织，教育管理党员，引领服务群众，推动事业发展。实行行政领导人负责制的事业单位中党的基层组织，发挥战斗堡垒作用。实行党委领导下的行政领导人负责制的事业单位中党的基层组织，对重大问题进行讨论和作出决定，同时保证行政领导人充分行使自己的职权。各级党和国家机关中党的基层组织，协助行政负责人完成任务，改进工作，对包括行政负责人在内的每个党员进行教育、管理、监督，不领导本单位的业务工作。"},{"article_no":34,"chapter_no":5,"chapter_name":"党的基层组织","content":"第三十四条　党支部是党的基础组织，担负直接教育党员、管理党员、监督党员和组织群众、宣传群众、凝聚群众、服务群众的职责。"}]},{"name":"党的干部","articles":[{"article_no":35,"chapter_no":6,"chapter_name":"党的干部","content":"第三十五条　党的干部是党的事业的骨干，是人民的公仆，要做到忠诚干净担当。党按照德才兼备、以德为先的原则选拔干部，坚持五湖四海、任人唯贤，坚持事业为上、公道正派，反对任人唯亲，努力实现干部队伍的革命化、年轻化、知识化、专业化。党重视教育、培训、选拔、考核和监督干部，特别是培养、选拔优秀年轻干部。积极推进干部制度改革。党重视培养、选拔女干部和少数民族干部。"},{"article_no":36,"chapter_no":6,"chapter_name":"党的干部","content":"第三十六条　党的各级领导干部必须信念坚定、为民服务、勤政务实、敢于担当、清正廉洁，模范地履行本章程第三条所规定的党员的各项义务，并且必须具备以下的基本条件：（一）具有履行职责所需要的马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观的水平，带头贯彻落实习近平新时代中国特色社会主义思想，努力用马克思主义的立场、观点、方法分析和解决实际问题，坚持讲学习、讲政治、讲正气，经得起各种风浪的考验。（二）具有共产主义远大理想和中国特色社会主义坚定信念，坚决执行党的基本路线和各项方针、政策，立志改革开放，献身现代化事业，在社会主义建设中艰苦创业，树立正确政绩观，做出经得起实践、人民、历史检验的实绩。（三）坚持解放思想，实事求是，与时俱进，开拓创新，认真调查研究，能够把党的方针、政策同本地区、本部门的实际相结合，卓有成效地开展工作，讲实话，办实事，求实效。（四）有强烈的革命事业心和政治责任感，有实践经验，有胜任领导工作的组织能力、文化水平和专业知识。（五）正确行使人民赋予的权力，坚持原则，依法办事，清正廉洁，勤政为民，以身作则，艰苦朴素，密切联系群众，坚持党的群众路线，自觉地接受党和群众的批评和监督，加强道德修养，讲党性、重品行、作表率，做到自重、自省、自警、自励，反对形式主义、官僚主义、享乐主义和奢靡之风，反对特权思想和特权现象，反对任何滥用职权、谋求私利的行为。（六）坚持和维护党的民主集中制，有民主作风，有全局观念，善于团结同志，包括团结同自己有不同意见的同志一道工作。"},{"article_no":37,"chapter_no":6,"chapter_name":"党的干部","content":"第三十七条　党员干部要善于同党外干部合作共事，尊重他们，虚心学习他们的长处。党的各级组织要善于发现和推荐有真才实学的党外干部担任领导工作，保证他们有职有权，充分发挥他们的作用。"},{"article_no":38,"chapter_no":6,"chapter_name":"党的干部","content":"第三十八条　党的各级领导干部，无论是由民主选举产生的，或是由领导机关任命的，他们的职务都不是终身的，都可以变动或解除。年龄和健康状况不适宜于继续担任工作的干部，应当按照国家的规定退、离休。"}]},{"name":"党的纪律","articles":[{"article_no":39,"chapter_no":7,"chapter_name":"党的纪律","content":"第三十九条　党的纪律是党的各级组织和全体党员必须遵守的行为规则，是维护党的团结统一、完成党的任务的保证。党组织必须严格执行和维护党的纪律，共产党员必须自觉接受党的纪律的约束。"},{"article_no":40,"chapter_no":7,"chapter_name":"党的纪律","content":"第四十条　党的纪律主要包括政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律。坚持惩前毖后、治病救人，执纪必严、违纪必究，抓早抓小、防微杜渐，按照错误性质和情节轻重，给以批评教育、责令检查、诫勉直至纪律处分。运用监督执纪“四种形态”，让“红红脸、出出汗”成为常态，党纪处分、组织调整成为管党治党的重要手段，严重违纪、严重触犯刑律的党员必须开除党籍。党内严格禁止用违反党章和国家法律的手段对待党员，严格禁止打击报复和诬告陷害。违反这些规定的组织或个人必须受到党的纪律和国家法律的追究。"},{"article_no":41,"chapter_no":7,"chapter_name":"党的纪律","content":"第四十一条　对党员的纪律处分有五种：警告、严重警告、撤销党内职务、留党察看、开除党籍。留党察看最长不超过两年。党员在留党察看期间没有表决权、选举权和被选举权。党员经过留党察看，确已改正错误的，应当恢复其党员的权利；坚持错误不改的，应当开除党籍。开除党籍是党内的最高处分。各级党组织在决定或批准开除党员党籍的时候，应当全面研究有关的材料和意见，采取十分慎重的态度。"},{"article_no":42,"chapter_no":7,"chapter_name":"党的纪律","content":"第四十二条　对党员的纪律处分，必须经过支部大会讨论决定，报党的基层委员会批准；如果涉及的问题比较重要或复杂，或给党员以开除党籍的处分，应分别不同情况，报县级或县级以上党的纪律检查委员会审查批准。在特殊情况下，县级和县级以上各级党的委员会和纪律检查委员会有权直接决定给党员以纪律处分。对党的中央委员会委员、候补委员，给以警告、严重警告处分，由中央纪律检查委员会常务委员会审议后，报党中央批准。对地方各级党的委员会委员、候补委员，给以警告、严重警告处分，应由上一级纪律检查委员会批准，并报它的同级党的委员会备案。对党的中央委员会和地方各级委员会的委员、候补委员，给以撤销党内职务、留党察看或开除党籍的处分，必须由本人所在的委员会全体会议三分之二以上的多数决定。在全体会议闭会期间，可以先由中央政治局和地方各级委员会常务委员会作出处理决定，待召开委员会全体会议时予以追认。对地方各级委员会委员和候补委员的上述处分，必须经过上级纪律检查委员会常务委员会审议，由这一级纪律检查委员会报同级党的委员会批准。严重触犯刑律的中央委员会委员、候补委员，由中央政治局决定开除其党籍；严重触犯刑律的地方各级委员会委员、候补委员，由同级委员会常务委员会决定开除其党籍。"},{"article_no":43,"chapter_no":7,"chapter_name":"党的纪律","content":"第四十三条　党组织对党员作出处分决定，应当实事求是地查清事实。处分决定所依据的事实材料和处分决定必须同本人见面，听取本人说明情况和申辩。如果本人对处分决定不服，可以提出申诉，有关党组织必须负责处理或者迅速转递，不得扣压。对于确属坚持错误意见和无理要求的人，要给以批评教育。"},{"article_no":44,"chapter_no":7,"chapter_name":"党的纪律","content":"第四十四条　党组织如果在维护党的纪律方面失职，必须问责。对于严重违犯党的纪律、本身又不能纠正的党组织，上一级党的委员会在查明核实后，应根据情节严重的程度，作出进行改组或予以解散的决定，并报再上一级党的委员会审查批准，正式宣布执行。"}]},{"name":"党的纪律检查机关","articles":[{"article_no":45,"chapter_no":8,"chapter_name":"党的纪律检查机关","content":"第四十五条　党的中央纪律检查委员会在党的中央委员会领导下进行工作。党的地方各级纪律检查委员会和基层纪律检查委员会在同级党的委员会和上级纪律检查委员会双重领导下进行工作。上级党的纪律检查委员会加强对下级纪律检查委员会的领导。党的各级纪律检查委员会每届任期和同级党的委员会相同。党的中央纪律检查委员会全体会议，选举常务委员会和书记、副书记，并报党的中央委员会批准。党的地方各级纪律检查委员会全体会议，选举常务委员会和书记、副书记，并由同级党的委员会通过，报上级党的委员会批准。党的基层委员会是设立纪律检查委员会，还是设立纪律检查委员，由它的上一级党组织根据具体情况决定。党的总支部委员会和支部委员会设纪律检查委员。党的中央和地方纪律检查委员会向同级党和国家机关全面派驻党的纪律检查组，按照规定向有关国有企业、事业单位派驻党的纪律检查组。纪律检查组组长参加驻在单位党的领导组织的有关会议。他们的工作必须受到该单位党的领导组织的支持。"},{"article_no":46,"chapter_no":8,"chapter_name":"党的纪律检查机关","content":"第四十六条　党的各级纪律检查委员会是党内监督专责机关，主要任务是：维护党的章程和其他党内法规，检查党的路线、方针、政策和决议的执行情况，协助党的委员会推进全面从严治党、加强党风建设和组织协调反腐败工作，推动完善党和国家监督体系。党的各级纪律检查委员会的职责是监督、执纪、问责，要经常对党员进行遵守纪律的教育，作出关于维护党纪的决定；对党的组织和党员领导干部履行职责、行使权力进行监督，受理处置党员群众检举举报，开展谈话提醒、约谈函询；检查和处理党的组织和党员违反党的章程和其他党内法规的比较重要或复杂的案件，决定或取消对这些案件中的党员的处分；进行问责或提出责任追究的建议；受理党员的控告和申诉；保障党员的权利。各级纪律检查委员会要把处理特别重要或复杂的案件中的问题和处理的结果，向同级党的委员会报告。党的地方各级纪律检查委员会和基层纪律检查委员会要同时向上级纪律检查委员会报告。各级纪律检查委员会发现同级党的委员会委员有违犯党的纪律的行为，可以先进行初步核实，如果需要立案检查的，应当在向同级党的委员会报告的同时向上一级纪律检查委员会报告；涉及常务委员的，报告上一级纪律检查委员会，由上一级纪律检查委员会进行初步核实，需要审查的，由上一级纪律检查委员会报它的同级党的委员会批准。"},{"article_no":47,"chapter_no":8,"chapter_name":"党的纪律检查机关","content":"第四十七条　上级纪律检查委员会有权检查下级纪律检查委员会的工作，并且有权批准和改变下级纪律检查委员会对于案件所作的决定。如果所要改变的该下级纪律检查委员会的决定，已经得到它的同级党的委员会的批准，这种改变必须经过它的上一级党的委员会批准。党的地方各级纪律检查委员会和基层纪律检查委员会如果对同级党的委员会处理案件的决定有不同意见，可以请求上一级纪律检查委员会予以复查；如果发现同级党的委员会或它的成员有违犯党的纪律的情况，在同级党的委员会不给予解决或不给予正确解决的时候，有权向上级纪律检查委员会提出申诉，请求协助处理。"}]},{"name":"党组","articles":[{"article_no":48,"chapter_no":9,"chapter_name":"党组","content":"第四十八条　在中央和地方国家机关、人民团体、经济组织、文化组织和其他非党组织的领导机关中，可以成立党组。党组发挥领导作用。党组的任务，主要是负责贯彻执行党的路线、方针、政策；加强对本单位党的建设的领导，履行全面从严治党责任；讨论和决定本单位的重大问题；做好干部管理工作；讨论和决定基层党组织设置调整和发展党员、处分党员等重要事项；团结党外干部和群众，完成党和国家交给的任务；领导机关和直属单位党组织的工作。"},{"article_no":49,"chapter_no":9,"chapter_name":"党组","content":"第四十九条　党组的成员，由批准成立党组的党组织决定。党组设书记，必要时还可以设副书记。党组必须服从批准它成立的党组织领导。"},{"article_no":50,"chapter_no":9,"chapter_name":"党组","content":"第五十条　在对下属单位实行集中统一领导的国家工作部门和有关单位的领导机关中，可以建立党委，党委的产生办法、职权和工作任务，由中央另行规定。"}]},{"name":"党和共产主义青年团的关系","articles":[{"article_no":51,"chapter_no":10,"chapter_name":"党和共产主义青年团的关系","content":"第五十一条　中国共产主义青年团是中国共产党领导的先进青年的群团组织，是广大青年在实践中学习中国特色社会主义和共产主义的学校，是党的助手和后备军。共青团中央委员会受党中央委员会领导。共青团的地方各级组织受同级党的委员会领导，同时受共青团上级组织领导。"},{"article_no":52,"chapter_no":10,"chapter_name":"党和共产主义青年团的关系","content":"第五十二条　党的各级委员会要加强对共青团的领导，注意团的干部的选拔和培训。党要坚决支持共青团根据广大青年的特点和需要，生动活泼地、富于创造性地进行工作，充分发挥团的突击队作用和联系广大青年的桥梁作用。团的县级和县级以下各级委员会书记，企业事业单位的团委员会书记，是党员的，可以列席同级党的委员会和常务委员会的会议。"}]},{"name":"党徽党旗","articles":[{"article_no":53,"chapter_no":11,"chapter_name":"党徽党旗","content":"第五十三条　中国共产党党徽为镰刀和锤头组成的图案。"},{"article_no":54,"chapter_no":11,"chapter_name":"党徽党旗","content":"第五十四条　中国共产党党旗为旗面缀有金黄色党徽图案的红旗。"},{"article_no":55,"chapter_no":11,"chapter_name":"党徽党旗","content":"第五十五条　中国共产党的党徽党旗是中国共产党的象征和标志。党的各级组织和每一个党员都要维护党徽党旗的尊严。要按照规定制作和使用党徽党旗。"}]}]},{"id":119,"name":"关于新形势下党内政治生活的若干准则","doc_no":"","level":"党内法规","issuing_org":"中国共产党第十八届中央委员会第六次全体会议","publish_date":"2016-10-27","amend_date":null,"status":"现行有效","bbbs":null,"source":"官方网站","official_url":"https://jgdw.mof.gov.cn/zt/xjpxsdzgts/zyjs/202308/t20230817_3902823.htm","effective_date":"2016-10-27","preamble":"2016年10月27日中国共产党第十八届中央委员会第六次全体会议通过","chapters":[{"name":"全文","articles":[{"article_no":1,"chapter_no":null,"chapter_name":"","content":"一、坚定理想信念共产主义远大理想和中国特色社会主义共同理想，是中国共产党人的精神支柱和政治灵魂，也是保持党的团结统一的思想基础。必须高度重视思想政治建设，把坚定理想信念作为开展党内政治生活的首要任务。\n理想信念动摇是最危险的动摇，理想信念滑坡是最危险的滑坡。全党同志必须把对马克思主义的信仰、对社会主义和共产主义的信念作为毕生追求，在改造客观世界的同时不断改造主观世界，解决好世界观、人生观、价值观这个“总开关”问题，不断增强政治定力，自觉成为共产主义远大理想和中国特色社会主义共同理想的坚定信仰者和忠实实践者；必须坚定对中国特色社会主义的道路自信、理论自信、制度自信、文化自信。领导干部特别是高级干部要以实际行动让党员和群众感受到理想信念的强大力量。\n全体党员必须永远保持建党时中国共产党人的奋斗精神，把理想信念的坚定性体现在做好本职工作的过程中，自觉为推进中国特色社会主义事业而苦干实干，在胜利时和顺境中不骄傲不自满，在困难时和逆境中不消沉不动摇，经受住各种赞誉和诱惑考验，经受住各种风险和挑战考验，永葆共产党人政治本色。\n坚定理想信念，必须加强学习。思想理论上的坚定清醒是政治上坚定的前提。全党必须毫不动摇坚持马克思主义指导思想，党的各级组织必须坚持不懈抓好理论武装，广大党员、干部特别是高级干部必须自觉抓好学习、增强党性修养。把马克思主义理论作为必修课，认真学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观，认真学习习近平总书记系列重要讲话精神，认真学习党章党规，不断提高马克思主义思想觉悟和理论水平。系统掌握马克思主义基本原理，学会用马克思主义立场、观点、方法观察问题、分析问题、解决问题，特别是要聚焦现实问题，不断深化对共产党执政规律、社会主义建设规律、人类社会发展规律的认识。适应时代进步和事业发展要求，广泛学习经济、政治、文化、社会、生态文明以及哲学、历史、法律、科技、国防、国际等各方面知识，提高战略思维、创新思维、辩证思维、法治思维、底线思维能力，提高领导能力专业化水平。\n坚持和创新党内学习制度。以党委(党组)中心组学习等制度为主要抓手，各级党组织要定期开展集体学习。党员、干部每年要完成规定的学习任务，领导干部要定期参加党校学习。坚持开展党内集中学习教育。各级党组织要加强督促检查，把学习情况作为领导班子和领导干部考核的重要内容。坚持中央领导同志作专题报告制度。健全党内重大思想理论问题分析研究和情况通报制度，强化互联网思想理论引导，把深层次思想理论问题讲清楚，帮助党员、干部站稳政治立场，分清是非界限，坚决抵制错误思想侵蚀。"},{"article_no":2,"chapter_no":null,"chapter_name":"","content":"二、坚持党的基本路线党在社会主义初级阶段的基本路线是党和国家的生命线、人民的幸福线，也是党内政治生活正常开展的根本保证。必须全面贯彻执行党的基本路线，把以经济建设为中心同坚持四项基本原则、坚持改革开放这两个基本点统一于中国特色社会主义伟大实践，任何时候都不能有丝毫偏离和动摇。\n全党必须毫不动摇坚持以经济建设为中心，聚精会神抓好发展这个党执政兴国的第一要务，坚持以人民为中心的发展思想，统筹推进“五位一体”总体布局和协调推进“四个全面”战略布局，坚持创新、协调、绿色、开放、共享的发展理念，努力提高发展质量和效益，不断提高人民生活水平，为实现“两个一百年”奋斗目标、实现中华民族伟大复兴的中国梦打下坚实物质基础。\n全党必须毫不动摇坚持四项基本原则，根本是坚持党的领导，坚持中国特色社会主义道路、中国特色社会主义理论体系、中国特色社会主义制度、中国特色社会主义文化，做到头脑清醒、立场坚定，矢志不移坚持和发展中国特色社会主义。\n全党必须毫不动摇坚持改革开放，发挥群众首创精神，勇于自我革命，勇于推进理论创新、实践创新、制度创新、文化创新以及其他各方面创新，坚定不移实施对外开放基本国策，决不能安于现状、墨守成规。新形势下，党领导人民全面深化改革，是为了推动中国特色社会主义制度自我完善和发展，推进国家治理体系和治理能力现代化，既不走封闭僵化的老路、也不走改旗易帜的邪路。\n全党必须把坚持党的思想路线贯穿于执行党的基本路线全过程，坚持解放思想、实事求是、与时俱进、求真务实，坚持理论联系实际，一切从实际出发，在实践中检验真理和发展真理，既反对各种否定马克思主义的错误倾向，又破除对马克思主义的教条式理解。坚持从我国仍处于并将长期处于社会主义初级阶段这个基本国情出发，不断研究新情况、总结新经验、解决新问题，不断推进马克思主义中国化。\n全党必须坚决捍卫党的基本路线，对否定党的领导、否定我国社会主义制度、否定改革开放的言行，对歪曲、丑化、否定中国特色社会主义的言行，对歪曲、丑化、否定党的历史、中华人民共和国历史、人民军队历史的言行，对歪曲、丑化、否定党的领袖和英雄模范的言行，对一切违背、歪曲、否定党的基本路线的言行，必须旗帜鲜明反对和抵制。\n考察识别干部特别是高级干部必须首先看是否坚定不移贯彻党的基本路线。党员、干部特别是高级干部在大是大非面前不能态度暧昧，不能动摇基本政治立场，不能被错误言论所左右。当人民利益受到损害、党和国家形象受到破坏、党的执政地位受到威胁时，要挺身而出、亮明态度，主动坚决开展斗争。对在大是大非问题上没有立场、没有态度、无动于衷、置身事外，在错误言行面前不抵制、不斗争，明哲保身、当老好人等政治不合格的坚决不用，已在领导岗位的要坚决调整，情节严重的要严肃处理。"},{"article_no":3,"chapter_no":null,"chapter_name":"","content":"三、坚决维护党中央权威坚决维护党中央权威、保证全党令行禁止，是党和国家前途命运所系，是全国各族人民根本利益所在，也是加强和规范党内政治生活的重要目的。必须坚持党员个人服从党的组织，少数服从多数，下级组织服从上级组织，全党各个组织和全体党员服从党的全国代表大会和中央委员会，核心是全党各个组织和全体党员服从党的全国代表大会和中央委员会。\n坚持党的领导，首先是坚持党中央的集中统一领导。一个国家、一个政党，领导核心至关重要。全党必须牢固树立政治意识、大局意识、核心意识、看齐意识，自觉在思想上政治上行动上同党中央保持高度一致。党的各级组织、全体党员特别是高级干部都要向党中央看齐，向党的理论和路线方针政策看齐，向党中央决策部署看齐，做到党中央提倡的坚决响应、党中央决定的坚决执行、党中央禁止的坚决不做。\n涉及全党全国性的重大方针政策问题，只有党中央有权作出决定和解释。各部门各地方党组织和党员领导干部可以向党中央提出建议，但不得擅自作出决定和对外发表主张。对党中央作出的决议和制定的政策如有不同意见，在坚决执行的前提下，可以向党组织提出保留意见，也可以按组织程序把自己的意见向党的上级组织直至党中央提出。\n全党必须自觉服从党中央领导。全国人大、国务院、全国政协，中央纪律检查委员会，最高人民法院、最高人民检察院，中央和国家机关各部门，人民军队，各人民团体，各地方，各企事业单位、社会组织，其党组织都要不折不扣执行党中央决策部署。\n全党必须严格执行重大问题请示报告制度。全国人大常委会、国务院、全国政协，中央纪律检查委员会，最高人民法院、最高人民检察院，中央和国家机关各部门，各人民团体，各省、自治区、直辖市，其党组织要定期向党中央报告工作。研究涉及全局的重大事项或作出重大决定要及时向党中央请示报告，执行党中央重要决定的情况要专题报告。遇有突发性重大问题和工作中重大问题要及时向党中央请示报告，情况紧急必须临机处置的，要尽职尽力做好工作，并迅速报告。\n省、自治区、直辖市党委在党中央领导下开展工作，同级各个组织中的党组织和领导干部要自觉接受同级党委领导、向同级党委负责，重大事项和重要情况及时向同级党委请示报告。\n全党必须自觉防止和反对个人主义、分散主义、自由主义、本位主义。对党中央决策部署，任何党组织和任何党员都不准合意的执行、不合意的不执行，不准先斩后奏，更不准口是心非、阳奉阴违。属于部门和地方职权范围内的工作部署，要以贯彻党中央决策部署为前提，发挥积极性、主动性、创造性，但决不允许自行其是、各自为政，决不允许有令不行、有禁不止，决不允许搞上有政策、下有对策。"},{"article_no":4,"chapter_no":null,"chapter_name":"","content":"四、严明党的政治纪律纪律严明是全党统一意志、统一行动、步调一致前进的重要保障，是党内政治生活的重要内容。必须严明党的纪律，把纪律挺在前面，用铁的纪律从严治党。\n坚持纪律面前一律平等，遵守纪律没有特权，执行纪律没有例外，党内决不允许存在不受纪律约束的特殊组织和特殊党员。每一个党员对党的纪律都要心存敬畏、严格遵守，任何时候任何情况下都不能违反党的纪律。党的各级组织和全体党员要坚决同一切违反党的纪律的行为作斗争。\n政治纪律是党最根本、最重要的纪律，遵守党的政治纪律是遵守党的全部纪律的基础。全党特别是高级干部必须严格遵守党的政治纪律和政治规矩。党员不准散布违背党的理论和路线方针政策的言论，不准公开发表违背党中央决定的言论，不准泄露党和国家秘密，不准参与非法组织和非法活动，不准制造、传播政治谣言及丑化党和国家形象的言论。党员不准搞封建迷信，不准信仰宗教，不准参与邪教，不准纵容和支持宗教极端势力、民族分裂势力、暴力恐怖势力及其活动。\n党员、干部特别是高级干部不准在党内搞小山头、小圈子、小团伙，严禁在党内拉私人关系、培植个人势力、结成利益集团。对那些投机取巧、拉帮结派、搞团团伙伙的人，要严格防范，依纪依规处理。坚决防止野心家、阴谋家窃取党和国家权力。\n党的各级组织和全体党员必须对党忠诚老实、光明磊落，说老实话、办老实事、做老实人，如实向党反映和报告情况，反对搞两面派、做“两面人”，反对弄虚作假、虚报浮夸，反对隐瞒实情、报喜不报忧。领导机关和领导干部不准以任何理由和名义纵容、唆使、暗示或强迫下级说假话。凡因弄虚作假、隐瞒实情给党和人民事业造成重大损失的，凡因弄虚作假、隐瞒实情骗取荣誉、地位、奖励或其他利益的，凡因纵容、唆使、暗示或强迫下级弄虚作假、隐瞒实情的，都要依纪依规严肃问责追责。对坚持原则、敢于说真话的同志，要给予支持、保护、鼓励。\n党内不准搞拉拉扯扯、吹吹拍拍、阿谀奉承。对领导人的宣传要实事求是，禁止吹捧，禁止给领导人祝寿、送礼、发致敬函电，禁止在领导干部国内考察工作时组织迎送、张贴标语、敲锣打鼓、铺红地毯、举行宴会等。\n党的各级组织必须担负起执行和维护政治纪律和政治规矩的责任，对违反政治纪律的行为要坚决批评制止，不能听之任之。党的各级组织和纪律检查机关要加强纪律执行情况的监督和检查，坚决防止和纠正执行纪律宽松软的问题。"},{"article_no":5,"chapter_no":null,"chapter_name":"","content":"五、保持党同人民群众的血肉联系人民立场是党的根本政治立场，人民群众是党的力量源泉。我们党来自人民，失去人民拥护和支持，党就会失去根基。必须把坚持全心全意为人民服务的根本宗旨、保持党同人民群众的血肉联系作为加强和规范党内政治生活的根本要求。\n全党必须牢固树立人民群众是历史创造者的历史唯物主义观点，站稳群众立场，增进群众感情。党的各级组织、全体党员特别是各级领导机关和领导干部要贯彻党的群众路线，做到一切为了群众，一切依靠群众，从群众中来，到群众中去，为群众办实事、解难事，当好人民公仆。坚持问政于民、问需于民、问计于民，决不允许在群众面前自以为是、盛气凌人，决不允许当官做老爷、漠视群众疾苦，更不允许欺压群众、损害和侵占群众利益。改进和创新联系群众方法，建立和完善民意调查等制度，利用传统媒体和互联网等各种渠道了解社情民意，倾听群众呼声，密切党群干群关系，把对上负责和对下负责一致起来，着力实现好、维护好、发展好最广大人民根本利益。\n全党必须坚决反对形式主义、官僚主义、享乐主义和奢靡之风，领导干部特别是高级干部要以身作则。反对形式主义，重在解决作风飘浮、工作不实，文山会海、表面文章，贪图虚名、弄虚作假等问题。反对官僚主义，重在解决脱离实际、脱离群众，消极应付、推诿扯皮，作风霸道、迷恋特权等问题。反对享乐主义，重在解决追名逐利、贪图享受，讲究排场、玩物丧志等问题。反对奢靡之风，重在解决铺张浪费、挥霍无度，骄奢淫逸、腐化堕落等问题。坚持抓常、抓细、抓长，特别是要防范和查处各种隐性、变异的“四风”问题，把落实中央八项规定精神常态化、长效化。\n党的各级组织、全体党员特别是领导干部必须提高做群众工作能力，既服务群众又带领群众坚定不移贯彻落实党的理论和路线方针政策，把党的主张变为群众的自觉行动，引领群众听党话、跟党走。坚决反对命令主义，坚决反对“尾巴主义”，不允许为了个人政绩、选票和形象脱离实际随意决策、随便许愿。\n坚持领导干部调查研究、定期接待群众来访、同干部群众谈心、群众满意度测评等制度。各级领导干部必须深入实际、深入基层、深入群众，多到条件艰苦、情况复杂、矛盾突出的地方解决问题，千方百计为群众排忧解难。领导干部下基层要接地气，轻车简从，了解实情，督查落实，解决问题，坚决反对作秀、哗众取宠。对一切搞劳民伤财的“形象工程”和“政绩工程”的行为，要严肃问责追责，依纪依法处理。在应对重大安全事件、重大突发事件、重大自然灾害事件等事件中，领导干部必须深入一线、靠前指挥，及时协调解决突出问题，及时回应社会关切。\n党员、干部必须顾全大局，自觉维护社会和谐稳定，遇到涉及自身利益和局部利益的问题应该通过正常渠道向上级反映，积极主动做好化解社会矛盾、防控社会风险工作，不准组织、参与、纵容扰乱社会秩序的非法活动。"},{"article_no":6,"chapter_no":null,"chapter_name":"","content":"六、坚持民主集中制原则民主集中制是党的根本组织原则，是党内政治生活正常开展的重要制度保障。坚持集体领导制度，实行集体领导和个人分工负责相结合，是民主集中制的重要组成部分，必须始终坚持，任何组织和个人在任何情况下都不允许以任何理由违反这项制度。\n各级党委(党组)必须坚持集体领导制度。凡属重大问题，要按照集体领导、民主集中、个别酝酿、会议决定的原则，由集体讨论、按少数服从多数作出决定，不允许用其他形式取代党委及其常委会(或党组)的领导。落实党委常委会(或党组)议事规则和决策程序，健全常委会向全委会定期报告工作并接受监督制度，坚决反对和防止独断专行或各自为政，坚决反对和防止议而不决、决而不行、行而不实，坚决反对和防止以党委集体决策名义集体违规。各级党委(党组)要善于观大势、抓大事、管全局，及时发现和解决矛盾和难题，不上推下卸，不留后遗症。建立上级组织在作出同下级组织有关重要决策前征求下级组织意见的制度。\n领导班子成员必须增强全局观念和责任意识，在研究工作时充分发表意见，决策形成后一抓到底，不得违背集体决定自作主张、自行其是。坚决反对和纠正当面不说、背后乱说，会上不说、会后乱说，当面一套、背后一套等错误言行。坚持讲原则、讲规矩，共同维护坚持党性原则基础上的团结。\n党委(党组)主要负责同志必须发扬民主、善于集中、敢于担责。在研究讨论问题时要把自己当成班子中平等的一员，充分发扬民主，严格按程序决策、按规矩办事，注意听取不同意见，正确对待少数人意见，不能搞一言堂甚至家长制。支持班子成员在职责范围内独立负责开展工作，坚决防止和克服名为集体领导、实际上个人或少数人说了算，坚决防止和克服名为集体负责、实际上无人负责。\n领导班子成员必须坚决执行党组织决定，如有不同意见，可以保留或向上一级党组织提出，但在上级或本级党组织改变决定以前，除执行决定会立即引起严重后果等紧急情况外，必须无条件执行已作出的决定。\n领导班子成员分工按规定向上级党委报备，无正当理由、未向上级党委报备不得调整。领导干部要自觉服从组织分工安排，任何人都不能向组织讨价还价、不服从组织安排。领导干部不准把分管工作、分管领域和地方当作“私人领地”，不准搞独断专行。\n在党的工作和活动中，该以组织名义出面不能以个人名义出面，该由集体研究不能个人擅自表态，不允许用个人主张代替党组织的主张、用个人决定代替党组织的决定。"},{"article_no":7,"chapter_no":null,"chapter_name":"","content":"七、发扬党内民主和保障党员权利党内民主是党的生命，是党内政治生活积极健康的重要基础。要坚持和完善党内民主各项制度，提高党内民主质量，党内决策、执行、监督等工作必须执行党章党规确定的民主原则和程序，任何党组织和个人都不得压制党内民主、破坏党内民主。\n中央委员会、中央政治局、中央政治局常务委员会和党的各级委员会作出重大决策部署，必须深入开展调查研究，广泛听取各方面意见和建议，凝聚智慧和力量，做到科学决策、民主决策、依法决策。\n必须尊重党员主体地位、保障党员民主权利，落实党员知情权、参与权、选举权、监督权，保障全体党员平等享有党章规定的党员权利、履行党章规定的党员义务，坚持党内民主平等的同志关系，党内一律称同志。任何党组织和党员不得侵害党员民主权利。\n畅通党员参与讨论党内事务的途径，拓宽党员表达意见渠道，营造党内民主讨论的政治氛围。健全党内重大决策论证评估和征求意见等制度。党的各级组织对重大决策和重大问题应该采取多种方式征求党员意见，党员有权在党的会议上发表不同意见，对党的决议和政策如有不同意见，在坚决执行的前提下，可以声明保留，并且可以把自己的意见向党的上级组织直至党中央提出。推进党务公开，发展和用好党务公开新形式，使党员更好了解和参与党内事务。\n党内选举必须体现选举人意志，规范和完善选举制度规则。党的任何组织和个人不得以任何方式妨碍选举人依照规定自主行使选举权，坚决反对和防止侵犯党员选举权和被选举权的现象，坚决防止和查处拉票贿选等行为。\n坚持党的代表大会制度。未经批准不得提前或延期召开党的代表大会。落实党代表大会代表任期制，实行代表提案制，健全代表参与重大决策、参加重要干部推荐和民主评议、列席党委有关会议、联系党员群众等制度。更好发挥党的地方各级委员会及委员作用。健全党内情况通报制度、情况反映制度，畅通党员表达意见、要求撤换不称职基层党组织领导班子成员的渠道。按期进行党的基层委员会、总支部和支部委员会换届。\n党员有权向党负责地揭发、检举党的任何组织和任何党员违纪违法的事实，提倡实名举报。党员有权在党的会议上有根据地批评党的任何组织和任何党员。党组织既要严肃处理对举报者的歧视、刁难、压制行为特别是打击报复行为，又要严肃追查处理诬告陷害行为。对受到诽谤、诬告、严重失实举报的党员，党组织要及时为其澄清和正名。要保障党员申辩、申诉等权利。对执纪中的过错或违纪行为，要依规及时纠正、消除影响并追究有关组织和人员的责任。"},{"article_no":8,"chapter_no":null,"chapter_name":"","content":"八、坚持正确选人用人导向坚持正确选人用人导向，是严肃党内政治生活的组织保证。必须严格标准、健全制度、完善政策、规范程序，使选出来的干部组织放心、群众满意、干部服气。\n选拔任用干部必须坚持党章规定的干部条件，坚持德才兼备、以德为先，坚持五湖四海、任人唯贤，坚持信念坚定、为民服务、勤政务实、敢于担当、清正廉洁的好干部标准。把公道正派作为干部工作核心理念贯穿选人用人全过程，做到公道对待干部、公平评价干部、公正使用干部。\n选人用人必须强化党组织的领导和把关作用，落实干部选拔任用工作纪实制度，确保每个环节都规范操作。组织部门要严格按政策、原则、制度办事，实事求是考察评价干部，敢于为干部说公道话，敢于抵制选人用人中的违规行为，形成能者上、庸者下、劣者汰的选人用人导向。加强选人用人监督问责，对用人失察失误的严肃追究责任。\n党的各级组织必须自觉防范和纠正用人上的不正之风和种种偏向。坚决禁止跑官要官、买官卖官、拉票贿选等行为，坚决禁止向党伸手要职务、要名誉、要待遇行为，坚决禁止向党组织讨价还价、不服从组织决定的行为。坚决纠正唯票、唯分、唯生产总值、唯年龄等取人偏向，坚决克服由少数人在少数人中选人的倾向。领导干部要带头执行党的干部政策，不准任人唯亲、搞亲亲疏疏，不准封官许愿、跑风漏气、收买人心，不准个人为干部提拔任用打招呼、递条子。领导干部不得干预曾经工作生活过的地方、曾经工作过的单位和不属于自己分管领域的干部选拔任用工作，有关地方和单位党组织要抵制这种违反党的组织原则的行为。\n任何人都不准把党的干部当作私有财产，党内不准搞人身依附关系。领导干部特别是高级干部不能搞家长制，要求别人唯命是从，特别是不能要求下级办违反党纪国法的事情；下级应该抵制上级领导干部的这种要求并向更上级党组织直至党中央报告，不应该对上级领导干部无原则服从。规范和纯洁党内同志交往，领导干部对党员不能颐指气使，党员对领导干部不能阿谀奉承。\n干部是党的宝贵财富，必须既严格教育、严格管理、严格监督，又在政治上、思想上、工作上、生活上真诚关爱，鼓励干部干事创业、大胆作为。\n建立容错纠错机制，宽容干部在工作中特别是改革创新中的失误。坚持惩前毖后、治病救人，正确对待犯错误的干部，帮助其认识和改正错误。不得混淆干部所犯错误性质或夸大错误程度对干部作出不适当的处理，不得利用干部所犯错误泄私愤、打击报复。\n党的各级组织和领导干部必须牢记空谈误国、实干兴邦，践行正确政绩观，发扬钉钉子精神，力戒空谈，察实情、出实招、办实事、求实效，做到守土尽责。各级领导干部要无私无畏，做到面对矛盾敢于迎难而上，面对危险敢于挺身而出，面对失误敢于承担责任。党的各级组织要旗帜鲜明为敢于担当的干部担当，为敢于负责的干部负责。对不担当、不作为、敷衍塞责的干部要严肃批评，必要时给予组织处理或党纪处分；对失职渎职的要严肃问责，造成严重后果的要严肃追责，依纪依法处理。"},{"article_no":9,"chapter_no":null,"chapter_name":"","content":"九、严格党的组织生活制度党的组织生活是党内政治生活的重要内容和载体，是党组织对党员进行教育管理监督的重要形式。必须坚持党的组织生活各项制度，创新方式方法，增强党的组织生活活力。\n全体党员、干部特别是高级干部必须增强党的意识，时刻牢记自己第一身份是党员。任何党员都不能游离于党的组织之外，更不能凌驾于党的组织之上。每个党员无论职务高低，都要参加党的组织生活。党组织要严格执行组织生活制度，确保党的组织生活经常、认真、严肃。\n坚持“三会一课”制度。党员必须参加党员大会、党小组会和上党课，党支部要定期召开支部委员会会议。“三会一课”要突出政治学习和教育，突出党性锻炼，坚决防止表面化、形式化、娱乐化、庸俗化。领导干部要以普通党员身份参加所在党支部或党小组的组织生活，坚持党员领导干部讲党课制度。每个党员都要按规定自觉交纳党费，党费使用和管理要公开透明。\n坚持民主生活会和组织生活会制度。会前要广泛听取意见、深入谈心交心，会上要认真查摆问题、深刻剖析根源、明确整改方向，会后要逐一整改落实。上级党组织领导班子成员定期、随机参加下级党组织领导班子民主生活会和组织生活会，发现问题及时纠正。中央政治局带头开好民主生活会。\n坚持谈心谈话制度。党组织领导班子成员之间、班子成员和党员之间、党员和党员之间要开展经常性的谈心谈话，坦诚相见，交流思想，交换意见。领导干部要带头谈，也要接受党员、干部约谈。\n坚持对党员进行民主评议。督促党员对照党章规定的党员标准、对照入党誓词、联系个人实际进行党性分析，强化党员意识、增强党的观念、提高党性修养。对党性不强的党员，及时进行批评教育，限期改正；经教育仍无转变的，应劝其退党或除名。\n领导干部必须强化组织观念，工作中重大问题和个人有关事项必须按规定按程序向组织请示报告，离开岗位或工作所在地要事先向组织请示报告。对无正当理由不按时报告、不如实报告或隐瞒不报的，要严肃处理。"},{"article_no":10,"chapter_no":null,"chapter_name":"","content":"十、开展批评和自我批评批评和自我批评是我们党强身治病、保持肌体健康的锐利武器，也是加强和规范党内政治生活的重要手段。必须坚持不懈把批评和自我批评这个武器用好。\n批评和自我批评必须坚持实事求是，讲党性不讲私情、讲真理不讲面子，坚持“团结——批评——团结”，按照“照镜子、正衣冠、洗洗澡、治治病”的要求，严肃认真提意见，满腔热情帮同志，决不能把自我批评变成自我表扬、把相互批评变成相互吹捧。\n党员、干部必须严于自我解剖，对发现的问题要深入剖析原因，认真整改。对待批评要有则改之、无则加勉，不能搞无原则的纷争。\n批评必须出于公心，不主观武断，不发泄私愤。坚决反对事不关己、高高挂起，明知不对、少说为佳的庸俗哲学和好人主义，坚决克服文过饰非、知错不改等错误倾向。\n党的领导机关和领导干部对各种不同意见都必须听取，鼓励下级反映真实情况。党内工作会议的报告、讲话以及各类工作总结，上级机关和领导干部检查指导工作，既要讲成绩和经验，又要讲问题和不足；既要注重解决问题，又要从问题中反思自身工作和领导责任。\n领导干部特别是高级干部必须带头从谏如流、敢于直言，以批评和自我批评的示范行动引导党员、干部打消自我批评怕丢面子、批评上级怕穿小鞋、批评同级怕伤和气、批评下级怕丢选票等思想顾虑。把发现和解决自身问题的能力作为考核评价领导班子的重要依据。"},{"article_no":11,"chapter_no":null,"chapter_name":"","content":"十一、加强对权力运行的制约和监督监督是权力正确运行的根本保证，是加强和规范党内政治生活的重要举措。必须加强对领导干部的监督，党内不允许有不受制约的权力，也不允许有不受监督的特殊党员。\n完善权力运行制约和监督机制，形成有权必有责、用权必担责、滥权必追责的制度安排。实行权力清单制度，公开权力运行过程和结果，健全不当用权问责机制，把权力关进制度笼子，让权力在阳光下运行。\n党的各级组织和领导干部必须在宪法法律范围内活动，增强法治意识、弘扬法治精神，自觉按法定权限、规则、程序办事，决不能以言代法、以权压法、徇私枉法，决不能违规干预司法。\n营造党内民主监督环境，畅通党内民主监督渠道。党的各级组织和全体党员要增强监督意识，既履行监督责任，又接受各方面监督。\n党内监督必须突出党的领导机关和领导干部特别是主要领导干部。领导干部要正确对待监督，主动接受监督，习惯在监督下开展工作，决不能拒绝监督、逃避监督。\n领导干部特别是高级干部必须加强自律、慎独慎微，自觉检查和及时纠正在行使权力、廉政勤政方面存在的问题，做到可以行使的权力按规则正确行使，该由上级组织行使的权力下级组织不能行使，该由领导班子集体行使的权力班子成员个人不能擅自行使，不该由自己行使的权力决不能行使。\n对涉及违纪违法行为的举报，对党员反映的问题，任何党组织和领导干部都不准隐瞒不报、拖延不办。涉及所反映问题的领导干部应该回避，不准干预或插手组织调查。\n党员、干部反映他人的问题，应该出于党性，通过党内正常渠道实名进行，不准散布小道消息，不准散发匿名信，不准诬告陷害等。对通过正常渠道反映问题的党员，任何组织和个人都不准打击报复，不准擅自进行追查，不准采取调离工作岗位、降格使用等惩罚措施。\n坚持授权者要负责监督，发现问题要及时处置。强化上级组织对下级组织特别是主要领导干部行使权力的监督，防止权力失控和滥用。\n对党组织和党员、干部行使权力进行监督，必须依纪依法进行。纪检监察、司法机关严格依纪依法按程序对涉嫌严重违纪违法行为进行调查。任何组织和个人不得自行决定或受指使对党员、干部采取非法调查手段。对违反规定的，要严肃追究纪律和法律责任。"},{"article_no":12,"chapter_no":null,"chapter_name":"","content":"十二、保持清正廉洁的政治本色建设廉洁政治，坚决反对腐败，是加强和规范党内政治生活的重要任务。必须筑牢拒腐防变的思想防线和制度防线，着力构建不敢腐、不能腐、不想腐的体制机制，保持党的肌体健康和队伍纯洁。\n各级领导干部必须严以修身、严以用权、严以律己，谋事要实、创业要实、做人要实，经得起权力、金钱、美色考验，用党和人民赋予的权力为人民服务。\n领导干部特别是高级干部必须带头践行社会主义核心价值观，继承和发扬党的优良传统和作风，弘扬中华民族传统美德，讲修养、讲道德、讲诚信、讲廉耻，养成共产党人的高风亮节，自觉远离低级趣味。\n各级领导干部是人民公仆，没有搞特殊化的权利。中央政治局要带头执行中央八项规定。各级领导干部特别是高级干部要坚持立党为公、执政为民，坚持公私分明、先公后私、克己奉公，带头保持谦虚、谨慎、不骄、不躁的作风，保持艰苦奋斗的作风，带头执行廉洁自律准则，自觉同特权思想和特权现象作斗争，不准利用权力为自己和他人谋取私利，禁止违反财经制度批钱批物批项目，禁止用各种借口或巧立名目侵占、挥霍国家和集体财物，禁止违反规定提高干部待遇标准。\n领导干部特别是高级干部必须注重家庭、家教、家风，教育管理好亲属和身边工作人员。严格执行领导干部个人有关事项报告制度，进一步规范领导干部配偶子女从业行为。禁止利用职权或影响力为家属亲友谋求特殊照顾，禁止领导干部家属亲友插手领导干部职权范围内的工作、插手人事安排。各级领导班子和领导干部对来自领导干部家属亲友的违规干预行为要坚决抵制，并将有关情况报告党组织。\n全体党员、干部特别是高级干部必须拒腐蚀、永不沾，坚决同消极腐败现象作斗争，坚决抵制潜规则，自觉净化社交圈、生活圈、朋友圈，决不能把商品交换那一套搬到党内政治生活和工作中来。党的各级组织要担负起反腐倡廉政治责任，坚持有腐必反、有贪必肃，坚持“老虎”、“苍蝇”一起打，坚持无禁区、全覆盖、零容忍，党内决不允许有腐败分子藏身之地。\n加强和规范党内政治生活是全党的共同任务，必须全党一起动手。各级党委(党组)要全面履行加强和规范党内政治生活的领导责任，着力解决突出问题，建立健全党内政治生活制度体系，把加强和规范党内政治生活各项任务落到实处。深入开展党内政治生活准则宣传教育，把党内政治生活准则列为党员、干部教育培训的必修内容。\n落实党委主体责任和纪委监督责任，强化责任追究。党委(党组)主要负责人要认真履行第一责任人责任。党的各级组织要强化对党内政治生活准则落实情况的督促检查，建立健全问责机制，上级党组织要加强对下级党组织的指导监督检查，各级组织部门和机关党组织要加强日常管理，各级纪律检查机关要严肃查处违反党内政治生活准则的各种行为。\n加强和规范党内政治生活，要从中央委员会、中央政治局、中央政治局常务委员会做起。高级干部要清醒认识自己岗位对党和国家的特殊重要性，职位越高越要自觉按照党提出的标准严格要求自己，越要做到党性坚强、党纪严明，做到对党始终忠诚、永不叛党。制定高级干部贯彻落实本准则的实施意见，指导和督促高级干部在遵守和执行党内政治生活准则上作全党表率。\n全面从严治党永远在路上。全党要坚持不懈努力，共同营造风清气正的政治生态，确保党始终成为中国特色社会主义事业的坚强领导核心。"}]}]},{"id":120,"name":"中国共产党廉洁自律准则","doc_no":"","level":"党内法规","issuing_org":"中国共产党中央委员会","publish_date":"2015-10-18","amend_date":null,"status":"现行有效","bbbs":null,"source":"官方网站","official_url":"https://www.miit.gov.cn/jgsj/jgdw/zlzx/art/2020/art_ad814b43b8884809b26f29c80614eb44.html","effective_date":"2016-01-01","preamble":"2015年10月18日中共中央印发 自2016年1月1日起施行","chapters":[{"name":"全文","articles":[{"article_no":1,"chapter_no":null,"chapter_name":"","content":"第一条　坚持公私分明，先公后私，克己奉公。"},{"article_no":2,"chapter_no":null,"chapter_name":"","content":"第二条　坚持崇廉拒腐，清白做人，干净做事。"},{"article_no":3,"chapter_no":null,"chapter_name":"","content":"第三条　坚持尚俭戒奢，艰苦朴素，勤俭节约。"},{"article_no":4,"chapter_no":null,"chapter_name":"","content":"第四条　坚持吃苦在前，享受在后，甘于奉献。党员领导干部廉洁自律规范"},{"article_no":5,"chapter_no":null,"chapter_name":"","content":"第五条　廉洁从政，自觉保持人民公仆本色。"},{"article_no":6,"chapter_no":null,"chapter_name":"","content":"第六条　廉洁用权，自觉维护人民根本利益。"},{"article_no":7,"chapter_no":null,"chapter_name":"","content":"第七条　廉洁修身，自觉提升思想道德境界。"},{"article_no":8,"chapter_no":null,"chapter_name":"","content":"第八条　廉洁齐家，自觉带头树立良好家风。"}]}]},{"id":129,"name":"上市发行人董事进行证券交易的标准守则","doc_no":"《上市规则》附录C3","level":"香港法规","issuing_org":"香港联合交易所有限公司","publish_date":"2023-12-31","amend_date":null,"status":"现行有效","bbbs":null,"source":"香港交易所","official_url":"https://sc.hkex.com.hk/TuniS/cn-rules.hkex.com.hk/node/10071","effective_date":"2023-12-31","preamble":"《上市规则》附录C3","chapters":[{"name":"基本原则","articles":[{"article_no":1,"chapter_no":1,"chapter_name":"基本原则","content":"1. 本守则（基本原则及规则）列载董事于买卖其所属上市发行人的证券时用以衡量其本身操守的所需标准。违反这些标准将被视作违反《上市规则》。董事须尽量保证，其拥有或被视为拥有权益的所有交易均按本守则进行。"},{"article_no":2,"chapter_no":1,"chapter_name":"基本原则","content":"2. 上市发行人本身可自行采纳一套比此守则所订标准更高的守则。除非有关违规行为同时违反本守则的条文，否则，违反上市发行人自订的守则并不构成违反《上市规则》。"},{"article_no":3,"chapter_no":1,"chapter_name":"基本原则","content":"3. 本交易所认为上市发行人的董事最好能持有其所属公司上市发行人的证券。"},{"article_no":4,"chapter_no":1,"chapter_name":"基本原则","content":"4. 欲买卖其所属上市发行人证券的董事应先注意《证券及期货条例》第XIII及XIV部所载有关内幕交易及市场不当行为的条文。然而，在若干情况下，即使有关董事并无触犯法定条文，该董事仍不可随意买卖其所属上市发行人的证券。"},{"article_no":5,"chapter_no":1,"chapter_name":"基本原则","content":"5. 本守则最重要的作用，在于规定：凡董事知悉、或参与收购或出售事项（《上市规则》第十四章界定为须予公布的交易、第十四A章界定的关连交易，或涉及任何内幕消息者）的任何洽谈或协议，该董事必须自其开始知悉或参与该等事项起，直至有关资料已公布为止，禁止买卖其所属发行人的证券。参与该等洽谈或协议、又或知悉任何内幕消息的董事应提醒并无参与该等事项的其他董事，倘有内幕消息，而他们亦不得在同一期间买卖其所属发行人的证券。"},{"article_no":6,"chapter_no":1,"chapter_name":"基本原则","content":"6. 此外，如未经许可，董事不得向共同受托人或任何其他人士（即使是该等董事须向其履行受信责任的人士）披露机密资料、或利用该等资料为其本人或其他人士谋取利益。"}]},{"name":"释义","articles":[{"article_no":7,"chapter_no":2,"chapter_name":"释义","content":"7. 就本守则而言：(a)除下列(d)段所载的情况外，「交易」或「买卖」包括：不论是否涉及代价，任何购入、出售或转让上市发行人的证券、或任何实体（其唯一或大部分资产均是该上市发行人证券）的证券、或提供或同意购入、出售或转让该等证券、或以该等证券作出抵押或押记、或就该等证券产生任何其他证券权益，以及有条件或无条件授予、接受、收购、出售、转让、行使或履行现在或将来的任何期权（不论是认购或认沽或两者兼备的期权）或其他权利或责任，以收购、出售或转让上市发行人或上述实体的证券或该等证券的任何证券权益；而动词「交易」或「买卖」亦应作相应解释；(b)「受益人」包括任何全权信托的全权对象（而董事是知悉有关安排），以及任何非全权信托的受益人；(c)「证券」指上市证券、可转换或交换成上市证券的非上市证券，以及如《上市规则》第15章A所述，以上市发行人的上市证券为基础所发行的结构性产品（包括衍生权证）；(d)尽管上述(a)段对「交易」或「买卖」已有所界定，下列「交易」或「买卖」并不受本守则所规限：(i)在供股、红股发行、资本化发行或上市发行人向其证券持有人提供的要约（包括以股份取代现金派息的要约）中认购或接受有关的权利；但为免产生疑问，申请供股中的超额股份或在公开发售股份申请超额配发的股份则被视作为「交易」或「买卖」；(ii)在供股或上市发行人向其证券持有人提供的其他要约（包括以股份取代现金派息的要约）中放弃认购或放弃接受有关的权利；(iii)接受或承诺接受收购要约人向股东（与收购者「被视为一致行动」人士（定义 见《收购守则》）的股东除外）提出全面收购上市发行人的股份；(iv)以预定价行使股份期权或权证，或根据与上市发行人订定的协议去接纳有关出售股份要约，而该协议的订定日期，是在本守则禁止进行买卖期之前所签订的；而预定价是在授予股份期权或权证或接纳股份要约时所订的固定金额；(v)购入资格股，而又符合以下条件：根据上市发行人的组织章程文件，购入该等资格股的最后日期是在本守则所载的禁止进行买卖期之内，而该等股份又不能在另一时间购入；(vi)上市发行人有关证券的实益权益无变的交易；(vii)股东以「先旧后新」方式配售其持有的旧股，而其根据不可撤销及具约束力的责任认购的新股股数相等于其配售的旧股股数，认购价扣除开支后亦相等于旧股的配售价；(viii)涉及第三者依照法律的操作去转移实益拥有权的交易；及(ix)根据上市发行人于禁售期（指根据本守则下不得「交易」或「买卖」所属发行人证券的期间）之前所授予股份奖励的条款按授出奖励时厘定的购买价（如有）而接纳或归属的股份。"},{"article_no":8,"chapter_no":2,"chapter_name":"释义","content":"8. 就本守则而言，如果董事获授予期权╱选择权去认购或购买其所属公司的证券，而于授予期权╱选择权之时已订下有关期权╱选择权的行使价格，则授予董事有关期权╱选择权将被视为该董事进行交易。然而，若按授予董事期权╱选择权的有关条款，在行使该期权╱选择权时方决定行使价格，则于行使有关期权╱选择权时方被视为进行交易。规则"}]},{"name":"A. 绝对禁止","articles":[{"article_no":9,"chapter_no":3,"chapter_name":"A. 绝对禁止","content":"1. 无论何时，董事如管有与其所属发行人证券有关的内幕消息，或尚未办妥本守则B.8项所载进行交易的所需手续，均不得买卖其所属发行人的任何证券。"},{"article_no":10,"chapter_no":3,"chapter_name":"A. 绝对禁止","content":"2. 如董事以其作为另一发行人董事的身份管有与发行人证券有关的内幕消息，均不得买卖任何该等证券。"},{"article_no":11,"chapter_no":3,"chapter_name":"A. 绝对禁止","content":"3. (a)在上市发行人刊发财务业绩当天及以下期间，其董事不得买卖其所属上市发行人的任何证券：(i)年度业绩刊发日期之前60日内，或有关财政年度结束之日起至业绩刊发之日止期间（以较短者为准）；及(ii)刊发季度业绩（如有）及半年度业绩日期之前30日内，或有关季度或半年度期间结束之日起至业绩刊发之日止期间（以较短者为准），但如情况特殊（如应付下述C部所指的紧急财务承担）则除外。在任何情况下，董事均须遵守本守则B.8及B.9 项所规定的程序。(b)上市发行人必须在每次其董事因为A.3(a)项的规定而不得买卖其证券的期间开始前，预先通知联交所。注：董事须注意，根据A.3项所规定禁止董事买卖其所属上市发行人证券的期间，将包括上市发行人延迟公布业绩的期间。"},{"article_no":12,"chapter_no":3,"chapter_name":"A. 绝对禁止","content":"4. 若董事是唯一受托人，本守则将适用于有关信托进行的所有交易，如同该董事是为其本人进行交易（但若有关董事是「被动受托人」 (bare trustee），而其或其紧密联系人均不是有关信托的受益人，则本守则并不适用）。"},{"article_no":13,"chapter_no":3,"chapter_name":"A. 绝对禁止","content":"5. 若董事以共同受托人的身份买卖上市发行人的证券，但没有参与或影响进行该项证券交易的决策过程，而该董事本身及其所有紧密联系人亦非有关信托的受益人，则有关信托进行的交易，将不会被视作该董事的交易。"},{"article_no":14,"chapter_no":3,"chapter_name":"A. 绝对禁止","content":"6. 本守则对董事进行买卖的限制，同样适用于董事的配偶或任何未成年子女（亲生或收养）、或代该等子女所进行的交易，以及任何其他就《证券及期货条例》第XV部而言，该董事在其中拥有或被视为拥有权益的交易。因此，董事有责任于其本身未能随意买卖时，尽量设法避免上述人士进行任何上述买卖。"},{"article_no":15,"chapter_no":3,"chapter_name":"A. 绝对禁止","content":"7. 倘董事将包含上市发行人证券的投资基金交予专业管理机构管理，不论基金经理是否已授予全权决定权，该基金经理买卖该董事所属上市发行人的证券时，必须受与董事同等的限制及遵循同等的程序。"}]},{"name":"B. 通知","articles":[{"article_no":16,"chapter_no":4,"chapter_name":"B. 通知","content":"8. 董事于未书面通知主席或董事会为此而指定的另一名董事（该董事本人以外的董事）及接获注明日期的确认书之前，均不得买卖其所属发行人的任何证券。主席若拟买卖发行人证券，必须在交易之前先在董事会会议上通知各董事，或通知董事会为此而指定的另一名董事（其本人以外的董事），并须接获注明日期的确认书后才能进行有关的买卖。前述所指定的董事在未通知主席及接获注明日期的确认书之前，也不得买卖其所属发行人的任何证券。在每种情况下，(a)须于有关董事要求批准买卖有关证券后五个营业日内回覆有关董事；及(b)按上文(a)项获准买卖证券的有效期，不得超过接获批准后五个营业日。附注：为释疑起见，谨此说明：如获准买卖证券之后出现内幕消息，本守则A.1项的限制适用。"},{"article_no":17,"chapter_no":4,"chapter_name":"B. 通知","content":"9. 公司内部制订的程序，最低限度须规定上市发行人需保存书面记录，证明已根据本守则B.8项规定发出适当的通知并已获确认，而有关董事亦已就该事宜收到书面确认。"},{"article_no":18,"chapter_no":4,"chapter_name":"B. 通知","content":"10. 上市发行人的任何董事如担任一项信托的受托人，必须确保其共同受托人知悉其担任董事的任何公司，以使共同受托人可预计可能出现的困难。投资受托管理基金的董事，亦同样须向投资经理说明情况。"},{"article_no":19,"chapter_no":4,"chapter_name":"B. 通知","content":"11. 任何董事，如为一项买卖其附属上市发行人证券的信托之受益人（而非受托人），必须尽量确保其于有关受托人代表该项信托买卖该等证券之后接获通知，以使该董事可随即通知其所属上市发行人。就此而言，该董事须确保受托人知悉其担任董事的上市发行人。"},{"article_no":20,"chapter_no":4,"chapter_name":"B. 通知","content":"12. 根据《证券及期货条例》第352条须予存备的登记册，应在每次董事会会议上可供查阅。"},{"article_no":21,"chapter_no":4,"chapter_name":"B. 通知","content":"13. 公司的董事须以董事会及个人身份，尽量确保其公司的任何雇员、或附属公司的任何董事或雇员，不会利用他们因在该公司或该附属公司的职务或工作而可能管有与任何发行人证券有关的内幕消息，在本守则禁止董事买卖证券之期间买卖该等证券。"}]},{"name":"C. 特殊情况","articles":[{"article_no":22,"chapter_no":5,"chapter_name":"C. 特殊情况","content":"14. 若董事拟在特殊情况下出售或转让其所属上市发行人的证券，而有关出售或转让属本守则所禁止者，有关董事除了必须符合本守则的其他条文外，亦需遵守本守则第B.8项有关书面通知及确认的条文。在出售或转让该等证券之前，有关董事必须让董事会主席（或董事会指定的董事）确信情况属特殊，而计划中的出售或转让是该董事唯一可选择的合理行动。此外，上市发行人亦需在可行的情况下，尽快书面通知本交易所有关董事出售或转让证券的交易，并说明其认为情况特殊的理由。于该等出售或转让事项完成后，上市发行人必须立即按照《上市规则》第2.07C条的规定刊登公告披露有关交易，并在公告中说明主席（或指定董事）确信有关董事是在特殊情况下出售或转让发行人的证券。董事藉此证券出售或转让去应付一项无法以其他方法解决的紧急财务承担，或会被视为特殊情况的其中一个例子。"}]},{"name":"D. 披露","articles":[{"article_no":23,"chapter_no":6,"chapter_name":"D. 披露","content":"15. 就董事进行的证券交易而言，上市发行人须在其中期报告（及中期摘要报告（如有））中及载于年报（及财务摘要报告（如有））内的《企业管治报告》中披露：(a)上市发行人是否有采纳一套比本守则所订标准更高的董事证券交易的守则；(b)在向所有董事作出特定查询后，确定上市发行人的董事有否遵守本守则所订有关董事进行证券交易的标准及上市发行人本身自订的守则；及(c)如有不遵守本守则所订标准的情况，说明有关不遵守的详情，并阐释上市发行人就此采取的任何补救步骤。"}]}]},{"id":130,"name":"企业管治守则","doc_no":"《上市规则》附录C1","level":"香港法规","issuing_org":"香港联合交易所有限公司","publish_date":"2023-12-31","amend_date":null,"status":"现行有效","bbbs":null,"source":"香港交易所","official_url":"https://cn-rules.hkex.com.hk/sites/default/files/net_file_store/HKEXCN_TC_10107_VER40506.pdf","effective_date":"2023-12-31","preamble":"《上市规则》附录C1","chapters":[{"name":"全文","articles":[{"article_no":1,"chapter_no":null,"chapter_name":"","content":"簡介本《企業管治守則》訂明：(a)發行人在《企業管治報告》中的披露的強制要求；及(b)良好企業管治的原則、「不遵守就解釋」的守則條文以及若干建議最佳常規。本交易所鼓勵發行人自願採納建議最佳常規。第一部分 — 強制披露要求發行人必須根據本交易所的《上市規則》附錄D2第34段及第50段在其年報及財務摘要報告（如有）中，列載由董事會編備的《企業管治報告》(「《企業管治報告》」)。《企業管治報告》的內容必須包括所有在下文「第一部分—強制披露要求」一節所列載的資料。發行人若不符合此規定，將被視作違反《上市規則》。在合理和適當的範圍內，載於發行人財務摘要報告內的《企業管治報告》可以是年報所載《企業管治報告》的摘要，並可同時提述載於年報的有關資料。有關提述必須清楚明白，不得含糊，有關摘要亦不能只列出相互參照而對有關事宜不作任何論述。有關摘要必須至少包括一項敘述聲明，說明發行人有否全面遵守下文「第二部分—良好企業管治的原則、守則條文及建議最佳常規」一節所列載的守則條文，並指出任何有所偏離的情況。附錄C1第二部分 — 良好企業管治的原則（「管治原則」）、守則條文及建議最佳常規管治原則為達到良好企業管治提供整體方向指引，而守則條文則旨在幫助發行人實踐應用管治原則。本交易所不擬設立「適合所有公司的劃一」方法，並明白要有效實踐這些管治原則，除了嚴格遵照守則條文以外，視乎發行人本身的情況、經營規模和複雜程度，以及所面對風險和挑戰的性質等多方面因素，發行人亦可能通過其他的方法達到相同目的。要體現管治原則背後的理念，發行人應遵守守則條文，但亦可選擇偏離守則條文。建議最佳常規只屬指引。然而，建議最佳常規的自願遵守性質，並不代表其不重要；反之，發行人為實踐應用管治原則，更應遵守該等常規和做法。本交易所鼓勵發行人說明有否遵守建議最佳常規，並且就任何偏離行為提供經過審慎考慮的理由。何謂「不遵守就解釋」?1.發行人須在其年報（及財務摘要報告（如有））及中期報告（及中期摘要報告（如有））中說明其於有關會計期間有否遵守守則條文。2.如若發行人認為可在應用管治原則情況下無需遵守守則條文，發行人可偏離守則條文行事（即採取守則條文中未有訂明的措施或步驟），惟前提是發行人：(a)在年報（及財務摘要報告（如有））內的《企業管治報告》就任何偏離行為提供經過審慎考慮的理由，並解釋如何以嚴格遵照有關守則條文以外的方法同樣達致良好企業管治（「經過審慎考慮的理由及解釋」）。該解釋應為發行人所採取的替代行動和步驟提供清楚的理據以及其影響和結果；及(b)在中期報告（及中期摘要報告（如有））內：(i)就任何偏離行為提供經過審慎考慮的理由及解釋；或(ii)在合理和適當的範圍內，提述載於上一份年報的《企業管治報告》，詳細說明任何轉變，並就未有在該年報內匯報的任何偏離的行為提供經過審慎考慮的理由及解釋。有關提述必須清楚明白，不得含糊，有關中期報告（或中期摘要報告）不能只列出相互參照而對有關事宜不作任何論述。經過審慎考慮的理由及解釋有助促進發行人與股東之間互通訊息、有建設性的溝通，從而持續提升企業管治。本交易所鼓勵股東就偏離守則條文的情況與發行人作具建設性的溝通及討論。股東在評估發行人提出的經過審慎考慮的理由及解釋時，應適當考慮發行人本身的情況。3.發行人若偏離守則條文而沒有以上述方式提供經過審慎考慮的理由及解釋，將被視作違反《上市規則》。企業管治與環境、社會及管治之間的聯繫企業管治可說是董事會制定決策和開展業務的框架。整個董事會所有人均應專注於為股東創造長期的可持續增長，並為所有相關持份者創造長期價值。有效的企業管治架構有助發行人了解、評估並管理風險和機會（包括環境和社會風險及機會）。《上市規則》附錄C2所載的《環境、社會及管治報告守則》提供了一個框架，其中包括讓發行人識別和考慮或對其重要的環境及社會風險。董事會應負責就環境、社會及管治事宜作有效管治和監督，並對重大的環境及社會風險作出評估和管理。發行人必須根據《環境、社會及管治報告守則》在其環境、社會及管治報告中披露環境及社會事宜。第一部分 — 強制披露要求為增加透明度，發行人必須列載其年報所涵蓋會計期間的以下資料，以及盡量包括於會計期間後至刊發年報當日前期間的重大事項。發行人若不符合此規定，將被視作違反《上市規則》。"}]},{"name":"A. 企業管治常規","articles":[{"article_no":2,"chapter_no":1,"chapter_name":"A. 企業管治常規","content":"(a)以陳述方式闡明發行人如何應用管治原則，讓其股東可衡量有關原則如何應用；(b)說明發行人是否遵守守則條文；及(c)如偏離守則條文（包括採用守則條文以外的任何替代方式），須說明在有關財政年度中任何偏離守則條文的詳情（包括經過審慎考慮的理由及解釋）。"}]},{"name":"B. 董事會","articles":[{"article_no":3,"chapter_no":2,"chapter_name":"B. 董事會","content":"(a)董事會的組成（按董事類別劃分），當中包括主席、執行董事、非執行董事、獨立非執行董事及首席獨立非執行董事（如有）的姓名，以及每名董事的任期及當前委任期間；(b)在財政年度內舉行董事會的次數；(c)具名列載每名董事於董事會會議及股東大會的出席率；註：1在符合發行人的組織章程文件、其註冊成立地的法律及法規的情況下，透過電話或視像會議等電子途徑參與會議的董事可計算為親身出席會議。2若有董事是在財政年度中途獲委任，其出席率應按其在任期間舉行的董事會會議數目計算。(d)具名列載每名董事出席的董事會或委員會會議數目，以及其替任董事代為出席的董事會或委員會會議數目。由替任董事代為出席的董事會或其他委員會會議不得計入有關董事的出席率；(e)陳述董事會與管理層各自的職責、其各自如何對發行人負責及作出貢獻，尤其是陳述董事會如何運作，包括高層次地說明哪類決定會由董事會作出，哪類決定會交由管理層作出；(f)未能遵守（如有）《上市規則》第3.10(1)及(2)條以及第3.10A條的詳情，以及闡釋就不合規情況所採取的補救步驟。不合規情況包括未有委任足夠數目的獨立非執行董事，以及未有委任具備適當專業資格、或具備會計或有關財務管理專長的獨立非執行董事；(g)當獨立非執行董事未能符合《上市規則》第3.13條列載的其中一項或多項評估獨立性的指引，須解釋為何發行人仍認同獨立非執行董事的獨立性；(h)若董事會成員之間（特別是主席與行政總裁之間）存有任何關係，包括財務、業務、家屬或其他重大╱相關的關係，則須披露有關關係；(ha)如發行人在年報所涵蓋會計期間內委任了董事，則須披露每名獲委任董事取得《上市規則》第3.09D條所述法律意見的日期；及每名董事確認明白其作為上市發行人董事的責任；及(i)確認所有董事（具名列載）均已於報告期內參與《上市規則》第 3.09F、3.09G 及 3.09H條規定的持續專業發展。有關確認應充分載列每名董事的詳情，包括：(i)於報告期內完成的持續專業發展總時數；(ii)所接受的持續專業發展的形式，包括是採用外部抑或內部培訓提供者，又或有關專業發展是否自修而來。就每名董事採用的每種持續專業發展形式，披露完成的培訓時數、所涵蓋的培訓主題以及（如適用）相關培訓提供者的描述（例如名稱及╱或類型）；及(iii)此外，就任何須符合《上市規則》第3.09H條規定的董事而言（如適用），聲明有關董事已根據第3.09H條完成所規定的持續專業發展。"}]},{"name":"C. 主席及行政總裁","articles":[{"article_no":4,"chapter_no":3,"chapter_name":"C. 主席及行政總裁","content":"主席及行政總裁的身份。"}]},{"name":"D. 非執行董事","articles":[{"article_no":5,"chapter_no":4,"chapter_name":"D. 非執行董事","content":"非執行董事的任期。"}]},{"name":"E. 董事會轄下的委員會","articles":[{"article_no":6,"chapter_no":5,"chapter_name":"E. 董事會轄下的委員會","content":"有關審核委員會、薪酬委員會、提名委員會、風險委員會（如有）及企業管治職能各自的下列資料：(a)委員會的角色及職能；(b)委員會的組成及其是否包括獨立非執行董事、非執行董事及執行董事（包括各委員的姓名，委員會的主席的姓名）；(c)委員會年內舉行會議討論事宜的次數，以及具名列載各委員出席該等會議的紀錄；及(d)年內工作摘要，包括：(i)就審核委員會而言：其如何履行審閱季度（如有）、半年度及年度業績、以及（除非有另設的董事會轄下風險委員會又或董事會本身會明確處理）檢討風險管理及內部監控系統的職責、發行人內部審核功能的有效性和履行《企業管治守則》所列其他責任的報告；未有遵守（如有）《上市規則》第3.21條的詳情，並闡釋發行人因未符合設立審核委員會的規定而採取的補救步驟；(ii)就薪酬委員會而言：由薪酬委員會執行的制定董事薪酬政策、評估執行董事的表現、批准執行董事服務合約條款以及審閱及╱或批准第十七章所述有關股份計劃的事宜（見第17.07A條）；披露採納了守則條文第E.1.2(c)條所述的兩種薪酬委員會模式的哪一種；(iii)就提名委員會而言：披露(1)年內有關提名董事的政策，包括提名委員會年內就董事候選人採納的提名程序、遴選及推薦準則以及(2)其就每名董事對董事會投入的時間及貢獻、能否有效履行職責作出的評估，當中須考慮董事的專業資格及工作經驗、現有在主板或GEM上市的發行人董事職位及該董事其他重大外部事務所涉及時間投入以及其他與董事的個性、品格、獨立性及經驗有關的因素或情況；註：就此規定而言：1「重大外部事務所涉及時間投入」包括所有需要投入大量時間、在主板或GEM上市的發行人董事職務以外的外部事務，例子包括在主板或GEM以外的交易所上市的發行人的董事職務、全職工作、主要顧問工作、重大公務職責以及法定機構或非牟利機構董事職務及其他參與；及2「其他與董事的個性、品格、獨立性及經驗有關的因素或情況」包括在評估董事是否能有效履行其職責時應合理考慮的董事個別情況的任何變更或發展。(iv)就風險委員會而言（如有）：其如何履行檢討風險管理及內部監控系統的職責和發行人內部審核功能的有效性的報告；及(v)就企業管治而言：制定發行人的企業管治政策，以及董事會或委員會根據守則條文第A.2.1條履行的職責。"}]},{"name":"F. 公司秘書","articles":[{"article_no":7,"chapter_no":6,"chapter_name":"F. 公司秘書","content":"(a)若發行人外聘服務機構擔任公司秘書：發行人內部的主要聯絡人（包括姓名及職位）；及(b)未能遵守《上市規則》第3.29條的詳情。"}]},{"name":"G. 董事的證券交易","articles":[{"article_no":8,"chapter_no":7,"chapter_name":"G. 董事的證券交易","content":"有關《上市規則》附錄C3所列載的《標準守則》：(a)發行人是否有採納一套比《標準守則》所訂的標準更高的董事進行證券交易的行為準則；(b)在向所有董事作出特定查詢後，發行人的董事是否有遵守或不遵守《標準守則》所訂有關董事進行證券交易的標準及其本身所訂有關的行為守則；及(c)如有不遵守《標準守則》所訂標準的情況，則須說明有關不遵守的詳情以及闡釋發行人就此採取的任何補救步驟。"}]},{"name":"H. 風險管理及內部監控","articles":[{"article_no":9,"chapter_no":8,"chapter_name":"H. 風險管理及內部監控","content":"發行人根據守則條文第D.2.1條就其及其附屬公司的風險管理及內部監控系統的有效性所作的檢討（至少每年一次）的詳情，包括：(a)董事會聲明：(i)確認其在發行人風險管理及內部監控系統方面的責任；及(ii)確認發行人風險管理及內部監控系統可適當及有效達到《企業管治守則》原則D2所述的目的；(b)風險管理及內部監控系統的主要特征，包括識別、評估及管理重大風險的流程以及適時、準確及完整披露須予披露的資料（包括內幕消息及任何其他就預防發行人證券出現虛假市場而言屬必要的資料）的程序；(c)報告期內有關(i)發行人的風險評估（包括環境、社會及管治風險）以及(ii)風險管理及內部監控系統的任何重大變更；(d)發行人是否設有內部審核功能；(e)內部部門（例如內部審核部門（如有））及外部服務提供者有關檢討發行人風險管理及內部監控系統的有效性的責任，以及有關檢討的流程及頻次；(f)佐證董事會認為風險管理及內部監控系統適當及有效的資料，包括（如適用）任何來自管理層、董事會轄下負責發行人風險管理及內部監控的相關委員會以及任何其他內部部門（例如內部審核部門（如有））、發行人獨立核數師及╱或其他外部服務提供者的確認；及(g)檢討範圍及檢討結果的詳情，包括在該報告期內發現的重大監控失誤或弱項（或之前已匯報但仍未解決者）以及任何所採取或擬採取以解決有關監控失誤或弱項的補救措施。"}]},{"name":"I. 核數師酬金及核數師相關事宜","articles":[{"article_no":10,"chapter_no":9,"chapter_name":"I. 核數師酬金及核數師相關事宜","content":"有關核數師向發行人提供核數及非核數服務所得酬金的分析（就此而言，核數師包括與負責核數的公司處於同一控制權、所有權或管理權之下的任何機構，或一個合理並知悉所有有關資料的第三方，在合理情況下會斷定該機構屬於該負責核數的公司的本土或國際業務的一部分的任何機構）。有關分析必須包括每項重大非核數服務的性質及所支付費用的詳情。"}]},{"name":"J. 多元化","articles":[{"article_no":11,"chapter_no":10,"chapter_name":"J. 多元化","content":"(a)(i)發行人的董事會多元化政策或政策摘要，當中應包括為推行董事會成員性別多元化而定的可計量目標（例如目標數字和時間表）及發行人為建立一個可以達到性別多元化的潛在董事繼任人人才庫所採取的措施；及(ii)發行人於年內對董事會多元化政策實施情況的檢討結果（包括實現發行人目標的進度及發行人如何得出其結論）；(b)發行人有關全體員工（包括高級管理人員）多元化的政策或政策摘要，包括發行人為達到性別多元化而訂立的任何計劃或可計量目標（例如目標數字和時間表）及達標的進度。如適用，發行人可披露任何會令全體員工（包括高級管理人員）達到性別多元化更具挑戰或較不相干的因素及情況；及(c)(i)高級管理層；及(ii)全體員工（不包括高級管理層）的性別比例。註：在本《企業管治守則》內，「高級管理人員」指發行人年報內提及的同一類別的人士；按附錄D2第12段，該等人士的身份須予以披露。"}]},{"name":"K. 股東權利","articles":[{"article_no":12,"chapter_no":11,"chapter_name":"K. 股東權利","content":"(a)股東如何可以召開股東特別大會；(b)股東可向董事會提出查詢的程序，並提供足夠的聯絡資料以便有關查詢可獲恰當處理；及(c)在股東大會提出建議的程序以及足夠的聯絡資料。"}]},{"name":"L. 投資者關係","articles":[{"article_no":13,"chapter_no":12,"chapter_name":"L. 投資者關係","content":"(a)年內發行人組織章程文件的任何重大變動；(b)發行人的股東通訊政策（或其摘要），應包括能供股東就影響發行人的各種事項發表意見的渠道，以及為征求並理解股東和持份者的意見而採取的步驟；(c)說明年內已檢討股東通訊政策的實施和有效性，包括發行人如何得出有關結論；及(d)根據守則條文F.1.1與股東進行的互動詳情（如適用）。"}]},{"name":"M. 股息","articles":[{"article_no":14,"chapter_no":13,"chapter_name":"M. 股息","content":"(a)如發行人訂有派付股息的政策：(i)該政策或政策摘要，包括政策目的或目標，以及董事會在決定是否宣布、建議或派付任何股息時會考慮的主要因素；及(ii)確認董事就股息作出的所有決定均符合發行人股息政策；否則須就任何偏離發行人股息政策的情況說明理由；(b)如發行人未訂有派付股息的政策：(i)未訂有有關政策的事實；及(ii)未訂有有關政策的理由；(c)不論發行人是否訂有派付股息的政策，發行人亦須：(i)（如董事會宣派股息（中期或末期股息））任何大幅偏離上年同期股息率的理由；及(ii)（如董事會決定不宣派任何股息）董事作出有關決定的原因及發行人擬採取以提升投資者回報的措施（如有）。第二部分 — 良好企業管治的原則、守則條文及建議最佳常規"}]},{"name":"A. 企業目的、策略及管治","articles":[{"article_no":15,"chapter_no":14,"chapter_name":"A. 企業目的、策略及管治","content":"A.1 企業策略、業務模式及文化原則發行人應以一個行之有效的董事會為首；董事會應負有領導及監控發行人的責任，並應集體負責統管並監督發行人事務以促使發行人成功。董事應該客觀行事，所作決策須符合發行人的最佳利益。守則條文"},{"article_no":16,"chapter_no":14,"chapter_name":"A. 企業目的、策略及管治","content":"A.1.1 董事會應制定發行人的目的、價值及策略，並確保與發行人的文化一致。所 有董事行事須持正不阿、以身作則，致力推廣企業文化。該文化應向企業上下灌輸，並不斷加強「行事合乎法律、道德及責任」的理念。"},{"article_no":17,"chapter_no":14,"chapter_name":"A. 企業目的、策略及管治","content":"A.1.2 董事應在年報內討論及分析集團表現，闡明發行人對長遠產生或保留價值的 基礎（業務模式）及實現發行人所立目標的策略。註：發行人應有其企業策略及長遠的業務模式。長遠的財務表現而非短期收益才是一項企業管治的目的。發行人董事會不應承受不當風險，為求短期收益而損及長遠目標。"},{"article_no":18,"chapter_no":14,"chapter_name":"A. 企業目的、策略及管治","content":"A.2 企業管治職能原則董事會負責履行企業管治職責，並可將責任指派予一個或多個委員會。守則條文"},{"article_no":19,"chapter_no":14,"chapter_name":"A. 企業目的、策略及管治","content":"A.2.1 董事會（或履行此職能的委員會）的職權範圍應至少包括： (a)制定及檢討發行人的企業管治政策及常規，並向董事會提出建議；(b)檢討及監察董事及高級管理人員的培訓及持續專業發展；(c)檢討及監察發行人在遵守法律及監管規定方面的政策及常規；(d)制定、檢討及監察僱員及董事的操守準則及合規手冊（如有）；及(e)檢討發行人遵守《企業管治守則》的情況及在《企業管治報告》內的披露。"}]},{"name":"B. 董事會組成及提名","articles":[{"article_no":20,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.1 董事會組成、繼任及評核原則董事會應根據發行人業務而具備適當所需技巧、經驗及多樣的觀點與角度，並應確保各董事能按其角色及董事會職責向發行人投入足夠時間並作出貢獻。董事會應確保其組成人員的變動不會帶來不適當的干擾。董事會中執行董事與非執行董事（包括獨立非執行董事）的組合應該保持均衡，以使董事會上有強大的獨立元素，能夠有效地作出獨立判斷。非執行董事應有足夠才幹和人數，以使其意見具有影響力。守則條文"},{"article_no":21,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.1.1 在所有載有董事姓名的公司通訊中，應該說明獨立非執行董事身份。"},{"article_no":22,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.1.2 發行人應在其網站及本交易所網站上設存及提供最新的董事會成員名單，並 列明其角色和職能，以及註明其是否獨立非執行董事。"},{"article_no":23,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.1.3 發行人應制定機制，以確保董事會可獲得獨立的觀點和意見，並在其《企業 管治報告》中披露該機制。董事會應每年檢討該機制的實施及有效性。"},{"article_no":24,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.1.4 發行人應至少每兩年對董事會表現進行正式的評核。發行人應在《企業管治 報告》中確認其是否已在報告期內進行評核。如否，應說明下一次董事會表現評核將於何時進行。如發行人已在報告期內進行董事會表現評核，則應在《企業管治報告》中披露：(a)是次董事會表現評核是由內部還是外部服務提供者進行；(b)進行董事會表現評核的方式，包括評核範圍及參與的負責部門╱委員會╱外部服務提供者；(c)任何參與董事會表現評核的外部服務提供者與發行人或其任何董事之間的關係（如有）；及(d)董事會表現評核結果的詳情，包括須作出重大改善的地方（如在董事會表現評核中發現）以及因應董事會表現評核結果而採取或計劃採取的措施。"},{"article_no":25,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.1.5 發行人應編製董事會技能表並在《企業管治報告》中作出披露，當中所載資料 應包括：(a)董事會當前具備的技能組合詳情；(b)說明董事技能、經驗及多元化組合如何符合發行人的目的、價值觀、策略及理想文化；及(c)（如適用）有關董事會擬獲得的任何新技能的詳情、其獲得該新技能的計劃，以及過往年度的相關計劃在匯報年度如何實現或其進度。建議最佳常規"},{"article_no":26,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.1.6 若有個別候任董事相互擔任對方公司的董事職務或透過參與其他公司或團體 與其他董事有重大聯繫，而董事會仍認為其是獨立人士，董事會應說明原因。註：當兩個（或更多）董事相互擔任對方公司的董事職務時，不同發行人董事相互擔任對方公司的董事職務的情況便會存在。"},{"article_no":27,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.2 委任、重選和罷免原則新董事的委任程序應正式、經審慎考慮並具透明度，另發行人應設定有秩序的董事繼任計劃。所有董事均應每隔若干時距即重新選舉。發行人必須就任何董事辭任或遭罷免解釋原因。守則條文"},{"article_no":28,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.2.1 董事應確保能付出足夠時間及精神以處理發行人的事務，否則不應接受委 任。"},{"article_no":29,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.2.2 每名董事（包括有指定任期的董事）應輪流退任，至少每三年一次。"},{"article_no":30,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.2.3 [將於2031年6月30日後刪除]若獨立非執行董事在任已過九年，其是否獲 續任應以獨立決議案形式由股東審議通過。隨附該決議案一同發給股東的文件中，應說明董事會（或提名委員會）為何認為該名董事仍屬獨立人士及應獲重選的原因，包括所考量的因素、董事會（或提名委員會）作此決定的過程及討論內容。"},{"article_no":31,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.2.4 [將於2028年6月30日後刪除] 若發行人的董事會內所有獨立非執行董事均 在任超過九年，發行人應：(a)在股東周年大會通告所隨附的致股東通函及╱或說明函件中披露每名在任獨立非執行董事的姓名及任期；及(b)在下次的股東周年大會上委任一名新的獨立非執行董事。"},{"article_no":32,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.3 提名委員會原則提名委員會履行職責時，須充分考慮第B.1條及第B.2條下的原則。守則條文"},{"article_no":33,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.3.1 發行人應書面訂明提名委員會具體的職權範圍，清楚說明其職權和責任。提 名委員會應履行以下責任：(a)至少每年檢討董事會的架構、人數及組成（包括技能、知識及經驗方面）、協助董事會編制董事會技能表，並就任何為配合發行人的公司策略而擬對董事會作出的變動提出建議；(b)物色具備合適資格可擔任董事的人士，並挑選提名有關人士出任董事或就此向董事會提出建議；(c)評核獨立非執行董事的獨立性；(d)就董事委任或重新委任以及董事（尤其是主席及行政總裁）繼任計劃向董事會提出建議；及(e)支援發行人定期評估董事會表現。"},{"article_no":34,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.3.2 提名委員會應在本交易所網站及發行人網站上公開其職權範圍，解釋其角色 以及董事會轉授予其的權力。"},{"article_no":35,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.3.3 發行人應向提名委員會提供充足資源以履行其職責。提名委員會履行職責時 如有需要，應尋求獨立專業意見，費用由發行人支付。"},{"article_no":36,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.3.4 若董事會擬於股東大會上提呈決議案選任某人士為獨立非執行董事，致股東 通函及╱或有關股東大會通告所隨附的說明函件中，應該列明：(a)用以物色該名人士的流程、董事會認為應選任該名人士的理由以及他們認為該名人士屬獨立人士的原因；(b)[將於2028年6月30日後刪除] 如果候任獨立非執行董事將出任第七家（或以上）在主板或GEM上市的發行人的董事，董事會認為該名人士仍可投入足夠時間履行董事責任的原因；(c)該名人士可為董事會帶來的觀點與角度、技能及經驗；及(d)該名人士如何促進董事會成員多元化。"},{"article_no":37,"chapter_no":15,"chapter_name":"B. 董事會組成及提名","content":"B.3.5  發行人應為提名委員會委任至少一名不同性別的董事。"}]},{"name":"C. 董事責任、權力轉授及董事會程序","articles":[{"article_no":38,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.1 董事責任原則每名董事須理解並時刻瞭解其作為發行人董事的職責，以及發行人的經營方式、業務活動及發展。由於董事會本質上是個一體組織，非執行董事應有與執行董事相同的受信責任以及以應有謹慎態度和技能行事的責任。為確保董事繼續在具備全面資訊及切合所需的情況下對董事會作出貢獻，所有董事均須參與持續專業發展，發展並更新其知識及技能，確保他們對發行人的業務、運作及管治政策均有適當的理解，以及完全知道自身在法規及普通法、《上市規則》、法律及其他監管規定下的職責。董事應向發行人提供其接受的持續專業發展紀錄。守則條文"},{"article_no":39,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.1.1 發行人應負責安排及（如有必要）資助： (a)新委任的董事在受委任時獲得全面、正式兼特為其而設的就任須知；及(b)所有董事參與適合的持續專業發展。"},{"article_no":40,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.1.2 非執行董事的職能應包括： (a)參與董事會會議，在涉及策略、政策、公司表現、問責性、資源、主要委任及操守準則等事宜上，提供獨立的意見；(b)在出現潛在利益衝突時發揮牽頭引導作用；(c)應邀出任審核委員會、薪酬委員會、提名委員會及其他管治委員會成員；及(d)仔細檢查發行人的表現是否達到既定的企業目標和目的，並監察匯報公司表現的事宜。"},{"article_no":41,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.1.3 董事會應就有關僱員買賣發行人證券事宜設定書面指引，指引內容應該不比 《標準守則》寬鬆。「有關僱員」包括任何因其職務或僱員關係而可能會管有關於發行人或其證券的內幕消息的僱員，又或附屬公司或控股公司的此等董事或僱員。"},{"article_no":42,"chapter_no":16,"chapter_name":"C. 董事責任、權力轉授及董事會程序","content":"C.1.4 董事應於接受委任時向發行人披露其於公眾公司或組織擔任職位的數目及性 質以及其他重大外部事務所涉及的時間投入，其後若有任何變動應及時披露。此外亦應披露所涉及的公眾公司
