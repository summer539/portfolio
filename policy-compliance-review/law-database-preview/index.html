<script>
const LAWS = [{"id":1,"name":"中华人民共和国劳动法","doc_no":"主席令第24号","level":"法律","issuing_org":"全国人民代表大会常务委员会","publish_date":"2018-12-29","amend_date":"2018-12-29","status":"现行有效","bbbs":"ff8080816f135f46016f20f16ee11737","source":"国家法律法规数据库","official_url":"https://flkoss.obs-bj2.cucloud.cn/prod/20181229/c17f15b134944e3687e89d1c16a1d156.docx","effective_date":"2018-12-29","preamble":"（1994年7月5日第八届全国人民代表大会常务委员会第八次会议通过根据2009年8月27日第十一届全国人民代表大会常务委员会第十次会议《关于修改部分法律的决定》第一次修正根据2018年12月29日第十三届全国人民代表大会常务委员会第七次会议《关于修改〈中华人民共和国劳动法〉等七部法律的决定》第二次修正）","chapters":[{"name":"总则","articles":[{"article_no":1,"chapter_no":1,"chapter_name":"总则","content":"为了保护劳动者的合法权益，调整劳动关系，建立和维护适应社会主义市场经济的劳动制度，促进经济发展和社会进步，根据宪法，制定本法。"},{"article_no":2,"chapter_no":1,"chapter_name":"总则","content":"在中华人民共和国境内的企业、个体经济组织（以下统称用人单位）和与之形成劳动关系的劳动者，适用本法。\n国家机关、事业组织、社会团体和与之建立劳动合同关系的劳动者，依照本法执行。"},{"article_no":3,"chapter_no":1,"chapter_name":"总则","content":"劳动者享有平等就业和选择职业的权利、取得劳动报酬的权利、休息休假的权利、获得劳动安全卫生保护的权利、接受职业技能培训的权利、享受社会保险和福利的权利、提请劳动争议处理的权利以及法律规定的其他劳动权利。\n劳动者应当完成劳动任务，提高职业技能，执行劳动安全卫生规程，遵守劳动纪律和职业道德。"},{"article_no":4,"chapter_no":1,"chapter_name":"总则","content":"用人单位应当依法建立和完善规章制度，保障劳动者享有劳动权利和履行劳动义务。"},{"article_no":5,"chapter_no":1,"chapter_name":"总则","content":"国家采取各种措施，促进劳动就业，发展职业教育，制定劳动标准，调节社会收入，完善社会保险，协调劳动关系，逐步提高劳动者的生活水平。"},{"article_no":6,"chapter_no":1,"chapter_name":"总则","content":"国家提倡劳动者参加社会义务劳动，开展劳动竞赛和合理化建议活动，鼓励和保护劳动者进行科学研究、技术革新和发明创造，表彰和奖励劳动模范和先进工作者。"},{"article_no":7,"chapter_no":1,"chapter_name":"总则","content":"劳动者有权依法参加和组织工会。\n工会代表和维护劳动者的合法权益，依法独立自主地开展活动。"},{"article_no":8,"chapter_no":1,"chapter_name":"总则","content":"劳动者依照法律规定，通过职工大会、职工代表大会或者其他形式，参与民主管理或者就保护劳动者合法权益与用人单位进行平等协商。"},{"article_no":9,"chapter_no":1,"chapter_name":"总则","content":"国务院劳动行政部门主管全国劳动工作。\n县级以上地方人民政府劳动行政部门主管本行政区域内的劳动工作。"}]},{"name":"促进就业","articles":[{"article_no":10,"chapter_no":2,"chapter_name":"促进就业","content":"国家通过促进经济和社会发展，创造就业条件，扩大就业机会。\n国家鼓励企业、事业组织、社会团体在法律、行政法规规定的范围内兴办产业或者拓展经营，增加就业。\n国家支持劳动者自愿组织起来就业和从事个体经营实现就业。"},{"article_no":11,"chapter_no":2,"chapter_name":"促进就业","content":"地方各级人民政府应当采取措施，发展多种类型的职业介绍机构，提供就业服务。"},{"article_no":12,"chapter_no":2,"chapter_name":"促进就业","content":"劳动者就业，不因民族、种族、性别、宗教信仰不同而受歧视。"},{"article_no":13,"chapter_no":2,"chapter_name":"促进就业","content":"妇女享有与男子平等的就业权利。在录用职工时，除国家规定的不适合妇女的工种或者岗位外，不得以性别为由拒绝录用妇女或者提高对妇女的录用标准。"},{"article_no":14,"chapter_no":2,"chapter_name":"促进就业","content":"残疾人、少数民族人员、退出现役的军人的就业，法律、法规有特别规定的，从其规定。"},{"article_no":15,"chapter_no":2,"chapter_name":"促进就业","content":"禁止用人单位招用未满十六周岁的未成年人。\n文艺、体育和特种工艺单位招用未满十六周岁的未成年人，必须遵守国家有关规定，并保障其接受义务教育的权利。"}]},{"name":"劳动合同和集体合同","articles":[{"article_no":16,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"劳动合同是劳动者与用人单位确立劳动关系、明确双方权利和义务的协议。\n建立劳动关系应当订立劳动合同。"},{"article_no":17,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"订立和变更劳动合同，应当遵循平等自愿、协商一致的原则，不得违反法律、行政法规的规定。\n劳动合同依法订立即具有法律约束力，当事人必须履行劳动合同规定的义务。"},{"article_no":18,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"下列劳动合同无效：\n（一）违反法律、行政法规的劳动合同；\n（二）采取欺诈、威胁等手段订立的劳动合同。\n无效的劳动合同，从订立的时候起，就没有法律约束力。确认劳动合同部分无效的，如果不影响其余部分的效力，其余部分仍然有效。\n劳动合同的无效，由劳动争议仲裁委员会或者人民法院确认。"},{"article_no":19,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"劳动合同应当以书面形式订立，并具备以下条款：\n（一）劳动合同期限；\n（二）工作内容；\n（三）劳动保护和劳动条件；\n（四）劳动报酬；\n（五）劳动纪律；\n（六）劳动合同终止的条件；\n（七）违反劳动合同的责任。\n劳动合同除前款规定的必备条款外，当事人可以协商约定其他内容。"},{"article_no":20,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"劳动合同的期限分为有固定期限、无固定期限和以完成一定的工作为期限。\n劳动者在同一用人单位连续工作满十年以上，当事人双方同意续延劳动合同的，如果劳动者提出订立无固定期限的劳动合同，应当订立无固定期限的劳动合同。"},{"article_no":21,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"劳动合同可以约定试用期。试用期最长不得超过六个月。"},{"article_no":22,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"劳动合同当事人可以在劳动合同中约定保守用人单位商业秘密的有关事项。"},{"article_no":23,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"劳动合同期满或者当事人约定的劳动合同终止条件出现，劳动合同即行终止。"},{"article_no":24,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"经劳动合同当事人协商一致，劳动合同可以解除。"},{"article_no":25,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"劳动者有下列情形之一的，用人单位可以解除劳动合同：\n（一）在试用期间被证明不符合录用条件的；\n（二）严重违反劳动纪律或者用人单位规章制度的；\n（三）严重失职，营私舞弊，对用人单位利益造成重大损害的；\n（四）被依法追究刑事责任的。"},{"article_no":26,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"有下列情形之一的，用人单位可以解除劳动合同，但是应当提前三十日以书面形式通知劳动者本人：\n（一）劳动者患病或者非因工负伤，医疗期满后，不能从事原工作也不能从事由用人单位另行安排的工作的；\n（二）劳动者不能胜任工作，经过培训或者调整工作岗位，仍不能胜任工作的；\n（三）劳动合同订立时所依据的客观情况发生重大变化，致使原劳动合同无法履行，经当事人协商不能就变更劳动合同达成协议的。"},{"article_no":27,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"用人单位濒临破产进行法定整顿期间或者生产经营状况发生严重困难，确需裁减人员的，应当提前三十日向工会或者全体职工说明情况，听取工会或者职工的意见，经向劳动行政部门报告后，可以裁减人员。\n用人单位依据本条规定裁减人员，在六个月内录用人员的，应当优先录用被裁减的人员。"},{"article_no":28,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"用人单位依据本法第二十四条、第二十六条、第二十七条的规定解除劳动合同的，应当依照国家有关规定给予经济补偿。"},{"article_no":29,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"劳动者有下列情形之一的，用人单位不得依据本法第二十六条、第二十七条的规定解除劳动合同：\n（一）患职业病或者因工负伤并被确认丧失或者部分丧失劳动能力的；\n（二）患病或者负伤，在规定的医疗期内的；\n（三）女职工在孕期、产期、哺乳期内的；\n（四）法律、行政法规规定的其他情形。"},{"article_no":30,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"用人单位解除劳动合同，工会认为不适当的，有权提出意见。如果用人单位违反法律、法规或者劳动合同，工会有权要求重新处理；劳动者申请仲裁或者提起诉讼的，工会应当依法给予支持和帮助。"},{"article_no":31,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"劳动者解除劳动合同，应当提前三十日以书面形式通知用人单位。"},{"article_no":32,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"有下列情形之一的，劳动者可以随时通知用人单位解除劳动合同：\n（一）在试用期内的；\n（二）用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动的；\n（三）用人单位未按照劳动合同约定支付劳动报酬或者提供劳动条件的。"},{"article_no":33,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"企业职工一方与企业可以就劳动报酬、工作时间、休息休假、劳动安全卫生、保险福利等事项，签订集体合同。集体合同草案应当提交职工代表大会或者全体职工讨论通过。\n集体合同由工会代表职工与企业签订；没有建立工会的企业，由职工推举的代表与企业签订。"},{"article_no":34,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"集体合同签订后应当报送劳动行政部门；劳动行政部门自收到集体合同文本之日起十五日内未提出异议的，集体合同即行生效。"},{"article_no":35,"chapter_no":3,"chapter_name":"劳动合同和集体合同","content":"依法签订的集体合同对企业和企业全体职工具有约束力。职工个人与企业订立的劳动合同中劳动条件和劳动报酬等标准不得低于集体合同的规定。"}]},{"name":"工作时间和休息休假","articles":[{"article_no":36,"chapter_no":4,"chapter_name":"工作时间和休息休假","content":"国家实行劳动者每日工作时间不超过八小时、平均每周工作时间不超过四十四小时的工时制度。"},{"article_no":37,"chapter_no":4,"chapter_name":"工作时间和休息休假","content":"对实行计件工作的劳动者，用人单位应当根据本法第三十六条规定的工时制度合理确定其劳动定额和计件报酬标准。"},{"article_no":38,"chapter_no":4,"chapter_name":"工作时间和休息休假","content":"用人单位应当保证劳动者每周至少休息一日。"},{"article_no":39,"chapter_no":4,"chapter_name":"工作时间和休息休假","content":"企业因生产特点不能实行本法第三十六条、第三十八条规定的，经劳动行政部门批准，可以实行其他工作和休息办法。"},{"article_no":40,"chapter_no":4,"chapter_name":"工作时间和休息休假","content":"用人单位在下列节日期间应当依法安排劳动者休假：\n（一）元旦；\n（二）春节；\n（三）国际劳动节；\n（四）国庆节；\n（五）法律、法规规定的其他休假节日。"},{"article_no":41,"chapter_no":4,"chapter_name":"工作时间和休息休假","content":"用人单位由于生产经营需要，经与工会和劳动者协商后可以延长工作时间，一般每日不得超过一小时；因特殊原因需要延长工作时间的，在保障劳动者身体健康的条件下延长工作时间每日不得超过三小时，但是每月不得超过三十六小时。"},{"article_no":42,"chapter_no":4,"chapter_name":"工作时间和休息休假","content":"有下列情形之一的，延长工作时间不受本法第四十一条规定的限制：\n（一）发生自然灾害、事故或者因其他原因，威胁劳动者生命健康和财产安全，需要紧急处理的；\n（二）生产设备、交通运输线路、公共设施发生故障，影响生产和公众利益，必须及时抢修的；\n（三）法律、行政法规规定的其他情形。"},{"article_no":43,"chapter_no":4,"chapter_name":"工作时间和休息休假","content":"用人单位不得违反本法规定延长劳动者的工作时间。"},{"article_no":44,"chapter_no":4,"chapter_name":"工作时间和休息休假","content":"有下列情形之一的，用人单位应当按照下列标准支付高于劳动者正常工作时间工资的工资报酬：\n（一）安排劳动者延长工作时间的，支付不低于工资的百分之一百五十的工资报酬；\n（二）休息日安排劳动者工作又不能安排补休的，支付不低于工资的百分之二百的工资报酬；\n（三）法定休假日安排劳动者工作的，支付不低于工资的百分之三百的工资报酬。"},{"article_no":45,"chapter_no":4,"chapter_name":"工作时间和休息休假","content":"国家实行带薪年休假制度。\n劳动者连续工作一年以上的，享受带薪年休假。具体办法由国务院规定。"}]},{"name":"工资","articles":[{"article_no":46,"chapter_no":5,"chapter_name":"工资","content":"工资分配应当遵循按劳分配原则，实行同工同酬。\n工资水平在经济发展的基础上逐步提高。国家对工资总量实行宏观调控。"},{"article_no":47,"chapter_no":5,"chapter_name":"工资","content":"用人单位根据本单位的生产经营特点和经济效益，依法自主确定本单位的工资分配方式和工资水平。"},{"article_no":48,"chapter_no":5,"chapter_name":"工资","content":"国家实行最低工资保障制度。最低工资的具体标准由省、自治区、直辖市人民政府规定，报国务院备案。\n用人单位支付劳动者的工资不得低于当地最低工资标准。"},{"article_no":49,"chapter_no":5,"chapter_name":"工资","content":"确定和调整最低工资标准应当综合参考下列因素：\n（一）劳动者本人及平均赡养人口的最低生活费用；\n（二）社会平均工资水平；\n（三）劳动生产率；\n（四）就业状况；\n（五）地区之间经济发展水平的差异。"},{"article_no":50,"chapter_no":5,"chapter_name":"工资","content":"工资应当以货币形式按月支付给劳动者本人。不得克扣或者无故拖欠劳动者的工资。"},{"article_no":51,"chapter_no":5,"chapter_name":"工资","content":"劳动者在法定休假日和婚丧假期间以及依法参加社会活动期间，用人单位应当依法支付工资。"}]},{"name":"劳动安全卫生","articles":[{"article_no":52,"chapter_no":6,"chapter_name":"劳动安全卫生","content":"用人单位必须建立、健全劳动安全卫生制度，严格执行国家劳动安全卫生规程和标准，对劳动者进行劳动安全卫生教育，防止劳动过程中的事故，减少职业危害。"},{"article_no":53,"chapter_no":6,"chapter_name":"劳动安全卫生","content":"劳动安全卫生设施必须符合国家规定的标准。\n新建、改建、扩建工程的劳动安全卫生设施必须与主体工程同时设计、同时施工、同时投入生产和使用。"},{"article_no":54,"chapter_no":6,"chapter_name":"劳动安全卫生","content":"用人单位必须为劳动者提供符合国家规定的劳动安全卫生条件和必要的劳动防护用品，对从事有职业危害作业的劳动者应当定期进行健康检查。"},{"article_no":55,"chapter_no":6,"chapter_name":"劳动安全卫生","content":"从事特种作业的劳动者必须经过专门培训并取得特种作业资格。"},{"article_no":56,"chapter_no":6,"chapter_name":"劳动安全卫生","content":"劳动者在劳动过程中必须严格遵守安全操作规程。\n劳动者对用人单位管理人员违章指挥、强令冒险作业，有权拒绝执行；对危害生命安全和身体健康的行为，有权提出批评、检举和控告。"},{"article_no":57,"chapter_no":6,"chapter_name":"劳动安全卫生","content":"国家建立伤亡事故和职业病统计报告和处理制度。县级以上各级人民政府劳动行政部门、有关部门和用人单位应当依法对劳动者在劳动过程中发生的伤亡事故和劳动者的职业病状况，进行统计、报告和处理。"}]},{"name":"女职工和未成年工特殊保护","articles":[{"article_no":58,"chapter_no":7,"chapter_name":"女职工和未成年工特殊保护","content":"国家对女职工和未成年工实行特殊劳动保护。\n未成年工是指年满十六周岁未满十八周岁的劳动者。"},{"article_no":59,"chapter_no":7,"chapter_name":"女职工和未成年工特殊保护","content":"禁止安排女职工从事矿山井下、国家规定的第四级体力劳动强度的劳动和其他禁忌从事的劳动。"},{"article_no":60,"chapter_no":7,"chapter_name":"女职工和未成年工特殊保护","content":"不得安排女职工在经期从事高处、低温、冷水作业和国家规定的第三级体力劳动强度的劳动。"},{"article_no":61,"chapter_no":7,"chapter_name":"女职工和未成年工特殊保护","content":"不得安排女职工在怀孕期间从事国家规定的第三级体力劳动强度的劳动和孕期禁忌从事的劳动。对怀孕七个月以上的女职工，不得安排其延长工作时间和夜班劳动。"},{"article_no":62,"chapter_no":7,"chapter_name":"女职工和未成年工特殊保护","content":"女职工生育享受不少于九十天的产假。"},{"article_no":63,"chapter_no":7,"chapter_name":"女职工和未成年工特殊保护","content":"不得安排女职工在哺乳未满一周岁的婴儿期间从事国家规定的第三级体力劳动强度的劳动和哺乳期禁忌从事的其他劳动，不得安排其延长工作时间和夜班劳动。"},{"article_no":64,"chapter_no":7,"chapter_name":"女职工和未成年工特殊保护","content":"不得安排未成年工从事矿山井下、有毒有害、国家规定的第四级体力劳动强度的劳动和其他禁忌从事的劳动。"},{"article_no":65,"chapter_no":7,"chapter_name":"女职工和未成年工特殊保护","content":"用人单位应当对未成年工定期进行健康检查。"}]},{"name":"职业培训","articles":[{"article_no":66,"chapter_no":8,"chapter_name":"职业培训","content":"国家通过各种途径，采取各种措施，发展职业培训事业，开发劳动者的职业技能，提高劳动者素质，增强劳动者的就业能力和工作能力。"},{"article_no":67,"chapter_no":8,"chapter_name":"职业培训","content":"各级人民政府应当把发展职业培训纳入社会经济发展的规划，鼓励和支持有条件的企业、事业组织、社会团体和个人进行各种形式的职业培训。"},{"article_no":68,"chapter_no":8,"chapter_name":"职业培训","content":"用人单位应当建立职业培训制度，按照国家规定提取和使用职业培训经费，根据本单位实际，有计划地对劳动者进行职业培训。\n从事技术工种的劳动者，上岗前必须经过培训。"},{"article_no":69,"chapter_no":8,"chapter_name":"职业培训","content":"国家确定职业分类，对规定的职业制定职业技能标准，实行职业资格证书制度，由经备案的考核鉴定机构负责对劳动者实施职业技能考核鉴定。"}]},{"name":"社会保险和福利","articles":[{"article_no":70,"chapter_no":9,"chapter_name":"社会保险和福利","content":"国家发展社会保险事业，建立社会保险制度，设立社会保险基金，使劳动者在年老、患病、工伤、失业、生育等情况下获得帮助和补偿。"},{"article_no":71,"chapter_no":9,"chapter_name":"社会保险和福利","content":"社会保险水平应当与社会经济发展水平和社会承受能力相适应。"},{"article_no":72,"chapter_no":9,"chapter_name":"社会保险和福利","content":"社会保险基金按照保险类型确定资金来源，逐步实行社会统筹。用人单位和劳动者必须依法参加社会保险，缴纳社会保险费。"},{"article_no":73,"chapter_no":9,"chapter_name":"社会保险和福利","content":"劳动者在下列情形下，依法享受社会保险待遇：\n（一）退休；\n（二）患病、负伤；\n（三）因工伤残或者患职业病；\n（四）失业；\n（五）生育。\n劳动者死亡后，其遗属依法享受遗属津贴。\n劳动者享受社会保险待遇的条件和标准由法律、法规规定。\n劳动者享受的社会保险金必须按时足额支付。"},{"article_no":74,"chapter_no":9,"chapter_name":"社会保险和福利","content":"社会保险基金经办机构依照法律规定收支、管理和运营社会保险基金，并负有使社会保险基金保值增值的责任。\n社会保险基金监督机构依照法律规定，对社会保险基金的收支、管理和运营实施监督。\n社会保险基金经办机构和社会保险基金监督机构的设立和职能由法律规定。\n任何组织和个人不得挪用社会保险基金。"},{"article_no":75,"chapter_no":9,"chapter_name":"社会保险和福利","content":"国家鼓励用人单位根据本单位实际情况为劳动者建立补充保险。\n国家提倡劳动者个人进行储蓄性保险。"},{"article_no":76,"chapter_no":9,"chapter_name":"社会保险和福利","content":"国家发展社会福利事业，兴建公共福利设施，为劳动者休息、休养和疗养提供条件。\n用人单位应当创造条件，改善集体福利，提高劳动者的福利待遇。"}]},{"name":"劳动争议","articles":[{"article_no":77,"chapter_no":10,"chapter_name":"劳动争议","content":"用人单位与劳动者发生劳动争议，当事人可以依法申请调解、仲裁、提起诉讼，也可以协商解决。\n调解原则适用于仲裁和诉讼程序。"},{"article_no":78,"chapter_no":10,"chapter_name":"劳动争议","content":"解决劳动争议，应当根据合法、公正、及时处理的原则，依法维护劳动争议当事人的合法权益。"},{"article_no":79,"chapter_no":10,"chapter_name":"劳动争议","content":"劳动争议发生后，当事人可以向本单位劳动争议调解委员会申请调解；调解不成，当事人一方要求仲裁的，可以向劳动争议仲裁委员会申请仲裁。当事人一方也可以直接向劳动争议仲裁委员会申请仲裁。对仲裁裁决不服的，可以向人民法院提起诉讼。"},{"article_no":80,"chapter_no":10,"chapter_name":"劳动争议","content":"在用人单位内，可以设立劳动争议调解委员会。劳动争议调解委员会由职工代表、用人单位代表和工会代表组成。劳动争议调解委员会主任由工会代表担任。\n劳动争议经调解达成协议的，当事人应当履行。"},{"article_no":81,"chapter_no":10,"chapter_name":"劳动争议","content":"劳动争议仲裁委员会由劳动行政部门代表、同级工会代表、用人单位方面的代表组成。劳动争议仲裁委员会主任由劳动行政部门代表担任。"},{"article_no":82,"chapter_no":10,"chapter_name":"劳动争议","content":"提出仲裁要求的一方应当自劳动争议发生之日起六十日内向劳动争议仲裁委员会提出书面申请。仲裁裁决一般应在收到仲裁申请的六十日内作出。对仲裁裁决无异议的，当事人必须履行。"},{"article_no":83,"chapter_no":10,"chapter_name":"劳动争议","content":"劳动争议当事人对仲裁裁决不服的，可以自收到仲裁裁决书之日起十五日内向人民法院提起诉讼。一方当事人在法定期限内不起诉又不履行仲裁裁决的，另一方当事人可以申请人民法院强制执行。"},{"article_no":84,"chapter_no":10,"chapter_name":"劳动争议","content":"因签订集体合同发生争议，当事人协商解决不成的，当地人民政府劳动行政部门可以组织有关各方协调处理。\n因履行集体合同发生争议，当事人协商解决不成的，可以向劳动争议仲裁委员会申请仲裁；对仲裁裁决不服的，可以自收到仲裁裁决书之日起十五日内向人民法院提起诉讼。"}]},{"name":"监督检查","articles":[{"article_no":85,"chapter_no":11,"chapter_name":"监督检查","content":"县级以上各级人民政府劳动行政部门依法对用人单位遵守劳动法律、法规的情况进行监督检查，对违反劳动法律、法规的行为有权制止，并责令改正。"},{"article_no":86,"chapter_no":11,"chapter_name":"监督检查","content":"县级以上各级人民政府劳动行政部门监督检查人员执行公务，有权进入用人单位了解执行劳动法律、法规的情况，查阅必要的资料，并对劳动场所进行检查。\n县级以上各级人民政府劳动行政部门监督检查人员执行公务，必须出示证件，秉公执法并遵守有关规定。"},{"article_no":87,"chapter_no":11,"chapter_name":"监督检查","content":"县级以上各级人民政府有关部门在各自职责范围内，对用人单位遵守劳动法律、法规的情况进行监督。"},{"article_no":88,"chapter_no":11,"chapter_name":"监督检查","content":"各级工会依法维护劳动者的合法权益，对用人单位遵守劳动法律、法规的情况进行监督。\n任何组织和个人对于违反劳动法律、法规的行为有权检举和控告。"}]},{"name":"法律责任","articles":[{"article_no":89,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位制定的劳动规章制度违反法律、法规规定的，由劳动行政部门给予警告，责令改正；对劳动者造成损害的，应当承担赔偿责任。"},{"article_no":90,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位违反本法规定，延长劳动者工作时间的，由劳动行政部门给予警告，责令改正，并可以处以罚款。"},{"article_no":91,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位有下列侵害劳动者合法权益情形之一的，由劳动行政部门责令支付劳动者的工资报酬、经济补偿，并可以责令支付赔偿金：\n（一）克扣或者无故拖欠劳动者工资的；\n（二）拒不支付劳动者延长工作时间工资报酬的；\n（三）低于当地最低工资标准支付劳动者工资的；\n（四）解除劳动合同后，未依照本法规定给予劳动者经济补偿的。"},{"article_no":92,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位的劳动安全设施和劳动卫生条件不符合国家规定或者未向劳动者提供必要的劳动防护用品和劳动保护设施的，由劳动行政部门或者有关部门责令改正，可以处以罚款；情节严重的，提请县级以上人民政府决定责令停产整顿；对事故隐患不采取措施，致使发生重大事故，造成劳动者生命和财产损失的，对责任人员依照刑法有关规定追究刑事责任。"},{"article_no":93,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位强令劳动者违章冒险作业，发生重大伤亡事故，造成严重后果的，对责任人员依法追究刑事责任。"},{"article_no":94,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位非法招用未满十六周岁的未成年人的，由劳动行政部门责令改正，处以罚款；情节严重的，由市场监督管理部门吊销营业执照。"},{"article_no":95,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位违反本法对女职工和未成年工的保护规定，侵害其合法权益的，由劳动行政部门责令改正，处以罚款；对女职工或者未成年工造成损害的，应当承担赔偿责任。"},{"article_no":96,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位有下列行为之一，由公安机关对责任人员处以十五日以下拘留、罚款或者警告；构成犯罪的，对责任人员依法追究刑事责任：\n（一）以暴力、威胁或者非法限制人身自由的手段强迫劳动的；\n（二）侮辱、体罚、殴打、非法搜查和拘禁劳动者的。"},{"article_no":97,"chapter_no":12,"chapter_name":"法律责任","content":"由于用人单位的原因订立的无效合同，对劳动者造成损害的，应当承担赔偿责任。"},{"article_no":98,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位违反本法规定的条件解除劳动合同或者故意拖延不订立劳动合同的，由劳动行政部门责令改正；对劳动者造成损害的，应当承担赔偿责任。"},{"article_no":99,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位招用尚未解除劳动合同的劳动者，对原用人单位造成经济损失的，该用人单位应当依法承担连带赔偿责任。"},{"article_no":100,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位无故不缴纳社会保险费的，由劳动行政部门责令其限期缴纳；逾期不缴的，可以加收滞纳金。"},{"article_no":101,"chapter_no":12,"chapter_name":"法律责任","content":"用人单位无理阻挠劳动行政部门、有关部门及其工作人员行使监督检查权，打击报复举报人员的，由劳动行政部门或者有关部门处以罚款；构成犯罪的，对责任人员依法追究刑事责任。"},{"article_no":102,"chapter_no":12,"chapter_name":"法律责任","content":"劳动者违反本法规定的条件解除劳动合同或者违反劳动合同中约定的保密事项，对用人单位造成经济损失的，应当依法承担赔偿责任。"},{"article_no":103,"chapter_no":12,"chapter_name":"法律责任","content":"劳动行政部门或者有关部门的工作人员滥用职权、玩忽职守、徇私舞弊，构成犯罪的，依法追究刑事责任；不构成犯罪的，给予行政处分。"},{"article_no":104,"chapter_no":12,"chapter_name":"法律责任","content":"国家工作人员和社会保险基金经办机构的工作人员挪用社会保险基金，构成犯罪的，依法追究刑事责任。"},{"article_no":105,"chapter_no":12,"chapter_name":"法律责任","content":"违反本法规定侵害劳动者合法权益，其他法律、行政法规已规定处罚的，依照该法律、行政法规的规定处罚。"}]},{"name":"附则","articles":[{"article_no":106,"chapter_no":13,"chapter_name":"附则","content":"省、自治区、直辖市人民政府根据本法和本地区的实际情况，规定劳动合同制度的实施步骤，报国务院备案。"},{"article_no":107,"chapter_no":13,"chapter_name":"附则","content":"本法自1995年1月1日起施行。"}]}]},{"id":3,"name":"企业职工带薪年休假实施办法","doc_no":"人力资源社会保障部令第1号","level":"部门规章","issuing_org":"人力资源社会保障部","publish_date":"2008-09-18","amend_date":null,"status":"现行有效","bbbs":null,"source":"国家规章库","official_url":"http://www.gov.cn/zhengce/2022-08/31/content_5711300.htm","effective_date":null,"preamble":"（2008年9月18日人力资源社会保障部令第1号公布 自公布之日起施行）","chapters":[{"name":"全文","articles":[{"article_no":1,"chapter_no":0,"chapter_name":"","content":"为了实施《职工带薪年休假条例》（以下简称条例），制定本实施办法。"},{"article_no":2,"chapter_no":0,"chapter_name":"","content":"中华人民共和国境内的企业、民办非企业单位、有雇工的个体工商户等单位（以下称用人单位）和与其建立劳动关系的职工，适用本办法。"},{"article_no":3,"chapter_no":0,"chapter_name":"","content":"职工连续工作满12个月以上的，享受带薪年休假（以下简称年休假）。"},{"article_no":4,"chapter_no":0,"chapter_name":"","content":"年休假天数根据职工累计工作时间确定。职工在同一或者不同用人单位工作期间，以及依照法律、行政法规或者国务院规定视同工作期间，应当计为累计工作时间。"},{"article_no":5,"chapter_no":0,"chapter_name":"","content":"职工新进用人单位且符合本办法第三条规定的，当年度年休假天数，按照在本单位剩余日历天数折算确定，折算后不足1整天的部分不享受年休假。\n前款规定的折算方法为：（当年度在本单位剩余日历天数÷365天）×职工本人全年应当享受的年休假天数。"},{"article_no":6,"chapter_no":0,"chapter_name":"","content":"职工依法享受的探亲假、婚丧假、产假等国家规定的假期以及因工伤停工留薪期间不计入年休假假期。"},{"article_no":7,"chapter_no":0,"chapter_name":"","content":"职工享受寒暑假天数多于其年休假天数的，不享受当年的年休假。确因工作需要,职工享受的寒暑假天数少于其年休假天数的，用人单位应当安排补足年休假天数。"},{"article_no":8,"chapter_no":0,"chapter_name":"","content":"职工已享受当年的年休假，年度内又出现条例第四条第 （二）、（三）、（四）、（五）项规定情形之一的，不享受下一年度的年休假。"},{"article_no":9,"chapter_no":0,"chapter_name":"","content":"用人单位根据生产、工作的具体情况，并考虑职工本人意愿，统筹安排年休假。用人单位确因工作需要不能安排职工年休假或者跨1个年度安排年休假的，应征得职工本人同意。"},{"article_no":10,"chapter_no":0,"chapter_name":"","content":"用人单位经职工同意不安排年休假或者安排职工年休假天数少于应休年休假天数，应当在本年度内对职工应休未休年休假天数，按照其日工资收入的300%支付未休年休假工资报酬，其中包含用人单位支付职工正常工作期间的工资收入。\n用人单位安排职工休年休假，但是职工因本人原因且书面提出不休年休假的，用人单位可以只支付其正常工作期间的工资收入。"},{"article_no":11,"chapter_no":0,"chapter_name":"","content":"计算未休年休假工资报酬的日工资收入按照职工本人的月工资除以月计薪天数  （21.75天）进行折算。\n前款所称月工资是指职工在用人单位支付其未休年休假工资报酬前12个月剔除加班工资后的月平均工资。在本用人单位工作时间不满12个月的，按实际月份计算月平均工资。\n职工在年休假期间享受与正常工作期间相同的工资收入。实行计件工资、提成工资或者其他绩效工资制的职工，日工资收入的计发办法按照本条第一款、第二款的规定执行。"},{"article_no":12,"chapter_no":0,"chapter_name":"","content":"用人单位与职工解除或者终止劳动合同时，当年度未安排职工休满应休年休假天数的，应当按照职工当年已工作时间折算应休未休年休假天数并支付未休年休假工资报酬，但折算后不足1整天的部分不支付未休年休假工资报酬。\n前款规定的折算方法为：（当年度在本单位已过日历天数÷365天）×职工本人全年应当享受的年休假天数-当年度已安排年休假天数。\n用人单位当年已安排职工年休假的，多于折算应休年休假的天数不再扣回。"},{"article_no":13,"chapter_no":0,"chapter_name":"","content":"劳动合同、集体合同约定的或者用人单位规章制度规定的年休假天数、未休年休假工资报酬高于法定标准的，用人单位应当按照有关约定或者规定执行。"},{"article_no":14,"chapter_no":0,"chapter_name":"","content":"劳务派遣单位的职工符合本办法第三条规定条件的，享受年休假。\n被派遣职工在劳动合同期限内无工作期间由劳务派遣单位依法支付劳动报酬的天数多于其全年应当享受的年休假天数的，不享受当年的年休假；少于其全年应当享受的年休假天数的，劳务派遣单位、用工单位应当协商安排补足被派遣职工年休假天数。"},{"article_no":15,"chapter_no":0,"chapter_name":"","content":"县级以上地方人民政府劳动行政部门应当依法监督检查用人单位执行条例及本办法的情况。\n用人单位不安排职工休年休假又不依照条例及本办法规定支付未休年休假工资报酬的，由县级以上地方人民政府劳动行政部门依据职权责令限期改正；对逾期不改正的，除责令该用人单位支付未休年休假工资报酬外，用人单位还应当按照未休年休假工资报酬的数额向职工加付赔偿金；对拒不执行支付未休年休假工资报酬、赔偿金行政处理决定的，由劳动行政部门申请人民法院强制执行。"},{"article_no":16,"chapter_no":0,"chapter_name":"","content":"职工与用人单位因年休假发生劳动争议的，依照劳动争议处理的规定处理。"},{"article_no":17,"chapter_no":0,"chapter_name":"","content":"除法律、行政法规或者国务院另有规定外，机关、事业单位、社会团体和与其建立劳动关系的职工，依照本办法执行。\n船员的年休假按《中华人民共和国船员条例》执行。"},{"article_no":18,"chapter_no":0,"chapter_name":"","content":"本办法中的 “年度”是指公历年度。"},{"article_no":19,"chapter_no":0,"chapter_name":"","content":"本办法自发布之日起施行。"}]}]},{"id":7,"name":"中华人民共和国公司法","doc_no":"主席令第15号","level":"法律","issuing_org":"全国人民代表大会常务委员会","publish_date":"2023-12-29","amend_date":"2023-12-29","status":"现行有效","bbbs":"ff8081818c9108eb018cb6922f750c07","source":"国家法律法规数据库","official_url":"https://flk.npc.gov.cn/detail2.html?bbbs=ff8081818c9108eb018cb6922f750c07","effective_date":"2024-07-01","preamble":"（1993年12月29日第八届全国人民代表大会常务委员会第五次会议通过根据1999年12月25日第九届全国人民代表大会常务委员会第十三次会议《关于修改〈中华人民共和国公司法〉的决定》第一次修正根据2004年8月28日第十届全国人民代表大会常务委员会第十一次会议《关于修改〈中华人民共和国公司法〉的决定》第二次修正2005年10月27日第十届全国人民代表大会常务委员会第十八次会议第一次修订根据2013年12月28日第十二届全国人民代表大会常务委员会第六次会议《关于修改〈中华人民共和国海洋环境保护法〉等七部法律的决定》第三次修正根据2018年10月26日第十三届全国人民代表大会常务委员会第六次会议《关于修改〈中华人民共和国公司法〉的决定》第四次修正2023年12月29日第十四届全国人民代表大会常务委员会第七次会议第二次修订）","chapters":[{"name":"总则","articles":[{"article_no":1,"chapter_no":1,"chapter_name":"总则","content":"为了规范公司的组织和行为，保护公司、股东、职工和债权人的合法权益，完善中国特色现代企业制度，弘扬企业家精神，维护社会经济秩序，促进社会主义市场经济的发展，根据宪法，制定本法。"},{"article_no":2,"chapter_no":1,"chapter_name":"总则","content":"本法所称公司，是指依照本法在中华人民共和国境内设立的有限责任公司和股份有限公司。"},{"article_no":3,"chapter_no":1,"chapter_name":"总则","content":"公司是企业法人，有独立的法人财产，享有法人财产权。公司以其全部财产对公司的债务承担责任。\n公司的合法权益受法律保护，不受侵犯。"},{"article_no":4,"chapter_no":1,"chapter_name":"总则","content":"有限责任公司的股东以其认缴的出资额为限对公司承担责任；股份有限公司的股东以其认购的股份为限对公司承担责任。\n公司股东对公司依法享有资产收益、参与重大决策和选择管理者等权利。"},{"article_no":5,"chapter_no":1,"chapter_name":"总则","content":"设立公司应当依法制定公司章程。公司章程对公司、股东、董事、监事、高级管理人员具有约束力。"},{"article_no":6,"chapter_no":1,"chapter_name":"总则","content":"公司应当有自己的名称。公司名称应当符合国家有关规定。\n公司的名称权受法律保护。"},{"article_no":7,"chapter_no":1,"chapter_name":"总则","content":"依照本法设立的有限责任公司，应当在公司名称中标明有限责任公司或者有限公司字样。\n依照本法设立的股份有限公司，应当在公司名称中标明股份有限公司或者股份公司字样。"},{"article_no":8,"chapter_no":1,"chapter_name":"总则","content":"公司以其主要办事机构所在地为住所。"},{"article_no":9,"chapter_no":1,"chapter_name":"总则","content":"公司的经营范围由公司章程规定。公司可以修改公司章程，变更经营范围。\n公司的经营范围中属于法律、行政法规规定须经批准的项目，应当依法经过批准。"},{"article_no":10,"chapter_no":1,"chapter_name":"总则","content":"公司的法定代表人按照公司章程的规定，由代表公司执行公司事务的董事或者经理担任。\n担任法定代表人的董事或者经理辞任的，视为同时辞去法定代表人。\n法定代表人辞任的，公司应当在法定代表人辞任之日起三十日内确定新的法定代表人。"},{"article_no":11,"chapter_no":1,"chapter_name":"总则","content":"法定代表人以公司名义从事的民事活动，其法律后果由公司承受。\n公司章程或者股东会对法定代表人职权的限制，不得对抗善意相对人。\n法定代表人因执行职务造成他人损害的，由公司承担民事责任。公司承担民事责任后，依照法律或者公司章程的规定，可以向有过错的法定代表人追偿。"},{"article_no":12,"chapter_no":1,"chapter_name":"总则","content":"有限责任公司变更为股份有限公司，应当符合本法规定的股份有限公司的条件。股份有限公司变更为有限责任公司，应当符合本法规定的有限责任公司的条件。\n有限责任公司变更为股份有限公司的，或者股份有限公司变更为有限责任公司的，公司变更前的债权、债务由变更后的公司承继。"},{"article_no":13,"chapter_no":1,"chapter_name":"总则","content":"公司可以设立子公司。子公司具有法人资格，依法独立承担民事责任。\n公司可以设立分公司。分公司不具有法人资格，其民事责任由公司承担。"},{"article_no":14,"chapter_no":1,"chapter_name":"总则","content":"公司可以向其他企业投资。\n法律规定公司不得成为对所投资企业的债务承担连带责任的出资人的，从其规定。"},{"article_no":15,"chapter_no":1,"chapter_name":"总则","content":"公司向其他企业投资或者为他人提供担保，按照公司章程的规定，由董事会或者股东会决议；公司章程对投资或者担保的总额及单项投资或者担保的数额有限额规定的，不得超过规定的限额。\n公司为公司股东或者实际控制人提供担保的，应当经股东会决议。\n前款规定的股东或者受前款规定的实际控制人支配的股东，不得参加前款规定事项的表决。该项表决由出席会议的其他股东所持表决权的过半数通过。"},{"article_no":16,"chapter_no":1,"chapter_name":"总则","content":"公司应当保护职工的合法权益，依法与职工签订劳动合同，参加社会保险，加强劳动保护，实现安全生产。\n公司应当采用多种形式，加强公司职工的职业教育和岗位培训，提高职工素质。"},{"article_no":17,"chapter_no":1,"chapter_name":"总则","content":"公司职工依照《中华人民共和国工会法》组织工会，开展工会活动，维护职工合法权益。公司应当为本公司工会提供必要的活动条件。公司工会代表职工就职工的劳动报酬、工作时间、休息休假、劳动安全卫生和保险福利等事项依法与公司签订集体合同。\n公司依照宪法和有关法律的规定，建立健全以职工代表大会为基本形式的民主管理制度，通过职工代表大会或者其他形式，实行民主管理。\n公司研究决定改制、解散、申请破产以及经营方面的重大问题、制定重要的规章制度时，应当听取公司工会的意见，并通过职工代表大会或者其他形式听取职工的意见和建议。"},{"article_no":18,"chapter_no":1,"chapter_name":"总则","content":"在公司中，根据中国共产党章程的规定，设立中国共产党的组织，开展党的活动。公司应当为党组织的活动提供必要条件。"},{"article_no":19,"chapter_no":1,"chapter_name":"总则","content":"公司从事经营活动，应当遵守法律法规，遵守社会公德、商业道德，诚实守信，接受政府和社会公众的监督。"},{"article_no":20,"chapter_no":1,"chapter_name":"总则","content":"公司从事经营活动，应当充分考虑公司职工、消费者等利益相关者的利益以及生态环境保护等社会公共利益，承担社会责任。\n国家鼓励公司参与社会公益活动，公布社会责任报告。"},{"article_no":21,"chapter_no":1,"chapter_name":"总则","content":"公司股东应当遵守法律、行政法规和公司章程，依法行使股东权利，不得滥用股东权利损害公司或者其他股东的利益。\n公司股东滥用股东权利给公司或者其他股东造成损失的，应当承担赔偿责任。"},{"article_no":22,"chapter_no":1,"chapter_name":"总则","content":"公司的控股股东、实际控制人、董事、监事、高级管理人员不得利用关联关系损害公司利益。\n违反前款规定，给公司造成损失的，应当承担赔偿责任。"},{"article_no":23,"chapter_no":1,"chapter_name":"总则","content":"公司股东滥用公司法人独立地位和股东有限责任，逃避债务，严重损害公司债权人利益的，应当对公司债务承担连带责任。\n股东利用其控制的两个以上公司实施前款规定行为的，各公司应当对任一公司的债务承担连带责任。\n只有一个股东的公司，股东不能证明公司财产独立于股东自己的财产的，应当对公司债务承担连带责任。"},{"article_no":24,"chapter_no":1,"chapter_name":"总则","content":"公司股东会、董事会、监事会召开会议和表决可以采用电子通信方式，公司章程另有规定的除外。"},{"article_no":25,"chapter_no":1,"chapter_name":"总则","content":"公司股东会、董事会的决议内容违反法律、行政法规的无效。"},{"article_no":26,"chapter_no":1,"chapter_name":"总则","content":"公司股东会、董事会的会议召集程序、表决方式违反法律、行政法规或者公司章程，或者决议内容违反公司章程的，股东自决议作出之日起六十日内，可以请求人民法院撤销。但是，股东会、董事会的会议召集程序或者表决方式仅有轻微瑕疵，对决议未产生实质影响的除外。\n未被通知参加股东会会议的股东自知道或者应当知道股东会决议作出之日起六十日内，可以请求人民法院撤销；自决议作出之日起一年内没有行使撤销权的，撤销权消灭。"},{"article_no":27,"chapter_no":1,"chapter_name":"总则","content":"有下列情形之一的，公司股东会、董事会的决议不成立：\n（一）未召开股东会、董事会会议作出决议；\n（二）股东会、董事会会议未对决议事项进行表决；\n（三）出席会议的人数或者所持表决权数未达到本法或者公司章程规定的人数或者所持表决权数；\n（四）同意决议事项的人数或者所持表决权数未达到本法或者公司章程规定的人数或者所持表决权数。"},{"article_no":28,"chapter_no":1,"chapter_name":"总则","content":"公司股东会、董事会决议被人民法院宣告无效、撤销或者确认不成立的，公司应当向公司登记机关申请撤销根据该决议已办理的登记。\n股东会、董事会决议被人民法院宣告无效、撤销或者确认不成立的，公司根据该决议与善意相对人形成的民事法律关系不受影响。"}]},{"name":"公司登记","articles":[{"article_no":29,"chapter_no":2,"chapter_name":"公司登记","content":"设立公司，应当依法向公司登记机关申请设立登记。\n法律、行政法规规定设立公司必须报经批准的，应当在公司登记前依法办理批准手续。"},{"article_no":30,"chapter_no":2,"chapter_name":"公司登记","content":"申请设立公司，应当提交设立登记申请书、公司章程等文件，提交的相关材料应当真实、合法和有效。\n申请材料不齐全或者不符合法定形式的，公司登记机关应当一次性告知需要补正的材料。"},{"article_no":31,"chapter_no":2,"chapter_name":"公司登记","content":"申请设立公司，符合本法规定的设立条件的，由公司登记机关分别登记为有限责任公司或者股份有限公司；不符合本法规定的设立条件的，不得登记为有限责任公司或者股份有限公司。"},{"article_no":32,"chapter_no":2,"chapter_name":"公司登记","content":"公司登记事项包括：\n（一）名称；\n（二）住所；\n（三）注册资本；\n（四）经营范围；\n（五）法定代表人的姓名；\n（六）有限责任公司股东、股份有限公司发起人的姓名或者名称。\n公司登记机关应当将前款规定的公司登记事项通过国家企业信用信息公示系统向社会公示。"},{"article_no":33,"chapter_no":2,"chapter_name":"公司登记","content":"依法设立的公司，由公司登记机关发给公司营业执照。公司营业执照签发日期为公司成立日期。\n公司营业执照应当载明公司的名称、住所、注册资本、经营范围、法定代表人姓名等事项。\n公司登记机关可以发给电子营业执照。电子营业执照与纸质营业执照具有同等法律效力。"},{"article_no":34,"chapter_no":2,"chapter_name":"公司登记","content":"公司登记事项发生变更的，应当依法办理变更登记。\n公司登记事项未经登记或者未经变更登记，不得对抗善意相对人。"},{"article_no":35,"chapter_no":2,"chapter_name":"公司登记","content":"公司申请变更登记，应当向公司登记机关提交公司法定代表人签署的变更登记申请书、依法作出的变更决议或者决定等文件。\n公司变更登记事项涉及修改公司章程的，应当提交修改后的公司章程。\n公司变更法定代表人的，变更登记申请书由变更后的法定代表人签署。"},{"article_no":36,"chapter_no":2,"chapter_name":"公司登记","content":"公司营业执照记载的事项发生变更的，公司办理变更登记后，由公司登记机关换发营业执照。"},{"article_no":37,"chapter_no":2,"chapter_name":"公司登记","content":"公司因解散、被宣告破产或者其他法定事由需要终止的，应当依法向公司登记机关申请注销登记，由公司登记机关公告公司终止。"},{"article_no":38,"chapter_no":2,"chapter_name":"公司登记","content":"公司设立分公司，应当向公司登记机关申请登记，领取营业执照。"},{"article_no":39,"chapter_no":2,"chapter_name":"公司登记","content":"虚报注册资本、提交虚假材料或者采取其他欺诈手段隐瞒重要事实取得公司设立登记的，公司登记机关应当依照法律、行政法规的规定予以撤销。"},{"article_no":40,"chapter_no":2,"chapter_name":"公司登记","content":"公司应当按照规定通过国家企业信用信息公示系统公示下列事项：\n（一）有限责任公司股东认缴和实缴的出资额、出资方式和出资日期，股份有限公司发起人认购的股份数；\n（二）有限责任公司股东、股份有限公司发起人的股权、股份变更信息；\n（三）行政许可取得、变更、注销等信息；\n（四）法律、行政法规规定的其他信息。\n公司应当确保前款公示信息真实、准确、完整。"},{"article_no":41,"chapter_no":2,"chapter_name":"公司登记","content":"公司登记机关应当优化公司登记办理流程，提高公司登记效率，加强信息化建设，推行网上办理等便捷方式，提升公司登记便利化水平。\n国务院市场监督管理部门根据本法和有关法律、行政法规的规定，制定公司登记注册的具体办法。"}]},{"name":"有限责任公司的设立和组织机构","articles":[{"article_no":42,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司由一个以上五十个以下股东出资设立。"},{"article_no":43,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司设立时的股东可以签订设立协议，明确各自在公司设立过程中的权利和义务。"},{"article_no":44,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司设立时的股东为设立公司从事的民事活动，其法律后果由公司承受。\n公司未成立的，其法律后果由公司设立时的股东承受；设立时的股东为二人以上的，享有连带债权，承担连带债务。\n设立时的股东为设立公司以自己的名义从事民事活动产生的民事责任，第三人有权选择请求公司或者公司设立时的股东承担。\n设立时的股东因履行公司设立职责造成他人损害的，公司或者无过错的股东承担赔偿责任后，可以向有过错的股东追偿。"},{"article_no":45,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"设立有限责任公司，应当由股东共同制定公司章程。"},{"article_no":46,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司章程应当载明下列事项：\n（一）公司名称和住所；\n（二）公司经营范围；\n（三）公司注册资本；\n（四）股东的姓名或者名称；\n（五）股东的出资额、出资方式和出资日期；\n（六）公司的机构及其产生办法、职权、议事规则；\n（七）公司法定代表人的产生、变更办法；\n（八）股东会认为需要规定的其他事项。\n股东应当在公司章程上签名或者盖章。"},{"article_no":47,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司的注册资本为在公司登记机关登记的全体股东认缴的出资额。全体股东认缴的出资额由股东按照公司章程的规定自公司成立之日起五年内缴足。\n法律、行政法规以及国务院决定对有限责任公司注册资本实缴、注册资本最低限额、股东出资期限另有规定的，从其规定。"},{"article_no":48,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"股东可以用货币出资，也可以用实物、知识产权、土地使用权、股权、债权等可以用货币估价并可以依法转让的非货币财产作价出资；但是，法律、行政法规规定不得作为出资的财产除外。\n对作为出资的非货币财产应当评估作价，核实财产，不得高估或者低估作价。法律、行政法规对评估作价有规定的，从其规定。"},{"article_no":49,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"股东应当按期足额缴纳公司章程规定的各自所认缴的出资额。\n股东以货币出资的，应当将货币出资足额存入有限责任公司在银行开设的账户；以非货币财产出资的，应当依法办理其财产权的转移手续。\n股东未按期足额缴纳出资的，除应当向公司足额缴纳外，还应当对给公司造成的损失承担赔偿责任。"},{"article_no":50,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司设立时，股东未按照公司章程规定实际缴纳出资，或者实际出资的非货币财产的实际价额显著低于所认缴的出资额的，设立时的其他股东与该股东在出资不足的范围内承担连带责任。"},{"article_no":51,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司成立后，董事会应当对股东的出资情况进行核查，发现股东未按期足额缴纳公司章程规定的出资的，应当由公司向该股东发出书面催缴书，催缴出资。\n未及时履行前款规定的义务，给公司造成损失的，负有责任的董事应当承担赔偿责任。"},{"article_no":52,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"股东未按照公司章程规定的出资日期缴纳出资，公司依照前条第一款规定发出书面催缴书催缴出资的，可以载明缴纳出资的宽限期；宽限期自公司发出催缴书之日起，不得少于六十日。宽限期届满，股东仍未履行出资义务的，公司经董事会决议可以向该股东发出失权通知，通知应当以书面形式发出。自通知发出之日起，该股东丧失其未缴纳出资的股权。\n依照前款规定丧失的股权应当依法转让，或者相应减少注册资本并注销该股权；六个月内未转让或者注销的，由公司其他股东按照其出资比例足额缴纳相应出资。\n股东对失权有异议的，应当自接到失权通知之日起三十日内，向人民法院提起诉讼。"},{"article_no":53,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"公司成立后，股东不得抽逃出资。\n违反前款规定的，股东应当返还抽逃的出资；给公司造成损失的，负有责任的董事、监事、高级管理人员应当与该股东承担连带赔偿责任。"},{"article_no":54,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"公司不能清偿到期债务的，公司或者已到期债权的债权人有权要求已认缴出资但未届出资期限的股东提前缴纳出资。"},{"article_no":55,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司成立后，应当向股东签发出资证明书，记载下列事项：\n（一）公司名称；\n（二）公司成立日期；\n（三）公司注册资本；\n（四）股东的姓名或者名称、认缴和实缴的出资额、出资方式和出资日期；\n（五）出资证明书的编号和核发日期。\n出资证明书由法定代表人签名，并由公司盖章。"},{"article_no":56,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司应当置备股东名册，记载下列事项：\n（一）股东的姓名或者名称及住所；\n（二）股东认缴和实缴的出资额、出资方式和出资日期；\n（三）出资证明书编号；\n（四）取得和丧失股东资格的日期。\n记载于股东名册的股东，可以依股东名册主张行使股东权利。"},{"article_no":57,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"股东有权查阅、复制公司章程、股东名册、股东会会议记录、董事会会议决议、监事会会议决议和财务会计报告。\n股东可以要求查阅公司会计账簿、会计凭证。股东要求查阅公司会计账簿、会计凭证的，应当向公司提出书面请求，说明目的。公司有合理根据认为股东查阅会计账簿、会计凭证有不正当目的，可能损害公司合法利益的，可以拒绝提供查阅，并应当自股东提出书面请求之日起十五日内书面答复股东并说明理由。公司拒绝提供查阅的，股东可以向人民法院提起诉讼。\n股东查阅前款规定的材料，可以委托会计师事务所、律师事务所等中介机构进行。\n股东及其委托的会计师事务所、律师事务所等中介机构查阅、复制有关材料，应当遵守有关保护国家秘密、商业秘密、个人隐私、个人信息等法律、行政法规的规定。\n股东要求查阅、复制公司全资子公司相关材料的，适用前四款的规定。\n第二节组织机构"},{"article_no":58,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司股东会由全体股东组成。股东会是公司的权力机构，依照本法行使职权。"},{"article_no":59,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"股东会行使下列职权：\n（一）选举和更换董事、监事，决定有关董事、监事的报酬事项；\n（二）审议批准董事会的报告；\n（三）审议批准监事会的报告；\n（四）审议批准公司的利润分配方案和弥补亏损方案；\n（五）对公司增加或者减少注册资本作出决议；\n（六）对发行公司债券作出决议；\n（七）对公司合并、分立、解散、清算或者变更公司形式作出决议；\n（八）修改公司章程；\n（九）公司章程规定的其他职权。\n股东会可以授权董事会对发行公司债券作出决议。\n对本条第一款所列事项股东以书面形式一致表示同意的，可以不召开股东会会议，直接作出决定，并由全体股东在决定文件上签名或者盖章。"},{"article_no":60,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"只有一个股东的有限责任公司不设股东会。股东作出前条第一款所列事项的决定时，应当采用书面形式，并由股东签名或者盖章后置备于公司。"},{"article_no":61,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"首次股东会会议由出资最多的股东召集和主持，依照本法规定行使职权。"},{"article_no":62,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"股东会会议分为定期会议和临时会议。\n定期会议应当按照公司章程的规定按时召开。代表十分之一以上表决权的股东、三分之一以上的董事或者监事会提议召开临时会议的，应当召开临时会议。"},{"article_no":63,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"股东会会议由董事会召集，董事长主持；董事长不能履行职务或者不履行职务的，由副董事长主持；副董事长不能履行职务或者不履行职务的，由过半数的董事共同推举一名董事主持。\n董事会不能履行或者不履行召集股东会会议职责的，由监事会召集和主持；监事会不召集和主持的，代表十分之一以上表决权的股东可以自行召集和主持。"},{"article_no":64,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"召开股东会会议，应当于会议召开十五日前通知全体股东；但是，公司章程另有规定或者全体股东另有约定的除外。\n股东会应当对所议事项的决定作成会议记录，出席会议的股东应当在会议记录上签名或者盖章。"},{"article_no":65,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"股东会会议由股东按照出资比例行使表决权；但是，公司章程另有规定的除外。"},{"article_no":66,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"股东会的议事方式和表决程序，除本法有规定的外，由公司章程规定。\n股东会作出决议，应当经代表过半数表决权的股东通过。\n股东会作出修改公司章程、增加或者减少注册资本的决议，以及公司合并、分立、解散或者变更公司形式的决议，应当经代表三分之二以上表决权的股东通过。"},{"article_no":67,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司设董事会，本法第七十五条另有规定的除外。\n董事会行使下列职权：\n（一）召集股东会会议，并向股东会报告工作；\n（二）执行股东会的决议；\n（三）决定公司的经营计划和投资方案；\n（四）制订公司的利润分配方案和弥补亏损方案；\n（五）制订公司增加或者减少注册资本以及发行公司债券的方案；\n（六）制订公司合并、分立、解散或者变更公司形式的方案；\n（七）决定公司内部管理机构的设置；\n（八）决定聘任或者解聘公司经理及其报酬事项，并根据经理的提名决定聘任或者解聘公司副经理、财务负责人及其报酬事项；\n（九）制定公司的基本管理制度；\n（十）公司章程规定或者股东会授予的其他职权。\n公司章程对董事会职权的限制不得对抗善意相对人。"},{"article_no":68,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司董事会成员为三人以上，其成员中可以有公司职工代表。职工人数三百人以上的有限责任公司，除依法设监事会并有公司职工代表的外，其董事会成员中应当有公司职工代表。董事会中的职工代表由公司职工通过职工代表大会、职工大会或者其他形式民主选举产生。\n董事会设董事长一人，可以设副董事长。董事长、副董事长的产生办法由公司章程规定。"},{"article_no":69,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司可以按照公司章程的规定在董事会中设置由董事组成的审计委员会，行使本法规定的监事会的职权，不设监事会或者监事。公司董事会成员中的职工代表可以成为审计委员会成员。"},{"article_no":70,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"董事任期由公司章程规定，但每届任期不得超过三年。董事任期届满，连选可以连任。\n董事任期届满未及时改选，或者董事在任期内辞任导致董事会成员低于法定人数的，在改选出的董事就任前，原董事仍应当依照法律、行政法规和公司章程的规定，履行董事职务。\n董事辞任的，应当以书面形式通知公司，公司收到通知之日辞任生效，但存在前款规定情形的，董事应当继续履行职务。"},{"article_no":71,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"股东会可以决议解任董事，决议作出之日解任生效。\n无正当理由，在任期届满前解任董事的，该董事可以要求公司予以赔偿。"},{"article_no":72,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"董事会会议由董事长召集和主持；董事长不能履行职务或者不履行职务的，由副董事长召集和主持；副董事长不能履行职务或者不履行职务的，由过半数的董事共同推举一名董事召集和主持。"},{"article_no":73,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"董事会的议事方式和表决程序，除本法有规定的外，由公司章程规定。\n董事会会议应当有过半数的董事出席方可举行。董事会作出决议，应当经全体董事的过半数通过。\n董事会决议的表决，应当一人一票。\n董事会应当对所议事项的决定作成会议记录，出席会议的董事应当在会议记录上签名。"},{"article_no":74,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司可以设经理，由董事会决定聘任或者解聘。\n经理对董事会负责，根据公司章程的规定或者董事会的授权行使职权。经理列席董事会会议。"},{"article_no":75,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"规模较小或者股东人数较少的有限责任公司，可以不设董事会，设一名董事，行使本法规定的董事会的职权。该董事可以兼任公司经理。"},{"article_no":76,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"有限责任公司设监事会，本法第六十九条、第八十三条另有规定的除外。\n监事会成员为三人以上。监事会成员应当包括股东代表和适当比例的公司职工代表，其中职工代表的比例不得低于三分之一，具体比例由公司章程规定。监事会中的职工代表由公司职工通过职工代表大会、职工大会或者其他形式民主选举产生。\n监事会设主席一人，由全体监事过半数选举产生。监事会主席召集和主持监事会会议；监事会主席不能履行职务或者不履行职务的，由过半数的监事共同推举一名监事召集和主持监事会会议。\n董事、高级管理人员不得兼任监事。"},{"article_no":77,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"监事的任期每届为三年。监事任期届满，连选可以连任。\n监事任期届满未及时改选，或者监事在任期内辞任导致监事会成员低于法定人数的，在改选出的监事就任前，原监事仍应当依照法律、行政法规和公司章程的规定，履行监事职务。"},{"article_no":78,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"监事会行使下列职权：\n（一）检查公司财务；\n（二）对董事、高级管理人员执行职务的行为进行监督，对违反法律、行政法规、公司章程或者股东会决议的董事、高级管理人员提出解任的建议；\n（三）当董事、高级管理人员的行为损害公司的利益时，要求董事、高级管理人员予以纠正；\n（四）提议召开临时股东会会议，在董事会不履行本法规定的召集和主持股东会会议职责时召集和主持股东会会议；\n（五）向股东会会议提出提案；\n（六）依照本法第一百八十九条的规定，对董事、高级管理人员提起诉讼；\n（七）公司章程规定的其他职权。"},{"article_no":79,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"监事可以列席董事会会议，并对董事会决议事项提出质询或者建议。\n监事会发现公司经营情况异常，可以进行调查；必要时，可以聘请会计师事务所等协助其工作，费用由公司承担。"},{"article_no":80,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"监事会可以要求董事、高级管理人员提交执行职务的报告。\n董事、高级管理人员应当如实向监事会提供有关情况和资料，不得妨碍监事会或者监事行使职权。"},{"article_no":81,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"监事会每年度至少召开一次会议，监事可以提议召开临时监事会会议。\n监事会的议事方式和表决程序，除本法有规定的外，由公司章程规定。\n监事会决议应当经全体监事的过半数通过。\n监事会决议的表决，应当一人一票。\n监事会应当对所议事项的决定作成会议记录，出席会议的监事应当在会议记录上签名。"},{"article_no":82,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"监事会行使职权所必需的费用，由公司承担。"},{"article_no":83,"chapter_no":3,"chapter_name":"有限责任公司的设立和组织机构","content":"规模较小或者股东人数较少的有限责任公司，可以不设监事会，设一名监事，行使本法规定的监事会的职权；经全体股东一致同意，也可以不设监事。"}]},{"name":"有限责任公司的股权转让","articles":[{"article_no":84,"chapter_no":4,"chapter_name":"有限责任公司的股权转让","content":"有限责任公司的股东之间可以相互转让其全部或者部分股权。\n股东向股东以外的人转让股权的，应当将股权转让的数量、价格、支付方式和期限等事项书面通知其他股东，其他股东在同等条件下有优先购买权。股东自接到书面通知之日起三十日内未答复的，视为放弃优先购买权。两个以上股东行使优先购买权的，协商确定各自的购买比例；协商不成的，按照转让时各自的出资比例行使优先购买权。\n公司章程对股权转让另有规定的，从其规定。"},{"article_no":85,"chapter_no":4,"chapter_name":"有限责任公司的股权转让","content":"人民法院依照法律规定的强制执行程序转让股东的股权时，应当通知公司及全体股东，其他股东在同等条件下有优先购买权。其他股东自人民法院通知之日起满二十日不行使优先购买权的，视为放弃优先购买权。"},{"article_no":86,"chapter_no":4,"chapter_name":"有限责任公司的股权转让","content":"股东转让股权的，应当书面通知公司，请求变更股东名册；需要办理变更登记的，并请求公司向公司登记机关办理变更登记。公司拒绝或者在合理期限内不予答复的，转让人、受让人可以依法向人民法院提起诉讼。\n股权转让的，受让人自记载于股东名册时起可以向公司主张行使股东权利。"},{"article_no":87,"chapter_no":4,"chapter_name":"有限责任公司的股权转让","content":"依照本法转让股权后，公司应当及时注销原股东的出资证明书，向新股东签发出资证明书，并相应修改公司章程和股东名册中有关股东及其出资额的记载。对公司章程的该项修改不需再由股东会表决。"},{"article_no":88,"chapter_no":4,"chapter_name":"有限责任公司的股权转让","content":"股东转让已认缴出资但未届出资期限的股权的，由受让人承担缴纳该出资的义务；受让人未按期足额缴纳出资的，转让人对受让人未按期缴纳的出资承担补充责任。\n未按照公司章程规定的出资日期缴纳出资或者作为出资的非货币财产的实际价额显著低于所认缴的出资额的股东转让股权的，转让人与受让人在出资不足的范围内承担连带责任；受让人不知道且不应当知道存在上述情形的，由转让人承担责任。"},{"article_no":89,"chapter_no":4,"chapter_name":"有限责任公司的股权转让","content":"有下列情形之一的，对股东会该项决议投反对票的股东可以请求公司按照合理的价格收购其股权：\n（一）公司连续五年不向股东分配利润，而公司该五年连续盈利，并且符合本法规定的分配利润条件；\n（二）公司合并、分立、转让主要财产；\n（三）公司章程规定的营业期限届满或者章程规定的其他解散事由出现，股东会通过决议修改章程使公司存续。\n自股东会决议作出之日起六十日内，股东与公司不能达成股权收购协议的，股东可以自股东会决议作出之日起九十日内向人民法院提起诉讼。\n公司的控股股东滥用股东权利，严重损害公司或者其他股东利益的，其他股东有权请求公司按照合理的价格收购其股权。\n公司因本条第一款、第三款规定的情形收购的本公司股权，应当在六个月内依法转让或者注销。"},{"article_no":90,"chapter_no":4,"chapter_name":"有限责任公司的股权转让","content":"自然人股东死亡后，其合法继承人可以继承股东资格；但是，公司章程另有规定的除外。"}]},{"name":"股份有限公司的设立和组织机构","articles":[{"article_no":91,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"设立股份有限公司，可以采取发起设立或者募集设立的方式。\n发起设立，是指由发起人认购设立公司时应发行的全部股份而设立公司。\n募集设立，是指由发起人认购设立公司时应发行股份的一部分，其余股份向特定对象募集或者向社会公开募集而设立公司。"},{"article_no":92,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"设立股份有限公司，应当有一人以上二百人以下为发起人，其中应当有半数以上的发起人在中华人民共和国境内有住所。"},{"article_no":93,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股份有限公司发起人承担公司筹办事务。\n发起人应当签订发起人协议，明确各自在公司设立过程中的权利和义务。"},{"article_no":94,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"设立股份有限公司，应当由发起人共同制订公司章程。"},{"article_no":95,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股份有限公司章程应当载明下列事项：\n（一）公司名称和住所；\n（二）公司经营范围；\n（三）公司设立方式；\n（四）公司注册资本、已发行的股份数和设立时发行的股份数，面额股的每股金额；\n（五）发行类别股的，每一类别股的股份数及其权利和义务；\n（六）发起人的姓名或者名称、认购的股份数、出资方式；\n（七）董事会的组成、职权和议事规则；\n（八）公司法定代表人的产生、变更办法；\n（九）监事会的组成、职权和议事规则；\n（十）公司利润分配办法；\n（十一）公司的解散事由与清算办法；\n（十二）公司的通知和公告办法；\n（十三）股东会认为需要规定的其他事项。"},{"article_no":96,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股份有限公司的注册资本为在公司登记机关登记的已发行股份的股本总额。在发起人认购的股份缴足前，不得向他人募集股份。\n法律、行政法规以及国务院决定对股份有限公司注册资本最低限额另有规定的，从其规定。"},{"article_no":97,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"以发起设立方式设立股份有限公司的，发起人应当认足公司章程规定的公司设立时应发行的股份。\n以募集设立方式设立股份有限公司的，发起人认购的股份不得少于公司章程规定的公司设立时应发行股份总数的百分之三十五；但是，法律、行政法规另有规定的，从其规定。"},{"article_no":98,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"发起人应当在公司成立前按照其认购的股份全额缴纳股款。\n发起人的出资，适用本法第四十八条、第四十九条第二款关于有限责任公司股东出资的规定。"},{"article_no":99,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"发起人不按照其认购的股份缴纳股款，或者作为出资的非货币财产的实际价额显著低于所认购的股份的，其他发起人与该发起人在出资不足的范围内承担连带责任。"},{"article_no":100,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"发起人向社会公开募集股份，应当公告招股说明书，并制作认股书。认股书应当载明本法第一百五十四条第二款、第三款所列事项，由认股人填写认购的股份数、金额、住所，并签名或者盖章。认股人应当按照所认购股份足额缴纳股款。"},{"article_no":101,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"向社会公开募集股份的股款缴足后，应当经依法设立的验资机构验资并出具证明。"},{"article_no":102,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股份有限公司应当制作股东名册并置备于公司。股东名册应当记载下列事项：\n（一）股东的姓名或者名称及住所；\n（二）各股东所认购的股份种类及股份数；\n（三）发行纸面形式的股票的，股票的编号；\n（四）各股东取得股份的日期。"},{"article_no":103,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"募集设立股份有限公司的发起人应当自公司设立时应发行股份的股款缴足之日起三十日内召开公司成立大会。发起人应当在成立大会召开十五日前将会议日期通知各认股人或者予以公告。成立大会应当有持有表决权过半数的认股人出席，方可举行。\n以发起设立方式设立股份有限公司成立大会的召开和表决程序由公司章程或者发起人协议规定。"},{"article_no":104,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"公司成立大会行使下列职权：\n（一）审议发起人关于公司筹办情况的报告；\n（二）通过公司章程；\n（三）选举董事、监事；\n（四）对公司的设立费用进行审核；\n（五）对发起人非货币财产出资的作价进行审核；\n（六）发生不可抗力或者经营条件发生重大变化直接影响公司设立的，可以作出不设立公司的决议。\n成立大会对前款所列事项作出决议，应当经出席会议的认股人所持表决权过半数通过。"},{"article_no":105,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"公司设立时应发行的股份未募足，或者发行股份的股款缴足后，发起人在三十日内未召开成立大会的，认股人可以按照所缴股款并加算银行同期存款利息，要求发起人返还。\n发起人、认股人缴纳股款或者交付非货币财产出资后，除未按期募足股份、发起人未按期召开成立大会或者成立大会决议不设立公司的情形外，不得抽回其股本。"},{"article_no":106,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"董事会应当授权代表，于公司成立大会结束后三十日内向公司登记机关申请设立登记。"},{"article_no":107,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"本法第四十四条、第四十九条第三款、第五十一条、第五十二条、第五十三条的规定，适用于股份有限公司。"},{"article_no":108,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"有限责任公司变更为股份有限公司时，折合的实收股本总额不得高于公司净资产额。有限责任公司变更为股份有限公司，为增加注册资本公开发行股份时，应当依法办理。"},{"article_no":109,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股份有限公司应当将公司章程、股东名册、股东会会议记录、董事会会议记录、监事会会议记录、财务会计报告、债券持有人名册置备于本公司。"},{"article_no":110,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股东有权查阅、复制公司章程、股东名册、股东会会议记录、董事会会议决议、监事会会议决议、财务会计报告，对公司的经营提出建议或者质询。\n连续一百八十日以上单独或者合计持有公司百分之三以上股份的股东要求查阅公司的会计账簿、会计凭证的，适用本法第五十七条第二款、第三款、第四款的规定。公司章程对持股比例有较低规定的，从其规定。\n股东要求查阅、复制公司全资子公司相关材料的，适用前两款的规定。\n上市公司股东查阅、复制相关材料的，应当遵守《中华人民共和国证券法》等法律、行政法规的规定。\n第二节股东会"},{"article_no":111,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股份有限公司股东会由全体股东组成。股东会是公司的权力机构，依照本法行使职权。"},{"article_no":112,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"本法第五十九条第一款、第二款关于有限责任公司股东会职权的规定，适用于股份有限公司股东会。\n本法第六十条关于只有一个股东的有限责任公司不设股东会的规定，适用于只有一个股东的股份有限公司。"},{"article_no":113,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股东会应当每年召开一次年会。有下列情形之一的，应当在两个月内召开临时股东会会议：\n（一）董事人数不足本法规定人数或者公司章程所定人数的三分之二时；\n（二）公司未弥补的亏损达股本总额三分之一时；\n（三）单独或者合计持有公司百分之十以上股份的股东请求时；\n（四）董事会认为必要时；\n（五）监事会提议召开时；\n（六）公司章程规定的其他情形。"},{"article_no":114,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股东会会议由董事会召集，董事长主持；董事长不能履行职务或者不履行职务的，由副董事长主持；副董事长不能履行职务或者不履行职务的，由过半数的董事共同推举一名董事主持。\n董事会不能履行或者不履行召集股东会会议职责的，监事会应当及时召集和主持；监事会不召集和主持的，连续九十日以上单独或者合计持有公司百分之十以上股份的股东可以自行召集和主持。\n单独或者合计持有公司百分之十以上股份的股东请求召开临时股东会会议的，董事会、监事会应当在收到请求之日起十日内作出是否召开临时股东会会议的决定，并书面答复股东。"},{"article_no":115,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"召开股东会会议，应当将会议召开的时间、地点和审议的事项于会议召开二十日前通知各股东；临时股东会会议应当于会议召开十五日前通知各股东。\n单独或者合计持有公司百分之一以上股份的股东，可以在股东会会议召开十日前提出临时提案并书面提交董事会。临时提案应当有明确议题和具体决议事项。董事会应当在收到提案后二日内通知其他股东，并将该临时提案提交股东会审议；但临时提案违反法律、行政法规或者公司章程的规定，或者不属于股东会职权范围的除外。公司不得提高提出临时提案股东的持股比例。\n公开发行股份的公司，应当以公告方式作出前两款规定的通知。\n股东会不得对通知中未列明的事项作出决议。"},{"article_no":116,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股东出席股东会会议，所持每一股份有一表决权，类别股股东除外。公司持有的本公司股份没有表决权。\n股东会作出决议，应当经出席会议的股东所持表决权过半数通过。\n股东会作出修改公司章程、增加或者减少注册资本的决议，以及公司合并、分立、解散或者变更公司形式的决议，应当经出席会议的股东所持表决权的三分之二以上通过。"},{"article_no":117,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股东会选举董事、监事，可以按照公司章程的规定或者股东会的决议，实行累积投票制。\n本法所称累积投票制，是指股东会选举董事或者监事时，每一股份拥有与应选董事或者监事人数相同的表决权，股东拥有的表决权可以集中使用。"},{"article_no":118,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股东委托代理人出席股东会会议的，应当明确代理人代理的事项、权限和期限；代理人应当向公司提交股东授权委托书，并在授权范围内行使表决权。"},{"article_no":119,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股东会应当对所议事项的决定作成会议记录，主持人、出席会议的董事应当在会议记录上签名。会议记录应当与出席股东的签名册及代理出席的委托书一并保存。\n第三节董事会、经理"},{"article_no":120,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股份有限公司设董事会，本法第一百二十八条另有规定的除外。\n本法第六十七条、第六十八条第一款、第七十条、第七十一条的规定，适用于股份有限公司。"},{"article_no":121,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股份有限公司可以按照公司章程的规定在董事会中设置由董事组成的审计委员会，行使本法规定的监事会的职权，不设监事会或者监事。\n审计委员会成员为三名以上，过半数成员不得在公司担任除董事以外的其他职务，且不得与公司存在任何可能影响其独立客观判断的关系。公司董事会成员中的职工代表可以成为审计委员会成员。\n审计委员会作出决议，应当经审计委员会成员的过半数通过。\n审计委员会决议的表决，应当一人一票。\n审计委员会的议事方式和表决程序，除本法有规定的外，由公司章程规定。\n公司可以按照公司章程的规定在董事会中设置其他委员会。"},{"article_no":122,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"董事会设董事长一人，可以设副董事长。董事长和副董事长由董事会以全体董事的过半数选举产生。\n董事长召集和主持董事会会议，检查董事会决议的实施情况。副董事长协助董事长工作，董事长不能履行职务或者不履行职务的，由副董事长履行职务；副董事长不能履行职务或者不履行职务的，由过半数的董事共同推举一名董事履行职务。"},{"article_no":123,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"董事会每年度至少召开两次会议，每次会议应当于会议召开十日前通知全体董事和监事。\n代表十分之一以上表决权的股东、三分之一以上董事或者监事会，可以提议召开临时董事会会议。董事长应当自接到提议后十日内，召集和主持董事会会议。\n董事会召开临时会议，可以另定召集董事会的通知方式和通知时限。"},{"article_no":124,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"董事会会议应当有过半数的董事出席方可举行。董事会作出决议，应当经全体董事的过半数通过。\n董事会决议的表决，应当一人一票。\n董事会应当对所议事项的决定作成会议记录，出席会议的董事应当在会议记录上签名。"},{"article_no":125,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"董事会会议，应当由董事本人出席；董事因故不能出席，可以书面委托其他董事代为出席，委托书应当载明授权范围。\n董事应当对董事会的决议承担责任。董事会的决议违反法律、行政法规或者公司章程、股东会决议，给公司造成严重损失的，参与决议的董事对公司负赔偿责任；经证明在表决时曾表明异议并记载于会议记录的，该董事可以免除责任。"},{"article_no":126,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股份有限公司设经理，由董事会决定聘任或者解聘。\n经理对董事会负责，根据公司章程的规定或者董事会的授权行使职权。经理列席董事会会议。"},{"article_no":127,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"公司董事会可以决定由董事会成员兼任经理。"},{"article_no":128,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"规模较小或者股东人数较少的股份有限公司，可以不设董事会，设一名董事，行使本法规定的董事会的职权。该董事可以兼任公司经理。"},{"article_no":129,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"公司应当定期向股东披露董事、监事、高级管理人员从公司获得报酬的情况。\n第四节监事会"},{"article_no":130,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"股份有限公司设监事会，本法第一百二十一条第一款、第一百三十三条另有规定的除外。\n监事会成员为三人以上。监事会成员应当包括股东代表和适当比例的公司职工代表，其中职工代表的比例不得低于三分之一，具体比例由公司章程规定。监事会中的职工代表由公司职工通过职工代表大会、职工大会或者其他形式民主选举产生。\n监事会设主席一人，可以设副主席。监事会主席和副主席由全体监事过半数选举产生。监事会主席召集和主持监事会会议；监事会主席不能履行职务或者不履行职务的，由监事会副主席召集和主持监事会会议；监事会副主席不能履行职务或者不履行职务的，由过半数的监事共同推举一名监事召集和主持监事会会议。\n董事、高级管理人员不得兼任监事。\n本法第七十七条关于有限责任公司监事任期的规定，适用于股份有限公司监事。"},{"article_no":131,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"本法第七十八条至第八十条的规定，适用于股份有限公司监事会。\n监事会行使职权所必需的费用，由公司承担。"},{"article_no":132,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"监事会每六个月至少召开一次会议。监事可以提议召开临时监事会会议。\n监事会的议事方式和表决程序，除本法有规定的外，由公司章程规定。\n监事会决议应当经全体监事的过半数通过。\n监事会决议的表决，应当一人一票。\n监事会应当对所议事项的决定作成会议记录，出席会议的监事应当在会议记录上签名。"},{"article_no":133,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"规模较小或者股东人数较少的股份有限公司，可以不设监事会，设一名监事，行使本法规定的监事会的职权。\n第五节上市公司组织机构的特别规定"},{"article_no":134,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"本法所称上市公司，是指其股票在证券交易所上市交易的股份有限公司。"},{"article_no":135,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"上市公司在一年内购买、出售重大资产或者向他人提供担保的金额超过公司资产总额百分之三十的，应当由股东会作出决议，并经出席会议的股东所持表决权的三分之二以上通过。"},{"article_no":136,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"上市公司设独立董事，具体管理办法由国务院证券监督管理机构规定。\n上市公司的公司章程除载明本法第九十五条规定的事项外，还应当依照法律、行政法规的规定载明董事会专门委员会的组成、职权以及董事、监事、高级管理人员薪酬考核机制等事项。"},{"article_no":137,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"上市公司在董事会中设置审计委员会的，董事会对下列事项作出决议前应当经审计委员会全体成员过半数通过：\n（一）聘用、解聘承办公司审计业务的会计师事务所；\n（二）聘任、解聘财务负责人；\n（三）披露财务会计报告；\n（四）国务院证券监督管理机构规定的其他事项。"},{"article_no":138,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"上市公司设董事会秘书，负责公司股东会和董事会会议的筹备、文件保管以及公司股东资料的管理，办理信息披露事务等事宜。"},{"article_no":139,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"上市公司董事与董事会会议决议事项所涉及的企业或者个人有关联关系的，该董事应当及时向董事会书面报告。有关联关系的董事不得对该项决议行使表决权，也不得代理其他董事行使表决权。该董事会会议由过半数的无关联关系董事出席即可举行，董事会会议所作决议须经无关联关系董事过半数通过。出席董事会会议的无关联关系董事人数不足三人的，应当将该事项提交上市公司股东会审议。"},{"article_no":140,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"上市公司应当依法披露股东、实际控制人的信息，相关信息应当真实、准确、完整。\n禁止违反法律、行政法规的规定代持上市公司股票。"},{"article_no":141,"chapter_no":5,"chapter_name":"股份有限公司的设立和组织机构","content":"上市公司控股子公司不得取得该上市公司的股份。\n上市公司控股子公司因公司合并、质权行使等原因持有上市公司股份的，不得行使所持股份对应的表决权，并应当及时处分相关上市公司股份。"}]},{"name":"股份有限公司的股份发行和转让","articles":[{"article_no":142,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司的资本划分为股份。公司的全部股份，根据公司章程的规定择一采用面额股或者无面额股。采用面额股的，每一股的金额相等。\n公司可以根据公司章程的规定将已发行的面额股全部转换为无面额股或者将无面额股全部转换为面额股。\n采用无面额股的，应当将发行股份所得股款的二分之一以上计入注册资本。"},{"article_no":143,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"股份的发行，实行公平、公正的原则，同类别的每一股份应当具有同等权利。\n同次发行的同类别股份，每股的发行条件和价格应当相同；认购人所认购的股份，每股应当支付相同价额。"},{"article_no":144,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司可以按照公司章程的规定发行下列与普通股权利不同的类别股：\n（一）优先或者劣后分配利润或者剩余财产的股份；\n（二）每一股的表决权数多于或者少于普通股的股份；\n（三）转让须经公司同意等转让受限的股份；\n（四）国务院规定的其他类别股。\n公开发行股份的公司不得发行前款第二项、第三项规定的类别股；公开发行前已发行的除外。\n公司发行本条第一款第二项规定的类别股的，对于监事或者审计委员会成员的选举和更换，类别股与普通股每一股的表决权数相同。"},{"article_no":145,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"发行类别股的公司，应当在公司章程中载明以下事项：\n（一）类别股分配利润或者剩余财产的顺序；\n（二）类别股的表决权数；\n（三）类别股的转让限制；\n（四）保护中小股东权益的措施；\n（五）股东会认为需要规定的其他事项。"},{"article_no":146,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"发行类别股的公司，有本法第一百一十六条第三款规定的事项等可能影响类别股股东权利的，除应当依照第一百一十六条第三款的规定经股东会决议外，还应当经出席类别股股东会议的股东所持表决权的三分之二以上通过。\n公司章程可以对需经类别股股东会议决议的其他事项作出规定。"},{"article_no":147,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司的股份采取股票的形式。股票是公司签发的证明股东所持股份的凭证。\n公司发行的股票，应当为记名股票。"},{"article_no":148,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"面额股股票的发行价格可以按票面金额，也可以超过票面金额，但不得低于票面金额。"},{"article_no":149,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"股票采用纸面形式或者国务院证券监督管理机构规定的其他形式。\n股票采用纸面形式的，应当载明下列主要事项：\n（一）公司名称；\n（二）公司成立日期或者股票发行的时间；\n（三）股票种类、票面金额及代表的股份数，发行无面额股的，股票代表的股份数。\n股票采用纸面形式的，还应当载明股票的编号，由法定代表人签名，公司盖章。\n发起人股票采用纸面形式的，应当标明发起人股票字样。"},{"article_no":150,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"股份有限公司成立后，即向股东正式交付股票。公司成立前不得向股东交付股票。"},{"article_no":151,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司发行新股，股东会应当对下列事项作出决议：\n（一）新股种类及数额；\n（二）新股发行价格；\n（三）新股发行的起止日期；\n（四）向原有股东发行新股的种类及数额；\n（五）发行无面额股的，新股发行所得股款计入注册资本的金额。\n公司发行新股，可以根据公司经营情况和财务状况，确定其作价方案。"},{"article_no":152,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司章程或者股东会可以授权董事会在三年内决定发行不超过已发行股份百分之五十的股份。但以非货币财产作价出资的应当经股东会决议。\n董事会依照前款规定决定发行股份导致公司注册资本、已发行股份数发生变化的，对公司章程该项记载事项的修改不需再由股东会表决。"},{"article_no":153,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司章程或者股东会授权董事会决定发行新股的，董事会决议应当经全体董事三分之二以上通过。"},{"article_no":154,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司向社会公开募集股份，应当经国务院证券监督管理机构注册，公告招股说明书。\n招股说明书应当附有公司章程，并载明下列事项：\n（一）发行的股份总数；\n（二）面额股的票面金额和发行价格或者无面额股的发行价格；\n（三）募集资金的用途；\n（四）认股人的权利和义务；\n（五）股份种类及其权利和义务；\n（六）本次募股的起止日期及逾期未募足时认股人可以撤回所认股份的说明。\n公司设立时发行股份的，还应当载明发起人认购的股份数。"},{"article_no":155,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司向社会公开募集股份，应当由依法设立的证券公司承销，签订承销协议。"},{"article_no":156,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司向社会公开募集股份，应当同银行签订代收股款协议。\n代收股款的银行应当按照协议代收和保存股款，向缴纳股款的认股人出具收款单据，并负有向有关部门出具收款证明的义务。\n公司发行股份募足股款后，应予公告。\n第二节股份转让"},{"article_no":157,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"股份有限公司的股东持有的股份可以向其他股东转让，也可以向股东以外的人转让；公司章程对股份转让有限制的，其转让按照公司章程的规定进行。"},{"article_no":158,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"股东转让其股份，应当在依法设立的证券交易场所进行或者按照国务院规定的其他方式进行。"},{"article_no":159,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"股票的转让，由股东以背书方式或者法律、行政法规规定的其他方式进行；转让后由公司将受让人的姓名或者名称及住所记载于股东名册。\n股东会会议召开前二十日内或者公司决定分配股利的基准日前五日内，不得变更股东名册。法律、行政法规或者国务院证券监督管理机构对上市公司股东名册变更另有规定的，从其规定。"},{"article_no":160,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司公开发行股份前已发行的股份，自公司股票在证券交易所上市交易之日起一年内不得转让。法律、行政法规或者国务院证券监督管理机构对上市公司的股东、实际控制人转让其所持有的本公司股份另有规定的，从其规定。\n公司董事、监事、高级管理人员应当向公司申报所持有的本公司的股份及其变动情况，在就任时确定的任职期间每年转让的股份不得超过其所持有本公司股份总数的百分之二十五；所持本公司股份自公司股票上市交易之日起一年内不得转让。上述人员离职后半年内，不得转让其所持有的本公司股份。公司章程可以对公司董事、监事、高级管理人员转让其所持有的本公司股份作出其他限制性规定。\n股份在法律、行政法规规定的限制转让期限内出质的，质权人不得在限制转让期限内行使质权。"},{"article_no":161,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"有下列情形之一的，对股东会该项决议投反对票的股东可以请求公司按照合理的价格收购其股份，公开发行股份的公司除外：\n（一）公司连续五年不向股东分配利润，而公司该五年连续盈利，并且符合本法规定的分配利润条件；\n（二）公司转让主要财产；\n（三）公司章程规定的营业期限届满或者章程规定的其他解散事由出现，股东会通过决议修改章程使公司存续。\n自股东会决议作出之日起六十日内，股东与公司不能达成股份收购协议的，股东可以自股东会决议作出之日起九十日内向人民法院提起诉讼。\n公司因本条第一款规定的情形收购的本公司股份，应当在六个月内依法转让或者注销。"},{"article_no":162,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司不得收购本公司股份。但是，有下列情形之一的除外：\n（一）减少公司注册资本；\n（二）与持有本公司股份的其他公司合并；\n（三）将股份用于员工持股计划或者股权激励；\n（四）股东因对股东会作出的公司合并、分立决议持异议，要求公司收购其股份；\n（五）将股份用于转换公司发行的可转换为股票的公司债券；\n（六）上市公司为维护公司价值及股东权益所必需。\n公司因前款第一项、第二项规定的情形收购本公司股份的，应当经股东会决议；公司因前款第三项、第五项、第六项规定的情形收购本公司股份的，可以按照公司章程或者股东会的授权，经三分之二以上董事出席的董事会会议决议。\n公司依照本条第一款规定收购本公司股份后，属于第一项情形的，应当自收购之日起十日内注销；属于第二项、第四项情形的，应当在六个月内转让或者注销；属于第三项、第五项、第六项情形的，公司合计持有的本公司股份数不得超过本公司已发行股份总数的百分之十，并应当在三年内转让或者注销。\n上市公司收购本公司股份的，应当依照《中华人民共和国证券法》的规定履行信息披露义务。上市公司因本条第一款第三项、第五项、第六项规定的情形收购本公司股份的，应当通过公开的集中交易方式进行。\n公司不得接受本公司的股份作为质权的标的。"},{"article_no":163,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"公司不得为他人取得本公司或者其母公司的股份提供赠与、借款、担保以及其他财务资助，公司实施员工持股计划的除外。\n为公司利益，经股东会决议，或者董事会按照公司章程或者股东会的授权作出决议，公司可以为他人取得本公司或者其母公司的股份提供财务资助，但财务资助的累计总额不得超过已发行股本总额的百分之十。董事会作出决议应当经全体董事的三分之二以上通过。\n违反前两款规定，给公司造成损失的，负有责任的董事、监事、高级管理人员应当承担赔偿责任。"},{"article_no":164,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"股票被盗、遗失或者灭失，股东可以依照《中华人民共和国民事诉讼法》规定的公示催告程序，请求人民法院宣告该股票失效。人民法院宣告该股票失效后，股东可以向公司申请补发股票。"},{"article_no":165,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"上市公司的股票，依照有关法律、行政法规及证券交易所交易规则上市交易。"},{"article_no":166,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"上市公司应当依照法律、行政法规的规定披露相关信息。"},{"article_no":167,"chapter_no":6,"chapter_name":"股份有限公司的股份发行和转让","content":"自然人股东死亡后，其合法继承人可以继承股东资格；但是，股份转让受限的股份有限公司的章程另有规定的除外。"}]},{"name":"国家出资公司组织机构的特别规定","articles":[{"article_no":168,"chapter_no":7,"chapter_name":"国家出资公司组织机构的特别规定","content":"国家出资公司的组织机构，适用本章规定；本章没有规定的，适用本法其他规定。\n本法所称国家出资公司，是指国家出资的国有独资公司、国有资本控股公司，包括国家出资的有限责任公司、股份有限公司。"},{"article_no":169,"chapter_no":7,"chapter_name":"国家出资公司组织机构的特别规定","content":"国家出资公司，由国务院或者地方人民政府分别代表国家依法履行出资人职责，享有出资人权益。国务院或者地方人民政府可以授权国有资产监督管理机构或者其他部门、机构代表本级人民政府对国家出资公司履行出资人职责。\n代表本级人民政府履行出资人职责的机构、部门，以下统称为履行出资人职责的机构。"},{"article_no":170,"chapter_no":7,"chapter_name":"国家出资公司组织机构的特别规定","content":"国家出资公司中中国共产党的组织，按照中国共产党章程的规定发挥领导作用，研究讨论公司重大经营管理事项，支持公司的组织机构依法行使职权。"},{"article_no":171,"chapter_no":7,"chapter_name":"国家出资公司组织机构的特别规定","content":"国有独资公司章程由履行出资人职责的机构制定。"},{"article_no":172,"chapter_no":7,"chapter_name":"国家出资公司组织机构的特别规定","content":"国有独资公司不设股东会，由履行出资人职责的机构行使股东会职权。履行出资人职责的机构可以授权公司董事会行使股东会的部分职权，但公司章程的制定和修改，公司的合并、分立、解散、申请破产，增加或者减少注册资本，分配利润，应当由履行出资人职责的机构决定。"},{"article_no":173,"chapter_no":7,"chapter_name":"国家出资公司组织机构的特别规定","content":"国有独资公司的董事会依照本法规定行使职权。\n国有独资公司的董事会成员中，应当过半数为外部董事，并应当有公司职工代表。\n董事会成员由履行出资人职责的机构委派；但是，董事会成员中的职工代表由公司职工代表大会选举产生。\n董事会设董事长一人，可以设副董事长。董事长、副董事长由履行出资人职责的机构从董事会成员中指定。"},{"article_no":174,"chapter_no":7,"chapter_name":"国家出资公司组织机构的特别规定","content":"国有独资公司的经理由董事会聘任或者解聘。\n经履行出资人职责的机构同意，董事会成员可以兼任经理。"},{"article_no":175,"chapter_no":7,"chapter_name":"国家出资公司组织机构的特别规定","content":"国有独资公司的董事、高级管理人员，未经履行出资人职责的机构同意，不得在其他有限责任公司、股份有限公司或者其他经济组织兼职。"},{"article_no":176,"chapter_no":7,"chapter_name":"国家出资公司组织机构的特别规定","content":"国有独资公司在董事会中设置由董事组成的审计委员会行使本法规定的监事会职权的，不设监事会或者监事。"},{"article_no":177,"chapter_no":7,"chapter_name":"国家出资公司组织机构的特别规定","content":"国家出资公司应当依法建立健全内部监督管理和风险控制制度，加强内部合规管理。"}]},{"name":"公司董事、监事、高级管理人员的资格和义务","articles":[{"article_no":178,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"有下列情形之一的，不得担任公司的董事、监事、高级管理人员：\n（一）无民事行为能力或者限制民事行为能力；\n（二）因贪污、贿赂、侵占财产、挪用财产或者破坏社会主义市场经济秩序，被判处刑罚，或者因犯罪被剥夺政治权利，执行期满未逾五年，被宣告缓刑的，自缓刑考验期满之日起未逾二年；\n（三）担任破产清算的公司、企业的董事或者厂长、经理，对该公司、企业的破产负有个人责任的，自该公司、企业破产清算完结之日起未逾三年；\n（四）担任因违法被吊销营业执照、责令关闭的公司、企业的法定代表人，并负有个人责任的，自该公司、企业被吊销营业执照、责令关闭之日起未逾三年；\n（五）个人因所负数额较大债务到期未清偿被人民法院列为失信被执行人。\n违反前款规定选举、委派董事、监事或者聘任高级管理人员的，该选举、委派或者聘任无效。\n董事、监事、高级管理人员在任职期间出现本条第一款所列情形的，公司应当解除其职务。"},{"article_no":179,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、监事、高级管理人员应当遵守法律、行政法规和公司章程。"},{"article_no":180,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、监事、高级管理人员对公司负有忠实义务，应当采取措施避免自身利益与公司利益冲突，不得利用职权牟取不正当利益。\n董事、监事、高级管理人员对公司负有勤勉义务，执行职务应当为公司的最大利益尽到管理者通常应有的合理注意。\n公司的控股股东、实际控制人不担任公司董事但实际执行公司事务的，适用前两款规定。"},{"article_no":181,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、监事、高级管理人员不得有下列行为：\n（一）侵占公司财产、挪用公司资金；\n（二）将公司资金以其个人名义或者以其他个人名义开立账户存储；\n（三）利用职权贿赂或者收受其他非法收入；\n（四）接受他人与公司交易的佣金归为己有；\n（五）擅自披露公司秘密；\n（六）违反对公司忠实义务的其他行为。"},{"article_no":182,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、监事、高级管理人员，直接或者间接与本公司订立合同或者进行交易，应当就与订立合同或者进行交易有关的事项向董事会或者股东会报告，并按照公司章程的规定经董事会或者股东会决议通过。\n董事、监事、高级管理人员的近亲属，董事、监事、高级管理人员或者其近亲属直接或者间接控制的企业，以及与董事、监事、高级管理人员有其他关联关系的关联人，与公司订立合同或者进行交易，适用前款规定。"},{"article_no":183,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、监事、高级管理人员，不得利用职务便利为自己或者他人谋取属于公司的商业机会。但是，有下列情形之一的除外：\n（一）向董事会或者股东会报告，并按照公司章程的规定经董事会或者股东会决议通过；\n（二）根据法律、行政法规或者公司章程的规定，公司不能利用该商业机会。"},{"article_no":184,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、监事、高级管理人员未向董事会或者股东会报告，并按照公司章程的规定经董事会或者股东会决议通过，不得自营或者为他人经营与其任职公司同类的业务。"},{"article_no":185,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事会对本法第一百八十二条至第一百八十四条规定的事项决议时，关联董事不得参与表决，其表决权不计入表决权总数。出席董事会会议的无关联关系董事人数不足三人的，应当将该事项提交股东会审议。"},{"article_no":186,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、监事、高级管理人员违反本法第一百八十一条至第一百八十四条规定所得的收入应当归公司所有。"},{"article_no":187,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"股东会要求董事、监事、高级管理人员列席会议的，董事、监事、高级管理人员应当列席并接受股东的质询。"},{"article_no":188,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、监事、高级管理人员执行职务违反法律、行政法规或者公司章程的规定，给公司造成损失的，应当承担赔偿责任。"},{"article_no":189,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、高级管理人员有前条规定的情形的，有限责任公司的股东、股份有限公司连续一百八十日以上单独或者合计持有公司百分之一以上股份的股东，可以书面请求监事会向人民法院提起诉讼；监事有前条规定的情形的，前述股东可以书面请求董事会向人民法院提起诉讼。\n监事会或者董事会收到前款规定的股东书面请求后拒绝提起诉讼，或者自收到请求之日起三十日内未提起诉讼，或者情况紧急、不立即提起诉讼将会使公司利益受到难以弥补的损害的，前款规定的股东有权为公司利益以自己的名义直接向人民法院提起诉讼。\n他人侵犯公司合法权益，给公司造成损失的，本条第一款规定的股东可以依照前两款的规定向人民法院提起诉讼。\n公司全资子公司的董事、监事、高级管理人员有前条规定情形，或者他人侵犯公司全资子公司合法权益造成损失的，有限责任公司的股东、股份有限公司连续一百八十日以上单独或者合计持有公司百分之一以上股份的股东，可以依照前三款规定书面请求全资子公司的监事会、董事会向人民法院提起诉讼或者以自己的名义直接向人民法院提起诉讼。"},{"article_no":190,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、高级管理人员违反法律、行政法规或者公司章程的规定，损害股东利益的，股东可以向人民法院提起诉讼。"},{"article_no":191,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"董事、高级管理人员执行职务，给他人造成损害的，公司应当承担赔偿责任；董事、高级管理人员存在故意或者重大过失的，也应当承担赔偿责任。"},{"article_no":192,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"公司的控股股东、实际控制人指示董事、高级管理人员从事损害公司或者股东利益的行为的，与该董事、高级管理人员承担连带责任。"},{"article_no":193,"chapter_no":8,"chapter_name":"公司董事、监事、高级管理人员的资格和义务","content":"公司可以在董事任职期间为董事因执行公司职务承担的赔偿责任投保责任保险。\n公司为董事投保责任保险或者续保后，董事会应当向股东会报告责任保险的投保金额、承保范围及保险费率等内容。"}]},{"name":"公司债券","articles":[{"article_no":194,"chapter_no":9,"chapter_name":"公司债券","content":"本法所称公司债券，是指公司发行的约定按期还本付息的有价证券。\n公司债券可以公开发行，也可以非公开发行。\n公司债券的发行和交易应当符合《中华人民共和国证券法》等法律、行政法规的规定。"},{"article_no":195,"chapter_no":9,"chapter_name":"公司债券","content":"公开发行公司债券，应当经国务院证券监督管理机构注册，公告公司债券募集办法。\n公司债券募集办法应当载明下列主要事项：\n（一）公司名称；\n（二）债券募集资金的用途；\n（三）债券总额和债券的票面金额；\n（四）债券利率的确定方式；\n（五）还本付息的期限和方式；\n（六）债券担保情况；\n（七）债券的发行价格、发行的起止日期；\n（八）公司净资产额；\n（九）已发行的尚未到期的公司债券总额；\n（十）公司债券的承销机构。"},{"article_no":196,"chapter_no":9,"chapter_name":"公司债券","content":"公司以纸面形式发行公司债券的，应当在债券上载明公司名称、债券票面金额、利率、偿还期限等事项，并由法定代表人签名，公司盖章。"},{"article_no":197,"chapter_no":9,"chapter_name":"公司债券","content":"公司债券应当为记名债券。"},{"article_no":198,"chapter_no":9,"chapter_name":"公司债券","content":"公司发行公司债券应当置备公司债券持有人名册。\n发行公司债券的，应当在公司债券持有人名册上载明下列事项：\n（一）债券持有人的姓名或者名称及住所；\n（二）债券持有人取得债券的日期及债券的编号；\n（三）债券总额，债券的票面金额、利率、还本付息的期限和方式；\n（四）债券的发行日期。"},{"article_no":199,"chapter_no":9,"chapter_name":"公司债券","content":"公司债券的登记结算机构应当建立债券登记、存管、付息、兑付等相关制度。"},{"article_no":200,"chapter_no":9,"chapter_name":"公司债券","content":"公司债券可以转让，转让价格由转让人与受让人约定。\n公司债券的转让应当符合法律、行政法规的规定。"},{"article_no":201,"chapter_no":9,"chapter_name":"公司债券","content":"公司债券由债券持有人以背书方式或者法律、行政法规规定的其他方式转让；转让后由公司将受让人的姓名或者名称及住所记载于公司债券持有人名册。"},{"article_no":202,"chapter_no":9,"chapter_name":"公司债券","content":"股份有限公司经股东会决议，或者经公司章程、股东会授权由董事会决议，可以发行可转换为股票的公司债券，并规定具体的转换办法。上市公司发行可转换为股票的公司债券，应当经国务院证券监督管理机构注册。\n发行可转换为股票的公司债券，应当在债券上标明可转换公司债券字样，并在公司债券持有人名册上载明可转换公司债券的数额。"},{"article_no":203,"chapter_no":9,"chapter_name":"公司债券","content":"发行可转换为股票的公司债券的，公司应当按照其转换办法向债券持有人换发股票，但债券持有人对转换股票或者不转换股票有选择权。法律、行政法规另有规定的除外。"},{"article_no":204,"chapter_no":9,"chapter_name":"公司债券","content":"公开发行公司债券的，应当为同期债券持有人设立债券持有人会议，并在债券募集办法中对债券持有人会议的召集程序、会议规则和其他重要事项作出规定。债券持有人会议可以对与债券持有人有利害关系的事项作出决议。\n除公司债券募集办法另有约定外，债券持有人会议决议对同期全体债券持有人发生效力。"},{"article_no":205,"chapter_no":9,"chapter_name":"公司债券","content":"公开发行公司债券的，发行人应当为债券持有人聘请债券受托管理人，由其为债券持有人办理受领清偿、债权保全、与债券相关的诉讼以及参与债务人破产程序等事项。"},{"article_no":206,"chapter_no":9,"chapter_name":"公司债券","content":"债券受托管理人应当勤勉尽责，公正履行受托管理职责，不得损害债券持有人利益。\n受托管理人与债券持有人存在利益冲突可能损害债券持有人利益的，债券持有人会议可以决议变更债券受托管理人。\n债券受托管理人违反法律、行政法规或者债券持有人会议决议，损害债券持有人利益的，应当承担赔偿责任。"}]},{"name":"公司财务、会计","articles":[{"article_no":207,"chapter_no":10,"chapter_name":"公司财务、会计","content":"公司应当依照法律、行政法规和国务院财政部门的规定建立本公司的财务、会计制度。"},{"article_no":208,"chapter_no":10,"chapter_name":"公司财务、会计","content":"公司应当在每一会计年度终了时编制财务会计报告，并依法经会计师事务所审计。\n财务会计报告应当依照法律、行政法规和国务院财政部门的规定制作。"},{"article_no":209,"chapter_no":10,"chapter_name":"公司财务、会计","content":"有限责任公司应当按照公司章程规定的期限将财务会计报告送交各股东。\n股份有限公司的财务会计报告应当在召开股东会年会的二十日前置备于本公司，供股东查阅；公开发行股份的股份有限公司应当公告其财务会计报告。"},{"article_no":210,"chapter_no":10,"chapter_name":"公司财务、会计","content":"公司分配当年税后利润时，应当提取利润的百分之十列入公司法定公积金。公司法定公积金累计额为公司注册资本的百分之五十以上的，可以不再提取。\n公司的法定公积金不足以弥补以前年度亏损的，在依照前款规定提取法定公积金之前，应当先用当年利润弥补亏损。\n公司从税后利润中提取法定公积金后，经股东会决议，还可以从税后利润中提取任意公积金。\n公司弥补亏损和提取公积金后所余税后利润，有限责任公司按照股东实缴的出资比例分配利润，全体股东约定不按照出资比例分配利润的除外；股份有限公司按照股东所持有的股份比例分配利润，公司章程另有规定的除外。\n公司持有的本公司股份不得分配利润。"},{"article_no":211,"chapter_no":10,"chapter_name":"公司财务、会计","content":"公司违反本法规定向股东分配利润的，股东应当将违反规定分配的利润退还公司；给公司造成损失的，股东及负有责任的董事、监事、高级管理人员应当承担赔偿责任。"},{"article_no":212,"chapter_no":10,"chapter_name":"公司财务、会计","content":"股东会作出分配利润的决议的，董事会应当在股东会决议作出之日起六个月内进行分配。"},{"article_no":213,"chapter_no":10,"chapter_name":"公司财务、会计","content":"公司以超过股票票面金额的发行价格发行股份所得的溢价款、发行无面额股所得股款未计入注册资本的金额以及国务院财政部门规定列入资本公积金的其他项目，应当列为公司资本公积金。"},{"article_no":214,"chapter_no":10,"chapter_name":"公司财务、会计","content":"公司的公积金用于弥补公司的亏损、扩大公司生产经营或者转为增加公司注册资本。\n公积金弥补公司亏损，应当先使用任意公积金和法定公积金；仍不能弥补的，可以按照规定使用资本公积金。\n法定公积金转为增加注册资本时，所留存的该项公积金不得少于转增前公司注册资本的百分之二十五。"},{"article_no":215,"chapter_no":10,"chapter_name":"公司财务、会计","content":"公司聘用、解聘承办公司审计业务的会计师事务所，按照公司章程的规定，由股东会、董事会或者监事会决定。\n公司股东会、董事会或者监事会就解聘会计师事务所进行表决时，应当允许会计师事务所陈述意见。"},{"article_no":216,"chapter_no":10,"chapter_name":"公司财务、会计","content":"公司应当向聘用的会计师事务所提供真实、完整的会计凭证、会计账簿、财务会计报告及其他会计资料，不得拒绝、隐匿、谎报。"},{"article_no":217,"chapter_no":10,"chapter_name":"公司财务、会计","content":"公司除法定的会计账簿外，不得另立会计账簿。\n对公司资金，不得以任何个人名义开立账户存储。"}]},{"name":"公司合并、分立、增资、减资","articles":[{"article_no":218,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"公司合并可以采取吸收合并或者新设合并。\n一个公司吸收其他公司为吸收合并，被吸收的公司解散。两个以上公司合并设立一个新的公司为新设合并，合并各方解散。"},{"article_no":219,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"公司与其持股百分之九十以上的公司合并，被合并的公司不需经股东会决议，但应当通知其他股东，其他股东有权请求公司按照合理的价格收购其股权或者股份。\n公司合并支付的价款不超过本公司净资产百分之十的，可以不经股东会决议；但是，公司章程另有规定的除外。\n公司依照前两款规定合并不经股东会决议的，应当经董事会决议。"},{"article_no":220,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"公司合并，应当由合并各方签订合并协议，并编制资产负债表及财产清单。公司应当自作出合并决议之日起十日内通知债权人，并于三十日内在报纸上或者国家企业信用信息公示系统公告。债权人自接到通知之日起三十日内，未接到通知的自公告之日起四十五日内，可以要求公司清偿债务或者提供相应的担保。"},{"article_no":221,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"公司合并时，合并各方的债权、债务，应当由合并后存续的公司或者新设的公司承继。"},{"article_no":222,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"公司分立，其财产作相应的分割。\n公司分立，应当编制资产负债表及财产清单。公司应当自作出分立决议之日起十日内通知债权人，并于三十日内在报纸上或者国家企业信用信息公示系统公告。"},{"article_no":223,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"公司分立前的债务由分立后的公司承担连带责任。但是，公司在分立前与债权人就债务清偿达成的书面协议另有约定的除外。"},{"article_no":224,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"公司减少注册资本，应当编制资产负债表及财产清单。\n公司应当自股东会作出减少注册资本决议之日起十日内通知债权人，并于三十日内在报纸上或者国家企业信用信息公示系统公告。债权人自接到通知之日起三十日内，未接到通知的自公告之日起四十五日内，有权要求公司清偿债务或者提供相应的担保。\n公司减少注册资本，应当按照股东出资或者持有股份的比例相应减少出资额或者股份，法律另有规定、有限责任公司全体股东另有约定或者股份有限公司章程另有规定的除外。"},{"article_no":225,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"公司依照本法第二百一十四条第二款的规定弥补亏损后，仍有亏损的，可以减少注册资本弥补亏损。减少注册资本弥补亏损的，公司不得向股东分配，也不得免除股东缴纳出资或者股款的义务。\n依照前款规定减少注册资本的，不适用前条第二款的规定，但应当自股东会作出减少注册资本决议之日起三十日内在报纸上或者国家企业信用信息公示系统公告。\n公司依照前两款的规定减少注册资本后，在法定公积金和任意公积金累计额达到公司注册资本百分之五十前，不得分配利润。"},{"article_no":226,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"违反本法规定减少注册资本的，股东应当退还其收到的资金，减免股东出资的应当恢复原状；给公司造成损失的，股东及负有责任的董事、监事、高级管理人员应当承担赔偿责任。"},{"article_no":227,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"有限责任公司增加注册资本时，股东在同等条件下有权优先按照实缴的出资比例认缴出资。但是，全体股东约定不按照出资比例优先认缴出资的除外。\n股份有限公司为增加注册资本发行新股时，股东不享有优先认购权，公司章程另有规定或者股东会决议决定股东享有优先认购权的除外。"},{"article_no":228,"chapter_no":11,"chapter_name":"公司合并、分立、增资、减资","content":"有限责任公司增加注册资本时，股东认缴新增资本的出资，依照本法设立有限责任公司缴纳出资的有关规定执行。\n股份有限公司为增加注册资本发行新股时，股东认购新股，依照本法设立股份有限公司缴纳股款的有关规定执行。"}]},{"name":"公司解散和清算","articles":[{"article_no":229,"chapter_no":12,"chapter_name":"公司解散和清算","content":"公司因下列原因解散：\n（一）公司章程规定的营业期限届满或者公司章程规定的其他解散事由出现；\n（二）股东会决议解散；\n（三）因公司合并或者分立需要解散；\n（四）依法被吊销营业执照、责令关闭或者被撤销；\n（五）人民法院依照本法第二百三十一条的规定予以解散。\n公司出现前款规定的解散事由，应当在十日内将解散事由通过国家企业信用信息公示系统予以公示。"},{"article_no":230,"chapter_no":12,"chapter_name":"公司解散和清算","content":"公司有前条第一款第一项、第二项情形，且尚未向股东分配财产的，可以通过修改公司章程或者经股东会决议而存续。\n依照前款规定修改公司章程或者经股东会决议，有限责任公司须经持有三分之二以上表决权的股东通过，股份有限公司须经出席股东会会议的股东所持表决权的三分之二以上通过。"},{"article_no":231,"chapter_no":12,"chapter_name":"公司解散和清算","content":"公司经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决的，持有公司百分之十以上表决权的股东，可以请求人民法院解散公司。"},{"article_no":232,"chapter_no":12,"chapter_name":"公司解散和清算","content":"公司因本法第二百二十九条第一款第一项、第二项、第四项、第五项规定而解散的，应当清算。董事为公司清算义务人，应当在解散事由出现之日起十五日内组成清算组进行清算。\n清算组由董事组成，但是公司章程另有规定或者股东会决议另选他人的除外。\n清算义务人未及时履行清算义务，给公司或者债权人造成损失的，应当承担赔偿责任。"},{"article_no":233,"chapter_no":12,"chapter_name":"公司解散和清算","content":"公司依照前条第一款的规定应当清算，逾期不成立清算组进行清算或者成立清算组后不清算的，利害关系人可以申请人民法院指定有关人员组成清算组进行清算。人民法院应当受理该申请，并及时组织清算组进行清算。\n公司因本法第二百二十九条第一款第四项的规定而解散的，作出吊销营业执照、责令关闭或者撤销决定的部门或者公司登记机关，可以申请人民法院指定有关人员组成清算组进行清算。"},{"article_no":234,"chapter_no":12,"chapter_name":"公司解散和清算","content":"清算组在清算期间行使下列职权：\n（一）清理公司财产，分别编制资产负债表和财产清单；\n（二）通知、公告债权人；\n（三）处理与清算有关的公司未了结的业务；\n（四）清缴所欠税款以及清算过程中产生的税款；\n（五）清理债权、债务；\n（六）分配公司清偿债务后的剩余财产；\n（七）代表公司参与民事诉讼活动。"},{"article_no":235,"chapter_no":12,"chapter_name":"公司解散和清算","content":"清算组应当自成立之日起十日内通知债权人，并于六十日内在报纸上或者国家企业信用信息公示系统公告。债权人应当自接到通知之日起三十日内，未接到通知的自公告之日起四十五日内，向清算组申报其债权。\n债权人申报债权，应当说明债权的有关事项，并提供证明材料。清算组应当对债权进行登记。\n在申报债权期间，清算组不得对债权人进行清偿。"},{"article_no":236,"chapter_no":12,"chapter_name":"公司解散和清算","content":"清算组在清理公司财产、编制资产负债表和财产清单后，应当制订清算方案，并报股东会或者人民法院确认。\n公司财产在分别支付清算费用、职工的工资、社会保险费用和法定补偿金，缴纳所欠税款，清偿公司债务后的剩余财产，有限责任公司按照股东的出资比例分配，股份有限公司按照股东持有的股份比例分配。\n清算期间，公司存续，但不得开展与清算无关的经营活动。公司财产在未依照前款规定清偿前，不得分配给股东。"},{"article_no":237,"chapter_no":12,"chapter_name":"公司解散和清算","content":"清算组在清理公司财产、编制资产负债表和财产清单后，发现公司财产不足清偿债务的，应当依法向人民法院申请破产清算。\n人民法院受理破产申请后，清算组应当将清算事务移交给人民法院指定的破产管理人。"},{"article_no":238,"chapter_no":12,"chapter_name":"公司解散和清算","content":"清算组成员履行清算职责，负有忠实义务和勤勉义务。\n清算组成员怠于履行清算职责，给公司造成损失的，应当承担赔偿责任；因故意或者重大过失给债权人造成损失的，应当承担赔偿责任。"},{"article_no":239,"chapter_no":12,"chapter_name":"公司解散和清算","content":"公司清算结束后，清算组应当制作清算报告，报股东会或者人民法院确认，并报送公司登记机关，申请注销公司登记。"},{"article_no":240,"chapter_no":12,"chapter_name":"公司解散和清算","content":"公司在存续期间未产生债务，或者已清偿全部债务的，经全体股东承诺，可以按照规定通过简易程序注销公司登记。\n通过简易程序注销公司登记，应当通过国家企业信用信息公示系统予以公告，公告期限不少于二十日。公告期限届满后，未有异议的，公司可以在二十日内向公司登记机关申请注销公司登记。\n公司通过简易程序注销公司登记，股东对本条第一款规定的内容承诺不实的，应当对注销登记前的债务承担连带责任。"},{"article_no":241,"chapter_no":12,"chapter_name":"公司解散和清算","content":"公司被吊销营业执照、责令关闭或者被撤销，满三年未向公司登记机关申请注销公司登记的，公司登记机关可以通过国家企业信用信息公示系统予以公告，公告期限不少于六十日。公告期限届满后，未有异议的，公司登记机关可以注销公司登记。\n依照前款规定注销公司登记的，原公司股东、清算义务人的责任不受影响。"},{"article_no":242,"chapter_no":12,"chapter_name":"公司解散和清算","content":"公司被依法宣告破产的，依照有关企业破产的法律实施破产清算。"}]},{"name":"外国公司的分支机构","articles":[{"article_no":243,"chapter_no":13,"chapter_name":"外国公司的分支机构","content":"本法所称外国公司，是指依照外国法律在中华人民共和国境外设立的公司。"},{"article_no":244,"chapter_no":13,"chapter_name":"外国公司的分支机构","content":"外国公司在中华人民共和国境内设立分支机构，应当向中国主管机关提出申请，并提交其公司章程、所属国的公司登记证书等有关文件，经批准后，向公司登记机关依法办理登记，领取营业执照。\n外国公司分支机构的审批办法由国务院另行规定。"},{"article_no":245,"chapter_no":13,"chapter_name":"外国公司的分支机构","content":"外国公司在中华人民共和国境内设立分支机构，应当在中华人民共和国境内指定负责该分支机构的代表人或者代理人，并向该分支机构拨付与其所从事的经营活动相适应的资金。\n对外国公司分支机构的经营资金需要规定最低限额的，由国务院另行规定。"},{"article_no":246,"chapter_no":13,"chapter_name":"外国公司的分支机构","content":"外国公司的分支机构应当在其名称中标明该外国公司的国籍及责任形式。\n外国公司的分支机构应当在本机构中置备该外国公司章程。"},{"article_no":247,"chapter_no":13,"chapter_name":"外国公司的分支机构","content":"外国公司在中华人民共和国境内设立的分支机构不具有中国法人资格。\n外国公司对其分支机构在中华人民共和国境内进行经营活动承担民事责任。"},{"article_no":248,"chapter_no":13,"chapter_name":"外国公司的分支机构","content":"经批准设立的外国公司分支机构，在中华人民共和国境内从事业务活动，应当遵守中国的法律，不得损害中国的社会公共利益，其合法权益受中国法律保护。"},{"article_no":249,"chapter_no":13,"chapter_name":"外国公司的分支机构","content":"外国公司撤销其在中华人民共和国境内的分支机构时，应当依法清偿债务，依照本法有关公司清算程序的规定进行清算。未清偿债务之前，不得将其分支机构的财产转移至中华人民共和国境外。"}]},{"name":"法律责任","articles":[{"article_no":250,"chapter_no":14,"chapter_name":"法律责任","content":"违反本法规定，虚报注册资本、提交虚假材料或者采取其他欺诈手段隐瞒重要事实取得公司登记的，由公司登记机关责令改正，对虚报注册资本的公司，处以虚报注册资本金额百分之五以上百分之十五以下的罚款；对提交虚假材料或者采取其他欺诈手段隐瞒重要事实的公司，处以五万元以上二百万元以下的罚款；情节严重的，吊销营业执照；对直接负责的主管人员和其他直接责任人员处以三万元以上三十万元以下的罚款。"},{"article_no":251,"chapter_no":14,"chapter_name":"法律责任","content":"公司未依照本法第四十条规定公示有关信息或者不如实公示有关信息的，由公司登记机关责令改正，可以处以一万元以上五万元以下的罚款。情节严重的，处以五万元以上二十万元以下的罚款；对直接负责的主管人员和其他直接责任人员处以一万元以上十万元以下的罚款。"},{"article_no":252,"chapter_no":14,"chapter_name":"法律责任","content":"公司的发起人、股东虚假出资，未交付或者未按期交付作为出资的货币或者非货币财产的，由公司登记机关责令改正，可以处以五万元以上二十万元以下的罚款；情节严重的，处以虚假出资或者未出资金额百分之五以上百分之十五以下的罚款；对直接负责的主管人员和其他直接责任人员处以一万元以上十万元以下的罚款。"},{"article_no":253,"chapter_no":14,"chapter_name":"法律责任","content":"公司的发起人、股东在公司成立后，抽逃其出资的，由公司登记机关责令改正，处以所抽逃出资金额百分之五以上百分之十五以下的罚款；对直接负责的主管人员和其他直接责任人员处以三万元以上三十万元以下的罚款。"},{"article_no":254,"chapter_no":14,"chapter_name":"法律责任","content":"有下列行为之一的，由县级以上人民政府财政部门依照《中华人民共和国会计法》等法律、行政法规的规定处罚：\n（一）在法定的会计账簿以外另立会计账簿；\n（二）提供存在虚假记载或者隐瞒重要事实的财务会计报告。"},{"article_no":255,"chapter_no":14,"chapter_name":"法律责任","content":"公司在合并、分立、减少注册资本或者进行清算时，不依照本法规定通知或者公告债权人的，由公司登记机关责令改正，对公司处以一万元以上十万元以下的罚款。"},{"article_no":256,"chapter_no":14,"chapter_name":"法律责任","content":"公司在进行清算时，隐匿财产，对资产负债表或者财产清单作虚假记载，或者在未清偿债务前分配公司财产的，由公司登记机关责令改正，对公司处以隐匿财产或者未清偿债务前分配公司财产金额百分之五以上百分之十以下的罚款；对直接负责的主管人员和其他直接责任人员处以一万元以上十万元以下的罚款。"},{"article_no":257,"chapter_no":14,"chapter_name":"法律责任","content":"承担资产评估、验资或者验证的机构提供虚假材料或者提供有重大遗漏的报告的，由有关部门依照《中华人民共和国资产评估法》、《中华人民共和国注册会计师法》等法律、行政法规的规定处罚。\n承担资产评估、验资或者验证的机构因其出具的评估结果、验资或者验证证明不实，给公司债权人造成损失的，除能够证明自己没有过错的外，在其评估或者证明不实的金额范围内承担赔偿责任。"},{"article_no":258,"chapter_no":14,"chapter_name":"法律责任","content":"公司登记机关违反法律、行政法规规定未履行职责或者履行职责不当的，对负有责任的领导人员和直接责任人员依法给予政务处分。"},{"article_no":259,"chapter_no":14,"chapter_name":"法律责任","content":"未依法登记为有限责任公司或者股份有限公司，而冒用有限责任公司或者股份有限公司名义的，或者未依法登记为有限责任公司或者股份有限公司的分公司，而冒用有限责任公司或者股份有限公司的分公司名义的，由公司登记机关责令改正或者予以取缔，可以并处十万元以下的罚款。"},{"article_no":260,"chapter_no":14,"chapter_name":"法律责任","content":"公司成立后无正当理由超过六个月未开业的，或者开业后自行停业连续六个月以上的，公司登记机关可以吊销营业执照，但公司依法办理歇业的除外。\n公司登记事项发生变更时，未依照本法规定办理有关变更登记的，由公司登记机关责令限期登记；逾期不登记的，处以一万元以上十万元以下的罚款。"},{"article_no":261,"chapter_no":14,"chapter_name":"法律责任","content":"外国公司违反本法规定，擅自在中华人民共和国境内设立分支机构的，由公司登记机关责令改正或者关闭，可以并处五万元以上二十万元以下的罚款。"},{"article_no":262,"chapter_no":14,"chapter_name":"法律责任","content":"利用公司名义从事危害国家安全、社会公共利益的严重违法行为的，吊销营业执照。"},{"article_no":263,"chapter_no":14,"chapter_name":"法律责任","content":"公司违反本法规定，应当承担民事赔偿责任和缴纳罚款、罚金的，其财产不足以支付时，先承担民事赔偿责任。"},{"article_no":264,"chapter_no":14,"chapter_name":"法律责任","content":"违反本法规定，构成犯罪的，依法追究刑事责任。"}]},{"name":"附则","articles":[{"article_no":265,"chapter_no":15,"chapter_name":"附则","content":"本法下列用语的含义：\n（一）高级管理人员，是指公司的经理、副经理、财务负责人，上市公司董事会秘书和公司章程规定的其他人员。\n（二）控股股东，是指其出资额占有限责任公司资本总额超过百分之五十或者其持有的股份占股份有限公司股本总额超过百分之五十的股东；出资额或者持有股份的比例虽然低于百分之五十，但依其出资额或者持有的股份所享有的表决权已足以对股东会的决议产生重大影响的股东。\n（三）实际控制人，是指通过投资关系、协议或者其他安排，能够实际支配公司行为的人。\n（四）关联关系，是指公司控股股东、实际控制人、董事、监事、高级管理人员与其直接或者间接控制的企业之间的关系，以及可能导致公司利益转移的其他关系。但是，国家控股的企业之间不仅因为同受国家控股而具有关联关系。"},{"article_no":266,"chapter_no":15,"chapter_name":"附则","content":"本法自2024年7月1日起施行。\n本法施行前已登记设立的公司，出资期限超过本法规定的期限的，除法律、行政法规或者国务院另有规定外，应当逐步调整至本法规定的期限以内；对于出资期限、出资额明显异常的，公司登记机关可以依法要求其及时调整。具体实施办法由国务院规定。"}]}]},{"id":8,"name":"通信工程建设项目招标投标管理办法","doc_no":"工业和信息化部令第27号","level":"部门规章","issuing_org":"工业和信息化部","publish_date":"2014-05-04","amend_date":null,"status":"现行有效","bbbs":null,"source":"国家规章库","official_url":"http://www.gov.cn/zhengce/2022-08/23/content_5722721.htm","effective_date":"2014-07-01","preamble":"（2014年5月4日，中华人民共和国工业和信息化部令第27号公布，2014年7月1日起施行。）","chapters":[{"name":"总则","articles":[{"article_no":1,"chapter_no":1,"chapter_name":"总则","content":"为了规范通信工程建设项目招标投标活动，根据《中华人民共和国招标投标法》（以下简称《招标投标法》）和《中华人民共和国招标投标法实施条例》（以下简称《实施条例》），制定本办法。"},{"article_no":2,"chapter_no":1,"chapter_name":"总则","content":"在中华人民共和国境内进行通信工程建设项目招标投标活动，适用本办法。\n前款所称通信工程建设项目，是指通信工程以及与通信工程建设有关的货物、服务。其中，通信工程包括通信设施或者通信网络的新建、改建、扩建、拆除等施工；与通信工程建设有关的货物，是指构成通信工程不可分割的组成部分，且为实现通信工程基本功能所必需的设备、材料等；与通信工程建设有关的服务，是指为完成通信工程所需的勘察、设计、监理等服务。\n依法必须进行招标的通信工程建设项目的具体范围和规模标准，依据国家有关规定确定。"},{"article_no":3,"chapter_no":1,"chapter_name":"总则","content":"工业和信息化部和各省、自治区、直辖市通信管理局（以下统称为“通信行政监督部门”）依法对通信工程建设项目招标投标活动实施监督。"},{"article_no":4,"chapter_no":1,"chapter_name":"总则","content":"工业和信息化部鼓励按照《电子招标投标办法》进行通信工程建设项目电子招标投标。"},{"article_no":5,"chapter_no":1,"chapter_name":"总则","content":"工业和信息化部建立“通信工程建设项目招标投标管理信息平台”（以下简称“管理平台”），实行通信工程建设项目招标投标活动信息化管理。"}]},{"name":"招标和投标","articles":[{"article_no":6,"chapter_no":2,"chapter_name":"招标和投标","content":"国有资金占控股或者主导地位的依法必须进行招标的通信工程建设项目，应当公开招标；但有下列情形之一的，可以邀请招标：\n（一）技术复杂、有特殊要求或者受自然环境限制，只有少量潜在投标人可供选择；\n（二）采用公开招标方式的费用占项目合同金额的比例过大。\n有前款第一项所列情形，招标人邀请招标的，应当向其知道或者应当知道的全部潜在投标人发出投标邀请书。\n采用公开招标方式的费用占项目合同金额的比例超过1.5%，且采用邀请招标方式的费用明显低于公开招标方式的费用的，方可被认定为有本条第一款第二项所列情形。"},{"article_no":7,"chapter_no":2,"chapter_name":"招标和投标","content":"除《招标投标法》第六十六条和《实施条例》第九条规定的可以不进行招标的情形外，潜在投标人少于3个的，可以不进行招标。\n招标人为适用前款规定弄虚作假的，属于《招标投标法》第四条规定的规避招标。"},{"article_no":8,"chapter_no":2,"chapter_name":"招标和投标","content":"依法必须进行招标的通信工程建设项目的招标人自行办理招标事宜的，应当自发布招标公告或者发出投标邀请书之日起2日内通过“管理平台”向通信行政监督部门提交《通信工程建设项目自行招标备案表》(见附录一)。"},{"article_no":9,"chapter_no":2,"chapter_name":"招标和投标","content":"招标代理机构代理招标业务，适用《招标投标法》、《实施条例》和本办法关于招标人的规定。"},{"article_no":10,"chapter_no":2,"chapter_name":"招标和投标","content":"公开招标的项目，招标人采用资格预审办法对潜在投标人进行资格审查的，应当发布资格预审公告、编制资格预审文件。招标人发布资格预审公告后，可不再发布招标公告。\n依法必须进行招标的通信工程建设项目的资格预审公告和招标公告，除在国家发展和改革委员会依法指定的媒介发布外，还应当在“管理平台”发布。在不同媒介发布的同一招标项目的资格预审公告或者招标公告的内容应当一致。"},{"article_no":11,"chapter_no":2,"chapter_name":"招标和投标","content":"资格预审公告、招标公告或者投标邀请书应当载明下列内容：\n（一）招标人的名称和地址；\n（二）招标项目的性质、内容、规模、技术要求和资金来源；\n（三）招标项目的实施或者交货时间和地点要求；\n（四）获取招标文件或者资格预审文件的时间、地点和方法；\n（五）对招标文件或者资格预审文件收取的费用；\n（六）提交资格预审申请文件或者投标文件的地点和截止时间。\n招标人对投标人的资格要求，应当在资格预审公告、招标公告或者投标邀请书中载明。"},{"article_no":12,"chapter_no":2,"chapter_name":"招标和投标","content":"资格预审文件一般包括下列内容：\n（一）资格预审公告；\n（二）申请人须知；\n（三）资格要求；\n（四）业绩要求；\n（五）资格审查标准和方法；\n（六）资格预审结果的通知方式；\n（七）资格预审申请文件格式。\n资格预审应当按照资格预审文件载明的标准和方法进行，资格预审文件没有规定的标准和方法不得作为资格预审的依据。"},{"article_no":13,"chapter_no":2,"chapter_name":"招标和投标","content":"招标人应当根据招标项目的特点和需要编制招标文件。招标文件一般包括下列内容：\n（一）招标公告或者投标邀请书；\n（二）投标人须知；\n（三）投标文件格式；\n（四）项目的技术要求；\n（五）投标报价要求；\n（六）评标标准、方法和条件；\n（七）网络与信息安全有关要求；\n（八）合同主要条款。\n招标文件应当载明所有评标标准、方法和条件，并能够指导评标工作，在评标过程中不得作任何改变。"},{"article_no":14,"chapter_no":2,"chapter_name":"招标和投标","content":"招标人应当在招标文件中以显著的方式标明实质性要求、条件以及不满足实质性要求和条件的投标将被否决的提示；对于非实质性要求和条件，应当规定允许偏差的最大范围、最高项数和调整偏差的方法。"},{"article_no":15,"chapter_no":2,"chapter_name":"招标和投标","content":"编制依法必须进行招标的通信工程建设项目资格预审文件和招标文件，应当使用国家发展和改革委员会会同有关行政监督部门制定的标准文本及工业和信息化部制定的范本。"},{"article_no":16,"chapter_no":2,"chapter_name":"招标和投标","content":"勘察设计招标项目的评标标准一般包括下列内容：\n（一）投标人的资质、业绩、财务状况和履约表现；\n（二）项目负责人的资格和业绩；\n（三）勘察设计团队人员；\n（四）技术方案和技术创新；\n（五）质量标准及质量管理措施；\n（六）技术支持与保障；\n（七）投标价格；\n（八）组织实施方案及进度安排。"},{"article_no":17,"chapter_no":2,"chapter_name":"招标和投标","content":"监理招标项目的评标标准一般包括下列内容：\n（一）投标人的资质、业绩、财务状况和履约表现；\n（二）项目总监理工程师的资格和业绩；\n（三）主要监理人员及安全监理人员；\n（四）监理大纲；\n（五）质量和安全管理措施；\n（六）投标价格。"},{"article_no":18,"chapter_no":2,"chapter_name":"招标和投标","content":"施工招标项目的评标标准一般包括下列内容：\n（一）投标人的资质、业绩、财务状况和履约表现；\n（二）项目负责人的资格和业绩；\n（三）专职安全生产管理人员；\n（四）主要施工设备及施工安全防护设施；\n（五）质量和安全管理措施；\n（六）投标价格；\n（七）施工组织设计及安全生产应急预案。"},{"article_no":19,"chapter_no":2,"chapter_name":"招标和投标","content":"与通信工程建设有关的货物招标项目的评标标准一般包括下列内容：\n（一）投标人的资质、业绩、财务状况和履约表现；\n（二）投标价格；\n（三）技术标准及质量标准；\n（四）组织供货计划；\n（五）售后服务。"},{"article_no":20,"chapter_no":2,"chapter_name":"招标和投标","content":"评标方法包括综合评估法、经评审的最低投标价法或者法律、行政法规允许的其他评标方法。\n鼓励通信工程建设项目使用综合评估法进行评标。"},{"article_no":21,"chapter_no":2,"chapter_name":"招标和投标","content":"通信工程建设项目需要划分标段的，招标人应当在招标文件中载明允许投标人中标的最多标段数。"},{"article_no":22,"chapter_no":2,"chapter_name":"招标和投标","content":"通信工程建设项目已确定投资计划并落实资金来源的，招标人可以将多个同类通信工程建设项目集中进行招标。\n招标人进行集中招标的，应当遵守《招标投标法》、《实施条例》和本办法有关依法必须进行招标的项目的规定。"},{"article_no":23,"chapter_no":2,"chapter_name":"招标和投标","content":"招标人进行集中招标的，应当在招标文件中载明工程或者有关货物、服务的类型、预估招标规模、中标人数量及每个中标人对应的中标份额等；对与工程或者有关服务进行集中招标的，还应当载明每个中标人对应的实施地域。"},{"article_no":24,"chapter_no":2,"chapter_name":"招标和投标","content":"招标人可以对多个同类通信工程建设项目的潜在投标人进行集中资格预审。招标人进行集中资格预审的，应当发布资格预审公告，明确集中资格预审的适用范围和有效期限，并且应当预估项目规模，合理设定资格、技术和商务条件，不得限制、排斥潜在投标人。\n招标人进行集中资格预审，应当遵守国家有关勘察、设计、施工、监理等资质管理的规定。\n集中资格预审后，通信工程建设项目的招标人应当继续完成招标程序，不得直接发包工程；直接发包工程的，属于《招标投标法》第四条规定的规避招标。"},{"article_no":25,"chapter_no":2,"chapter_name":"招标和投标","content":"招标人根据招标项目的具体情况，可以在发售招标文件截止之日后，组织潜在投标人踏勘项目现场和召开投标预备会。\n招标人组织潜在投标人踏勘项目现场或者召开投标预备会的，应当向全部潜在投标人发出邀请。"},{"article_no":26,"chapter_no":2,"chapter_name":"招标和投标","content":"投标人应当在招标文件要求提交投标文件的截止时间前，将投标文件送达投标地点。通信工程建设项目划分标段的，投标人应当在投标文件上标明相应的标段。\n未通过资格预审的申请人提交的投标文件，以及逾期送达或者不按照招标文件要求密封的投标文件，招标人应当拒收。\n招标人收到投标文件后，不得开启，并应当如实记载投标文件的送达时间和密封情况，存档备查。"}]},{"name":"开标、评标和中标","articles":[{"article_no":27,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"通信工程建设项目投标人少于3个的，不得开标，招标人在分析招标失败的原因并采取相应措施后，应当依法重新招标。划分标段的通信工程建设项目某一标段的投标人少于3个的，该标段不得开标，招标人在分析招标失败的原因并采取相应措施后，应当依法对该标段重新招标。\n投标人认为存在低于成本价投标情形的，可以在开标现场提出异议，并在评标完成前向招标人提交书面材料。招标人应当及时将书面材料转交评标委员会。"},{"article_no":28,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"招标人应当根据《招标投标法》和《实施条例》的规定开标，记录开标过程并存档备查。招标人应当记录下列内容：\n（一）开标时间和地点；\n（二）投标人名称、投标价格等唱标内容；\n（三）开标过程是否经过公证；\n（四）投标人提出的异议。\n开标记录应当由投标人代表、唱标人、记录人和监督人签字。\n因不可抗力或者其他特殊原因需要变更开标地点的，招标人应提前通知所有潜在投标人，确保其有足够的时间能够到达开标地点。"},{"article_no":29,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"评标由招标人依法组建的评标委员会负责。\n通信工程建设项目评标委员会的专家成员应当具备下列条件：\n（一）从事通信相关领域工作满8年并具有高级职称或者同等专业水平。掌握通信新技术的特殊人才经工作单位推荐，可以视为具备本项规定的条件；\n（二）熟悉国家和通信行业有关招标投标以及通信建设管理的法律、行政法规和规章，并具有与招标项目有关的实践经验；\n（三）能够认真、公正、诚实、廉洁地履行职责；\n（四）未因违法、违纪被取消评标资格或者未因在招标、评标以及其他与招标投标有关活动中从事违法行为而受过行政处罚或者刑事处罚;\n（五）身体健康，能够承担评标工作。\n工业和信息化部统一组建和管理通信工程建设项目评标专家库，各省、自治区、直辖市通信管理局负责本行政区域内评标专家的监督管理工作。"},{"article_no":30,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"依法必须进行招标的通信工程建设项目，评标委员会的专家应当从通信工程建设项目评标专家库内相关专业的专家名单中采取随机抽取方式确定；个别技术复杂、专业性强或者国家有特殊要求，采取随机抽取方式确定的专家难以保证胜任评标工作的招标项目，可以由招标人从通信工程建设项目评标专家库内相关专业的专家名单中直接确定。\n依法必须进行招标的通信工程建设项目的招标人应当通过“管理平台”抽取评标委员会的专家成员，通信行政监督部门可以对抽取过程进行远程监督或者现场监督。"},{"article_no":31,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"依法必须进行招标的通信工程建设项目技术复杂、评审工作量大，其评标委员会需要分组评审的，每组成员人数应为5人以上，且每组每个成员应对所有投标文件进行评审。评标委员会的分组方案应当经全体成员同意。\n评标委员会设负责人的，其负责人由评标委员会成员推举产生或者由招标人确定。评标委员会其他成员与负责人享有同等的表决权。"},{"article_no":32,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"评标委员会成员应当客观、公正地对投标文件提出评审意见，并对所提出的评审意见负责。\n招标文件没有规定的评标标准和方法不得作为评标依据。"},{"article_no":33,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"评标过程中，评标委员会收到低于成本价投标的书面质疑材料、发现投标人的综合报价明显低于其他投标报价或者设有标底时明显低于标底，认为投标报价可能低于成本的，应当书面要求该投标人作出书面说明并提供相关证明材料。招标人要求以某一单项报价核定是否低于成本的，应当在招标文件中载明。\n投标人不能合理说明或者不能提供相关证明材料的，评标委员会应当否决其投标。"},{"article_no":34,"chapter_no":3,"chapter_name":"开标、评标和中标","content":"投标人以他人名义投标或者投标人经资格审查不合格的，评标委员会应当否决其投标。\n部分投标人在开标后撤销投标文件或者部分投标人被否决投标后，有效投标不足3个且明显缺乏竞争的，评标委员会应当否决全部投标。有效投标不足3个，评标委员会未否决全部投标的，应当在评标报告中说明理由。\n依法必须进行招标的通信工程
